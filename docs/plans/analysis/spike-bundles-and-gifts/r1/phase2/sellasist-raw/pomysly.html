ą stroną zarządza zespół marketingu, który nie ma możliwości właściwego ich rozpatrzenia. Komentarze lub pomysły zawierające pytania do BOK nie będą akceptowane. "}]},{"type":"paragraph","children":[{"text":""}]},{"type":"paragraph","children":[{"text":"Dziękujemy za przestrzeganie zasad i tworzenie z nami przyszłości Sellasist!"}]},{"type":"paragraph","children":[{"text":"Masz pytania lub potrzebujesz wsparcia?"}]},{"type":"paragraph","children":[{"text":"Skontaktuj się z nami: biuro@esprzedaz.com"}]}],"comment-reaction-count":"Reakcja","forgot-password-submit":"Wyślij","idea-activity-approved":"pomysł zatwierdzony.","idea-activity-archived":"pomysł zarchiwizowany.","idea-activity-rejected":"pomysł odrzucony.","idea-activity-unpinned":"pomysł został odpięty.","idea-form-topics-label":"Wybierz max. 3 kategorie","idea-sort-priority-asc":"Najniższy piorytet","ideas-board-meta-title":"Pomysły dla Sellasist","login-meta-description":"Zaloguj się na swoje konto i podziel się swoimi pomysłami.","profile-settings-title":"Profil","reset-password-success":"Gotowe! Twoje hasło zostało zresetowane.","time-about-a-month-ago":"około miesiąca temu","time-about-an-hour-ago":"około godziny temu","unsubscribe-meta-title":"Zrezygnuj","announcement-create-new":"Utwórz ogłoszenie","announcements-subscribe":"Subskrybuj aktualizacje","comment-reactions-count":"{{count}} reakcji","delete-account-question":"Szukasz, jak usunąć swoje konto?","email-unsubscribe-error":"Błąd podczas wypisywania","email-unsubscribe-title":"Wypisywanie się","forgot-password-success":"Gotowe! Sprawdź e-mail.","form-label-your-details":"Szczegóły","form-tooltip-attachment":"Dodaj","generic-error-try-again":"Spróbuj ponownie","idea-similar-no-results":"Brak podobnych pomysłów","idea-sort-priority-desc":"Najwyższy priorytet","idea-vote-signup-prompt":"I zacznij głosować na pomysły","page-redirecting-button":"Kliknij tutaj, jeśli nie zostaniesz przekierowany automatycznie.","reset-password-subtitle":"Wpisz nowe hasł
