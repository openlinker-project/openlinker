                  type: integer
                  description: "ID cechy (parametru nadrzędnego) z GET /qualities"
                  example: 18
                properties_id:
                  type: array
                  description: "Opcjonalna lista ID właściwości do odpięcia. Jeśli pusta, odpięte zostaną wszystkie właściwości przypisane do tej cechy dla tego produktu."
