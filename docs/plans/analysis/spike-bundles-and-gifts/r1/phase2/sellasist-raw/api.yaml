  /operationdocuments:
    get:
      description: >-
        Zwraca listę dokumentów operacyjnych z opcjonalnymi parametrami
        filtrowania.
      parameters:
        - description: Liczba wyników do zwrócenia (maksymalnie 100).
          in: query
          name: limit
          required: false
          schema:
            default: 100
            example: 50
            type: integer
        - description: Przesunięcie (offset) dla paginacji wyników.
          in: query
          name: offset
          required: false
          schema:
            default: 0
            example: 10
            type: integer
        - description: Filtruje według identyfikatora serii dokumentów.
          in: query
          name: series_id
          required: false
          schema:
            example: 3
            type: integer
        - description: Filtruje według typu dokumentu [`sale`, `stock`, `correct`].
          in: query
          name: type
          required: false
          schema:
            example: sale
            type: string
        - description: >-
            Filtruje według podtypu dokumentu [`invoice`, `receipt`, `proforma`,
            `bill`, `correction`, `reservation`, `release`, `internal_release`,
            `internal_admission`, `admission`, `mov`].
          in: query
          name: subtype
          required: false
          schema:
            example: invoice
            type: string
        - description: >-
            Data początkowa (od) dla filtrowania dokumentów (po polu
            `issue_date`).
          in: query
          name: date_from
          required: false
          schema:
            example: '2026-03-15'
            format: date
            type: string
        - description: Data końcowa (do) dla filtrowania dokumentów (po polu `issue_date`).
          in: query
          name: date_to
          required: false
          schema:
            example: '2026-03-15'
            format: date
            type: string
        - description: Filtruje dokumenty według ID zamówienia.
          in: query
          name: order_id
          required: false
          schema:
            example: 202
            type: integer
        - description: >-
            Filtruje według statusu wydruku. Prawidłowe wartości: `true` lub
            `false`.
          in: query
          name: is_printed
          required: false
          schema:
            example: true
            type: boolean
        - description: >-
            Filtruje według statusu wstrzymania wydruku. Prawidłowe wartości:
            `true` lub `false`.
          in: query
          name: print_suspended
          required: false
          schema:
            example: true
            type: boolean
        - description: >-
            Kolejność sortowania wyników. Wartości: `asc` (rosnąco) lub `desc`
            (malejąco).
          in: query
          name: sort
          required: false
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    custom_number:
                      example: DOC-2023/001
                      type: string
                    id:
                      example: 123
                      type: integer
                    is_printed:
                      example: true
                      type: boolean
                    issue_date:
                      example: '2026-07-20'
                      format: date
                      type: string
                    number:
                      example: INV-2023/01
                      type: string
                    print_suspended:
                      example: true
                      type: boolean
                    sale_date:
                      example: '2026-07-20'
                      format: date
                      type: string
                    series_id:
                      example: 3
                      type: integer
                    subtype:
                      example: sale
                      type: string
                    type:
                      example: invoice
                      type: string
                  type: object
                type: array
          description: Lista dokumentów operacyjnych pobrana pomyślnie.
        '400':
          description: Nieprawidłowe dane żądania.
        '404':
          description: Nie znaleziono dokumentów spełniających kryteria wyszukiwania.
      summary: Pobierz listę dokumentów operacyjnych
      tags:
        - Dokumenty operacyjne [BETA]
    post:
      description: Tworzy nowy dokument operacyjny na podstawie przekazanych danych.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationDocument'
        description: Dane nowego dokumentu operacyjnego.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDocument'
          description: Dokument został pomyślnie utworzony.
        '400':
          description: Nieprawidłowe dane żądania.
      summary: Dodaj nowy dokument operacyjny
      tags:
        - Dokumenty operacyjne [BETA]
