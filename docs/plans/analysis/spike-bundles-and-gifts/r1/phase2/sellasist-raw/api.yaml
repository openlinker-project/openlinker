components:
  responses:
    400BadRequest:
      description: "Nieprawidłowe żądanie (błędna struktura JSON lub niepoprawny format zapytania)."
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: string
                example: "error"
              message:
                type: string
                example: "Nieprawidłowy format danych wejściowych."
    401Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/response_unauthorized'
      description: Błąd autoryzacji
    404NotFound:
      description: "Nie znaleziono żądanego zasobu."
      content:
        application/json:
          schema:
            type: object
            required:
              - status
