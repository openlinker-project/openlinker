      description: Aktualizuje kategorię w oparciu o id
      parameters:
        - description: Identyfikator kategorii
          in: path
          name: category_id
          required: true
          schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/category_details'
        description: Szczegóły kategorii
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
