                example: "error"
              message:
                type: string
                example: "Wskazany zasób nie istnieje."

    422ValidationError:
      description: "Błąd walidacji danych wejściowych (przesłane wartości nie spełniają wymagań biznesowych)."
      content:
        application/json:
          schema:
            type: object
            required:
