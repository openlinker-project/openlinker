  description: Korzystanie z Sellasist REST API wymaga podania klucza apiKey. Klucz można wygenerować po zalogowaniu do Sellasista w zakładce Integracje > Klucze API.<br><br><a href='/changelog' target='_blank'>CHANGELOG</a>
  version: 1.92.8
servers:
  - url: https://{account}.sellasist.pl/api/v1
    variables:
      account:
        default: demo
