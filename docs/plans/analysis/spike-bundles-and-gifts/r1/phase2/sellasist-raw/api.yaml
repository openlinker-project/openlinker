      tags:
        - Zamówienia
      description: Zwraca listę zamówień wraz z filtrowaniem i stronicowaniem
      parameters:
        - description: Offset (przesunięcie wyników)
          in: query
          name: offset
          required: false
          schema:
            type: integer
        - description: Limit zwracanych wyników (maksymalnie 100)
          in: query
          name: limit
          required: false
          schema:
            type: integer
        - description: Identyfikator statusu zamówienia
          in: query
          name: status_id
          required: false
          schema:
            type: integer
        - description: Zwraca zamówienia o ID wyższym niż podana wartość
          in: query
          name: from_id
          required: false
          schema:
            type: integer
        - description: Adres e-mail klienta składającego zamówienie
          in: query
          name: email
          required: false
          schema:
            type: string
        - description: Częściowe dopasowanie adresu e-mail klienta (szukane od początku ciągu)
          in: query
          name: email_contains
          required: false
          schema:
            type: string
        - description: Imię klienta (z adresu bilingowego, wyszukiwanie typu LIKE)
          in: query
          name: first_name
          required: false
          schema:
            type: string
        - description: Nazwisko klienta (z adresu bilingowego, wyszukiwanie typu LIKE)
          in: query
          name: last_name
          required: false
          schema:
            type: string
        - description: Zewnętrzny identyfikator zamówienia (np. ID zamówienia w sklepie lub serwisie, z którego zostało zaimportowane)
          in: query
          name: external_id
          required: false
          schema:
            type: string
        - description: "Wyszukiwanie kupującego po zewnętrznym user ID lub user login (np. 111111111 lub Client:11111111)"
          in: query
          name: external_user
          required: false
          schema:
            type: string
        - description: Dokładna data złożenia zamówienia (format YYYY-MM-DD)
          in: query
          name: exact_date
          required: false
          schema:
            type: string
        - description: Typ dokumentu sprzedaży (receipt/invoice)
          in: query
          name: sale_document
          required: false
          schema:
            type: string
            enum: [ receipt, invoice ]
        - description: Flaga oznaczająca zamówienia z otwartym sporem na Allegro (0 lub 1)
          in: query
          name: dispute
          required: false
          schema:
            type: integer
        - description: Zwraca tylko zamówienia w pełni opłacone (filtr logiczny oparty na statusie paid)
          in: query
          name: paid
          required: false
          schema:
            type: boolean
        - description: Filtrowanie po statusie płatności
          in: query
          name: payment_status
          required: false
          schema:
            type: string
            enum: [ paid, unpaid, excess, partial, returned ]
        - description: Identyfikator metody płatności
          in: query
          name: payment_id
          required: false
          schema:
            type: integer
        - description: Identyfikator metody dostawy
          in: query
          name: shipment_id
          required: false
          schema:
            type: integer
        - description: Symbol waluty zamówienia (np. PLN, EUR)
          in: query
          name: currency
          required: false
          schema:
            type: string
        - description: Źródło zamówienia (np. allegro, ebay, amazon, erli itp.)
          in: query
          name: source
          required: false
          schema:
            type: string
            enum: [ allegro, ebay, arena, ceneo, extsources, amazon, empik, erli, wms, marketplace, baselinker ]
        - description: Data zamówienia od (YYYY-MM-DD HH:ii:ss)
          in: query
          name: date_from
          required: false
          schema:
            type: string
        - description: Data zamówienia do (YYYY-MM-DD HH:ii:ss)
          in: query
          name: date_to
          required: false
          schema:
            type: string
        - description: Sortowanie zamówień po ID (asc/desc), domyślnie desc
          in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [ asc, desc ]
        - description: Flaga umożliwiająca pobranie wszystkich zamówień niezależnie od statusu placeholder (0 lub 1)
          in: query
          name: include_placeholders
          required: false
          schema:
            type: integer
        - description: Filtrowanie po konkretnym statusie placeholder (0 - zatwierdzone, 1 - w trakcie składania)
          in: query
          name: placeholder
          required: false
          schema:
            type: integer
