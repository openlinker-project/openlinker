  /wms_stockingups:
    get:
      tags:
        - WMS - Dostawy towaru
      summary: Pobierz listę planowanych dostaw towaru
      description: >-
        Zwraca listę planowanych dostaw magazynowych. Wyniki możesz stronicować przez limit/offset albo id_from/id_to. Podsumowanie ilości i listę produktów dołączysz parametrem `include`.
      parameters:
        - name: id_from
          in: query
          description: "ID początkowe do wydajnej paginacji"
          required: false
          schema:
            type: integer
            example: 100
        - name: id_to
          in: query
          description: "ID końcowe do wydajnej paginacji"
          required: false
          schema:
            type: integer
            example: 200
        - name: document_number
          in: query
          description: Numer dokumentu dostawy
          required: false
          schema:
            type: string
            example: "PZ/PLAN/2026/09"
        - name: status
          in: query
          description: Kod statusu dostawy
          required: false
          schema:
            type: integer
            example: 1
        - name: status_id
          in: query
          description: ID słownikowe statusu
          required: false
          schema:
            type: integer
            example: 2
        - name: supplier_id
          in: query
          description: ID powiązanej hurtowni/dostawcy
          required: false
          schema:
            type: integer
            example: 5
        - name: contractor_id
          in: query
          description: ID powiązanego kontrahenta
          required: false
          schema:
            type: integer
            example: 12
        - name: date_from
          in: query
          description: "Data utworzenia dokumentu od (format: YYYY-MM-DD lub YYYY-MM-DD HH:ii:ss)"
          required: false
          schema:
            type: string
            example: "2026-09-01 00:00:00"
        - name: date_to
          in: query
          description: "Data utworzenia dokumentu do (format: YYYY-MM-DD lub YYYY-MM-DD HH:ii:ss)"
          required: false
          schema:
            type: string
            example: "2026-09-30 23:59:59"
        - name: delivery_date_from
          in: query
          description: "Planowana data dostarczenia towaru od (format: YYYY-MM-DD)"
          required: false
          schema:
            type: string
            format: date
            example: "2026-09-15"
        - name: delivery_date_to
          in: query
          description: "Planowana data dostarczenia towaru do (format: YYYY-MM-DD)"
          required: false
          schema:
            type: string
            format: date
            example: "2026-09-20"
        - name: include
          in: query
          description: >-
            Opcjonalne dołączenie relacji oddzielonych przecinkami:
            `summary` (liczba pozycji i łączna ilość sztuk),
            `products` (pełna lista awizowanych towarów w dostawie).
          required: false
          schema:
            type: string
            example: "summary,products"
        - name: sort
          in: query
          description: "Kierunek sortowania po ID"
          required: false
          schema:
            type: string
            enum: [ asc, desc ]
            default: desc
        - name: limit
          in: query
          description: "Maksymalna liczba zwracanych rekordów (maksymalnie 500, domyślnie 100)"
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          description: "Przesunięcie wyników (tradycyjna paginacja)"
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Sukces. Zwraca listę planowanych dostaw magazynowych.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockingupListItem'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '422':
          $ref: '#/components/responses/422ValidationError'
        '500':
          $ref: '#/components/responses/500InternalError'

