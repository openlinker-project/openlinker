                    example: 1
                    type: integer
                type: object
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          content:
            application/json:
              schema:
                properties:
                  error:
                    example: 104
                    type: integer
                  message:
                    example: Podany identyfikator pola danych nie istnieje.
                    type: string
                type: object
          description: Błąd - jeden z elementów w zapytaniu nie został znaleziony w zbiorze
      tags:
        - Kategorie
  /changelog:
    get:
      tags: [ "Informacyjne" ]
      summary: Pobierz changelog oprogramowania sellasist
      description: "Pobiera stronicowaną listę zmian i aktualizacji systemu Sellasist, pobieraną na bieżąco z zewnętrznego systemu CRM."
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: "Numer strony z wynikami changeloga."
      responses:
        200:
          description: Sukces. Zwraca listę wersji i opis wprowadzonych zmian.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChangelogItem'
              example:
                - version: "1.90.7"
                  date: "2026-03-15"
                  description: "Aktualizacja API, optymalizacja gospodarki magazynowej."
                  changes:
                    - type: "added"
                      text: "Dodano nowy punkt końcowy do obsługi pobierania załączników."
                    - type: "fixed"
                      text: "Poprawiono rzadki błąd walidacji podczas masowej aktualizacji stanów."
                - version: "1.90.6"
                  date: "2026-02-28"
                  description: "Wydanie konserwacyjne."
                  changes:
                    - type: "improved"
