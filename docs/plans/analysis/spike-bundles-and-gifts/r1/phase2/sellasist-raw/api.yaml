                  type: array
                  description: "Opcjonalna lista właściwości (w kodzie mapowana na 'values')"
                  items:
                    $ref: '#/components/schemas/QualityPropertyInput'
                values:
                  type: array
                  description: "Alternatywny klucz dla właściwości (równoważny z 'properties')"
                  items:
                    $ref: '#/components/schemas/QualityPropertyInput'
            example:
              language_id: 2
              name:
                "1": "Color"
                "2": "Kolor"
              properties:
                - name: "Czerwony"
                  order: 1
                - name:
                    "1": "Green"
                    "2": "Zielony"
                  order: 2
      responses:
