paths:
  /alerts:
    get:
      tags: [ "Informacyjne" ]
      summary: Pobierz listę Twoich aktywnych komunikatów i alertów systemowych
      description: "Zwraca ustrukturyzowaną i stronicowaną listę wszystkich aktywnych komunikatów widocznych na pulpicie panelu."
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: "Numer strony z wynikami alertów."
      responses:
        200:
          description: Sukces. Zwraca ustrukturyzowaną listę komunikatów z paginacją.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertsResponse'
  /attributes:
    get:
      summary: Pobierz listę atrybutów
      description: Zwraca listę atrybutów
      parameters:
        - description: Offset
          in: query
          name: offset
          required: false
          schema:
            type: integer
        - description: Limit
          in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                example:
                  - id: 1
                    name: Grupa 1
                  - id: 2
                    name: Grupa 2
                  - id: 3
                    name: Grupa 3
                items:
                  format: int64
                  type: integer
                title: attributes
                type: array
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty
    post:
      summary: Tworzy atrybut
      description: Tworzy atrybut
      requestBody:
        content:
          application/json:
            schema:
              properties:
                group_id:
                  description: Identyfikator grupy atrybutów
                  example: 1
                  type: integer
                name:
                  description: Nazwa grupy atrybutów
                  example: Odcienie zieleni
                  type: string
              type: object
        description: Struktura atrybutu
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    message:
                      description: Wiadomość zwrotna od systemu
                      example: success
                      type: string
                  type: object
                type: array
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty
  /attributes/{attribute_id}:
    delete:
      summary: Usuwa dany atrybut
      description: Usuwa dany atrybut
      parameters:
        - description: Identyfikator atrybutu
          in: path
          name: attribute_id
          required: true
          schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    description: Status wykonania zapytania
                    example: success
                    type: string
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty
    get:
      summary: Pobierz szczegóły atrybutu
      description: Zwraca szczegóły atrybutu
      parameters:
        - description: Identyfikator atrybutu
          in: path
          name: attribute_id
          required: true
          schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  group_id:
                    example: 1
                    type: integer
                  id:
                    example: 2
                    type: integer
                  name:
                    example: Nazwa atrybutu 1
                    type: string
                  properties:
                    example:
                      - id: 1
                        name: Właścwiość 1
                      - id: 2
                        name: Właścwiość 2
                    items:
                      format: int64
                      type: integer
                    type: array
                type: object
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty
    put:
      summary: Aktualizuje atrybut
      description: Aktualizuje atrybut
      parameters:
        - description: Identyfikator atrybutu
          in: path
          name: attribute_id
          required: true
          schema: {}
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  description: Nazwa atrybutu
                  example: Zielony
                  type: string
              type: object
        description: Struktura aktualizacji atrybutu
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    message:
                      description: Wiadomość zwrotna od systemu
                      example: success
                      type: string
                  type: object
                type: array
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty
  /attributes_groups:
    get:
      summary: Pobierz listę grup atrybutów
      description: Zwraca listę grup atrybutów
      parameters:
        - description: Offset
          in: query
          name: offset
          required: false
          schema:
            type: integer
        - description: Limit
          in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                example:
                  - id: 1
                    name: Grupa 1
                  - id: 2
                    name: Grupa 2
                  - id: 3
                    name: Grupa 3
                items:
                  format: int64
                  type: integer
                title: attributes_groups
                type: array
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty - Grupy
    post:
      summary: Tworzy grupę atrybutów
      description: Tworzy grupę atrybutów
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  description: Nazwa grupy atrybutów
                  example: Kolor
                  type: string
              type: object
        description: Struktura aktualizacji grupy atrybutów
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    message:
                      description: Wiadomość zwrotna od systemu
                      example: success
                      type: string
                  type: object
                type: array
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty - Grupy
  /attributes_groups/{group_id}:
    delete:
      summary: Usuwa daną grupę atrybutów
      description: Usuwa daną metodę dostawy
      parameters:
        - description: Identyfikator grupy atrybutów
          in: path
          name: group_id
          required: true
          schema: {}
      responses:
        '200':
          content:
              application/json:
                schema:
                  type: object
                  properties:
                    message:
                      description: Status wykonania zapytania
                      example: success
                      type: string
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty - Grupy
    get:
      summary: Pobierz szczegóły grupy atrybutów
      description: Zwraca listę grup atrybutów
      parameters:
        - description: Identyfikator grupy atrybutów
          in: path
          name: group_id
          required: true
          schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  attributes:
                    example:
                      - id: 1
                        name: Wariant 1
                      - id: 2
                        name: Wariant 2
                    items:
                      format: int64
                      type: integer
                    type: array
                  id:
                    example: 2
                    type: integer
                  name:
                    example: Nazwa grupy 1
                    type: string
                type: object
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty - Grupy
    put:
      summary: Aktualizuje grupę atrybutów
      description: Aktualizuje grupę atrybutów
      parameters:
        - description: Identyfikator grupy atrybutów
          in: path
          name: group_id
          required: true
          schema: {}
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  description: Nazwa grupy atrybutów
                  example: Kolor
                  type: string
              type: object
        description: Struktura aktualizacji grupy atrybutów
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    message:
                      description: Wiadomość zwrotna od systemu
                      example: success
                      type: string
                  type: object
                type: array
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty - Grupy
  /attributes_properties:
    get:
      summary: Pobierz listę właściwości atrybutów
      description: Zwraca listę właściwości atrybutów
      parameters:
        - description: Offset
          in: query
          name: offset
          required: false
          schema:
            type: integer
        - description: Limit
          in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                example:
                  - id: 1
                    name: Właścwiość 1
                  - id: 2
                    name: Właścwiość 2
                  - id: 3
                    name: Właścwiość 3
                items:
                  format: int64
                  type: integer
                title: attributes_properties
                type: array
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty - Właściwości
    post:
      summary: Tworzy właściwość atrybutu
      description: Tworzy właściwość atrybutu
      requestBody:
        content:
          application/json:
            schema:
              properties:
                attribute_id:
                  description: Identyfikator właściwości atrybutu
                  example: 1
                  type: integer
                name:
                  description: Nazwa właściwości atrybutu
                  example: Jasnozielony
                  type: string
              type: object
        description: Struktura właściwości atrybutu
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    message:
                      description: Wiadomość zwrotna od systemu
                      example: success
                      type: string
                  type: object
                type: array
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty - Właściwości
  /attributes_properties/{attribute_property_id}:
    delete:
      summary: Usuwa dany atrybut
      description: Usuwa dany atrybut
      parameters:
        - description: Identyfikator atrybutu
          in: path
          name: attribute_property_id
          required: true
          schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    description: Status wykonania zapytania
                    example: success
                    type: string
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty - Właściwości
    get:
      summary: Pobierz szczegóły właściwości
      description: Zwraca szczegóły właściwości
      parameters:
        - description: Identyfikator atrybutu
          in: path
          name: attribute_property_id
          required: true
          schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  attribute_id:
                    example: 1
                    type: integer
                  id:
                    example: 2
                    type: integer
                  name:
                    example: Nazwa właściwości 1
                    type: string
                type: object
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty - Właściwości
    put:
      summary: Aktualizuje właściwość atrybutu
      description: Aktualizuje właściwość atrybutu
      parameters:
        - description: Identyfikator właściwości atrybutu
          in: path
          name: attribute_property_id
          required: true
          schema: {}
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  description: Nazwa właściwości
                  example: Jasnozielony
                  type: string
              type: object
        description: Struktura aktualizacji właściwości atrybutu
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    message:
                      description: Wiadomość zwrotna od systemu
                      example: success
                      type: string
                  type: object
                type: array
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Atrybuty - Właściwości
  /categories:
    get:
      summary: Pobierz listę kategorii
      description: Zwraca listę kategorii
      parameters:
        - description: Offset
          in: query
          name: offset
          required: false
          schema:
            type: integer
        - description: Limit
          in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                example:
                  - id: 1
                    parent: ''
                    title: OdzieĹź
                  - id: 2
                    parent: 1
                    title: Kurtki
                  - id: 3
                    parent: 1
                    title: Bluzki
                items:
                  format: int64
                  type: integer
                title: categories
                type: array
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
      tags:
        - Kategorie
    post:
      summary: Tworzy nową kategorię
      description: Tworzy nową kategorię
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/category_details'
        description: Szczegóły kategorii
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  id:
                    example: 1
                    type: integer
                type: object
          description: Sukces
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          content:
            application/json:
              schema:
                properties:
                  error:
                    example: 103
                    type: integer
                  message:
                    example: Podany identyfikator języka nie istnieje.
                    type: string
                type: object
          description: Błąd - jeden z elementów w zapytaniu nie został znaleziony w zbiorze
      tags:
        - Kategorie
  /categories/{category_id}:
    delete:
      summary: Usuwa daną kategorię
      description: Usuwa daną kategorię
      parameters:
        - description: Identyfikator kategorii
          in: path
          name: category_id
          required: true
          schema: {}
      responses:
        '200':
          content:
