  /returns:
    get:
      tags:
        - Zwroty
      summary: Pobierz listę zarejestrowanych zwrotów
      description: >-
        Zwraca listę dokumentów zwrotów (RMZ). Umożliwia filtrowanie po dacie, numerze zamówienia, statusie, źródle oraz numerze zwrotu.
      parameters:
        - name: date_from
          in: query
          description: "Data utworzenia zwrotu od (format: YYYY-MM-DD HH:MM:SS)"
          required: false
          schema:
            type: string
            example: "2026-07-01 00:00:00"
        - name: date_to
          in: query
          description: "Data utworzenia zwrotu do (format: YYYY-MM-DD HH:MM:SS)"
          required: false
          schema:
            type: string
            example: "2026-07-31 23:59:59"
        - name: order_id
          in: query
          description: "ID zamówienia w Sellasist (wskazówka: to samo ID, które występuje w endpointcie GET /orders)"
          required: false
          schema:
            type: integer
            example: 1234
        - name: status_id
          in: query
          description: "ID statusu zwrotu (wskazówka: pełną listę dostępnych ID statusów pobierzesz z GET /returns_statuses)"
          required: false
          schema:
            type: integer
            example: 1
        - name: source_id
          in: query
          description: "ID źródła zwrotu (wskazówka: pełną listę źródeł pobierzesz z GET /returns_sources)"
          required: false
          schema:
            type: integer
            example: 1
        - name: return_number
          in: query
          description: "Dokładny numer zwrotu w systemie (np. RMZ120072026)"
          required: false
          schema:
            type: string
            example: "RMZ120072026"
        - name: sort
          in: query
          description: "Kierunek sortowania po ID (desc - od najnowszych, asc - od najstarszych)"
          required: false
          schema:
            type: string
            enum: [ asc, desc ]
            default: desc
        - name: limit
          in: query
          description: "Liczba wyników na stronę (domyślnie 100, maks. 500)"
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          description: "Przesunięcie wyników (paginacja)"
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Sukces. Zwraca listę dokumentów zwrotów.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/returns_list_item'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          description: Przekroczono limit zapytań (Rate Limiter).
        '500':
          $ref: '#/components/responses/500InternalError'

    post:
      tags:
        - Zwroty
      summary: Zarejestruj nowy zwrot (RMZ)
      description: >-
        Tworzy nowy dokument zwrotu.
        
        **Wskazówki integracyjne (Skąd wziąć dane):**
        - `order_number`: ID zamówienia z `GET /orders`.
        - `status_id` lub `status`: ID z `GET /returns_statuses` (lub wpisz po prostu typ/nazwę np. "positive", "new").
        - `source_id` lub `source`: ID lub nazwa z `GET /returns_sources`.
        - `returned_products[].cart_id`: ID pozycji w koszyku zamówienia z `GET /orders/{order_id}` (tablica `carts[].id`). Jeśli podasz `cart_id`, system sam pobierze nazwę, ID produktu, wariantu oraz cenę!
        - `return_number`: Opcjonalne pole. Jeśli puste, system wygeneruje automatyczny numer w formacie `RMZ{numer}{data}`.
        - `term`: Opcjonalne pole daty terminu rozpatrzenia. W przypadku braku system ustawi automatycznie +14 dni od daty zwrotu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/return_request_payload'
      responses:
        '201':
          description: Pomyślnie zarejestrowano zwrot. Zwraca pełny obiekt utworzonego dokumentu (gotowy do natychmiastowego użycia w PUT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/return_details'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422ValidationError'
        '500':
          $ref: '#/components/responses/500InternalError'

  /returns/{id}:
    get:
      tags:
        - Zwroty
      summary: Pobierz szczegóły konkretnego zwrotu
      description: >-
        Zwraca pełne dane zwrotu. Odpowiedź możesz zmienić (np. status lub opis) i od razu wysłać w `PUT /returns/{id}`.
      parameters:
        - name: id
          in: path
          required: true
          description: "ID dokumentu zwrotu w Sellasist"
          schema:
            type: integer
            example: 666
      responses:
        '200':
          description: Sukces. Zwraca szczegółowe dane zwrotu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/return_details'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Nie znaleziono zwrotu o podanym ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
        '500':
          $ref: '#/components/responses/500InternalError'

    put:
      tags:
        - Zwroty
      summary: Zaktualizuj dane zwrotu (Pełna edycja / Podmiana danych)
      description: >-
        Umożliwia pełną edycję dokumentu zwrotu, w tym zmianę statusu, danych adresowych, kwot oraz listy pozycji.

        **Wskazówka:** Możesz wkleić tutaj 1:1 cały obiekt JSON pobrany wcześniej z `GET /returns/{id}`.
      parameters:
        - name: id
          in: path
          required: true
          description: "ID dokumentu zwrotu do edycji"
          schema:
            type: integer
            example: 666
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/return_request_payload'
      responses:
        '200':
          description: Pomyślnie zaktualizowano zwrot. Zwraca odświeżony obiekt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/return_details'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422ValidationError'
        '500':
          $ref: '#/components/responses/500InternalError'

    delete:
      tags:
        - Zwroty
      summary: Usuń dokument zwrotu
      description: "Trwale usuwa zwrot razem z jego pozycjami."
      parameters:
        - name: id
          in: path
          required: true
          description: "ID zwrotu do usunięcia"
          schema:
            type: integer
            example: 666
      responses:
        '204':
          description: Zwrot został pomyślnie usunięty (brak zawartości).
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Nie znaleziono zwrotu o podanym ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
        '500':
          $ref: '#/components/responses/500InternalError'

  /returns_status/{id}:
    put:
      tags:
        - Zwroty
      summary: Zmień status zwrotu
      description: >-
        Zmienia status zwrotu tak jak w panelu, razem z wiadomościami do klienta i akcjami automatycznymi
        przypisanymi do statusu. Ponowne wysłanie tego samego statusu niczego nie zmienia.
      parameters:
        - name: id
          in: path
          required: true
          description: "ID zwrotu (nie statusu)"
          schema:
            type: integer
            example: 666
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status_id
              properties:
                status_id:
                  type: integer
                  description: >-
                    ID statusu zwrotu (pełną listę pobierzesz z GET /returns_statuses). Statusy, które wystawiają
                    korektę, zlecają zwrot środków albo odrzucają zwrot, można ustawić tylko w panelu.
                  example: 2
      responses:
        '200':
          description: Pomyślnie zmieniono status zwrotu.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: integer
                    description: "ID zwrotu"
                    example: 666
                  return_number:
                    type: string
                    description: "Numer zwrotu"
                    example: "RMZ215042024"
                  status_id:
                    type: integer
                    description: "ID aktualnego statusu zwrotu"
                    example: 2
                  status:
                    type: string
                    description: "Nazwa aktualnego statusu zwrotu"
                    example: "Przyjęto na stan"
                  last_change_status_date:
                    type: string
                    nullable: true
                    description: "Data ostatniej zmiany statusu (format Y-m-d H:i:s)"
                    example: "2026-10-13 14:05:21"
                  warnings:
                    type: array
                    description: >-
                      Pojawia się tylko wtedy, gdy status został zmieniony, ale nie wszystkie akcje statusu się wykonały.
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: "Kod ostrzeżenia"
                          enum:
                            - status_actions_incomplete
                        message:
                          type: string
                          description: "Opis ostrzeżenia"
              examples:
                success:
                  summary: Status zmieniony
                  value:
                    id: 666
                    return_number: "RMZ215042024"
                    status_id: 2
                    status: "Przyjęto na stan"
                    last_change_status_date: "2026-10-13 14:05:21"
                warnings:
                  summary: Status zmieniony, nie wszystkie akcje się wykonały
                  value:
                    id: 666
                    return_number: "RMZ215042024"
                    status_id: 2
                    status: "Przyjęto na stan"
                    last_change_status_date: "2026-10-13 14:05:21"
                    warnings:
                      - code: status_actions_incomplete
                        message: "Status changed, but not all status actions were completed."
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Konto API nie ma dostępu do tego endpointu.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: error
                message: "This API account type cannot use this endpoint."
        '404':
          description: Nie znaleziono zwrotu o podanym ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
              example:
                status: error
                message: "Return not found."
        '409':
          description: Status zwrotu jest właśnie zmieniany. Spróbuj ponownie za chwilę.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: error
                message: "Status of this return is being changed by another request."
        '422':
          description: Nie można ustawić podanego statusu zwrotu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse422'
              examples:
                not_found:
                  summary: Status nie istnieje
                  value:
                    status: error
                    message: "The status_id field: status does not exist."
                type_mismatch:
                  summary: Status nie pasuje do typu zgłoszenia
                  value:
                    status: error
                    message: "The status_id field: status does not match the return type."
        '429':
          description: Przekroczono limit zapytań.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: error
                message: "Przekroczono limit zapytań"
        '500':
          $ref: '#/components/responses/500InternalError'

  /returns_statuses:
    get:
