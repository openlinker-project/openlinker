.card-button-reset > .metric-card{
  height: 100%;
}
.button__shortcut{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.125rem;
  padding: 1px 5px;
  margin-left: var(--space-2);
  font-family: var(--font-mono);
  font-size: 0.625rem;
  line-height: 1;
  letter-spacing: var(--tracking-wide);
  border-radius: var(--radius-xs);
  background: rgb(255 255 255 / 0.20);
  color: inherit;
  opacity: 0.85;
}
.button--secondary .button__shortcut,
.button--ghost .button__shortcut{
  background: var(--bg-surface-muted);

}
.sr-only{
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.shell{
  min-height: 100vh;
  background: var(--bg-canvas);
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto 1fr;
  grid-template-areas: 'main';
}
.shell-sidebar{
  display: none;
}

  }
.shell-sidebar{
    grid-area: sidebar;
    display: flex;
    flex-direction: column;
    background: var(--bg-shell);
    border-right: 1px solid var(--border-subtle);
    padding: 12px 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
  }}
.shell-brand{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 16px 16px;
}
.shell-brand__mark{
  width: 26px;
  height: 26px;
  border-radius: 6px;
  display: block;
  object-fit: cover;
}
.shell-brand__name{
  font-weight: 600;
  font-size: 14px;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}
.shell-nav{
  flex: 1;
  overflow-y: auto;
  padding: 0 12px;
  scrollbar-width: thin;
}
.shell-nav__group{
  margin-bottom: 16px;
}
.shell-nav__label{
  margin: 0 0 4px;
  padding: 0 8px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.shell-nav__list{
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 1px;
}
.shell-nav__link{
  display: flex;
  align-items: center;
  padding: 6px 8px;
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  transition:
    background 120ms,
    color 120ms;
}
.shell-nav__link:hover{
  background: var(--bg-surface-muted);
  color: var(--text-primary);
}
.shell-nav__link--active{
  background: var(--bg-surface-muted);
  color: var(--text-primary);
  font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent-primary);
}

}
.shell-nav__link--disabled:hover{
  background: transparent;
  color: var(--text-disabled);
}
.shell-nav__link-label{
  flex: 1;
  min-width: 0;
}
.shell-nav__link-count{

  font-weight: 500;
  color: var(--text-muted);
  padding-left: 0.5rem;
  letter-spacing: -0.01em;
}
.shell-nav__link--active .shell-nav__link-count{
  color: var(--text-primary);
}
.shell-nav__link-lock{

  font-size: 11px;

  color: var(--text-muted);
}

}

}

  z-index: 10;

  align-items: center;

}
.shell-crumbs{

  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
  min-width: 0;
}
.shell-crumbs__group{
  white-space: nowrap;
}
.shell-crumbs__sep{
  color: var(--border-strong);
  font-size: 12px;
  line-height: 1;
}
.shell-crumbs__current{
  color: var(--text-primary);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.shell-topbar__spacer{

.shell-topbar__alerts{

  padding: 0 10px 0 32px;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  background: var(--bg-surface);
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 400;
  cursor: text;
  position: relative;
  text-align: left;
}
@media (min-width: 1024px){.shell-topbar__search{
    display: inline-flex;

.shell-topbar__search:hover{
  border-color: var(--border-strong);
  background: var(--bg-surface);
}
.shell-topbar__search:focus-visible{
  outline: 2px solid var(--accent-focus);
  outline-offset: 2px;
}
.shell-topbar__search-icon{
  position: absolute;
  left: 10px;
  top: 50%;

  border: 1px solid var(--border-default);
  border-bottom-width: 2px;
  border-radius: var(--radius-xs);
  color: var(--text-muted);
  background: var(--bg-surface-muted);
  line-height: 1;
  letter-spacing: 0.04em;
  font-weight: 500;
}
.shell-user-chip{
  display: inline-flex;
  align-items: center;
  gap: 8px;

  color: var(--text-primary);

  height: 32px;

  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.02em;

  font-weight: 500;
  color: var(--text-primary);

    display: none;
  }}
.shell-content{

    padding: 20px 32px 48px;

.page-title,
.state-card__title{

.panel-copy,
.muted-text{

}

.connection-list,
.activity-list,
.check-list,
.page-section,
.page-header,

.field{

.eyebrow{

  border-radius: var(--radius-sm);
  background: var(--status-disabled-soft);
  color: var(--status-disabled-fg);

  font-size: 0.6875rem;

  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;

.status-badge--compact{
  padding: 1px var(--space-2);
  font-size: 0.625rem;
}
.status-badge__dot{
  width: 0.375rem;
  height: 0.375rem;
  border-radius: 999px;
  background: currentColor;
  flex-shrink: 0;
  opacity: 0.75;

.status-badge--success{
  border-color: var(--status-success-border);
  background: var(--status-success-soft);
  color: var(--status-success-fg);
}
.status-badge--warning{
  border-color: var(--status-warning-border);
  background: var(--status-warning-soft);
  color: var(--status-warning-fg);
}
.status-badge--error{
  border-color: var(--status-error-border);
  background: var(--status-error-soft);
  color: var(--status-error-fg);
}
.status-badge--review{
  border-color: var(--status-review-border);
  background: var(--status-review-soft);
  color: var(--status-review-fg);

.status-badge--conflict{

  background: var(--status-conflict-soft);
  color: var(--status-conflict-strong);
}
.status-badge--info{
  border-color: var(--status-info-border);
  background: var(--status-info-soft);
  color: var(--status-info-fg);
}
.status-badge--neutral{
  border-color: var(--status-disabled-border);

.status-badge--solid{

.mono{

.data-table__action{

.data-table__action:hover{

.data-table th,

  line-height: 1.4;

  font-family: var(--font-mono);

  font-weight: 500;
  letter-spacing: var(--tracking-caps);

  top: 0;

.bg-app { position:absolute; inset:-30px; overflow:hidden; filter:blur(4px) saturate(.9); opacity:var(--bg-app-opacity); pointer-events:none; user-select:none; -webkit-user-select:none; }
.bg-app__frame { position:absolute; left:0; top:0; transform-origin:left top; }
.bg-app .shell { min-height:0; height:100%; }
.bg-app .shell-content { overflow:hidden; }
.bg-app__scenes { position:relative; animation:none; }
.bg-app__scene { position:absolute; inset:0; padding:inherit; will-change:opacity, transform; }
.bg-app__crumb { position:relative; display:inline-grid; }
.bg-app__crumb > span { grid-area:1 / 1; }
.bg-app__nav { transition: background-color 1.2s ease, color 1.2s ease, box-shadow 1.2s ease; }
.bg-app__drift { width:100%; height:100%; animation: bg-drift 28s ease-in-out infinite alternate; transform-origin:60% 40%; }
@keyframes bg-drift { from { transform: scale(1) translate3d(0, 0, 0); } to { transform: scale(1.05) translate3d(-1.5%, -1%, 0); } }
@media (prefers-reduced-motion: reduce) { .bg-app__drift { animation:none; } }
.stage__wash { position:absolute; inset:0; z-index:-1; pointer-events:none; background:
  radial-gradient(65% 80% at 0% 100%, color-mix(in oklab, var(--accent-primary) 26%, transparent), transparent 62%),
  radial-gradient(55% 60% at 100% 0%, color-mix(in oklab, var(--accent-primary) 12%, transparent), transparent 60%),
  linear-gradient(90deg, color-mix(in oklab, var(--bg-canvas) 94%, transparent) 0%, color-mix(in oklab, var(--bg-canvas) 78%, transparent) 42%, color-mix(in oklab, var(--bg-canvas) 50%, transparent) 100%); }
.stage__inner { flex:1; width:100%; box-sizing:border-box; max-width:1240px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,440px); gap:72px; align-items:center; padding-block:24px; padding-left:max(32px, env(safe-area-inset-left, 0px)); padding-right:max(32px, env(safe-area-inset-right, 0px)); }
.hero { display:grid; gap:26px; max-width:620px; align-self:center; }
.brand { display:inline-flex; align-items:center; gap:10px; font-weight:600; font-size:1.0625rem; letter-spacing:var(--tracking-tight); color:var(--text-primary); }
.brand__tile { width:32px; height:32px; border-radius:8px; background:oklch(20% 0.012 270); display:grid; place-items:center; box-shadow: inset 0 0 0 1px oklch(100% 0 0 / .06); }
.h1 { font-size:clamp(2.2rem, 3.6vw, 3.1rem); line-height:1.08; letter-spacing:-0.035em; font-weight:600; }
.h1__line { display:block; overflow:hidden; padding-bottom:.06em; white-space:nowrap; }
.h1__line > span { display:block; }
.h1__slot { position:relative; display:block; height:1.1em; overflow:hidden; color:var(--brand-word); }
:root { --brand-word: oklch(60% 0.19 48); --bg-app-opacity: .85; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --brand-word: oklch(78% 0.15 55); --bg-app-opacity: .6; } }
:root[data-theme="dark"] { --brand-word: oklch(78% 0.15 55); --bg-app-opacity: .6; }
.h1__word { position:absolute; left:0; top:0; white-space:nowrap; }
.lead { color:var(--text-secondary); font-size:1.0625rem; line-height:1.55; max-width:42ch; text-wrap:pretty; }
.auth-card { background:var(--bg-surface); border:1px solid var(--border-default); border-radius:16px; padding:24px 28px 26px; box-shadow: 0 1px 2px rgb(15 18 26 / .06), 0 28px 64px -16px rgb(15 18 26 / .28); }
@media (max-width: 960px) {
  .stage__inner { grid-template-columns:minmax(0,1fr); gap:28px; padding-block:28px 48px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .stage__bg { display:none; }
  .h1 { font-size:clamp(2rem, 8vw, 2.6rem); }
  .lead { font-size:1rem; }
  .auth-card { padding:22px 18px 24px; }
  .demo-strip a { margin-left:0; }
}
/* ── Right: auth panel ──────────────────────────────────────────────── */
.tabs { position:relative; display:grid; grid-template-columns:1fr 1fr; padding:4px; border-radius:10px; background:var(--bg-surface-muted); border:1px solid var(--border-subtle); margin-bottom:22px; }
.tab { position:relative; height:40px; border:0; background:transparent; border-radius:7px; font:inherit; font-size:.875rem; font-weight:600; color:var(--text-muted); cursor:pointer; transition: color var(--duration-normal) var(--ease-out); }
.tab:hover { color:var(--text-secondary); }
.tab[aria-selected="true"] { color:var(--text-primary); }
.tab:focus-visible { outline:none; box-shadow:var(--shadow-focus); }
.tab__pill { position:absolute; inset:0; border-radius:7px; background:var(--bg-surface); box-shadow:0 1px 2px rgb(15 18 26 / .08), 0 0 0 1px var(--border-default); }
.tab > span:last-child { position:relative; }

/* Every view sits in the same grid cell: the cell is always as tall as the tallest view,
   so switching tabs, showing errors or finishing a step never changes the page height. */
/* Views are stacked on top of each other; the stack animates to the ACTIVE view's height, so the
   card shrinks for login. The column reserves the tallest view's height, so the page never moves. */
.stack { position:relative; overflow:clip; overflow-clip-margin:8px; }
.stack > .view { position:absolute; top:0; left:0; right:0; min-width:0; }
.auth-col { align-self:center; display:flex; align-items:center; min-height:var(--auth-reserve, auto); }
@media (max-width: 960px) { .auth-col { min-height:0; align-self:start; } }
.auth-col > .auth-card { width:100%; }
.h1__plain { display:block; color:var(--brand-word); }
.highlights { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
.highlights li { display:flex; align-items:center; gap:10px; color:var(--text-secondary); font-size:.9375rem; }
.tick { flex:none; width:20px; height:20px; border-radius:50%; background:var(--accent-primary-soft); border:1px solid var(--accent-primary-border); position:relative; }
.tick::after { content:""; position:absolute; left:6px; top:3.5px; width:5px; height:9px; border:solid var(--accent-primary-soft-strong); border-width:0 2px 2px 0; transform:rotate(45deg); }
.language-switch{
  --switch-hue: var(--accent-primary);
  --switch-tint: color-mix(in oklab, var(--switch-hue) 13%, var(--bg-surface));
  --switch-edge: color-mix(in oklab, var(--switch-hue) 55%, var(--border-subtle));
  position: relative;
  isolation: isolate;
  display: inline-flex;
  
  flex: none;
}
.language-switch__peek{
  position: absolute;
  z-index: 2;
  top: 0;
  right: 0;
  bottom: 0;
  
  width: max-content;
  display: inline-flex;
  align-items: center;
  padding: 5px 8px 5px 6px;
  border: 1px solid var(--switch-edge);
  border-radius: var(--radius-pill);
  background: var(--switch-tint);
  box-shadow: 0 4px 12px -6px color-mix(in oklab, var(--switch-hue) 45%, transparent);
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-fast) var(--ease-out) 80ms;
}
.language-switch__peek > *{
  flex: none;
}
.language-switch__peek .language-switch__chevron{
  margin-left: 6px;
  transform: rotate(var(--peek-chevron, 0deg));
}
.language-switch__reveal{
  display: grid;
  grid-template-columns: 0fr;
  transition: grid-template-columns var(--duration-fast) var(--ease-standard);
}
.language-switch__reveal-clip{
  min-width: 0;
  overflow: hidden;
}
.language-switch__reveal-name{
  display: block;
  padding-left: 7px;
  white-space: nowrap;
  opacity: 0;
  transform: translateX(-6px);
  transition:
    opacity var(--duration-fast) var(--ease-out),
    transform var(--duration-fast) var(--ease-out);
}
.language-switch:not(.is-open):has(.language-switch__trigger:is(:hover, :focus-visible))
  .language-switch__peek{
  opacity: 1;
  transition: opacity 80ms var(--ease-out);
}
.language-switch:not(.is-open):has(.language-switch__trigger:is(:hover, :focus-visible))
  .language-switch__reveal{
  grid-template-columns: 1fr;
  transition: grid-template-columns var(--duration-slow) var(--ease-out);
}
.language-switch:not(.is-open):has(.language-switch__trigger:is(:hover, :focus-visible))
  .language-switch__reveal-name{
  opacity: 1;
  transform: none;
  transition:
    opacity var(--duration-normal) var(--ease-out) 60ms,
    transform var(--duration-slow) var(--ease-out) 40ms;
}
@media (hover: none){.language-switch__peek{
    display: none;
  }}
@media (prefers-reduced-motion: reduce){.language-switch__peek,
  .language-switch__reveal,
  .language-switch__reveal-name{
    transition: none !important;
  }}
.language-switch__trigger{
  font: inherit;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px 5px 6px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-default);
  background: var(--bg-surface);
  color: var(--text-primary);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  box-shadow: var(--shadow-xs);
}
.language-switch__trigger:hover,
.language-switch__trigger[aria-expanded='true']{
  border-color: var(--accent-primary);
}
.language-switch__trigger:focus-visible,
.language-switch__trigger[aria-expanded='true']{
  outline: none;
  box-shadow: var(--shadow-focus);
}
.language-switch__flag-wrap{
  display: inline-block;
  perspective: 120px;
  width: 22px;
  height: 15px;
}
.language-switch__flag-face{
  display: block;
}
.language-switch__chevron{
  width: 10px;
  height: 10px;
  color: var(--text-muted);
}
.language-flag{
  display: block;
  width: 22px;
  height: 15px;
  border-radius: 3px;
  box-shadow: 0 0 0 1px var(--border-default);
  overflow: hidden;
}
.language-switch__popover{
  
  position: fixed;
  width: 200px;
  z-index: 40;
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-xl);
  padding: 6px;
  box-shadow: var(--shadow-overlay);
  transform-origin: 50% 100%;
}
.language-switch__popover--down{
  transform-origin: 50% 0;
}
.language-switch__head{
  padding: 6px 8px 8px;
  font-size: 11.5px;
  color: var(--text-muted);
  font-weight: 500;
}
.language-switch__list{
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 2px;
  outline: none;
}
.language-switch__option{
  position: relative;
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  height: 44px;
  padding: 0 8px;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-primary);
}
.language-switch__option.is-focus{
  background: var(--bg-surface-muted);
}
.language-switch__selected{
  position: absolute;
  inset: 0;
  border-radius: var(--radius-md);
  background: var(--accent-primary-soft);
  box-shadow: inset 0 0 0 1.5px var(--accent-primary);
  pointer-events: none;
}
.language-switch__option > :not(.language-switch__selected){
  position: relative;
  z-index: 1;
}
.language-switch__option[aria-selected='true'] .language-switch__name{
  font-weight: 600;
}
.language-switch__name{
  display: grid;
  line-height: 1.25;
}
.language-switch__name small{
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
}
.language-switch__beta{
  position: relative;
  justify-self: end;
  cursor: help;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--status-info-border);
  background: var(--status-info-soft);
  color: var(--status-info);
  font-size: 10.5px;
  font-weight: 600;
  line-height: 1.3;
}
.language-switch__option > .language-switch__hint{
  position: absolute;
  z-index: 3;
  left: 50%;
  bottom: calc(100% + 6px);
  
  width: 212px;
  padding: 9px 12px;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  background: var(--bg-surface);
  box-shadow: var(--shadow-md);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 400;
  line-height: 1.45;
  white-space: normal;
  text-align: center;
  text-wrap: balance;
  transform-origin: 50% 100%;
  pointer-events: none;
}
/* ── Top bar (new): brand + demo notice + links + the real LanguageSwitch ── */
.topbar { position:relative; z-index:3; color:var(--text-primary); }
.topbar__inner { box-sizing:border-box; max-width:1240px; margin:0 auto; min-height:64px; display:flex; align-items:center; gap:14px; padding-left:max(32px, env(safe-area-inset-left, 0px)); padding-right:max(32px, env(safe-area-inset-right, 0px)); }
@media (max-width: 960px) { .topbar__inner { padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); } }
.topbar .brand { font-size:1.125rem; font-weight:600; letter-spacing:-0.025em; gap:12px; }
.topbar .brand > svg { display:block; width:32px; height:32px; }
/* Same header as openlinker.io: canvas-dark at 95% with a blur, subtle-dark bottom border. */
.topbar--demo { background:transparent; border-bottom:1px solid var(--border-subtle); }
.topbar--plain { background:transparent; }
.topbar__chip { display:inline-flex; align-items:center; gap:7px; height:24px; padding:0 10px; border-radius:999px; font-size:.75rem; font-weight:600; letter-spacing:.02em; color:var(--accent-primary-soft-strong); background:color-mix(in oklab, var(--accent-primary) 14%, transparent); border:1px solid color-mix(in oklab, var(--accent-primary) 40%, transparent); }
.topbar__dot { position:relative; width:6px; height:6px; border-radius:50%; background:var(--accent-primary); }
.topbar__dot::after { content:""; position:absolute; inset:-3px; border-radius:50%; border:1px solid var(--accent-primary); animation: topbar-pulse 2.4s ease-out infinite; }
@keyframes topbar-pulse { from { transform:scale(.6); opacity:.9; } to { transform:scale(1.8); opacity:0; } }
.topbar__text { flex:1; min-width:0; overflow:hidden; color:var(--text-secondary); font-size:.8125rem; }
.topbar__text > span { display:inline-block; white-space:nowrap; transition: opacity var(--duration-normal) var(--ease-out); }
.topbar__text[data-fits="false"] > span { visibility:hidden; opacity:0; }
.topbar__links { margin-left:auto; display:flex; align-items:center; gap:4px; }
.topbar__links a { color:var(--text-secondary); font-size:.8125rem; font-weight:500; text-decoration:none; padding:5px 9px; border-radius:7px; transition: color var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out); }
.topbar__links a:hover { color:var(--text-primary); background:transparent; }
.topbar__links a:focus-visible { outline:none; box-shadow:var(--shadow-focus); }
.topbar__links + .language-switch { margin-left:6px; padding-left:12px; border-left:1px solid var(--border-default); }
.topbar__spacer { flex:1; }
@media (max-width: 960px) {
  .topbar__links a:not(:last-child) { display:none; }
}
@media (prefers-reduced-motion: reduce) { .topbar__dot::after { animation:none; } }
@media (max-width: 600px) { .topbar__links { display:none; } .topbar__links + .language-switch, .topbar__text + .topbar__links + .language-switch { border-left:0; padding-left:0; } .topbar .language-switch { margin-left:auto; } }

/** "What we record" opens as a popover above the text, so it never pushes the layout. */
function RecordingPopover({ label, items }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const popId = useId();
  useEffect(() => {
    if (!open) return undefined;
    const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('pointerdown', onDown);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('pointerdown', onDown); document.removeEventListener('keydown', onKey); };
  }, [open]);
  return (
    <span ref={ref}>
      <button type="button" className="linkish" aria-expanded={open} aria-controls={popId} onClick={() => setOpen((o) => !o)}>{label}</button>
      <AnimatePresence>
        {open ? (
          <motion.div id={popId} className="pop" role="dialog" aria-label={label}
            initial={{ opacity: 0, scale: 0.97, y: 4 }} animate={{ opacity: 1, scale: 1, y: 0 }} exit={{ opacity: 0, scale: 0.98 }}
            transition={{ duration: 0.18, ease: EASE }}>
            <strong>{label}</strong>
            <ul>{items.map((r) => <li key={r}>{r}</li>)}</ul>
          </motion.div>
        ) : null}
      </AnimatePresence>
    </span>
  );
}

/** One view of the stack. Inactive views stay mounted (they hold the height) but are hidden and inert. */
function View({ active, nodeRef, children, centered = false }) {
  return (
    <motion.div ref={nodeRef} className={centered ? 'view view--center' : 'view'} aria-hidden={!active} inert={active ? undefined : ''}
      initial={false}
      animate={{ opacity: active ? 1 : 0, y: active ? 0 : 6 }}
      transition={{ duration: active ? 0.26 : 0.14, ease: EASE, delay: active ? 0.06 : 0 }}>
      {children}
    </motion.div>
  );
}

/** Success check: the circle settles in, then the tick draws itself. Replays whenever its view activates. */
function CheckMark({ active }) {
  const reduce = useReducedMotion();
  return (
    <motion.svg className="check" viewBox="0 0 48 48" aria-hidden="true"
      initial={false} animate={active && !reduce ? { scale: [0.6, 1], opacity: [0, 1] } : { scale: 1, opacity: 1 }} transition={SPRING}>
      <circle cx="24" cy="24" r="23" fill="var(--status-success-soft)" stroke="var(--status-success-border)" />
      <motion.path d="M15 24.5l6 6 12-13" fill="none" stroke="var(--status-success-strong)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
        initial={false} animate={{ pathLength: active || reduce ? 1 : 0 }} transition={{ duration: 0.45, ease: EASE, delay: active ? 0.25 : 0 }} />
    </motion.svg>
  );
}

/* shared/ui/sparkline.tsx */
function Sparkline({ values, tone = 'neutral', width = 72, height = 20 }) {
  const min = Math.min(...values); const max = Math.max(...values); const range = max - min || 1;
  const stepX = width / (values.length - 1);
  const d = values.map((v, i) => `${i === 0 ? 'M' : 'L'}${(i * stepX).toFixed(2)},${(height - ((v - min) / range) * height).toFixed(2)}`).join(' ');
  return (
    <svg className={`sparkline sparkline--${tone} kpi-card__sparkline`} width={width} height={height} viewBox={`0 0 ${width} ${height}`} aria-hidden="true">
      <path d={d} className="sparkline__line" fill="none" />
    </svg>
  );
}

/* ── LanguageSwitch + LanguageFlag: 1:1 port of origin/main apps/web/src/shared/ui/language-switch.tsx
   and language-flag.tsx (ADR-081). Same markup, classes and motion; its CSS is copied verbatim from
   main's index.css. Only the wiring differs: useMessages('ui').languageSwitch -> LANG_SWITCH_COPY,
   useOptionalLocale() -> this page's LocaleCtx. In apps/web the page imports the real one. */
const LANG_SWITCH_COPY = {
  en: { beta: 'Beta', betaHint: 'Some content may not be translated yet.', current: 'Language: {name}', label: 'Language' },
  pl: { beta: 'Beta', betaHint: 'Część zawartości może być jeszcze nieprzetłumaczona.', current: 'Język: {name}', label: 'Język' },
};
const interpolate = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');

function LanguageFlag({ code }) {
  switch (code) {
    case 'pl':
      return (
        <svg className="language-flag" viewBox="0 0 16 10" aria-hidden="true">
          <rect width="16" height="5" fill="#fff" />
          <rect y="5" width="16" height="5" fill="#dc143c" />
        </svg>
      );
    default:
      return (
        <svg className="language-flag" viewBox="0 0 60 40" aria-hidden="true">
          <rect width="60" height="40" fill="#012169" />
          <path d="M0 0L60 40M60 0L0 40" stroke="#fff" strokeWidth="8" />
          <path d="M0 0L60 40M60 0L0 40" stroke="#c8102e" strokeWidth="3" />
          <path d="M30 0V40M0 20H60" stroke="#fff" strokeWidth="12" />
          <path d="M30 0V40M0 20H60" stroke="#c8102e" strokeWidth="7" />
        </svg>
      );
  }
}

const LANGUAGE_DETAILS = { pl: { name: 'Polski', beta: true }, en: { name: 'English' } };
const LANGUAGE_OPTIONS = ['pl', 'en'].map((code) => ({ code, ...LANGUAGE_DETAILS[code] }));
const LS_SPRING = { type: 'spring', stiffness: 520, damping: 34, mass: 0.7 };
const POPOVER_WIDTH = 200;
const GAP = 8;

function popoverPosition(trigger, down) {
  const half = POPOVER_WIDTH / 2;
  const centre = trigger.left + trigger.width / 2;
  const left = Math.min(Math.max(centre, GAP + half), window.innerWidth - GAP - half);
  return down ? { left, top: trigger.bottom + GAP } : { left, bottom: window.innerHeight - trigger.top + GAP };
}
const indexOfLang = (code) => Math.max(0, LANGUAGE_OPTIONS.findIndex((o) => o.code === code));
const stepLang = (from, dir) => (from + dir + LANGUAGE_OPTIONS.length) % LANGUAGE_OPTIONS.length;

function LanguageSwitch({ placement = 'up', className, locale, setLocale }) {
  const copy = LANG_SWITCH_COPY[locale];
  const [open, setOpen] = useState(false);
  const [betaHint, setBetaHint] = useState(false);
  const betaHintId = useId();
  const down = placement === 'down';
  const [focus, setFocus] = useState(0);
  const rootRef = useRef(null);
  const listRef = useRef(null);
  const triggerRef = useRef(null);
  const popoverRef = useRef(null);
  const [position, setPosition] = useState({});
  const listId = useId();
  const headId = useId();
  const current = LANGUAGE_OPTIONS.find((o) => o.code === locale) ?? LANGUAGE_OPTIONS[0];

  useEffect(() => {
    if (!open) return undefined;
    const onPointerDown = (event) => {
      const target = event.target;
      if (rootRef.current?.contains(target) || popoverRef.current?.contains(target)) return;
      setOpen(false);
    };
    const place = () => { if (triggerRef.current) setPosition(popoverPosition(triggerRef.current.getBoundingClientRect(), down)); };
    document.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('resize', place);
    window.addEventListener('scroll', place, true);
    const frame = requestAnimationFrame(() => listRef.current?.focus());
    return () => {
      document.removeEventListener('pointerdown', onPointerDown);
      window.removeEventListener('resize', place);
      window.removeEventListener('scroll', place, true);
      cancelAnimationFrame(frame);
    };
  }, [open, down]);

  function close() { setOpen(false); triggerRef.current?.focus(); }
  function choose(option) { setLocale(option.code); close(); }
  function toggle() {
    if (!open) {
      setFocus(indexOfLang(locale));
      if (triggerRef.current) setPosition(popoverPosition(triggerRef.current.getBoundingClientRect(), down));
    }
    setOpen((v) => !v);
  }
  function onKeyDown(event) {
    if (event.key === 'Escape') { event.preventDefault(); close(); }
    else if (event.key === 'ArrowDown') { event.preventDefault(); setFocus((i) => stepLang(i, 1)); }
    else if (event.key === 'ArrowUp') { event.preventDefault(); setFocus((i) => stepLang(i, -1)); }
    else if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); choose(LANGUAGE_OPTIONS[focus]); }
    else if (event.key === 'Tab') { event.preventDefault(); close(); }
  }

  const classes = ['language-switch', open ? 'is-open' : '', className].filter(Boolean).join(' ');
  const chevron = (
    <path d="M2 6.5L5 3.5L8 6.5" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
  );

  return (
    <div className={classes} ref={rootRef}>
      <button ref={triggerRef} type="button" className="language-switch__trigger" aria-haspopup="listbox" aria-expanded={open}
        aria-controls={open ? listId : undefined} aria-label={interpolate(copy.current, { name: current.name })} onClick={toggle}>
        <span className="language-switch__flag-wrap">
          <AnimatePresence mode="wait" initial={false}>
            <motion.span key={locale} className="language-switch__flag-face"
              initial={{ rotateY: -90, opacity: 0 }} animate={{ rotateY: 0, opacity: 1 }} exit={{ rotateY: 90, opacity: 0 }}
              transition={{ duration: 0.18, ease: [0.16, 1, 0.3, 1] }}>
              <LanguageFlag code={current.code} />
            </motion.span>
          </AnimatePresence>
        </span>
        <motion.svg className="language-switch__chevron" viewBox="0 0 10 10" aria-hidden="true" animate={{ rotate: open !== down ? 180 : 0 }} transition={LS_SPRING}>
          {chevron}
        </motion.svg>
      </button>
      <span className="language-switch__peek" aria-hidden="true" style={{ '--peek-chevron': down ? '180deg' : '0deg' }}>
        <LanguageFlag code={current.code} />
        <span className="language-switch__reveal">
          <span className="language-switch__reveal-clip">
            <span className="language-switch__reveal-name" lang={current.code}>{current.name}</span>
          </span>
        </span>
        <svg className="language-switch__chevron" viewBox="0 0 10 10">{chevron}</svg>
      </span>
      {ReactDOM.createPortal(
        <AnimatePresence>
          {open ? (
            <motion.div ref={popoverRef} style={position}
              className={['language-switch__popover', down ? 'language-switch__popover--down' : ''].filter(Boolean).join(' ')}
              initial={{ opacity: 0, scale: 0.92, x: '-50%', y: down ? -6 : 6, filter: 'blur(4px)' }}
              animate={{ opacity: 1, scale: 1, x: '-50%', y: 0, filter: 'blur(0px)' }}
              exit={{ opacity: 0, scale: 0.96, x: '-50%', y: down ? -4 : 4, filter: 'blur(2px)', transition: { duration: 0.12 } }}
              transition={LS_SPRING}>
              <div className="language-switch__head" id={headId}>{copy.label}</div>
              <span id={betaHintId} className="sr-only">{copy.betaHint}</span>
              <motion.ul ref={listRef} id={listId} className="language-switch__list" role="listbox" tabIndex={-1}
                aria-labelledby={headId} aria-activedescendant={`${listId}-${LANGUAGE_OPTIONS[focus].code}`} onKeyDown={onKeyDown}
                initial="hidden" animate="show" variants={{ show: { transition: { staggerChildren: 0.035, delayChildren: 0.04 } } }}>
                {LANGUAGE_OPTIONS.map((option, index) => {
                  const selected = option.code === locale;
                  return (
                    <motion.li key={option.code} id={`${listId}-${option.code}`} role="option" lang={option.code} aria-selected={selected}
                      aria-describedby={option.beta ? betaHintId : undefined}
                      className={['language-switch__option', index === focus ? 'is-focus' : ''].filter(Boolean).join(' ')}
                      variants={{ hidden: { opacity: 0, x: -8 }, show: { opacity: 1, x: 0, transition: LS_SPRING } }}
                      onPointerMove={() => setFocus(index)} onClick={() => choose(option)}>
                      {selected ? <motion.span className="language-switch__selected" layoutId={`${listId}-selected`} transition={LS_SPRING} /> : null}
                      <LanguageFlag code={option.code} />
                      <span className="language-switch__name">{option.name}<small>{option.code.toUpperCase()}</small></span>
                      {option.beta ? (
                        <span className="language-switch__beta" onPointerEnter={() => setBetaHint(true)} onPointerLeave={() => setBetaHint(false)}>{copy.beta}</span>
                      ) : null}
                      <AnimatePresence>
                        {option.beta && betaHint ? (
                          <motion.span className="language-switch__hint" aria-hidden="true"
                            initial={{ opacity: 0, scale: 0.92, x: '-50%', y: 4, filter: 'blur(4px)' }}
                            animate={{ opacity: 1, scale: 1, x: '-50%', y: 0, filter: 'blur(0px)', transition: { ...LS_SPRING, delay: 0.12 } }}
                            exit={{ opacity: 0, scale: 0.96, x: '-50%', y: 2, filter: 'blur(2px)', transition: { duration: 0.12 } }}>
                            {copy.betaHint}
                          </motion.span>
                        ) : null}
                      </AnimatePresence>
                    </motion.li>
                  );
                })}
              </motion.ul>
            </motion.div>
          ) : null}
        </AnimatePresence>,
        document.body,
      )}
    </div>
  );
}

/** Shows the sentence only when all of it fits; a cut-off sentence reads worse than none. */
function FitText({ className, children }) {
  const boxRef = useRef(null);
  const textRef = useRef(null);
  const [fits, setFits] = useState(true);
  useLayoutEffect(() => {
    const box = boxRef.current;
    const text = textRef.current;
    if (!box || !text) return undefined;
    const check = () => setFits(text.offsetWidth <= box.clientWidth);
    check();
    const ro = new ResizeObserver(check);
    ro.observe(box);
    ro.observe(text);
    return () => ro.disconnect();
  }, [children]);
  return (
    <span ref={boxRef} className={className} data-fits={fits ? 'true' : 'false'} aria-hidden={fits ? undefined : true}>
      <span ref={textRef}>{children}</span>
    </span>
  );
}

const LocaleCtx = React.createContext('pl');
const useUi = () => UI[React.useContext(LocaleCtx)];

function readLocale() {
  try { const s = localStorage.getItem('ol-login-locale'); if (s === 'pl' || s === 'en') return s; } catch (e) { /* storage blocked */ }
  return (navigator.language || 'pl').toLowerCase().startsWith('pl') ? 'pl' : 'en';
}

function RotatingChannel({ words }) {
  const reduce = useReducedMotion();
  const [i, setI] = useState(0);
  useEffect(() => {
    if (reduce) return undefined;
    const id = setInterval(() => setI((n) => (n + 1) % words.length), 2600);
    return () => clearInterval(id);
  }, [reduce, words]);
  return (
    <span className="h1__slot">
      <AnimatePresence initial={false}>
        <motion.span key={words[i]} className="h1__word"
          initial={{ y: '100%' }} animate={{ y: '0%' }} exit={{ y: '-100%' }}
          transition={{ duration: 0.6, ease: EASE }}>
          {words[i]}
        </motion.span>
      </AnimatePresence>
    </span>
  );
}

function Hero({ copy }) {
  const reduce = useReducedMotion();
  const line = (n) => (reduce ? {} : { initial: { y: '105%' }, animate: { y: '0%' }, transition: { duration: 0.85, ease: EASE, delay: 0.08 + n * 0.08 } });
  const fade = (d) => (reduce ? {} : { initial: { opacity: 0, y: 6 }, animate: { opacity: 1, y: 0 }, transition: { duration: 0.6, ease: EASE, delay: d } });
  const { before, rotating, after } = copy.headline;
  const spoken = `${[].concat(before).join(' ')} ${rotating ? rotating[0] : after}`;
  return (
    <section className="hero">
      <h1 className="h1" aria-label={spoken}>
        {[].concat(before).map((b, i) => (
          <span key={b} className="h1__line" aria-hidden="true"><motion.span {...line(i)}>{b}</motion.span></span>
        ))}
        <span className="h1__line" aria-hidden="true">
          <motion.span {...line([].concat(before).length)}>{rotating ? <RotatingChannel words={rotating} /> : <span className="h1__plain">{after}</span>}</motion.span>
        </span>
        {rotating && after ? <span className="h1__line" aria-hidden="true"><motion.span {...line(2)}>{after}</motion.span></span> : null}
      </h1>
      <motion.p className="lead" {...fade(0.35)}>{copy.lead}</motion.p>
      {copy.highlights.length ? (
        <ul className="highlights">
          {copy.highlights.map((h, i) => <motion.li key={h} {...fade(0.45 + i * 0.07)}><span className="tick" aria-hidden="true" />{h}</motion.li>)}
        </ul>
      ) : null}
    </section>
  );
}

function validate(mode, v, ui) {
  const e = {};
  if (!v.username.trim()) e.username = mode === 'login' ? ui.v.usernameLogin : ui.v.usernameRegister;
  if (mode === 'register') {
    if (!v.email.trim()) e.email = ui.v.email;
    else if (!/^\S+@\S+\.\S+$/.test(v.email)) e.email = ui.v.emailBad;
  }
  if (!v.password) e.password = ui.v.password;
  else if (mode === 'register' && v.password.length < 8) e.password = ui.v.password8;
  if (mode === 'register' && v.confirm !== v.password) e.confirm = v.confirm ? ui.v.mismatch : ui.v.confirm;
  return e;
}

/* Mockup behaviour: login succeeds only with the password "demo1234"; username "zajety" triggers the 409. */
function AuthPanel({ preset, copy, showTrackingFootnote = false, onReserve, initial = {} }) {
  const ui = useUi();
  const reduce = useReducedMotion();
  const canRegister = preset.registration !== 'off';
  const [tab, setTab] = useState(canRegister ? (initial.tab || preset.defaultTab) : 'login');
  const [step, setStep] = useState({ register: 'form', login: 'form', ...(initial.step || {}) });
  const [values, setValues] = useState({ username: '', email: '', password: '', confirm: '', ...(initial.values || {}) });
  const [errors, setErrors] = useState({});
  const [pending, setPending] = useState(false);
  const [loginFailed, setLoginFailed] = useState(Boolean(initial.failed));
  const ids = { u: useId(), e: useId(), p: useId(), c: useId(), lu: useId(), lp: useId() };

  const set = (key) => (event) => {
    setValues((v) => ({ ...v, [key]: event.target.value }));
    if (errors[key]) setErrors((e) => ({ ...e, [key]: undefined }));
    if (loginFailed) setLoginFailed(false);
  };
  const go = (next) => { setTab(next); setErrors({}); setLoginFailed(false); setPending(false); };
  /* Errors are stored as keys, not sentences, so switching language re-renders them in the new one. */
  const errText = (k) => (errors[k] ? (ui.v[errors[k]] || errors[k]) : undefined);

  const submit = (mode) => (event) => {
    event.preventDefault();
    const found = validate(mode, values, ui);
    const keyed = Object.fromEntries(Object.entries(found).map(([k, msg]) => [k, Object.keys(ui.v).find((x) => ui.v[x] === msg)]));
    setErrors(keyed);
    setLoginFailed(false);
    if (Object.keys(found).length) return;
    setPending(true);
    setTimeout(() => {
      setPending(false);
      if (mode === 'login') {
        if (values.password !== 'demo1234') setLoginFailed(true);
        else setStep((s) => ({ ...s, login: 'in' }));
      } else if (values.username.trim().toLowerCase() === 'zajety') {
        setErrors({ username: 'taken', email: 'taken' });
      } else {
        setStep((s) => ({ ...s, register: 'sent' }));
      }
    }, 1000);
  };

  const active = `${tab}:${step[tab]}`;
  const VIEW_KEYS = ['register:form', 'register:sent', 'login:form', 'login:consent', 'login:in'];
  const viewRefs = useRef({});
  const stackRef = useRef(null);
  const rootRef = useRef(null);
  const [heights, setHeights] = useState({});
  useLayoutEffect(() => {
    const measure = () => {
      const next = {};
      for (const k of VIEW_KEYS) { const el = viewRefs.current[k]; if (el) next[k] = el.offsetHeight; }
      setHeights((prev) => (VIEW_KEYS.every((k) => prev[k] === next[k]) ? prev : next));
    };
    measure();
    const ro = new ResizeObserver(measure);
    for (const k of VIEW_KEYS) if (viewRefs.current[k]) ro.observe(viewRefs.current[k]);
    return () => ro.disconnect();
  }, []);
  const tallest = Math.max(0, ...Object.values(heights));
  useLayoutEffect(() => {
    const card = rootRef.current && rootRef.current.parentElement;
    if (!card || !stackRef.current || !tallest || !onReserve) return;
    onReserve(card.offsetHeight - stackRef.current.offsetHeight + tallest);
  }, [tallest, showTrackingFootnote]);
  const bindView = (k) => (el) => { viewRefs.current[k] = el; };
  const submitLabel = (idle, busy) => (pending ? <><span className="spinner" aria-hidden="true" />{busy}</> : idle);

  return (
    <div className="panel__inner" ref={rootRef}>
      {canRegister ? (
        <div className="tabs" role="tablist" aria-label={ui.tabsLabel}>
          {['register', 'login'].map((key) => (
            <button key={key} role="tab" type="button" className="tab" aria-selected={tab === key} onClick={() => go(key)}>
              {tab === key ? <motion.span layoutId="tab-pill" className="tab__pill" transition={SPRING} /> : null}
              <span>{copy.tabs[key]}</span>
            </button>
          ))}
        </div>
      ) : null}

      <motion.div className="stack" ref={stackRef} initial={false}
        animate={{ height: heights[active] ?? 'auto' }} transition={{ type: 'spring', bounce: 0, visualDuration: 0.4 }}>
        {canRegister ? (
          <>
            <View active={active === 'register:form'} nodeRef={bindView('register:form')}>
              <div className="v-head">
                <h2 className="v-title">{copy.register.title}</h2>
                <p className="v-lead">{copy.register.lead}</p>
              </div>
              <form className="auth-form" onSubmit={submit('register')} noValidate>
                <Field id={ids.u} label={ui.username} error={errText('username')}>
                  <Input value={values.username} onChange={set('username')} autoComplete="username" placeholder={ui.usernamePh} />
                </Field>
                <Field id={ids.e} label={ui.email} error={errText('email')}>
                  <Input type="email" value={values.email} onChange={set('email')} autoComplete="email" placeholder={ui.emailPh} />
                </Field>
                <Field id={ids.p} label={ui.password} aside={<span className="f__hint">{ui.min8}</span>} error={errText('password')}>
                  <PasswordInput value={values.password} onChange={set('password')} autoComplete="new-password" />
                </Field>
                <Field id={ids.c} label={ui.confirm} error={errText('confirm')}>
                  <PasswordInput value={values.confirm} onChange={set('confirm')} autoComplete="new-password" />
                </Field>
                <motion.div whileTap={reduce ? undefined : { scale: 0.985 }} transition={SPRING}>
                  <Button type="submit" className="submit" disabled={pending}>{submitLabel(copy.register.submit, copy.register.pending)}</Button>
                </motion.div>
              </form>
              {copy.register.recording ? (
                <p className="v-note">{copy.register.recording} <RecordingPopover label={copy.recordedLabel} items={copy.recorded} /></p>
              ) : null}
            </View>

            <View centered active={active === 'register:sent'} nodeRef={bindView('register:sent')}>
              <CheckMark active={active === 'register:sent'} />
              <h2 className="v-title">{copy.register.sentTitle}</h2>
              <p className="v-lead">{copy.register.sentLead(values.email)}</p>
              <div className="row-end" style={{ justifyContent: 'flex-start' }}>
                <Button tone="secondary" onClick={() => go('login')}>{copy.register.sentAction}</Button>
              </div>
            </View>
          </>
        ) : null}

        <View active={active === 'login:form'} nodeRef={bindView('login:form')}>
          <div className="v-head">
            <h2 className="v-title">{copy.login.title}</h2>
            <p className="v-lead">{copy.login.lead}</p>
          </div>
          <form className="auth-form" onSubmit={submit('login')} noValidate>
            <Field id={ids.lu} label={ui.usernameOrEmail} error={errText('username')}>
              <Input value={values.username} onChange={set('username')} autoComplete="username" placeholder={ui.usernamePh} />
            </Field>
            <Field id={ids.lp} label={ui.password} aside={<a href="#forgot" onClick={(e) => e.preventDefault()}>{ui.forgot}</a>} error={errText('password')}>
              <PasswordInput value={values.password} onChange={set('password')} autoComplete="current-password" />
            </Field>
            <motion.div whileTap={reduce ? undefined : { scale: 0.985 }} transition={SPRING}>
              <Button type="submit" className="submit" disabled={pending}>{submitLabel(copy.login.submit, copy.login.pending)}</Button>
            </motion.div>
          </form>
          <div style={{ marginTop: 16 }}>
            <AnimatePresence initial={false}>
              {loginFailed ? (
                <motion.div key="fail" initial={{ opacity: 0, y: -6 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} transition={{ duration: 0.2, ease: EASE }}>
                  <Alert tone="error" title={ui.loginFailedTitle}>{copy.login.failed}</Alert>
                </motion.div>
              ) : null}
            </AnimatePresence>
          </div>
          {copy.support ? <p className="fine support">{copy.support}</p> : null}
        </View>

        {preset.demoMode ? (
          <View active={active === 'login:consent'} nodeRef={bindView('login:consent')}>
            <h2 className="v-title">{copy.consent.title}</h2>
            <p className="v-lead" style={{ marginBottom: 16 }}>{copy.consent.lead}</p>
            <ul className="bullets" style={{ margin: 0, paddingLeft: 18, display: 'grid', gap: 6, color: 'var(--text-secondary)', fontSize: '.875rem' }}>
              {copy.recorded.map((r) => <li key={r}>{r}</li>)}
            </ul>
            <div className="row-end">
              <Button tone="ghost" onClick={() => setStep((s) => ({ ...s, login: 'form' }))}>{copy.consent.decline}</Button>
              <Button onClick={() => setStep((s) => ({ ...s, login: 'in' }))}>{copy.consent.accept}</Button>
            </div>
            <p className="fine">{copy.consent.fine}</p>
          </View>
        ) : null}

        <View centered active={active === 'login:in'} nodeRef={bindView('login:in')}>
          <CheckMark active={active === 'login:in'} />
          <h2 className="v-title">{ui.signedInTitle}</h2>
          <p className="v-lead">{ui.signedInLead}</p>
          <div className="redirect" aria-hidden="true">
            <motion.span initial={false} animate={{ scaleX: active === 'login:in' ? 1 : 0 }} transition={{ duration: active === 'login:in' ? 1.8 : 0, ease: [0.4, 0, 0.2, 1] }} />
          </div>
        </View>
      </motion.div>

      {showTrackingFootnote ? <p className="fine">{ui.tracking}</p> : null}
    </div>
  );
}

/* shared/ui/segmented-control.tsx (keyboard handling trimmed for the mockup) */
function SegmentedControl({ options, value, onChange, ...rest }) {
  return (
    <div role="radiogroup" className="segmented-control" {...rest}>
      {options.map((o) => (
        <button key={o.value} type="button" role="radio" aria-checked={o.value === value} tabIndex={o.value === value ? 0 : -1}
          className={['segmented-control__option', o.value === value ? 'segmented-control__option--active' : ''].filter(Boolean).join(' ')}
          onClick={() => onChange(o.value)}>
          <span className="segmented-control__label">{o.label}</span>
        </button>
      ))}
    </div>
  );
}

/* shared/ui/textarea.tsx */
const Textarea = forwardRef(function Textarea({ className = '', invalid = false, ...props }, ref) {
  const classes = ['control', invalid ? 'control--invalid' : '', className].filter(Boolean).join(' ');
  return <textarea ref={ref} className={classes} {...props} />;
});

/* shared/ui/form-field.tsx, with the optional description row */
function SettingsField({ label, name, description, children }) {
  const id = `${name}-${useId()}`;
  const descId = description ? `${id}-description` : undefined;
  return (
    <div className="form-field">
      <label htmlFor={id} className="form-field__label">{label}</label>
      {React.cloneElement(children, { id, 'aria-describedby': descId })}
      {description ? <p id={descId} className="form-field__description">{description}</p> : null}
    </div>
  );
}

/* What an admin can override, per language. `read` takes the default from PRODUCTION_COPY. */
const LOGIN_PAGE_FIELDS = [
  { key: 'headlineTop', read: (c) => c.headline.before },
  { key: 'headlineAccent', read: (c) => c.headline.after },
  { key: 'lead', read: (c) => c.lead, multiline: true },
  { key: 'loginTitle', read: (c) => c.login.title },
  { key: 'loginLead', read: (c) => c.login.lead },
  { key: 'support', read: (c) => c.support },
];

function applyLoginOverrides(base, o = {}) {
  const pick = (k, fallback) => (o[k] && o[k].trim() ? o[k] : fallback);
  return {
    ...base,
    headline: { ...base.headline, before: pick('headlineTop', base.headline.before), after: pick('headlineAccent', base.headline.after) },
    lead: pick('lead', base.lead),
    login: { ...base.login, title: pick('loginTitle', base.login.title), lead: pick('loginLead', base.login.lead) },
    support: pick('support', base.support),
  };
}

    const el = boxRef.current;
    if (!el) return undefined;

    return () => ro.disconnect();
  }, []);
  const preset = canRegister ? LOGIN_PRESETS.access : LOGIN_PRESETS.production;
  return (
    <div ref={boxRef} className="login-preview" style={{ height: H * scale }} aria-hidden="true" inert="">
      <div style={{ position: 'absolute', left: 0, top: 0, width: W, height: H, transform: `scale(${scale})`, transformOrigin: 'left top' }}>

            const control = f.multiline
              ? <Textarea rows={3} value={values[f.key] || ''} onChange={setField(f.key)} placeholder={f.read(base) || ''} lang={lang} />
              : <Input value={values[f.key] || ''} onChange={setField(f.key)} placeholder={f.read(base) || ''} lang={lang} />;
            return <SettingsField key={`${lang}-${f.key}`} name={f.key} label={label} description={hint}>{control}</SettingsField>;
          })}

          <div className="buyer-email-editor__actions">
            <Button type="submit" disabled={!dirty || status === 'saving'}>{status === 'saving' ? ui.saving : ui.save}</Button>
            <Button type="button" tone="secondary" onClick={() => { setStatus('idle'); setDraft((d) => ({ ...d, [lang]: {} })); }}>{ui.reset}</Button>
            <Button type="button" tone="ghost" disabled={!dirty} onClick={() => { setStatus('idle'); setDraft(saved); }}>{ui.cancel}</Button>
          </div>
          {status === 'saved' && !dirty ? <Alert tone="success">{ui.saved}</Alert> : null}
          {dirty ? <p className="muted-text">{ui.unsaved}</p> : null}
        </form>

        <aside className="buyer-email-editor__form">
          <section className="panel panel--dense">
            <p className="eyebrow">{ui.preview}</p>
            <p className="muted-text">{lang === 'pl' ? ui.previewHint : ui.previewHintEn}</p>
            <LoginPreview copy={preview} lang={lang} canRegister={registration} />
          </section>
        </aside>
      </div>
    </section>
  );
}

/* ── Page ─────────────────────────────────────────────────────────────── */
/* Every state the implementation must match, by name (docs/frontend-architecture.md § UX Mockups).
   ?state=<name> opens it; add &bare=1 to hide the switchers (that is how parity screenshots are taken). */
const STATES = {
  'demo-register': { preset: 'demo', initial: { tab: 'register' } },
  'demo-login': { preset: 'demo', initial: { tab: 'login' } },
  'demo-login-failed': { preset: 'demo', initial: { tab: 'login', failed: true, values: { username: 'kasia', password: 'zle-haslo' } } },
  'demo-register-sent': { preset: 'demo', initial: { tab: 'register', step: { register: 'sent' }, values: { email: 'kasia@twojsklep.pl' } } },
  // /consent only: a demo account created before session recording existed. Sign-in never shows it.
  'demo-consent': { preset: 'demo', initial: { tab: 'login', step: { login: 'consent' } } },
  'demo-signed-in': { preset: 'demo', initial: { tab: 'login', step: { login: 'in' } } },
  'production-login': { preset: 'production', initial: {} },
  'access-register': { preset: 'access', initial: { tab: 'register' } },
  'access-sent': { preset: 'access', initial: { tab: 'register', step: { register: 'sent' } } },
  'admin-login-page-editor': { preset: 'admin', initial: {} },
};
const QUERY = new URLSearchParams(location.search);
const BARE = QUERY.get('bare') === '1';
function readState() { const s = QUERY.get('state'); return s && STATES[s] ? s : null; }
const PRESET_HASH = { demo: 'demo', produkcja: 'production', dostep: 'access', admin: 'admin' };
const HASH_OF = { demo: 'demo', production: 'produkcja', access: 'dostep', admin: 'admin' };
function readPreset() {
  const st = readState();
  if (st) return STATES[st].preset;
  const h = (location.hash || '').replace('#', '');
  return PRESET_HASH[h] || 'demo';
}

function App() {
  const [presetKey, setPresetKey] = useState(readPreset);
  const [stateKey, setStateKey] = useState(readState);
  const initial = stateKey ? STATES[stateKey].initial : {};
  const pickState = (k) => { setStateKey(k); setPresetKey(STATES[k].preset); setReserve(0); try { history.replaceState(null, '', `?state=${k}`); } catch (e) { /* ignore */ } };
  const [locale, setLocale] = useState(readLocale);
  const [reserve, setReserve] = useState(0);
  const [overrides, setOverrides] = useState({ pl: {}, en: {} });
  useEffect(() => {
    const onHash = () => setPresetKey(readPreset());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  useEffect(() => { document.documentElement.lang = locale; try { localStorage.setItem('ol-login-locale', locale); } catch (e) { /* storage blocked */ } }, [locale]);
  const pick = (k) => { setStateKey(null); setPresetKey(k); setReserve(0); try { history.replaceState(null, '', `#${HASH_OF[k]}`); } catch (e) { location.hash = HASH_OF[k]; } };
  const switchLocale = (l) => setLocale(l);
  const isAdmin = presetKey === 'admin';
  const preset = LOGIN_PRESETS[isAdmin ? 'production' : presetKey];
  const copy = preset.demoMode ? preset.copy[locale] : applyLoginOverrides(preset.copy[locale], overrides[locale]);
  const modes = [...Object.entries(LOGIN_PRESETS).map(([k, p]) => [k, p.label]), ['admin', 'Panel admina: ustawienia']];
  const campaign = /utm_/.test(location.search) || location.hash === '#kampania';
  return (
    <LocaleCtx.Provider value={locale}>
      <MotionConfig reducedMotion="user">
        {BARE ? null : <>
        <div className="mock-modes" role="tablist" aria-label="Podgląd trybu strony (makieta)">
          <span className="mock-modes__label">Podgląd trybu</span>
          {modes.map(([k, label]) => (
            <button key={k} role="tab" type="button" aria-selected={presetKey === k} className="mock-modes__btn" onClick={() => pick(k)}>{label}</button>
          ))}
        </div>
        <div className="mock-modes" role="tablist" aria-label="Stany (data-state)">
          <span className="mock-modes__label">Stan</span>
          {Object.keys(STATES).map((k) => (
            <button key={k} role="tab" type="button" aria-selected={stateKey === k} className="mock-modes__btn" onClick={() => pickState(k)}>{k}</button>
          ))}
        </div>
        </>}
        <div data-state={stateKey || undefined} data-bare={BARE ? "" : undefined}>
        {isAdmin ? <AdminView uiLocale={locale} setLocale={switchLocale} saved={overrides} onSave={setOverrides} /> : (
        <div className={`stage stage--${preset.background}`} key={`${presetKey}:${stateKey}`} style={{ minHeight: BARE ? '100dvh' : 'calc(100dvh - 72px)' }}>
          {preset.background === 'app-preview' ? <div className="stage__bg"><AppPreview /></div> : null}
          <div className="stage__wash" aria-hidden="true" />
          <TopBar demo={copy.bar} locale={locale} setLocale={switchLocale} />
          <div className="stage__inner">
            <Hero copy={copy} />
            <div className="auth-col" style={reserve ? { '--auth-reserve': `${reserve}px` } : undefined}>
              <motion.section className="auth-card" aria-label={copy.login.title}
                initial={{ opacity: 0, y: 16 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.6, ease: EASE, delay: 0.2 }}>
                <AuthPanel preset={preset} copy={copy} showTrackingFootnote={campaign} onReserve={setReserve} initial={initial} />
              </motion.section>
            </div>
          </div>
        </div>
        )}
        </div>
      </MotionConfig>
    </LocaleCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
