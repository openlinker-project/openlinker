.card-button-reset > .metric-card{
  height: 100%;
}
.button__shortcut{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.125rem;
  padding: 1px 5px;
  margin-left: var(--space-2);
  font-family: var(--font-mono);
  font-size: 0.625rem;
  line-height: 1;
  letter-spacing: var(--tracking-wide);
  border-radius: var(--radius-xs);
  background: rgb(255 255 255 / 0.20);
  color: inherit;
  opacity: 0.85;
}
.button--secondary .button__shortcut,
.button--ghost .button__shortcut{
  background: var(--bg-surface-muted);

}
.sr-only{
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.shell{
  min-height: 100vh;
  background: var(--bg-canvas);
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto 1fr;
  grid-template-areas: 'main';
}
.shell-sidebar{
  display: none;
}

  }
.shell-sidebar{
    grid-area: sidebar;
    display: flex;
    flex-direction: column;
    background: var(--bg-shell);
    border-right: 1px solid var(--border-subtle);
    padding: 12px 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
  }}
.shell-brand{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 16px 16px;
}
.shell-brand__mark{
  width: 26px;
  height: 26px;
  border-radius: 6px;
  display: block;
  object-fit: cover;
}
.shell-brand__name{
  font-weight: 600;
  font-size: 14px;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}
.shell-nav{
  flex: 1;
  overflow-y: auto;
  padding: 0 12px;
  scrollbar-width: thin;
}
.shell-nav__group{
  margin-bottom: 16px;
}
.shell-nav__label{
  margin: 0 0 4px;
  padding: 0 8px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.shell-nav__list{
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 1px;
}
.shell-nav__link{
  display: flex;
  align-items: center;
  padding: 6px 8px;
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  transition:
    background 120ms,
    color 120ms;
}
.shell-nav__link:hover{
  background: var(--bg-surface-muted);
  color: var(--text-primary);
}
.shell-nav__link--active{
  background: var(--bg-surface-muted);
  color: var(--text-primary);
  font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent-primary);
}

}
.shell-nav__link--disabled:hover{
  background: transparent;
  color: var(--text-disabled);
}
.shell-nav__link-label{
  flex: 1;
  min-width: 0;
}
.shell-nav__link-count{

  font-weight: 500;
  color: var(--text-muted);
  padding-left: 0.5rem;
  letter-spacing: -0.01em;
}
.shell-nav__link--active .shell-nav__link-count{
  color: var(--text-primary);
}
.shell-nav__link-lock{

  font-size: 11px;

  color: var(--text-muted);
}

}

}

  z-index: 10;

  align-items: center;

}
.shell-crumbs{

  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
  min-width: 0;
}
.shell-crumbs__group{
  white-space: nowrap;
}
.shell-crumbs__sep{
  color: var(--border-strong);
  font-size: 12px;
  line-height: 1;
}
.shell-crumbs__current{
  color: var(--text-primary);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.shell-topbar__spacer{

.shell-topbar__alerts{

  padding: 0 10px 0 32px;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  background: var(--bg-surface);
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 400;
  cursor: text;
  position: relative;
  text-align: left;
}
@media (min-width: 1024px){.shell-topbar__search{
    display: inline-flex;

.shell-topbar__search:hover{
  border-color: var(--border-strong);
  background: var(--bg-surface);
}
.shell-topbar__search:focus-visible{
  outline: 2px solid var(--accent-focus);
  outline-offset: 2px;
}
.shell-topbar__search-icon{
  position: absolute;
  left: 10px;
  top: 50%;

  border: 1px solid var(--border-default);
  border-bottom-width: 2px;
  border-radius: var(--radius-xs);
  color: var(--text-muted);
  background: var(--bg-surface-muted);
  line-height: 1;
  letter-spacing: 0.04em;
  font-weight: 500;
}
.shell-user-chip{
  display: inline-flex;
  align-items: center;
  gap: 8px;

  color: var(--text-primary);

  height: 32px;

  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.02em;

  font-weight: 500;
  color: var(--text-primary);

    display: none;
  }}
.shell-content{

    padding: 20px 32px 48px;

.page-title,
.state-card__title{

.panel-copy,
.muted-text{

}

.connection-list,
.activity-list,
.check-list,
.page-section,
.page-header,

.field{

.eyebrow{

  border-radius: var(--radius-sm);
  background: var(--status-disabled-soft);
  color: var(--status-disabled-fg);

  font-size: 0.6875rem;

  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;

.status-badge--compact{
  padding: 1px var(--space-2);
  font-size: 0.625rem;
}
.status-badge__dot{
  width: 0.375rem;
  height: 0.375rem;
  border-radius: 999px;
  background: currentColor;
  flex-shrink: 0;
  opacity: 0.75;

.status-badge--success{
  border-color: var(--status-success-border);
  background: var(--status-success-soft);
  color: var(--status-success-fg);
}
.status-badge--warning{
  border-color: var(--status-warning-border);
  background: var(--status-warning-soft);
  color: var(--status-warning-fg);
}
.status-badge--error{
  border-color: var(--status-error-border);
  background: var(--status-error-soft);
  color: var(--status-error-fg);
}
.status-badge--review{
  border-color: var(--status-review-border);
  background: var(--status-review-soft);
  color: var(--status-review-fg);

.status-badge--conflict{

  background: var(--status-conflict-soft);
  color: var(--status-conflict-strong);
}
.status-badge--info{
  border-color: var(--status-info-border);
  background: var(--status-info-soft);
  color: var(--status-info-fg);
}
.status-badge--neutral{
  border-color: var(--status-disabled-border);

.status-badge--solid{

.mono{

.data-table__action{

.data-table__action:hover{

.data-table th,

  line-height: 1.4;

  font-family: var(--font-mono);

  font-weight: 500;
  letter-spacing: var(--tracking-caps);

  top: 0;

/* Every view sits in the same grid cell: the cell is always as tall as the tallest view,
   so switching tabs, showing errors or finishing a step never changes the page height. */
/* Views are stacked on top of each other; the stack animates to the ACTIVE view's height, so the

.stack { position:relative; overflow:clip; overflow-clip-margin:8px; }
.stack > .view { position:absolute; top:0; left:0; right:0; min-width:0; }

.peek-button{
  --switch-hue: var(--accent-primary);
  --switch-tint: color-mix(in oklab, var(--switch-hue) 13%, var(--bg-surface));
  --switch-edge: color-mix(in oklab, var(--switch-hue) 55%, var(--border-subtle));
  position: relative;
  isolation: isolate;
  display: inline-flex;
  
  flex: none;
}
.peek-button__peek{
  position: absolute;
  z-index: 2;
  top: 0;
  right: 0;
  bottom: 0;
  
  width: max-content;
  display: inline-flex;
  align-items: center;
  padding: 5px 8px 5px 6px;
  border: 1px solid var(--switch-edge);
  border-radius: var(--radius-pill);
  background: var(--switch-tint);
  box-shadow: 0 4px 12px -6px color-mix(in oklab, var(--switch-hue) 45%, transparent);
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-fast) var(--ease-out) 80ms;
}
.peek-button--reveal-end .peek-button__peek{ right:auto; left:0; }
@media (hover: hover) and (pointer: fine) and (max-width: 1349.98px) { .topbar .peek-button--reveal-end .peek-button__peek{ right:0; left:auto; } }
.peek-button__peek > *{
  flex: none;
}
.peek-button__peek .peek-button__chevron{
  margin-left: 6px;
  transform: rotate(var(--peek-chevron, 0deg));
}
.peek-button__reveal{
  display: grid;
  grid-template-columns: 0fr;
  transition: grid-template-columns var(--duration-fast) var(--ease-standard);
}
.peek-button__reveal-clip{
  min-width: 0;
  overflow: hidden;
}
.peek-button__reveal-name{
  display: block;
  padding-left: 7px;
  white-space: nowrap;
  opacity: 0;
  transform: translateX(-6px);
  transition:
    opacity var(--duration-fast) var(--ease-out),
    transform var(--duration-fast) var(--ease-out);
}
.peek-button:not(.is-open):has(.peek-button__trigger:is(:hover, :focus-visible))
  .peek-button__peek{
  opacity: 1;
  transition: opacity 80ms var(--ease-out);
}
.peek-button:not(.is-open):has(.peek-button__trigger:is(:hover, :focus-visible))
  .peek-button__reveal{
  grid-template-columns: 1fr;
  transition: grid-template-columns var(--duration-slow) var(--ease-out);
}
.peek-button:not(.is-open):has(.peek-button__trigger:is(:hover, :focus-visible))
  .peek-button__reveal-name{
  opacity: 1;
  transform: none;
  transition:
    opacity var(--duration-normal) var(--ease-out) 60ms,
    transform var(--duration-slow) var(--ease-out) 40ms;
}
@media (hover: none){.peek-button__peek{
    display: none;
  }}
@media (prefers-reduced-motion: reduce){.peek-button__peek,
  .peek-button__reveal,
  .peek-button__reveal-name{
    transition: none !important;
  }}

/** "What we record" opens as a popover above the text, so it never pushes the layout. */
function RecordingPopover({ label, items }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const popId = useId();
  useEffect(() => {
    if (!open) return undefined;
    const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('pointerdown', onDown);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('pointerdown', onDown); document.removeEventListener('keydown', onKey); };
  }, [open]);
  return (
    <span ref={ref}>
      <button type="button" className="linkish" aria-expanded={open} aria-controls={popId} onClick={() => setOpen((o) => !o)}>{label}</button>
      <AnimatePresence>
        {open ? (
          <motion.div id={popId} className="pop" role="dialog" aria-label={label}
            initial={{ opacity: 0, scale: 0.97, y: 4 }} animate={{ opacity: 1, scale: 1, y: 0 }} exit={{ opacity: 0, scale: 0.98 }}
            transition={{ duration: 0.18, ease: EASE }}>
            <strong>{label}</strong>
            <ul>{items.map((r) => <li key={r}>{r}</li>)}</ul>
          </motion.div>
        ) : null}
      </AnimatePresence>
    </span>
  );
}

/** One view of the stack. Inactive views stay mounted (they hold the height) but are hidden and inert. */
function View({ active, nodeRef, children, centered = false }) {
  return (
    <motion.div ref={nodeRef} className={centered ? 'view view--center' : 'view'} aria-hidden={!active} inert={active ? undefined : ''}
      initial={false}
      animate={{ opacity: active ? 1 : 0, y: active ? 0 : 6 }}
      transition={{ duration: active ? 0.26 : 0.14, ease: EASE, delay: active ? 0.06 : 0 }}>
      {children}
    </motion.div>
  );
}

/** Success check: the circle settles in, then the tick draws itself. Replays whenever its view activates. */
function CheckMark({ active }) {
  const reduce = useReducedMotion();
  return (
    <motion.svg className="check" viewBox="0 0 48 48" aria-hidden="true"
      initial={false} animate={active && !reduce ? { scale: [0.6, 1], opacity: [0, 1] } : { scale: 1, opacity: 1 }} transition={SPRING}>
      <circle cx="24" cy="24" r="23" fill="var(--status-success-soft)" stroke="var(--status-success-border)" />
      <motion.path d="M15 24.5l6 6 12-13" fill="none" stroke="var(--status-success-strong)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
        initial={false} animate={{ pathLength: active || reduce ? 1 : 0 }} transition={{ duration: 0.45, ease: EASE, delay: active ? 0.25 : 0 }} />
    </motion.svg>
  );
}

   Every element below is a 1:1 copy of an apps/web component, with the SAME class names, so it
   is styled by the SAME index.css rules (copied verbatim into this page):
     AppShell, SidebarBrand, SidebarNav, WorkspaceFooter, CommandPaletteTrigger  -> app/app-shell.tsx, shared/ui/command-palette.tsx
     PageLayout -> shared/ui/page-layout.tsx      StatusBadge -> shared/ui/status-badge.tsx
     AnalyticsKpiCard -> features/analytics/components/analytics-kpi-card.tsx   Sparkline -> shared/ui/sparkline.tsx
     DataTable markup -> shared/ui/data-table.tsx
   In apps/web the preview IMPORTS those components instead, so it follows every change.
   The figures are example data, like the demo's own made-up stores. */
const APP_W = 1280;
const APP_H = 800;
/* 1:1 with login-backdrop.tsx: the frame takes the screen's proportions and is never scaled past 1.5x,
   so a wide monitor shows the panel as it looks on a wide monitor instead of a 2.6x blow-up. */
const MAX_SCALE = 1.5;
const BLEED = 30;
/* Below 1024 px the shell is its phone layout; show it at real size inside the bleed. */
function backdropFrame(w, h) {
  if (w - 2 * BLEED < 1024) return { width: Math.max(0, w - 2 * BLEED), height: Math.max(0, h - 2 * BLEED), scale: 1, offset: BLEED };
  const scale = Math.min(Math.max(w / APP_W, h / APP_H), MAX_SCALE);
  return { width: Math.max(APP_W, Math.ceil(w / scale)), height: Math.max(APP_H, Math.ceil(h / scale)), scale, offset: 0 };
}

/* shared/ui/sparkline.tsx */
function Sparkline({ values, tone = 'neutral', width = 72, height = 20 }) {
  const min = Math.min(...values); const max = Math.max(...values); const range = max - min || 1;
  const stepX = width / (values.length - 1);
  const d = values.map((v, i) => `${i === 0 ? 'M' : 'L'}${(i * stepX).toFixed(2)},${(height - ((v - min) / range) * height).toFixed(2)}`).join(' ');
  return (
    <svg className={`sparkline sparkline--${tone} kpi-card__sparkline`} width={width} height={height} viewBox={`0 0 ${width} ${height}`} aria-hidden="true">
      <path d={d} className="sparkline__line" fill="none" />
    </svg>
  );
}

function buildScenes(lang) {
  const c = BACKDROP_COPY[lang];
  const a = c.analytics;
  const tag = lang === 'pl' ? 'pl-PL' : 'en-GB';
  const currency = lang === 'pl' ? 'PLN' : 'EUR';
  const amount = (pln) => (currency === 'PLN' ? pln : pln / PLN_PER_EUR);
  const money = (pln) => new Intl.NumberFormat(tag, { style: 'currency', currency }).format(Math.round(amount(pln) * 100) / 100);
  const total = (pln) => new Intl.NumberFormat(tag, { style: 'currency', currency, maximumFractionDigits: 0 }).format(Math.round(amount(pln)));
  const count = (v) => new Intl.NumberFormat(tag).format(v);
  const share = (f) => new Intl.NumberFormat(tag, { style: 'percent', maximumFractionDigits: 1 }).format(f);
  const ago = (w) => (w[0] === 'yesterday' ? c.ago.yesterday : interpolate(c.ago[w[0]], { n: w[1] }));
  const badge = ([k, tone], withDot = false) => <StatusBadge tone={tone} withDot={withDot}>{c.status[k]}</StatusBadge>;
  const up = (f) => ({ tone: 'success', glyph: '↑', formatted: share(f) });
  const kpis = [
    { label: a.revenue, value: total(KPIS.revenue.pln), metric: a.revenueMetric, delta: up(KPIS.revenue.delta), trend: KPIS.revenue.trend },

/** Shows the sentence only when all of it fits; a cut-off sentence reads worse than none. */
function FitText({ className, children }) {
  const boxRef = useRef(null);
  const textRef = useRef(null);
  const [fits, setFits] = useState(true);
  useLayoutEffect(() => {
    const box = boxRef.current;
    const text = textRef.current;
    if (!box || !text) return undefined;
    const check = () => setFits(text.offsetWidth <= box.clientWidth);
    check();
    const ro = new ResizeObserver(check);
    ro.observe(box);
    ro.observe(text);
    return () => ro.disconnect();
  }, [children]);
  return (
    <span ref={boxRef} className={className} data-fits={fits ? 'true' : 'false'} aria-hidden={fits ? undefined : true}>
      <span ref={textRef}>{children}</span>
    </span>
  );
}

                      initial={{ height: 0 }} animate={{ height: 26 }} exit={{ height: 0 }} transition={LS_SPRING}>

/* Sticks to the top; over the first 64 px of scroll it gets a surface and settles slightly lower and smaller.
   One 0..1 value tied directly to the scroll feeds CSS transforms (1:1 with login-top-bar.tsx). */
function TopBar({ demo, locale, setLocale }) {
  const scrollY = useWindowScrollY();
  const shrink = M.useTransform(scrollY, [0, 64], [0, 1], { clamp: true });
  /* The framer-motion UMD build here does not write a CSS-variable motion value from `style`
     (apps/web does), so the mockup sets it by hand. */
  const headerRef = useRef(null);
  useEffect(() => {
    const write = (v) => headerRef.current?.style.setProperty('--topbar-shrink', String(v));
    write(shrink.get());
    return shrink.on('change', write);
  }, [shrink]);
  return (
    <header ref={headerRef} className={`topbar ${demo ? 'topbar--demo' : 'topbar--plain'}`}>
      <span className="topbar__surface" aria-hidden="true" />
      <div className="topbar__inner">
        <span className="brand">
          <svg viewBox="0 0 500 500" aria-hidden="true"><g transform="translate(250 250) rotate(-30)"><rect x="-72" y="-160" width="144" height="320" rx="72" fill="none" stroke="#ee8c3c" strokeWidth="42" /></g><rect x="105" y="232" width="290" height="36" rx="18" fill="#ee8c3c" /></svg>
          OpenLinker
        </span>
        {demo ? (
          <>
            <span className="topbar__chip"><span className="topbar__dot" aria-hidden="true" />{demo.chip}</span>
            <FitText className="topbar__text">{demo.text}</FitText>
            <nav className="topbar__links" aria-label={demo.linksLabel}>
              {demo.links.map(([label, href]) => <a key={href} href={href} target="_blank" rel="noreferrer">{label}</a>)}
            </nav>
          </>
        ) : <span className="topbar__spacer" />}
        <span className="topbar__controls">
          <ThemeSwitch placement="down" locale={locale} />

      </div>
    </header>
  );
}

          transition={{ duration: 0.6, ease: EASE }}>
          {words[i]}
        </motion.span>
      </AnimatePresence>

  );
}

function validate(mode, v, ui) {
  const e = {};
  if (!v.username.trim()) e.username = mode === 'login' ? ui.v.usernameLogin : ui.v.usernameRegister;
  if (mode === 'register') {
    if (!v.email.trim()) e.email = ui.v.email;
    else if (!/^\S+@\S+\.\S+$/.test(v.email)) e.email = ui.v.emailBad;
  }
  if (!v.password) e.password = ui.v.password;
  else if (mode === 'register' && v.password.length < 8) e.password = ui.v.password8;
  if (mode === 'register' && v.confirm !== v.password) e.confirm = v.confirm ? ui.v.mismatch : ui.v.confirm;
  return e;
}

/* Mockup behaviour: login succeeds only with the password "demo1234"; username "zajety" triggers the 409. */
// Sign-in Tab order: username, password, Sign in, Show, Forgot your password? (mirrors login-focus-order.ts).
const TABBABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
const reachable = (el) => el instanceof HTMLElement && el.tabIndex >= 0 && !el.closest('[inert], [hidden], [aria-hidden="true"]');
function loginFormTab(event) {
  if (event.key !== 'Tab' || event.altKey || event.ctrlKey || event.metaKey) return;
  const form = event.currentTarget;
  const inputs = form.querySelectorAll('input');
  const stops = [inputs[0], inputs[1], form.querySelector('button[type="submit"]'), form.querySelector('.pw__toggle'), form.querySelector('.f__aside a')].filter((el) => el && reachable(el));
  const index = stops.indexOf(event.target);
  if (index === -1) return;
  const target = stops[index + (event.shiftKey ? -1 : 1)];
  if (target) { event.preventDefault(); target.focus(); return; }
  if (!event.shiftKey) {
    const all = Array.from(document.querySelectorAll(TABBABLE)).filter(reachable);
    const after = all.find((el) => !form.contains(el) && (form.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING)) ?? all[0];
    if (after) { event.preventDefault(); after.focus(); }
  }
}

function AuthPanel({ preset, copy, showTrackingFootnote = false, onReserve, initial = {} }) {
  const ui = useUi();
  const reduce = useReducedMotion();
  const canRegister = preset.registration !== 'off';
  // `?tab=sign-up|sign-in` opens that tab (as in the app), unless the caller pins one (the admin preview).
  const urlTab = initial.pinTab ? undefined : new Map([['sign-up', 'register'], ['sign-in', 'login']]).get(new URLSearchParams(location.search).get('tab'));
  const [tab, setTab] = useState(canRegister ? (urlTab || initial.tab || preset.defaultTab) : 'login');
  const [step, setStep] = useState({ register: 'form', login: 'form', ...(initial.step || {}) });
  const [values, setValues] = useState({ username: '', email: '', password: '', confirm: '', ...(initial.values || {}) });
  const [errors, setErrors] = useState({});
  const [pending, setPending] = useState(false);
  const [loginFailed, setLoginFailed] = useState(Boolean(initial.failed));
  const ids = { u: useId(), e: useId(), p: useId(), c: useId(), lu: useId(), lp: useId() };

  const set = (key) => (event) => {
    setValues((v) => ({ ...v, [key]: event.target.value }));
    if (errors[key]) setErrors((e) => ({ ...e, [key]: undefined }));
    if (loginFailed) setLoginFailed(false);
  };
  const focusAfterSwitch = useRef(false);
  const go = (next, focusForm = true) => { focusAfterSwitch.current = focusForm; setTab(next); setErrors({}); setLoginFailed(false); setPending(false); };
  /* Errors are stored as keys, not sentences, so switching language re-renders them in the new one. */
  const errText = (k) => (errors[k] ? (ui.v[errors[k]] || errors[k]) : undefined);

  const submit = (mode) => (event) => {
    event.preventDefault();
    const found = validate(mode, values, ui);
    const keyed = Object.fromEntries(Object.entries(found).map(([k, msg]) => [k, Object.keys(ui.v).find((x) => ui.v[x] === msg)]));
    setErrors(keyed);
    setLoginFailed(false);
    if (Object.keys(found).length) return;
    setPending(true);
    setTimeout(() => {
      setPending(false);
      if (mode === 'login') {
        if (values.password !== 'demo1234') setLoginFailed(true);
        else setStep((s) => ({ ...s, login: 'in' }));
      } else if (values.username.trim().toLowerCase() === 'zajety') {
        setErrors({ username: 'taken', email: 'taken' });
      } else {
        setStep((s) => ({ ...s, register: 'sent' }));
      }
    }, 1000);
  };

  const active = `${tab}:${step[tab]}`;
  const VIEW_KEYS = ['register:form', 'register:sent', 'login:form', 'login:consent', 'login:in'];
  const viewRefs = useRef({});
  const stackRef = useRef(null);
  const rootRef = useRef(null);
  const [heights, setHeights] = useState({});
  useLayoutEffect(() => {
    const measure = () => {
      const next = {};
      for (const k of VIEW_KEYS) { const el = viewRefs.current[k]; if (el) next[k] = el.offsetHeight; }
      setHeights((prev) => (VIEW_KEYS.every((k) => prev[k] === next[k]) ? prev : next));
    };
    measure();
    const ro = new ResizeObserver(measure);
    for (const k of VIEW_KEYS) if (viewRefs.current[k]) ro.observe(viewRefs.current[k]);
    return () => ro.disconnect();
  }, []);
  const tallest = Math.max(0, ...Object.values(heights));
  useLayoutEffect(() => {
    const card = rootRef.current && rootRef.current.parentElement;
    if (!card || !stackRef.current || !tallest || !onReserve) return;
    onReserve(card.offsetHeight - stackRef.current.offsetHeight + tallest);
  }, [tallest, showTrackingFootnote]);
  const bindView = (k) => (el) => { viewRefs.current[k] = el; };
  useEffect(() => {
    if (!focusAfterSwitch.current) return;
    focusAfterSwitch.current = false;
    const field = viewRefs.current[active]?.querySelector('input:not([type="hidden"]), select, textarea');
    if (!field) return;
    field.focus({ preventScroll: true });
    field.scrollIntoView({ block: 'nearest', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }, [active]);
  const tabRefs = useRef({});
  const onTabsKeyDown = (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const next = tab === 'register' ? 'login' : 'register';
    go(next, false);
    tabRefs.current[next]?.focus();
  };
  const submitLabel = (idle, busy) => (pending ? <><span className="spinner" aria-hidden="true" />{busy}</> : idle);

  return (
    <div className="panel__inner" ref={rootRef}>
      {canRegister ? (
        <div className="tabs" role="tablist" aria-label={ui.tabsLabel} onKeyDown={onTabsKeyDown}>
          {['register', 'login'].map((key) => (
            <button key={key} ref={(el) => { tabRefs.current[key] = el; }} role="tab" type="button" className="tab" aria-selected={tab === key} tabIndex={tab === key ? 0 : -1} onClick={() => { if (key !== tab) go(key); }}>
              {tab === key ? <motion.span layoutId="tab-pill" className="tab__pill" transition={SPRING} /> : null}
              <span>{copy.tabs[key]}</span>
            </button>
          ))}
        </div>
      ) : null}

      <motion.div className="stack" ref={stackRef} initial={false}
        animate={{ height: heights[active] ?? 'auto' }} transition={{ type: 'spring', bounce: 0, visualDuration: 0.4 }}>
        {canRegister ? (

                  <PasswordInput value={values.password} onChange={set('password')} autoComplete="new-password" />

                  <Button type="submit" className="submit" disabled={pending}>{submitLabel(copy.register.submit, copy.register.pending)}</Button>
                </motion.div>

              {copy.register.recording ? (

        <View active={active === 'login:form'} nodeRef={bindView('login:form')}>

   Built like main's buyer-email-editor-page.tsx (#3555): PageLayout with a back link, the form in a
   `panel panel--dense`, a live preview beside it, FormField/Input/Textarea/Alert/SegmentedControl/Button
   from shared/ui. Only PRODUCTION copy is editable; the demo's copy ships in code. An empty field
   falls back to the default, so a fresh install is never left with a blank login page. */

/* shared/ui/segmented-control.tsx (keyboard handling trimmed for the mockup) */
function SegmentedControl({ options, value, onChange, className = '', ...rest }) {
  return (
    <div role="radiogroup" className={['segmented-control', className].filter(Boolean).join(' ')} {...rest}>
      {options.map((o) => (
        <button key={o.value} type="button" role="radio" aria-checked={o.value === value} tabIndex={o.value === value ? 0 : -1}
          className={['segmented-control__option', o.value === value ? 'segmented-control__option--active' : ''].filter(Boolean).join(' ')}
          onClick={() => onChange(o.value)}>
          <span className="segmented-control__label">{o.label}</span>
        </button>
      ))}
    </div>
  );
}

/* shared/ui/textarea.tsx */
const Textarea = forwardRef(function Textarea({ className = '', invalid = false, ...props }, ref) {
  const classes = ['control', invalid ? 'control--invalid' : '', className].filter(Boolean).join(' ');
  return <textarea ref={ref} className={classes} {...props} />;
});

/* shared/ui/form-field.tsx, with the optional description row */
function SettingsField({ label, name, description, children }) {
  const id = `${name}-${useId()}`;
  const descId = description ? `${id}-description` : undefined;
  return (
    <div className="form-field">
      <label htmlFor={id} className="form-field__label">{label}</label>
      {React.cloneElement(children, { id, 'aria-describedby': descId })}
      {description ? <p id={descId} className="form-field__description">{description}</p> : null}
    </div>
  );
}

/* The default support line links `<link>...</link>` to the docs; an admin's own line is plain text. */
function supportLine(text) {
  if (/<(p|a|strong|em|br)\b/.test(text)) return <div className="rich-text-view" dangerouslySetInnerHTML={{ __html: text }} />;
  const m = /^([\s\S]*)<link>([\s\S]*?)<\/link>([\s\S]*)$/.exec(text);
  if (!m) return text;
  return <>{m[1]}<a href="https://docs.openlinker.io/" target="_blank" rel="noreferrer">{m[2]}</a>{m[3]}</>;
}

/* What an admin can override, per language. `read` takes the default from PRODUCTION_COPY. */
const LOGIN_PAGE_FIELDS = [
  { key: 'headlineTop', read: (c) => c.headline.before },
  { key: 'headlineAccent', read: (c) => c.headline.after },
  { key: 'lead', read: (c) => c.lead, multiline: true },
  { key: 'loginTitle', read: (c) => c.login.title },
  { key: 'loginLead', read: (c) => c.login.lead },
  { key: 'support', read: (c) => c.support.replace(/<\/?\w+>/g, ''), rich: true },
  { key: 'registerTitle', read: (c) => c.register.title },
  { key: 'registerLead', read: (c) => c.register.lead },
];
const SCREEN_FIELDS = {
  login: ['headlineTop', 'headlineAccent', 'lead', 'loginTitle', 'loginLead', 'support'],
  register: ['headlineTop', 'headlineAccent', 'lead', 'registerTitle', 'registerLead'],
};

function applyLoginOverrides(base, o = {}) {
  const pick = (k, fallback) => (o[k] && o[k].trim() ? o[k] : fallback);
  return {
    ...base,
    headline: { ...base.headline, before: pick('headlineTop', base.headline.before), after: pick('headlineAccent', base.headline.after) },
    lead: pick('lead', base.lead),
    login: { ...base.login, title: pick('loginTitle', base.login.title), lead: pick('loginLead', base.login.lead) },
    register: { ...base.register, title: pick('registerTitle', base.register.title), lead: pick('registerLead', base.register.lead) },
    support: pick('support', base.support),
  };
}

/** Live preview of the real login page, scaled down and inert. */
function LoginPreview({ copy, lang, canRegister = false, screen = 'login', phone = false }) {
  const boxRef = useRef(null);
  const [scale, setScale] = useState(0.4);
  // On a phone the page takes its phone layout, so the modal frames it like a phone.
  const W = phone ? 390 : 1180; const H = phone ? 920 : 820;
  useEffect(() => {
    const el = boxRef.current;
    if (!el) return undefined;
    const ro = new ResizeObserver(([e]) => setScale(e.contentRect.width / W));
    ro.observe(el);
    return () => ro.disconnect();
  }, [W]);
  const preset = canRegister ? LOGIN_PRESETS.access : LOGIN_PRESETS.production;
  return (
    <div ref={boxRef} className="login-preview" style={{ height: H * scale }} aria-hidden="true" inert="">
      <div style={{ position: 'absolute', left: 0, top: 0, width: W, height: H, transform: `scale(${scale})`, transformOrigin: 'left top' }}>
        <LocaleCtx.Provider value={lang}>
          <MotionConfig reducedMotion="always">
            <div className="stage stage--gradient" style={{ minHeight: H }}>
              <StageBackdrop />
              <TopBar demo={null} locale={lang} setLocale={() => {}} />
              <div className="stage__inner">
                <Hero copy={copy} />
                <div className="auth-col">
                  <section className="auth-card"><AuthPanel key={`${lang}:${canRegister}:${screen}`} preset={preset} copy={copy} initial={{ tab: canRegister ? screen : 'login', pinTab: true }} /></section>
                </div>
              </div>
            </div>
          </MotionConfig>
        </LocaleCtx.Provider>
      </div>
    </div>
  );
}

/* Stands in for the app's RichTextEditor (Tiptap, ADR-046) on the support line: bold, italic, link. */
function MiniRichText({ value, onChange, placeholder, linkLabel, linkTarget }) {
  const ref = useRef(null);
  useEffect(() => { if (ref.current) ref.current.innerHTML = value; }, []); // eslint-disable-line react-hooks/exhaustive-deps
  const emit = () => { const html = ref.current.innerHTML; onChange(html.replace(/<[^>]*>/g, '').trim() ? html : ''); };
  const run = (cmd, arg) => { ref.current.focus(); document.execCommand(cmd, false, arg); emit(); };
  return (
    <div className="mini-rich">
      <div className="mini-rich__toolbar">
        <button type="button" className="mini-rich__tool" aria-label="Bold" onMouseDown={(e) => { e.preventDefault(); run('bold'); }}><b>B</b></button>
        <button type="button" className="mini-rich__tool" aria-label="Italic" onMouseDown={(e) => { e.preventDefault(); run('italic'); }}><i>I</i></button>
        <button type="button" className="mini-rich__tool" aria-label={linkLabel} title={linkLabel}
          onMouseDown={(e) => { e.preventDefault(); const href = window.prompt(linkTarget, 'https://'); if (href) run('createLink', href); }}>↗</button>
      </div>
      <div ref={ref} className="mini-rich__surface" contentEditable suppressContentEditableWarning data-placeholder={placeholder}
        role="textbox" aria-multiline="true" onInput={emit} />
    </div>
  );
}

function LoginPageSettings({ uiLocale, saved, onSave }) {
  const ui = ADMIN_COPY[uiLocale];
  const [lang, setLang] = useState(uiLocale);
  const [draft, setDraft] = useState(saved);
  const [status, setStatus] = useState('idle'); // idle | saving | saved
  const [registration, setRegistration] = useState(false);
  const [screenChoice, setScreen] = useState('login');
  const [previewOpen, setPreviewOpen] = useState(false);
  const screen = registration ? screenChoice : 'login';
  const dirty = JSON.stringify(draft) !== JSON.stringify(saved);
  const base = PRODUCTION_COPY[lang];
  const values = draft[lang] || {};
  const setField = (k) => (e) => { setStatus('idle'); setDraft((d) => ({ ...d, [lang]: { ...(d[lang] || {}), [k]: e.target.value } })); };
  const save = (e) => {
    e.preventDefault();
    setStatus('saving');
    setTimeout(() => { onSave(draft); setStatus('saved'); }, 700);
  };
  const preview = applyLoginOverrides(base, values);

  return (
    <section className="page-section">
      <div className="page-header">
        <div className="page-header__content">
          <a className="back-link" href="#admin" onClick={(e) => e.preventDefault()}>
            <span className="back-link__glyph" aria-hidden="true">←</span>
            <span className="back-link__label">{ui.back}</span>
          </a>
          <p className="eyebrow">{ui.settings}</p>
          <h2 className="page-title">{ui.title}</h2>
          <p className="page-description">{ui.description}</p>
        </div>
      </div>

      <div className="buyer-email-editor login-page-editor">
        <form className="buyer-email-editor__form panel panel--dense" onSubmit={save} noValidate>
          <div className="form-field">
            <span className="form-field__label">{ui.registrationLabel}</span>
            <label className="buyer-emails-switch"><input type="checkbox" checked={registration} onChange={(e) => { setStatus('idle'); setRegistration(e.target.checked); }} /><span>{ui.registrationToggle}</span></label>
            <p className="form-field__description">{ui.registrationHint}</p>
          </div>

          <div className="form-field">
            <span className="form-field__label">{ui.language}</span>
            <SegmentedControl aria-label={ui.language} value={lang} onChange={setLang}
              options={[{ value: 'pl', label: 'Polski' }, { value: 'en', label: 'English' }]} />
            <p className="form-field__description">{ui.emptyHint}</p>
          </div>

          {registration ? (
            <div className="form-field">
              <span className="form-field__label">{ui.screen}</span>
              <SegmentedControl className="login-page-editor__screens" aria-label={ui.screen} value={screen} onChange={setScreen}
                options={[{ value: 'login', label: ui.screenLogin }, { value: 'register', label: ui.screenRegister }]} />
              <p className="form-field__description">{ui.screenHint}</p>
            </div>
          ) : null}

          <Button type="button" tone="secondary" className="login-page-editor__preview-open" onClick={() => setPreviewOpen(true)}>{ui.previewOpen}</Button>

          {LOGIN_PAGE_FIELDS.filter((f) => SCREEN_FIELDS[screen].includes(f.key)).map((f) => {
            const [label, hint] = ui.fields[f.key];
            const control = f.rich
              ? <MiniRichText key={lang} value={values[f.key] || ''} placeholder={f.read(base) || ''} linkLabel={ui.link} linkTarget={ui.linkTarget}
                  onChange={(html) => { setStatus('idle'); setDraft((d) => ({ ...d, [lang]: { ...(d[lang] || {}), [f.key]: html } })); }} />
              : f.multiline
              ? <Textarea rows={3} value={values[f.key] || ''} onChange={setField(f.key)} placeholder={f.read(base) || ''} lang={lang} />
              : <Input value={values[f.key] || ''} onChange={setField(f.key)} placeholder={f.read(base) || ''} lang={lang} />;
            return <SettingsField key={`${lang}-${f.key}`} name={f.key} label={label} description={hint}>{control}</SettingsField>;
          })}

          <div className="buyer-email-editor__actions">
            <Button type="submit" disabled={!dirty || status === 'saving'}>{status === 'saving' ? ui.saving : ui.save}</Button>
            <Button type="button" tone="secondary" onClick={() => { setStatus('idle'); setDraft((d) => ({ ...d, [lang]: {} })); }}>{ui.reset}</Button>
            <Button type="button" tone="ghost" disabled={!dirty} onClick={() => { setStatus('idle'); setDraft(saved); }}>{ui.cancel}</Button>
          </div>
          {status === 'saved' && !dirty ? <Alert tone="success">{ui.saved}</Alert> : null}
          {dirty ? <p className="muted-text">{ui.unsaved}</p> : null}
        </form>

        <aside className="buyer-email-editor__form">
          <section className="panel panel--dense">
            <p className="eyebrow">{ui.preview}</p>
            <p className="muted-text">{lang === 'pl' ? ui.previewHint : ui.previewHintEn}</p>
            {previewOpen ? null : <LoginPreview copy={preview} lang={lang} canRegister={registration} screen={screen} />}
          </section>
        </aside>
      </div>
      {previewOpen ? (
        <div className="mock-dialog__overlay" onClick={() => setPreviewOpen(false)}>
          <div className="mock-dialog" role="dialog" aria-modal="true" aria-label={ui.preview} onClick={(e) => e.stopPropagation()}>
            <h3 className="mock-dialog__title">{ui.preview}</h3>
            <LoginPreview copy={preview} lang={lang} canRegister={registration} screen={screen} phone />
            <div className="mock-dialog__footer"><Button type="button" tone="secondary" onClick={() => setPreviewOpen(false)}>{ui.previewClose}</Button></div>
          </div>
        </div>
      ) : null}
    </section>
  );
}

            <svg className="shell-brand__mark" width="26" height="26" viewBox="0 0 500 500" aria-hidden="true"><g transform="translate(250 250) rotate(-30)"><rect x="-72" y="-160" width="144" height="320" rx="72" fill="none" stroke="#ee8c3c" strokeWidth="42" /></g><rect x="105" y="232" width="290" height="36" rx="18" fill="#ee8c3c" /></svg>
            <span className="shell-brand__name">OpenLinker</span>
          </div>
          <nav className="shell-nav" aria-label="Primary">
            {NAV_GROUPS.map((g) => (
              <section key={g.label} className="shell-nav__group">
                <p className="shell-nav__label">{BACKDROP_COPY[uiLocale].nav[g.label]}</p>
                <ul className="shell-nav__list">
                  {g.items.map(([k, label, count]) => (
                    <li key={k}>
                      <a href="#admin" onClick={(e) => e.preventDefault()} className={k === 'settings' ? 'shell-nav__link shell-nav__link--active' : 'shell-nav__link'} aria-current={k === 'settings' ? 'page' : undefined}>
                        <span className="shell-nav__link-label">{BACKDROP_COPY[uiLocale].nav[label]}</span>
                        {count !== undefined ? <span className="shell-nav__link-count mono-text">{count}</span> : null}
                      </a>
                    </li>

          </nav>
          <div className="shell-workspace">
            <div className="shell-workspace__header">
              <strong className="shell-workspace__name">{BACKDROP_COPY[uiLocale].workspace}</strong>
              <LanguageSwitch placement="up" locale={uiLocale} setLocale={setLocale} />

            <div className="shell-workspace__user"><span className="shell-workspace__username">admin</span></div>

        <div className="shell-main">
          <header className="shell-topbar">
            <nav aria-label="Breadcrumb" className="shell-crumbs">
              <span className="shell-crumbs__group">{ui.group}</span>
              <span className="shell-crumbs__sep" aria-hidden="true">/</span>
              <span className="shell-crumbs__current">{ui.title}</span>

            <span className="shell-topbar__search">
              <span className="shell-topbar__search-icon" aria-hidden="true">⌕</span>
              <span className="shell-topbar__search-placeholder">{BACKDROP_COPY[uiLocale].search}</span>
              <kbd className="shell-topbar__search-kbd" aria-hidden="true">⌘K</kbd>

          <main className="shell-content">

  );
}

/* ── Page ─────────────────────────────────────────────────────────────── */
/* Every state the implementation must match, by name (docs/frontend-architecture.md § UX Mockups).
   ?state=<name> opens it; add &bare=1 to hide the switchers (that is how parity screenshots are taken). */
const STATES = {
  'demo-register': { preset: 'demo', initial: { tab: 'register' } },
  'demo-login': { preset: 'demo', initial: { tab: 'login' } },
  'demo-login-failed': { preset: 'demo', initial: { tab: 'login', failed: true, values: { username: 'kasia', password: 'zle-haslo' } } },
  'demo-register-sent': { preset: 'demo', initial: { tab: 'register', step: { register: 'sent' }, values: { email: 'kontakt@twojsklep.pl' } } },
  // /consent only: a demo account created before session recording existed. Sign-in never shows it.
  'demo-consent': { preset: 'demo', initial: { tab: 'login', step: { login: 'consent' } } },
  'demo-signed-in': { preset: 'demo', initial: { tab: 'login', step: { login: 'in' } } },
  'production-login': { preset: 'production', initial: {} },
  'access-register': { preset: 'access', initial: { tab: 'register' } },
  'access-sent': { preset: 'access', initial: { tab: 'register', step: { register: 'sent' } } },
  'admin-login-page-editor': { preset: 'admin', initial: {} },
};
const QUERY = new URLSearchParams(location.search);
const BARE = QUERY.get('bare') === '1';
function readState() { const s = QUERY.get('state'); return s && STATES[s] ? s : null; }
const PRESET_HASH = { demo: 'demo', produkcja: 'production', dostep: 'access', admin: 'admin' };
const HASH_OF = { demo: 'demo', production: 'produkcja', access: 'dostep', admin: 'admin' };
function readPreset() {
  const st = readState();
  if (st) return STATES[st].preset;
  const h = (location.hash || '').replace('#', '');
  return PRESET_HASH[h] || 'demo';
}

function App() {
  const [presetKey, setPresetKey] = useState(readPreset);
  const [stateKey, setStateKey] = useState(readState);
  const initial = stateKey ? STATES[stateKey].initial : {};
  const pickState = (k) => { setStateKey(k); setPresetKey(STATES[k].preset); setReserve(0); try { history.replaceState(null, '', `?state=${k}`); } catch (e) { /* ignore */ } };
  const [locale, setLocale] = useState(readLocale);
  const [reserve, setReserve] = useState(0);
  const [overrides, setOverrides] = useState({ pl: {}, en: {} });
  useEffect(() => {
    const onHash = () => setPresetKey(readPreset());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  useEffect(() => { document.documentElement.lang = locale; try { localStorage.setItem('ol-login-locale', locale); } catch (e) { /* storage blocked */ } }, [locale]);
  const pick = (k) => { setStateKey(null); setPresetKey(k); setReserve(0); try { history.replaceState(null, '', `#${HASH_OF[k]}`); } catch (e) { location.hash = HASH_OF[k]; } };
  const switchLocale = (l) => setLocale(l);
  const isAdmin = presetKey === 'admin';
  const preset = LOGIN_PRESETS[isAdmin ? 'production' : presetKey];
  const copy = preset.demoMode ? preset.copy[locale] : applyLoginOverrides(preset.copy[locale], overrides[locale]);
  const modes = [...Object.entries(LOGIN_PRESETS).map(([k, p]) => [k, p.label]), ['admin', 'Panel admina: ustawienia']];
  const campaign = /utm_/.test(location.search) || location.hash === '#kampania';
  return (
    <LocaleCtx.Provider value={locale}>
      <MotionConfig reducedMotion="user">
        {BARE ? null : <>
        <div className="mock-modes" role="tablist" aria-label="Podgląd trybu strony (makieta)">
          <span className="mock-modes__label">Podgląd trybu</span>
          {modes.map(([k, label]) => (
            <button key={k} role="tab" type="button" aria-selected={presetKey === k} className="mock-modes__btn" onClick={() => pick(k)}>{label}</button>
          ))}
        </div>
        <div className="mock-modes" role="tablist" aria-label="Stany (data-state)">
          <span className="mock-modes__label">Stan</span>
          {Object.keys(STATES).map((k) => (
            <button key={k} role="tab" type="button" aria-selected={stateKey === k} className="mock-modes__btn" onClick={() => pickState(k)}>{k}</button>
          ))}
        </div>
        </>}
        <div data-state={stateKey || undefined} data-bare={BARE ? "" : undefined}>
        {isAdmin ? <AdminView uiLocale={locale} setLocale={switchLocale} saved={overrides} onSave={setOverrides} /> : (
        <div className={`stage stage--${preset.background}`} key={`${presetKey}:${stateKey}`} style={{ minHeight: BARE ? '100dvh' : 'calc(100dvh - 72px)' }}>
          <StageBackdrop background={preset.background === 'app-preview' ? <AppPreview /> : null} />
          <TopBar demo={copy.bar} locale={locale} setLocale={switchLocale} />
          <div className="stage__inner">
            <Hero copy={copy} />
            <div className="auth-col" style={reserve ? { '--auth-reserve': `${reserve}px` } : undefined}>
              <motion.section className="auth-card" aria-label={copy.login.title}
                initial={{ opacity: 0, y: 16 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.6, ease: EASE, delay: 0.2 }}>
                <AuthPanel preset={preset} copy={copy} showTrackingFootnote={campaign} onReserve={setReserve} initial={initial} />
              </motion.section>
            </div>
            {copy.bar ? (
              <footer className="stage__footer">
                <p className="stage__footer-text">{copy.bar.text}</p>
                <nav className="stage__footer-links" aria-label={copy.bar.linksLabel}>
                  {copy.bar.links.map(([label, href]) => <a key={href} href={href} target="_blank" rel="noreferrer">{label}</a>)}
                </nav>
              </footer>
            ) : null}
          </div>
        </div>
        )}
        </div>
      </MotionConfig>
    </LocaleCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
