* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background: var(--bg-canvas);
}
a {
  color: var(--accent-primary-hover);
  text-decoration: underline;
  text-underline-offset: 0.16em;
}
button, input, select, textarea {
  font: inherit;
}
button, .button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  border: 1px solid var(--accent-primary-border);
  border-radius: var(--radius-md);
  padding: 0 var(--space-4);
  height: 2rem;
  background: var(--accent-primary);
  color: var(--text-on-primary);
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  letter-spacing: var(--tracking-normal);
  cursor: pointer;
  text-decoration: none;
  user-select: none;
  white-space: nowrap;
  box-shadow: var(--shadow-xs), var(--shadow-inset-top);
  transition:
    background var(--duration-fast) var(--ease-out),
    border-color var(--duration-fast) var(--ease-out),
    color var(--duration-fast) var(--ease-out),
    box-shadow var(--duration-fast) var(--ease-out);
}
.button:hover {
  background: var(--button-primary-bg-hover);
  border-color: var(--button-primary-bg-hover);
  color: var(--text-on-primary);
}
.button:active {
  background: var(--accent-primary-active);
  border-color: var(--accent-primary-active);
}
.button:focus-visible {
  outline: none;
  box-shadow: var(--shadow-focus);
}
.button:focus-visible, .control:focus-visible {
  outline: none;
  box-shadow: var(--shadow-focus);
}
.button--secondary {
  border-color: var(--border-default);
  background: var(--bg-surface);
  color: var(--text-primary);
  box-shadow: var(--shadow-xs), var(--shadow-inset-top);
}
.button--secondary:hover {
  background: var(--bg-surface-muted);
  border-color: var(--border-strong);
  color: var(--text-primary);
}
.button--secondary:active {
  background: var(--bg-surface-hover);
}
.button--danger {
  border-color: color-mix(in oklab, var(--status-error) 80%, black);
  background: var(--status-error);
  color: #ffffff;
  box-shadow: var(--shadow-xs), var(--shadow-inset-top);
}
.button--danger:hover {
  background: color-mix(in oklab, var(--status-error) 90%, black);
  border-color: color-mix(in oklab, var(--status-error) 70%, black);
  color: #ffffff;
}
.button--ghost {
  border-color: transparent;
  background: transparent;
  color: var(--text-secondary);
  box-shadow: none;
}
.button--ghost:hover {
  background: var(--bg-surface-muted);
  border-color: transparent;
  color: var(--text-primary);
}
.button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
  box-shadow: none;
}
.button__spinner {
  display: inline-block;
  width: 0.8em;
  height: 0.8em;
  margin-right: var(--space-2);
  border: 2px solid currentColor;
  border-top-color: transparent;
  border-radius: var(--radius-pill);
  opacity: 0.85;
  animation: button-spinner-rotate var(--duration-slow) linear infinite;
  vertical-align: -0.125em;
}
@media (prefers-reduced-motion: reduce) {
  .button__spinner {
    animation: none;
    border-top-color: currentColor;
    opacity: 0.4;
  }
}
.button--xs {
  height: 1.5rem;
  padding: 0 var(--space-2);
  font-size: 0.6875rem;
  border-radius: var(--radius-sm);
  gap: var(--space-1);

  height: 1.75rem;
  padding: 0 var(--space-3);
  font-size: 0.75rem;
}

.button--icon {

<script type="text/babel" data-presets="react">
const { useState, useId, Children, cloneElement } = React;

/* ════════════════════════════════════════════════════════════════════
 * shared/ui - ported 1:1 from apps/web/src/shared/ui (types dropped)
 * ════════════════════════════════════════════════════════════════════ */

function Alert({ action, children, className = '', density = 'default', title, tone = 'info' }) {
  const classes = ['alert', `alert--${tone}`, density === 'compact' ? 'alert--compact' : '', className].filter(Boolean).join(' ');
  return (
    <div className={classes} role={tone === 'error' ? 'alert' : 'status'}>
      <div className="alert__content">
        {title ? <strong className="alert__title">{title}</strong> : null}
        <div className="alert__description">{children}</div>
      </div>
      {action ? <div className="alert__actions">{action}</div> : null}
    </div>
  );
}

function Button({ className = '', tone = 'primary', type = 'button', ...props }) {
  return <button type={type} className={['button', `button--${tone}`, className].filter(Boolean).join(' ')} {...props} />;
}

function FieldError({ id, message }) {
  if (!message) return null;
  return <p id={id} className="form-field__error" role="alert">{message}</p>;
}

function FormField({ children, description, error, label, name }) {
  const child = Children.only(children);
  const generatedId = useId();
  const inputId = child.props.id ?? `${name}-${generatedId}`;
  const descriptionId = description ? `${inputId}-description` : undefined;
  return (
    <div className="form-field">
      <label htmlFor={inputId} className="form-field__label">{label}</label>
      {cloneElement(child, { id: inputId, 'aria-describedby': descriptionId, 'aria-invalid': Boolean(error) })}
      {description ? <p id={descriptionId} className="form-field__description">{description}</p> : null}
      <FieldError id={`${inputId}-error`} message={error} />
    </div>
  );
}

function Input({ className = '', invalid = false, ...props }) {
  return <input className={['control', invalid ? 'control--invalid' : '', className].filter(Boolean).join(' ')} {...props} />;
}

function InlineDisclosure({ label, value, children, changeLabel = 'Change', defaultOpen = false, className }) {
  return (
    <details className={['inline-disclosure', className].filter(Boolean).join(' ')} open={defaultOpen}>
      <summary className="inline-disclosure__summary">
        <span className="inline-disclosure__label">{label}</span>{' '}
        <span className="inline-disclosure__value">{value}</span>{' '}
        <span className="inline-disclosure__cta">{changeLabel} →</span>
      </summary>
      <div className="inline-disclosure__panel">{children}</div>
    </details>
  );
}

/* shared/ui/toast-provider.tsx - the Radix toast's own markup and classes */
function Toast({ tone, title, description, onDismiss }) {
  return (
    <div className="proposal__toast-host" role="region" aria-label="Notifications">
      <div className={`toast toast--${tone}`} data-state="open">
        <div className="toast__content">
          <div className="toast__title">{title}</div>
          <div className="toast__description">{description}</div>
        </div>
        <button type="button" className="toast__dismiss" onClick={onDismiss}>Dismiss</button>
      </div>
    </div>
  );
}

    <path d="M9.5 1.5v3h3" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round" />
    <path d="M5.5 8h5M5.5 10.5h5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" />
  </svg>
);

function Headline({ tone, word, sub, tick }) {

      <span className={`document-headline__main document-headline__main--${tone}`}>

            <path d="M4.4 11.6 11.6 4.4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" />
          </svg>
        ) : <DocGlyph />}
        <span className="document-headline__word">{word[0]}<span className="document-headline__sep" aria-hidden="true"> · </span>{word[1]}</span>
        {tick ? (
          <svg className="document-headline__tick" viewBox="0 0 12 12" width="14" height="14" aria-hidden="true">
            <path d="M2.5 6.4 4.7 8.6 9.5 3.8" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />

}

function Panel({ headline, children }) {

function ConnectionSettings({ onSaved, onCancel }) {

  return (
    <div className="settings-card">
      <div className="page-header__content">
        <p className="eyebrow">Edit connection</p>
        <h2 className="page-title">{CONNECTION}</h2>

    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════
 * Flows
 * ════════════════════════════════════════════════════════════════════ */

const STATES = {
  today: [
    ['today-ready', 'Przed kliknięciem'],
    ['today-toast', 'Po kliknięciu'],
    ['today-reloaded', 'Po odświeżeniu'],
  ],
  proposal: [
    ['proposal-ready', 'Przed kliknięciem'],
    ['proposal-setup-incomplete', 'Po kliknięciu'],
    ['proposal-connection-settings', 'Ustawienia połączenia'],
    ['proposal-saved', 'Po zapisie'],
    ['proposal-issued', 'Po ponowieniu'],
    ['proposal-unclassified', 'Nieznany błąd'],
  ],
};

const CAPTIONS = {
  'today-ready': 'Operator wystawia fakturę ręcznie. Połączenie nie ma NIP sprzedawcy.',
  'today-toast': <><strong>Toast obwinia dostawcę</strong>, choć eparagony.pl nic nie dostało. Panel się nie zmienia: nieudana próba nie jest wczytana, a correlationId nic operatorowi nie mówi.</>,
  'today-reloaded': <>Dopiero po odświeżeniu panel pokazuje próbę. Każe <strong>sprawdzić dane zamówienia</strong>, a problem leży w połączeniu. Retry powtarza ten sam błąd.</>,
  'proposal-ready': 'Ten sam punkt wyjścia.',
  'proposal-setup-incomplete': <><strong>Bez toastu.</strong> Panel od razu pokazuje nieudaną próbę, mówi, czego brakuje i w którym połączeniu, i prowadzi tam jednym kliknięciem. Tak samo działa dziś brak serii numeracji.</>,
  'proposal-connection-settings': 'Link otwiera edycję połączenia. Grupa „Seller on invoices” z #3771 jest już rozwinięta, bo brakuje NIP.',
  'proposal-saved': 'Po zapisie wracasz do zamówienia. Komunikat dotyczy ostatniej próby, więc dalej jest prawdziwy. Retry to jedno kliknięcie.',
  'proposal-issued': 'Faktura wystawiona.',
  'proposal-unclassified': <>Błąd, którego nie umiemy sklasyfikować, <strong>nadal</strong> trafia do toastu z correlationId. Zmiana dotyczy tylko błędów, których przyczynę znamy.</>,
};

function Stage({ state, go }) {
  const orderContext = (
    <div className="proposal__context">
      <p className="eyebrow">Orders</p>
      <h2 className="page-title">Order 6fdb60d0</h2>
      <p style={{ margin: 0 }}><strong>Handmade Resin Ring</strong> · PLN 1,148.35 · Allegro (sandbox)</p>
      <p className="proposal__caption">{CAPTIONS[state]}</p>
    </div>
  );
  let panel = null;
  let toast = null;
  switch (state) {
    case 'today-ready':
      panel = <NotIssuedPanel onIssue={() => go('today-toast')} />; break;
    case 'today-toast':
      panel = <NotIssuedPanel onIssue={() => go('today-toast')} />;
      toast = <Toast tone="error" title="Could not issue invoice" description="Invoice issuance was rejected by the provider (correlationId: inv-mvaqap1b-gav5jf)" onDismiss={() => go('today-reloaded')} />;
      break;
    case 'today-reloaded':
      panel = <RejectedTodayPanel onRetry={() => go('today-toast')} />; break;
    case 'proposal-ready':
      panel = <NotIssuedPanel onIssue={() => go('proposal-setup-incomplete')} />; break;
    case 'proposal-setup-incomplete':
    case 'proposal-saved':
      panel = <SetupIncompletePanel onOpenSettings={() => go('proposal-connection-settings')} onRetry={() => go(state === 'proposal-saved' ? 'proposal-issued' : 'proposal-setup-incomplete')} />;
      if (state === 'proposal-saved') toast = <Toast tone="success" title="Connection saved" description={`${CONNECTION} was updated.`} onDismiss={() => go('proposal-saved')} />;
      break;
    case 'proposal-connection-settings':
      return <ConnectionSettings onSaved={() => go('proposal-saved')} onCancel={() => go('proposal-setup-incomplete')} />;
    case 'proposal-issued':
      panel = <IssuedPanel />;
      toast = <Toast tone="success" title="Invoice issued" description="The invoice was issued." onDismiss={() => go('proposal-issued')} />;
      break;
    case 'proposal-unclassified':
      panel = <NotIssuedPanel onIssue={() => go('proposal-unclassified')} />;
      toast = <Toast tone="error" title="Could not issue invoice" description="The invoicing provider returned an unexpected error. Reference: inv-mvaqap1b-gav5jf" onDismiss={() => go('proposal-ready')} />;
      break;
    default: break;
  }
  return (
    <div className="proposal__stage">
      {orderContext}
      <div>{panel}</div>
      {toast}
    </div>
  );
}

function App() {
  const [mode, setMode] = useState('proposal');
  const [state, setState] = useState('proposal-ready');
  const pick = (m) => { setMode(m); setState(STATES[m][0][0]); };
  return (
    <div className="proposal">
      <main className="proposal__app" data-state={state}>
        <div className="proposal__modes" role="tablist" aria-label="Wersja">
          <div style={{ display: "inline-flex", gap: "0.375rem" }}>
            {[['today', 'Dziś'], ['proposal', 'Propozycja']].map(([m, label]) => (
              <Button key={m} tone={mode === m ? 'primary' : 'secondary'} className="button--sm" onClick={() => pick(m)} aria-pressed={mode === m}>{label}</Button>
            ))}
          </div>
        </div>
        <div className="proposal__steps">
          {STATES[mode].map(([id, label], i) => (
            <Button key={id} tone={state === id ? 'primary' : 'secondary'} className="button--sm" onClick={() => setState(id)}>{i + 1}. {label}</Button>
          ))}
        </div>
        <Stage state={state} go={setState} />
      </main>

      <aside className="proposal__notes" aria-label="Opis propozycji">
        <div className="proposal__note">
          <span className="proposal__badge">propozycja</span>
          <h3>Problem</h3>
          <p style={{ margin: 0 }}>Adapter odmawia jeszcze przed wysłaniem, z konkretną instrukcją. Kontroler zamienia to na „rejected by the provider”, a rekord dostaje <code>provider-rejected</code>. Operator nie wie, co naprawić ani gdzie.</p>
          <p style={{ margin: 0 }}>Klikalne: przyciski w panelu przechodzą do kolejnych stanów. <code>data-state="{state}"</code></p>
        </div>
        <div className="proposal__note">
          <h3>Backend</h3>
          <ol>
            <li>Nowy neutralny kod <code>connection-setup-incomplete</code> w <code>InvoiceFailureCodeValues</code>.</li>
            <li>Adapter oznacza tylko odmowy o brakującej konfiguracji połączenia (strukturalne pole na wyjątku, bez szukania słów). Dla tego kodu <code>failureReason</code> to zdanie adaptera, bez danych kupującego.</li>
            <li>eparagony: brak NIP na fakturze i brak nazwy/adresu na korekcie dostają ten znacznik.</li>
            <li>Kontroler: 422 niesie <code>failureCode</code> (i powód przy tym kodzie). correlationId tylko dla błędów nieznanych.</li>
          </ol>
        </div>
        <div className="proposal__note">
          <h3>Frontend</h3>
          <ol>
            <li>Po każdym błędzie panel od razu odświeża fakturę (dziś dopiero po przeładowaniu strony).</li>
            <li>Dla nowego kodu: alert w panelu z linkiem do ustawień połączenia, bez toastu (wzór: brak serii numeracji).</li>
            <li>Nagłówek „Not issued” zamiast „Rejected”, gdy dostawca nic nie dostał.</li>
            <li>Lista <code>/invoices</code> dostaje ten sam tekst przez <code>resolveFailureCopy</code>.</li>
          </ol>
        </div>
      </aside>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
