/* ============================================================================
   Components. Class names follow apps/web where a shared primitive exists
   (button, alert, status-badge, field). Layout classes are mockup-local.
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg-canvas); }
body { margin: 0; font-family: var(--font-sans); color: var(--text-primary); font-size: 14px; line-height: 1.5; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
code, .mono { font-family: var(--font-mono); font-size: .8125rem; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---- mockup harness (not product UI) ---- */
.harness { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg-shell);
  border-bottom: 1px dashed var(--border-strong); padding: var(--space-2) var(--space-4); }
.harness__row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.harness__label { font-size: .6875rem; text-transform: uppercase; letter-spacing: var(--tracking-caps);
  color: var(--text-muted); font-weight: 600; margin-right: var(--space-1); }
.harness__row + .harness__row { margin-top: var(--space-2); }
.chip { border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-secondary);
  border-radius: var(--radius-pill); padding: 2px 10px; font-size: .75rem; cursor: pointer; }
.chip:hover { background: var(--bg-surface-hover); }
.chip[aria-pressed='true'] { background: var(--text-primary); color: var(--bg-surface); border-color: var(--text-primary); }
.harness__sep { width: 1px; height: 18px; background: var(--border-default); margin: 0 var(--space-1); }

/* ---- app shell ---- */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 80px); }
.nav { background: var(--bg-shell); border-right: 1px solid var(--border-subtle); padding: var(--space-4) var(--space-3); }
.nav__brand { font-weight: 700; font-size: .9375rem; padding: 0 var(--space-2) var(--space-4); }
.nav__group { font-size: .6875rem; text-transform: uppercase; letter-spacing: var(--tracking-caps);
  color: var(--text-muted); font-weight: 600; padding: var(--space-3) var(--space-2) var(--space-1); }
.nav a { display: flex; justify-content: space-between; padding: 5px var(--space-2); border-radius: var(--radius-sm);
  color: var(--text-secondary); text-decoration: none; font-size: .8125rem; }
.nav a:hover { background: var(--bg-surface-hover); }
.nav a[aria-current='page'] { background: var(--accent-primary-soft); color: var(--text-primary); font-weight: 600; }
.nav__new { font-size: .6875rem; color: var(--status-success-fg); font-weight: 600; }
.content { padding: var(--space-6) var(--space-6) var(--space-7); max-width: 1120px; width: 100%; }
@media (max-width: 900px) { .shell { grid-template-columns: 1fr; } .nav { display: none; } .content { padding: var(--space-5) var(--space-4) var(--space-6); } }

.back-link { color: var(--text-link); text-decoration: none; font-size: .8125rem; }
.eyebrow { font-size: .6875rem; text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--text-muted); font-weight: 600; margin-top: var(--space-3); }
.page-title { font-size: 1.5rem; font-weight: 600; letter-spacing: var(--tracking-tight); margin-top: var(--space-1); }
.page-description { color: var(--text-secondary); max-width: 64ch; margin-top: var(--space-2); }
.page-header { margin-bottom: var(--space-6); }

/* ---- wizard layout ---- */
.wizard { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
@media (max-width: 800px) { .wizard { grid-template-columns: 1fr; gap: var(--space-4); } }

.stepper { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 110px; }
.stepper__item button { width: 100%; display: grid; grid-template-columns: 28px 1fr; gap: var(--space-3); align-items: start;
  text-align: left; background: none; border: 0; padding: var(--space-2); border-radius: var(--radius-md); cursor: pointer; color: inherit; }
.stepper__item button:hover:not(:disabled) { background: var(--bg-surface-hover); }
.stepper__item button:disabled { cursor: default; }
.stepper__dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 600;
  border: 1.5px solid var(--border-strong); color: var(--text-secondary); background: var(--bg-surface); font-variant-numeric: tabular-nums; }
.stepper__title { font-size: .875rem; font-weight: 500; line-height: 1.3; padding-top: 4px; }
.stepper__meta { font-size: .75rem; color: var(--text-muted); }
.stepper__item[data-status='current'] .stepper__dot { border-color: var(--accent-primary); background: var(--accent-primary); color: var(--text-on-primary); }
.stepper__item[data-status='current'] .stepper__title { font-weight: 600; }
.stepper__item[data-status='done'] .stepper__dot { border-color: var(--status-success); background: var(--status-success-soft); color: var(--status-success-fg); }
.stepper__item[data-status='locked'] .stepper__title { color: var(--text-muted); }
@media (max-width: 800px) {
  .stepper { position: static; flex-direction: row; overflow-x: auto; gap: var(--space-1); padding-bottom: var(--space-1); }
  .stepper__item { flex: 0 0 auto; }
  .stepper__item button { grid-template-columns: 24px auto; gap: var(--space-2); }
  .stepper__dot { width: 24px; height: 24px; }
  .stepper__meta { display: none; }
  .stepper__item:not([data-status='current']) .stepper__title { display: none; }
}

.panel { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-xs); }
.panel__head { padding: var(--space-5) var(--space-5) 0; }
.panel__step { font-size: .75rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.panel__title { font-size: 1.1875rem; font-weight: 600; margin-top: 2px; }
.panel__why { color: var(--text-secondary); margin-top: var(--space-2); max-width: 62ch; }
.panel__body { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); }
.panel__foot { padding: var(--space-4) var(--space-5); border-top: 1px solid var(--border-subtle); display: flex; gap: var(--space-2);
  justify-content: space-between; align-items: center; flex-wrap: wrap; }
.panel__foot-right { display: flex; gap: var(--space-2); flex-wrap: wrap; }

/* ---- form ---- */
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
@media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; }
.field--wide { grid-column: 1 / -1; }
.field label { font-size: .8125rem; font-weight: 500; }
.field__hint { font-size: .75rem; color: var(--text-muted); }
.input, .select { font: inherit; border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 7px 10px;
  background: var(--bg-surface); color: var(--text-primary); width: 100%; }
.input:focus, .select:focus { outline: none; border-color: var(--border-focus); box-shadow: var(--shadow-focus); }

/* ---- buttons ---- */
.button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: 7px 14px; font-weight: 600; font-size: .8125rem; cursor: pointer; background: var(--accent-primary); color: var(--text-on-primary);
  text-decoration: none; }
.button:hover { background: var(--button-primary-bg-hover); }
.button:disabled { background: var(--bg-strong); color: var(--text-disabled); cursor: not-allowed; }
.button--secondary { background: var(--bg-surface); color: var(--text-primary); border-color: var(--border-default); }
.button--secondary:hover { background: var(--bg-surface-hover); }
.button--ghost { background: none; color: var(--text-secondary); }
.button--ghost:hover { background: var(--bg-surface-hover); }
.button--danger { background: var(--status-error); color: #fff; }
.button--danger:hover { background: var(--status-error-fg); }

/* ---- alerts & badges ---- */
.alert { border: 1px solid; border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: 2px; }
.alert__title { font-weight: 600; font-size: .8125rem; }
.alert__text { font-size: .8125rem; color: var(--text-secondary); }
.alert--info { background: var(--status-info-soft); border-color: var(--status-info-border); }
.alert--info .alert__title { color: var(--status-info-fg); }
.alert--warning { background: var(--status-warning-soft); border-color: var(--status-warning-border); }
.alert--warning .alert__title { color: var(--status-warning-fg); }
.alert--success { background: var(--status-success-soft); border-color: var(--status-success-border); }
.alert--success .alert__title { color: var(--status-success-fg); }
.alert--error { background: var(--status-error-soft); border-color: var(--status-error-border); }
.alert--error .alert__title { color: var(--status-error-fg); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .6875rem; font-weight: 600; padding: 1px 8px; border-radius: var(--radius-pill); border: 1px solid; white-space: nowrap; }
.badge--success { background: var(--status-success-soft); color: var(--status-success-fg); border-color: var(--status-success-border); }
.badge--muted { background: var(--status-disabled-soft); color: var(--status-disabled-fg); border-color: var(--status-disabled-border); }
.badge--info { background: var(--status-info-soft); color: var(--status-info-fg); border-color: var(--status-info-border); }

/* ---- summary card (source connection, warehouse) ---- */
.item-card { border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);
  display: flex; gap: var(--space-3); align-items: center; justify-content: space-between; flex-wrap: wrap; }
.item-card__main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item-card__name { font-weight: 600; }
.item-card__sub { font-size: .8125rem; color: var(--text-muted); }

.choice { border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);
  display: grid; grid-template-columns: 20px 1fr; gap: var(--space-3); cursor: pointer; align-items: start; }
.choice:has(input:checked) { border-color: var(--accent-primary); background: var(--accent-primary-soft); }
.choice input { margin: 3px 0 0; accent-color: var(--accent-primary); width: 16px; height: 16px; }

/* ---- progress ---- */
.progress { display: flex; flex-direction: column; gap: var(--space-2); }
.progress__row { display: flex; justify-content: space-between; gap: var(--space-3); font-size: .8125rem; flex-wrap: wrap; }
.progress__num { font-variant-numeric: tabular-nums; font-weight: 600; }
.progress__track { height: 8px; border-radius: var(--radius-pill); background: var(--bg-strong); overflow: hidden; }
.progress__fill { height: 100%; background: var(--status-success); border-radius: inherit; transition: width var(--duration-normal) var(--ease-out); }

/* ---- user list ---- */
.users { border: 1px solid var(--border-default); border-radius: var(--radius-md); overflow: hidden; }
.user { display: grid; grid-template-columns: 32px 1fr auto; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-4); }
.user + .user { border-top: 1px solid var(--border-subtle); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-strong); display: grid; place-items: center; font-size: .75rem; font-weight: 600; color: var(--text-secondary); }
.user__name { font-weight: 500; }
.user__mail { font-size: .75rem; color: var(--text-muted); }

/* ---- flow diagram ---- */
.flow-tabs { display: inline-flex; border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 2px; gap: 2px; background: var(--bg-muted); }
.flow-tabs button { border: 0; background: none; padding: 5px 12px; border-radius: var(--radius-xs); cursor: pointer; font-size: .8125rem; color: var(--text-secondary); }
.flow-tabs button[aria-selected='true'] { background: var(--bg-surface); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow-xs); }
.flows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
@media (max-width: 720px) { .flows { grid-template-columns: 1fr; } }
.flow { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-4); background: var(--bg-surface-elevated); display: flex; flex-direction: column; gap: var(--space-3); }
.flow__label { font-size: .6875rem; text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--text-muted); font-weight: 600; }
.flow--after { border-color: var(--accent-primary-border); }
.flow--after .flow__label { color: var(--accent-primary-active); }
.chain { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
.node { border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 8px 12px; background: var(--bg-surface); }
.node__t { font-weight: 600; font-size: .8125rem; }
.node__s { font-size: .75rem; color: var(--text-muted); }
.node--hl { border-color: var(--accent-primary); background: var(--accent-primary-soft); }
.node--gone { border-style: dashed; color: var(--text-muted); background: transparent; }
.node--fail { border-color: var(--status-error-border); background: var(--status-error-soft); }
.node--fail .node__t { color: var(--status-error-fg); }
.node--gone .node__t { text-decoration: line-through; color: var(--text-muted); }
.arrow { align-self: center; width: 2px; height: 16px; background: var(--border-strong); position: relative; margin: 2px 0 6px; }
.arrow::after { content: ''; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--border-strong); border-bottom: 0; }

.inout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
@media (max-width: 720px) { .inout { grid-template-columns: 1fr; } }
.inout__box { border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); border: 1px solid; }
.inout__box--in { background: var(--status-success-soft); border-color: var(--status-success-border); }
.inout__box--out { background: var(--bg-muted); border-color: var(--border-default); }
.inout__title { font-weight: 600; font-size: .8125rem; margin-bottom: var(--space-2); }
.inout__box--in .inout__title { color: var(--status-success-fg); }
.inout ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; font-size: .8125rem; color: var(--text-secondary); }

.changes b { font-weight: 600; }

/* ---- live / status page ---- */
.live-banner { display: flex; justify-content: space-between; gap: var(--space-4); align-items: center; flex-wrap: wrap;
  padding: var(--space-4) var(--space-5); border-radius: var(--radius-lg); background: var(--status-success-soft); border: 1px solid var(--status-success-border); }
.live-banner--off { background: var(--bg-muted); border-color: var(--border-default); }
.live-banner__t { font-weight: 600; font-size: 1rem; display: flex; gap: var(--space-2); align-items: center; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--status-success); box-shadow: 0 0 0 0 var(--status-success); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 oklch(54% 0.14 150 / .5); } 70% { box-shadow: 0 0 0 8px oklch(54% 0.14 150 / 0); } 100% { box-shadow: 0 0 0 0 oklch(54% 0.14 150 / 0); } }
.live-banner--off .pulse { background: var(--status-disabled); animation: none; }
.live-banner__s { font-size: .8125rem; color: var(--text-secondary); margin-top: 2px; }
.checks { list-style: none; margin: 0; padding: 0; }

.checks li + li { border-top: 1px solid var(--border-subtle); }
.tick { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 700; }

.checks__t { font-weight: 500; }

.linkish { background: none; border: 0; color: var(--text-link); cursor: pointer; font-size: .8125rem; padding: 0; text-decoration: none; }
.linkish:hover { text-decoration: underline; }
.section-title { font-size: .9375rem; font-weight: 600; padding: var(--space-4) var(--space-5) var(--space-2); }
.stack { display: flex; flex-direction: column; gap: var(--space-5); }

.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border-default); border-top-color: var(--accent-primary); animation: spin 1s linear infinite; margin-top: 2px; }

<script>
/* ---------------------------------------------------------------------------
   Frontend-only wizard. Every action maps to an endpoint on main today, except
   where a dev note (toggle "Show API calls") says TARGET.
   Scope: ONE warehouse, fed by one shop or two (TWO below).
   OpenLinker keeps no catalogue or stock of its own: products and stock come
   only from a connection with ProductMaster + InventoryMaster enabled, so step 1
   is a gate, not a formality.
   ------------------------------------------------------------------------- */
const TOTAL_STOCK = 4812;

const SOURCES = {
  prestashop: { name: 'PrestaShop', host: 'sklep-example.pl', ordersOn: true, stockWhen: 'when the order is created in PrestaShop' },
  woocommerce: { name: 'WooCommerce', host: 'sklep-example.pl', ordersOn: true, stockWhen: 'when the paid order is created in WooCommerce' },
  subiekt: { name: 'Subiekt GT', host: 'Biuro, Warszawa', ordersOn: true, stockWhen: 'when the invoice or receipt is issued in Subiekt GT (Subiekt then issues the warehouse release, WZ)' },
  'orders-off': { name: 'PrestaShop', host: 'sklep-example.pl', ordersOn: false, stockWhen: 'when the order is created in PrestaShop' },
};

const S = {
  source: 'prestashop',   // key of SOURCES, or 'none' | 'two'
  step: 1, maxReached: 1,
  done: [false, false, false, false, false, false],
  view: 'wizard',         // 'wizard' | 'waiting' | 'first' | 'status'
  live: false,
  located: 0, syncing: false,
  warehouse: { name: 'Main warehouse', code: 'MAIN', country: 'PL', postcode: '00-001' },
  lastCreated: null,      // shows the one-time password right after creating a packer
  packers: [],            // approved packers
  ack: false,
};

const STEPS = [
  { title: 'Your shop', meta: 'Where products and stock come from' },
  { title: 'Add your warehouse', meta: 'Where you pack' },
  { title: 'Show where your stock is', meta: 'One click' },
  { title: 'Add packers', meta: 'Optional' },
  { title: 'See what changes', meta: 'Read before turning on' },
  { title: 'Turn it on', meta: '' },
];
const N = STEPS.length;

const $ = (q) => document.querySelector(q);
const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n) => n.toLocaleString('en-US');
const api = (t) => `<div class="api">${t}</div>`;
/* Two shops sharing one warehouse (e.g. chemicals in A, electrics in B).
   Verified on main: every order fans out to EVERY active OrderProcessorManager
   (order-sync.service.ts:499), so the shop without the product fails
   ("Product not found", prestashop-order-processor-manager.adapter.ts:274) and a
   mixed basket fails in both. The same item listed in both shops is two separate
   OL products with two stock counts (getOrCreateInternalId is per connection). */
const TWO = [
  { name: 'PrestaShop A', host: 'chemia-example.pl', items: 3120, sells: 'chemicals' },
  { name: 'PrestaShop B', host: 'elektro-example.pl', items: 1692, sells: 'electrics' },
];
const isTwo = () => S.source === 'two';
const src = () => (isTwo() ? { name: 'your shops', host: '', ordersOn: true, stockWhen: 'when the order is created in the shop that sells the product' } : SOURCES[S.source]);
const shops = () => (isTwo() ? TWO : [{ name: SOURCES[S.source].name, host: SOURCES[S.source].host, items: TOTAL_STOCK }]);
const shopOk = () => isTwo() || Boolean(SOURCES[S.source]);
const shopNames = () => shops().map((x) => x.name).join(' and ');

/* ---------------- shell ---------------- */
function stepper() {
  return `<ol class="stepper" aria-label="Setup steps" data-testid="wizard-stepper">${STEPS.map((s, i) => {
    const n = i + 1;
    const status = S.done[i] && n !== S.step ? 'done' : n === S.step ? 'current' : n <= S.maxReached ? 'open' : 'locked';
    return `<li class="stepper__item" data-status="${status}" data-testid="wizard-stepper-step-${n}">
      <button data-testid="wizard-stepper-button-${n}" type="button" ${status === 'locked' ? 'disabled' : ''} onclick="goStep(${n})" ${n === S.step ? 'aria-current="step"' : ''}>
        <span class="stepper__dot" aria-hidden="true">${status === 'done' ? '&#10003;' : n}</span>
        <span><span class="stepper__title">${s.title}</span>${s.meta ? `<br><span class="stepper__meta">${s.meta}</span>` : ''}</span>
      </button></li>`;
  }).join('')}</ol>`;
}

function panel({ why, body, next, back = true }) {
  return `<section class="panel" aria-labelledby="panelTitle" data-testid="wizard-step-panel" data-step="${S.step}">
    <div class="panel__head">
      <p class="panel__step">Step ${S.step} of ${N}</p>
      <h2 class="panel__title" id="panelTitle" tabindex="-1">${STEPS[S.step - 1].title}</h2>
      <p class="panel__why">${why}</p>
    </div>
    <div class="panel__body">${body}</div>
    <div class="panel__foot" data-testid="wizard-step-footer">
      <span>${back && S.step > 1 ? `<button data-testid="btn-back" class="button button--ghost" type="button" onclick="goStep(${S.step - 1})">&larr; Back</button>` : ''}</span>
      <span class="panel__foot-right">${next}</span>
    </div>
  </section>`;
}

/* ---------------- step 1: your shop (gate) ---------------- */
function step1() {
  const conn = api('GET /connections &rarr; status=active AND enabledCapabilities &ni; ProductMaster, InventoryMaster<br>soft check: enabledCapabilities &ni; OrderProcessorManager (else stock never drops after a sale)');
  if (S.source === 'none') {
    return panel({
      why: 'OpenLinker has no products or stock of its own. It reads them from your shop or ERP. Connect it first.',
      body: `<div class="alert alert--error"><span class="alert__title" data-testid="alert-no-shop">No shop connected yet</span><span class="alert__text">Connect the shop or ERP that holds your products and stock, for example PrestaShop, WooCommerce or Subiekt GT. Then come back here.</span></div>${conn}`,
      next: `<a class="button" href="#" data-testid="link-connect-shop">Connect your shop</a>`,
    });
  }
  if (isTwo()) {
    const card = (x) => `<div class="item-card"><div class="item-card__main"><span class="item-card__name">${x.name} &middot; ${esc(x.host)}</span>
        <span class="item-card__sub">Sells ${x.sells}</span>
        <div class="cap-list"><span class="badge badge--success">&#10003; Products</span><span class="badge badge--success">&#10003; Stock</span><span class="badge badge--success">&#10003; Receives orders</span></div></div>
        <span class="badge badge--info">Your shop</span></div>`;
    return panel({
      why: 'OpenLinker has no products or stock of its own. It reads them from your shops. These two will share one warehouse.',
      body: `${TWO.map(card).join('')}
        <div class="alert alert--info"><span class="alert__title" data-testid="alert-two-shops-receive-orders">Keep "Receives orders" on for both shops</span><span class="alert__text">A shop only lowers its stock when it gets the order. If you turn it off on one shop, that shop's stock never goes down after a sale.</span></div>${conn}`,
      next: `<button data-testid="btn-continue-step-1" class="button" type="button" onclick="markDone(1)">Continue</button>`,
    });
  }
  const s = src();
  const warn = !s.ordersOn
    ? `<div class="alert alert--warning"><span class="alert__title" data-testid="alert-orders-off">This shop doesn't receive your orders</span><span class="alert__text">Orders from Allegro and Erli are not sent to ${s.name}, so its stock never goes down after a sale, and other channels can sell the same item twice. Turn on <b>Receive orders</b> in the connection settings first.</span></div>`
    : '';
  return panel({
    why: 'OpenLinker has no products or stock of its own. It reads them from your shop. This is the shop it will use.',
    body: `<div class="item-card">
        <div class="item-card__main">
          <span class="item-card__name">${s.name} &middot; ${esc(s.host)}</span>
          <div class="cap-list">
            <span class="badge badge--success">&#10003; Products</span>
            <span class="badge badge--success">&#10003; Stock</span>
            ${s.ordersOn ? '<span class="badge badge--success">&#10003; Receives orders</span>' : '<span class="badge badge--warn">&#10007; Receives orders</span>'}
          </div>
        </div>
        <span class="badge badge--info">Your shop</span>
      </div>${warn}${conn}`,
    next: s.ordersOn
      ? `<button data-testid="btn-continue-step-1" class="button" type="button" onclick="markDone(1)">Continue</button>`
      : `<a class="button button--secondary" href="#" data-testid="link-open-connection-settings">Open connection settings</a><button class="button" type="button" disabled>Continue</button>`,
  });
}

/* ---------------- step 2: warehouse ---------------- */
function step2() {
  const w = S.warehouse;

/* ---------------- step 3: stock ---------------- */
function step3() {
  const list = shops();
  const why = list.length > 1
    ? 'Your shops don\'t say which warehouse the stock is in. Tell OpenLinker once per shop, and it can pick every order from there.'
    : `${list[0].name} doesn't say which warehouse its stock is in. Tell OpenLinker once, and it can pick every order from there.`;
  const cards = list.map((x) => `<div class="item-card"><div class="item-card__main"><span class="item-card__name">${x.name} &middot; ${esc(x.host)}</span><span class="item-card__sub">${fmt(x.items)} stock items</span></div><span class="badge badge--info">Your shop</span></div>`).join('');
  const calls = api(list.map((x, i) => `PATCH /connections/{shop${i + 1}Id} {config: {...fullConfig, stockLocationOverride: "{MAIN id}"}}`).join('<br>') + '<br>(config is replaced whole: send the existing config back with only this key changed)');
  if (!S.done[2]) {
    return panel({
      why,
      body: `${cards}
        ${list.map((x, i) => `<label class="choice"><input type="checkbox" id="stock${i}" checked>
          <span><span class="choice__title">All stock from ${x.name} is in ${esc(S.warehouse.name)}</span><br>
          <span class="choice__text">Nothing moves. You only tell OpenLinker where the goods are. Stock numbers keep coming from ${x.name}, as today.</span></span></label>`).join('')}
        ${calls}`,
      next: `<button data-testid="btn-save-stock" class="button" type="button" onclick="saveStock()">Confirm</button>`,
    });
  }
  const pct = Math.round((S.located / TOTAL_STOCK) * 100);
  const complete = S.located >= TOTAL_STOCK;
  return panel({
    why,
    body: `${cards}
      <div class="progress" aria-live="polite" data-testid="stock-located-progress">
        <div class="progress__row"><span>Stock placed in ${esc(S.warehouse.name)}${list.length > 1 ? ', both shops' : ''}</span><span class="progress__num">${fmt(S.located)} of ${fmt(TOTAL_STOCK)}</span></div>
        <div class="progress__track" role="progressbar" aria-valuemin="0" aria-valuemax="${TOTAL_STOCK}" aria-valuenow="${S.located}" aria-label="Stock placed in warehouse"><div class="progress__fill" style="width:${pct}%"></div></div>
      </div>
      ${complete
        ? `<div class="alert alert--success"><span class="alert__title">All stock is in ${esc(S.warehouse.name)}</span><span class="alert__text">OpenLinker can now pick every product from this warehouse.</span></div>`
        : `<div class="alert alert--info"><span class="alert__title">Filling in with each stock sync from ${shopNames()}</span><span class="alert__text">You don't need to wait here. Until it reaches ${fmt(TOTAL_STOCK)}, an order for a product not counted yet is handled the old way.</span></div>`}
      ${api(`GET /inventory?locationId={MAIN id}&limit=1 &rarr; total (${fmt(S.located)})<br>GET /inventory?limit=1 &rarr; total (all rows from your shop${list.length > 1 ? 's' : ''})`)}`,
    next: `<button data-testid="btn-go-step-4" class="button" type="button" onclick="goStep(4)">Continue</button>`,
  });
}

        <div class="live-banner__s">12 orders on Fulfilment, 4 unassigned &middot; last one arrived 4 min ago</div></div>
        <span style="display:flex; gap:var(--space-2); flex-wrap:wrap;"><a class="button" href="#" data-testid="link-open-fulfilment">Open Fulfilment</a><button data-testid="btn-ask-stop" class="button button--secondary" type="button" onclick="askStop()">Stop packing in OpenLinker</button></span></div>`
    : `<div class="live-banner live-banner--off" data-testid="packing-status-banner" data-live="false"><div><div class="live-banner__t"><span class="pulse" aria-hidden="true"></span>Packing is off</div>
        <div class="live-banner__s">New orders go to ${isTwo() ? 'your shops' : s.name} and are packed there, as before. Your warehouse and stock setup are kept.</div></div>
        <button data-testid="btn-turn-on" class="button" type="button" onclick="turnOn(true)">Start packing again</button></div>`;
  return `<div class="stack">${banner}
    <section class="panel" data-testid="setup-status"><h2 class="section-title">Setup</h2>
      <ul class="checks">
        <li><span class="tick tick--ok" aria-hidden="true">&#10003;</span><span><span class="checks__t">Your shop${isTwo() ? 's' : ''}</span><br><span class="checks__s">${shops().map((x) => `${x.name} &middot; ${esc(x.host)}`).join(', ')}</span></span><a class="linkish" href="#">Open</a></li>
        <li><span class="tick tick--ok" aria-hidden="true">&#10003;</span><span><span class="checks__t">Warehouse</span><br><span class="checks__s">${esc(S.warehouse.name)} &middot; ${esc(S.warehouse.postcode)}</span></span><a class="linkish" href="#">Edit</a></li>
        <li><span class="tick tick--ok" aria-hidden="true">&#10003;</span><span><span class="checks__t">Stock in the warehouse</span><br><span class="checks__s">${fmt(S.located)} of ${fmt(TOTAL_STOCK)} from ${shopNames()}</span></span><a class="linkish" href="#">View</a></li>
        <li><span class="tick tick--ok" aria-hidden="true">&#10003;</span><span><span class="checks__t">Packers</span><br><span class="checks__s">${esc(who)}</span></span><a class="linkish" href="#">Add packers</a></li>
      </ul>
      ${api('<span style="display:block;margin:0 var(--space-5) var(--space-4)">GET /connections · GET /inventory/locations?status=active · GET /inventory?locationId= · GET /fulfillment-authority/status (sourcing row) · GET /fulfillment/works</span>')}
    </section></div>`;
}

/* ---------------- dialog ---------------- */
function askStop() {
  const s = src();
  $('#dialogHost').innerHTML = `<div class="scrim" onclick="if(event.target===this) closeDialog()">
    <div class="dialog" data-testid="dialog-stop-packing" data-state="dialog-stop-confirm" role="dialog" aria-modal="true" aria-labelledby="dT" aria-describedby="dD" tabindex="-1" id="dlg">
      <div class="dialog__head"><h2 class="dialog__title" id="dT">Stop packing in OpenLinker?</h2></div>
      <div class="dialog__body" id="dD">
        <p>New orders go to ${isTwo() ? 'your shops' : s.name} and are packed there, as before.</p>
        <p>The 12 orders already on Fulfilment stay there. Finish packing them at the pack bench.</p>
        <p>Your warehouse and stock setup are kept, so you can start again with one click.</p>
        ${api('PATCH /connections/{openlinkerId} {config: {...config, sourcingAuthority: {enabled: false}}}')}
      </div>
      <div class="dialog__foot"><button data-testid="btn-close-dialog" class="button button--secondary" type="button" onclick="closeDialog()">Cancel</button><button data-testid="btn-stop-now" class="button button--danger" type="button" onclick="stopNow()">Stop packing</button></div>
    </div></div>`;
  $('#dlg').focus();
}
function closeDialog() { $('#dialogHost').innerHTML = ''; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDialog(); });

/* ---------------- actions ---------------- */
function markDone(n) { S.done[n - 1] = true; goStep(Math.min(N, n + 1)); }
function saveWarehouse() {
  const v = (id) => $(id).value;
  S.warehouse = { name: v('#wName') || 'Main warehouse', code: v('#wCode') || 'MAIN', country: v('#wCountry'), postcode: v('#wPost') };
  S.done[1] = true; S.maxReached = Math.max(S.maxReached, 3); render(true);
}
function saveStock() { S.done[2] = true; S.located = 1240; S.syncing = true; S.maxReached = Math.max(S.maxReached, 4); render(true); tick(); }
function addPacker() {
  const name = $('#pName').value.trim(); const login = $('#pLogin').value.trim(); const err = $('#pErr');
  if (!name || !login) { err.textContent = 'Enter a name and a login.'; err.hidden = false; return; }
  if (S.packers.some((u) => u.login === login)) { err.textContent = `The login "${login}" is already taken. Pick another one.`; err.hidden = false; return; }
  const pass = 'Pack-' + Math.random().toString(36).slice(2, 6) + '-' + Math.random().toString(36).slice(2, 6);
  S.packers.push({ id: 'u' + Date.now(), name, login, mail: $('#pMail').value.trim() });
  S.lastCreated = { name, login, pass };
  render();
}
function copyPass() {
  const btn = $('#copyBtn');
  const ok = () => { btn.textContent = 'Copied'; setTimeout(() => { if ($('#copyBtn')) $('#copyBtn').textContent = 'Copy password'; }, 1500); };
  try { navigator.clipboard.writeText($('#tmpPass').value).then(ok, () => $('#tmpPass').select()); } catch (e) { $('#tmpPass').select(); }
}
function turnOn(again) { S.done[5] = true; S.live = true; S.view = again ? 'status' : 'waiting'; render(true); }
function stopNow() { closeDialog(); S.live = false; S.view = 'status'; render(true); }
function goStep(n) { S.maxReached = Math.max(S.maxReached, n); S.step = n; S.view = 'wizard'; render(true); }

let timer = null;
function tick() {
  clearInterval(timer);
  timer = setInterval(() => {
    if (!S.syncing) return clearInterval(timer);
    S.located = Math.min(TOTAL_STOCK, S.located + 600);
    if (S.located >= TOTAL_STOCK) { S.syncing = false; clearInterval(timer); }
    if (S.view === 'wizard' && (S.step === 3 || S.step === 6)) render();
  }, 1400);
}

/* ---------------- data-state vocabulary (E2E + implementation tickets cite these) ----------------
   step-1-shop | step-1-orders-off | step-1-no-shop | step-1-two-shops
   step-2-warehouse-form | step-2-warehouse-saved
   step-3-stock-confirm | step-3-stock-syncing | step-3-stock-complete
   step-4-packers-empty | step-4-packer-added
   step-5-what-changes | step-5-what-changes-two-shops
   step-6-turn-on | waiting-first-order | first-order-arrived | status-on | status-off
   dialog-stop-confirm (on the dialog element)
   body[data-source] = prestashop | woocommerce | subiekt | orders-off | none | two */
function stateName() {
  if (S.view === 'waiting') return 'waiting-first-order';
  if (S.view === 'first') return 'first-order-arrived';
  if (S.view === 'status') return S.live ? 'status-on' : 'status-off';
  switch (S.step) {
    case 1: return S.source === 'none' ? 'step-1-no-shop' : isTwo() ? 'step-1-two-shops' : S.source === 'orders-off' ? 'step-1-orders-off' : 'step-1-shop';
    case 2: return S.done[1] ? 'step-2-warehouse-saved' : 'step-2-warehouse-form';
    case 3: return !S.done[2] ? 'step-3-stock-confirm' : S.located >= TOTAL_STOCK ? 'step-3-stock-complete' : 'step-3-stock-syncing';
    case 4: return S.packers.length ? 'step-4-packer-added' : 'step-4-packers-empty';
    case 5: return isTwo() ? 'step-5-what-changes-two-shops' : 'step-5-what-changes';
    default: return 'step-6-turn-on';
  }
}

/* ---------------- render ---------------- */
function render(moveFocus) {
  const inWizard = S.view === 'wizard';
  $('#navBench').hidden = !S.live;
  $('#pageTitle').textContent = inWizard ? 'Pack orders in OpenLinker' : 'Packing in OpenLinker';
  $('#pageDesc').textContent = inWizard
    ? 'Pick and pack orders on one screen, with a barcode scanner. Setup takes about 10 minutes. Nothing changes in how your orders are handled until the last step.'
    : 'Orders are packed at the pack bench. You can stop this at any time.';
  let html;
  if (inWizard) html = `<div class="wizard">${stepper()}<div>${[step1, step2, step3, step4, step5, step6][S.step - 1]()}</div></div>`;
  else if (S.view === 'waiting') html = firstOrderView(false);
  else if (S.view === 'first') html = firstOrderView(true);
  else html = statusView();
  $('#root').innerHTML = html;
  document.body.dataset.state = stateName();
  document.body.dataset.source = S.source;
  if (moveFocus && inWizard) { const t = $('#panelTitle'); if (t) t.focus({ preventScroll: true }); }
}

/* ---------------- harness ---------------- */
const ANNA = { id: 'u1', name: 'Anna Nowak', login: 'anna', mail: 'anna@sklep-example.pl' };
let currentPreset = 's1';
function setPreset(p) {
  currentPreset = p;
  Object.assign(S, { step: 1, maxReached: 1, done: Array(N).fill(false), view: 'wizard', live: false, located: 0, syncing: false, lastCreated: null, packers: [], ack: false });
  clearInterval(timer);
  if (!shopOk() && p !== 's1') { S.source = 'prestashop'; syncSourceChips(); }
  const upTo = (n) => { for (let i = 0; i < n; i++) S.done[i] = true; S.maxReached = Math.min(N, n + 1); };
  const full = () => { S.located = TOTAL_STOCK; };
  switch (p) {
    case 's2': upTo(1); S.step = 2; break;
    case 's3': upTo(2); S.step = 3; break;
    case 's3-sync': upTo(3); S.step = 3; S.located = 1240; S.syncing = true; tick(); break;
    case 's4': upTo(3); S.step = 4; full(); break;
    case 's4-pending': upTo(3); S.step = 4; full(); S.packers = [{ ...ANNA }]; S.lastCreated = { name: ANNA.name, login: ANNA.login, pass: 'Pack-7k2q-m9xd' }; break;
    case 's5': upTo(4); S.step = 5; full(); break;
    case 's6': upTo(5); S.step = 6; full(); S.ack = true; S.packers = [{ ...ANNA }]; break;
    case 'waiting': upTo(6); full(); S.live = true; S.view = 'waiting'; break;
    case 'first': upTo(6); full(); S.live = true; S.view = 'first'; break;
    case 'live': upTo(6); full(); S.live = true; S.view = 'status'; S.packers = [{ ...ANNA }]; break;
    case 'off': upTo(6); full(); S.live = false; S.view = 'status'; S.packers = [{ ...ANNA }]; break;
  }
  document.querySelectorAll('[data-preset]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.preset === p)));
  render(true);
}
function syncSourceChips() { document.querySelectorAll('[data-source]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.source === S.source))); }
document.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => setPreset(b.dataset.preset)));
document.querySelectorAll('[data-source]').forEach((b) => b.addEventListener('click', () => {
  S.source = b.dataset.source; syncSourceChips();
  setPreset(shopOk() && src().ordersOn ? currentPreset : 's1');
}));
$('#apiToggle').addEventListener('click', (e) => { const on = document.body.classList.toggle('show-api'); e.currentTarget.setAttribute('aria-pressed', String(on)); });

syncSourceChips();
setPreset('s1');
</script>
