  Milestone: "OMS onboarding wizard".

  Durable spec per docs/frontend-architecture.md § UX Mockups. E2E baselines come
  from THIS file, never from the Artifact it was iterated on.

  How to drive it:
  - The dashed top bar is the mockup's own harness, not product UI.
    [data-testid="mockup-state-chip"][data-preset=...] picks a state;
    [data-testid="mockup-source-chip"][data-source=...] picks the product master setup.
  - The page writes body[data-state] (full vocabulary: see the comment above
    stateName() in the script) and body[data-source].
  - "Show API calls (devs)" reveals, under each action, the endpoint it calls and
    every TARGET sentence with the issue it depends on (#3453, #3455, #3456,
    #3479, #3480, #3485, #3486, #3487, #3488).

  Scope (v1): one warehouse, fed by one or two product masters. Two warehouses are #3454.
-->

/* ============================================================================
   Components. Class names follow apps/web where a shared primitive exists
   (button, alert, status-badge, field). Layout classes are mockup-local.
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg-canvas); }
body { margin: 0; font-family: var(--font-sans); color: var(--text-primary); font-size: 14px; line-height: 1.5; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
code, .mono { font-family: var(--font-mono); font-size: .8125rem; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---- mockup harness (not product UI) ---- */
.harness { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg-shell);
  border-bottom: 1px dashed var(--border-strong); padding: var(--space-2) var(--space-4); }
.harness__row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.harness__label { font-size: .6875rem; text-transform: uppercase; letter-spacing: var(--tracking-caps);
  color: var(--text-muted); font-weight: 600; margin-right: var(--space-1); }
.harness__row + .harness__row { margin-top: var(--space-2); }
.chip { border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-secondary);
  border-radius: var(--radius-pill); padding: 2px 10px; font-size: .75rem; cursor: pointer; }
.chip:hover { background: var(--bg-surface-hover); }
.chip[aria-pressed='true'] { background: var(--text-primary); color: var(--bg-surface); border-color: var(--text-primary); }
.harness__sep { width: 1px; height: 18px; background: var(--border-default); margin: 0 var(--space-1); }

/* ---- app shell ---- */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 80px); }
.nav { background: var(--bg-shell); border-right: 1px solid var(--border-subtle); padding: var(--space-4) var(--space-3); }
.nav__brand { font-weight: 700; font-size: .9375rem; padding: 0 var(--space-2) var(--space-4); }
.nav__group { font-size: .6875rem; text-transform: uppercase; letter-spacing: var(--tracking-caps);
  color: var(--text-muted); font-weight: 600; padding: var(--space-3) var(--space-2) var(--space-1); }
.nav a { display: flex; justify-content: space-between; padding: 5px var(--space-2); border-radius: var(--radius-sm);
  color: var(--text-secondary); text-decoration: none; font-size: .8125rem; }
.nav a:hover { background: var(--bg-surface-hover); }
.nav a[aria-current='page'] { background: var(--accent-primary-soft); color: var(--text-primary); font-weight: 600; }
.nav__new { font-size: .6875rem; color: var(--status-success-fg); font-weight: 600; }
.content { padding: var(--space-6) var(--space-6) var(--space-7); max-width: 1120px; width: 100%; }
@media (max-width: 900px) { .shell { grid-template-columns: 1fr; } .nav { display: none; } .content { padding: var(--space-5) var(--space-4) var(--space-6); } }

.back-link { color: var(--text-link); text-decoration: none; font-size: .8125rem; }
.eyebrow { font-size: .6875rem; text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--text-muted); font-weight: 600; margin-top: var(--space-3); }
.page-title { font-size: 1.5rem; font-weight: 600; letter-spacing: var(--tracking-tight); margin-top: var(--space-1); }
.page-description { color: var(--text-secondary); max-width: 64ch; margin-top: var(--space-2); }
.page-header { margin-bottom: var(--space-6); }

/* ---- wizard layout ---- */
.wizard { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
@media (max-width: 800px) { .wizard { grid-template-columns: 1fr; gap: var(--space-4); } }

.stepper { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 110px; }
.stepper__item button { width: 100%; display: grid; grid-template-columns: 28px 1fr; gap: var(--space-3); align-items: start;
  text-align: left; background: none; border: 0; padding: var(--space-2); border-radius: var(--radius-md); cursor: pointer; color: inherit; }
.stepper__item button:hover:not(:disabled) { background: var(--bg-surface-hover); }
.stepper__item button:disabled { cursor: default; }
.stepper__dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 600;
  border: 1.5px solid var(--border-strong); color: var(--text-secondary); background: var(--bg-surface); font-variant-numeric: tabular-nums; }
.stepper__title { font-size: .875rem; font-weight: 500; line-height: 1.3; padding-top: 4px; }
.stepper__meta { font-size: .75rem; color: var(--text-muted); }
.stepper__item[data-status='current'] .stepper__dot { border-color: var(--accent-primary); background: var(--accent-primary); color: var(--text-on-primary); }
.stepper__item[data-status='current'] .stepper__title { font-weight: 600; }
.stepper__item[data-status='done'] .stepper__dot { border-color: var(--status-success); background: var(--status-success-soft); color: var(--status-success-fg); }
.stepper__item[data-status='locked'] .stepper__title { color: var(--text-muted); }
@media (max-width: 800px) {
  .stepper { position: static; flex-direction: row; overflow-x: auto; gap: var(--space-1); padding-bottom: var(--space-1); }
  .stepper__item { flex: 0 0 auto; }
  .stepper__item button { grid-template-columns: 24px auto; gap: var(--space-2); }
  .stepper__dot { width: 24px; height: 24px; }
  .stepper__meta { display: none; }
  .stepper__item:not([data-status='current']) .stepper__title { display: none; }
}

.panel { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-xs); }
.panel__head { padding: var(--space-5) var(--space-5) 0; }
.panel__step { font-size: .75rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.panel__title { font-size: 1.1875rem; font-weight: 600; margin-top: 2px; }
.panel__why { color: var(--text-secondary); margin-top: var(--space-2); max-width: 62ch; }
.panel__body { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); }
.panel__foot { padding: var(--space-4) var(--space-5); border-top: 1px solid var(--border-subtle); display: flex; gap: var(--space-2);
  justify-content: space-between; align-items: center; flex-wrap: wrap; }
.panel__foot-right { display: flex; gap: var(--space-2); flex-wrap: wrap; }

/* ---- form ---- */
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
@media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; }
.field--wide { grid-column: 1 / -1; }
.field label { font-size: .8125rem; font-weight: 500; }
.field__hint { font-size: .75rem; color: var(--text-muted); }
.input, .select { font: inherit; border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 7px 10px;
  background: var(--bg-surface); color: var(--text-primary); width: 100%; }
.input:focus, .select:focus { outline: none; border-color: var(--border-focus); box-shadow: var(--shadow-focus); }

/* ---- buttons ---- */
.button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: 7px 14px; font-weight: 600; font-size: .8125rem; cursor: pointer; background: var(--accent-primary); color: var(--text-on-primary);
  text-decoration: none; }
.button:hover { background: var(--button-primary-bg-hover); }
.button:disabled { background: var(--bg-strong); color: var(--text-disabled); cursor: not-allowed; }
.button--secondary { background: var(--bg-surface); color: var(--text-primary); border-color: var(--border-default); }
.button--secondary:hover { background: var(--bg-surface-hover); }
.button--ghost { background: none; color: var(--text-secondary); }
.button--ghost:hover { background: var(--bg-surface-hover); }
.button--danger { background: var(--status-error); color: #fff; }
.button--danger:hover { background: var(--status-error-fg); }

/* ---- alerts & badges ---- */
.alert { border: 1px solid; border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: 2px; }
.alert__title { font-weight: 600; font-size: .8125rem; }
.alert__text { font-size: .8125rem; color: var(--text-secondary); }
.alert--info { background: var(--status-info-soft); border-color: var(--status-info-border); }
.alert--info .alert__title { color: var(--status-info-fg); }
.alert--warning { background: var(--status-warning-soft); border-color: var(--status-warning-border); }
.alert--warning .alert__title { color: var(--status-warning-fg); }
.alert--success { background: var(--status-success-soft); border-color: var(--status-success-border); }
.alert--success .alert__title { color: var(--status-success-fg); }
.alert--error { background: var(--status-error-soft); border-color: var(--status-error-border); }
.alert--error .alert__title { color: var(--status-error-fg); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .6875rem; font-weight: 600; padding: 1px 8px; border-radius: var(--radius-pill); border: 1px solid; white-space: nowrap; }
.badge--success { background: var(--status-success-soft); color: var(--status-success-fg); border-color: var(--status-success-border); }
.badge--muted { background: var(--status-disabled-soft); color: var(--status-disabled-fg); border-color: var(--status-disabled-border); }

<script>
/* ---------------------------------------------------------------------------
   Frontend-only wizard. Every action maps to an endpoint on main today, except
   where a dev note (toggle "Show API calls") says TARGET.
   Scope (v1): ONE warehouse, fed by one or two product masters (TWO below).
   Two warehouses are out of scope (v2, #3454).
   Decision: with the OMS on, a marketplace order stays in OpenLinker and is NOT
   created in the product master; the product master only has its stock lowered.
   OpenLinker keeps no catalogue or stock of its own: products and stock come
   only from a connection with ProductMaster + InventoryMaster enabled, so step 1
   is a gate, not a formality, and it also records where that stock sits.
   ------------------------------------------------------------------------- */
const TOTAL_STOCK = 4812;

const SOURCES = {
  prestashop: { name: 'PrestaShop', host: 'sklep-example.pl', ordersOn: true, stockWhen: 'when the order is created in PrestaShop' },
  woocommerce: { name: 'WooCommerce', host: 'sklep-example.pl', ordersOn: true, stockWhen: 'when the paid order is created in WooCommerce' },
  subiekt: { name: 'Subiekt GT', host: 'Biuro, Warszawa', ordersOn: true, stockWhen: 'when the invoice or receipt is issued in Subiekt GT (Subiekt then issues the warehouse release, WZ)' },
};

const S = {
  source: 'prestashop',   // key of SOURCES, or 'none' | 'two'
  step: 1, maxReached: 1,
  done: [false, false, false, false],
  view: 'wizard',         // 'wizard' | 'waiting' | 'first' | 'status'
  live: false,
  located: 0, syncing: false,
  warehouse: { name: 'Main warehouse', code: 'MAIN' },
  lastCreated: null,      // shows the one-time password right after creating a packer
  packers: [],            // approved packers
  ack: false,
};

const STEPS = [
  { title: 'Your product master', meta: 'Products and stock' },
  { title: 'Add packers', meta: 'Optional' },
  { title: 'See what changes', meta: 'Read before turning on' },
  { title: 'Turn it on', meta: '' },
];
const N = STEPS.length;

const $ = (q) => document.querySelector(q);
const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n) => n.toLocaleString('en-US');
const api = (t) => `<div class="api">${t}</div>`;
/* Two product masters sharing one warehouse (e.g. chemicals in A, electrics in B).
   Allowed in v1: both point their stock at the same location, the router sees
   per-variant stock, a mixed basket is one parcel from one place, and each line
   knows its owner via inventory_items.sourceConnectionId.
   Known limits, shown as a warning: the same item listed in both product masters is
   two separate OL products with two stock counts (getOrCreateInternalId is per
   connection), and nothing can detect that cheaply. */
const TWO = [
  { name: 'PrestaShop A', host: 'chemia-example.pl', items: 3120, sells: 'chemicals' },
  { name: 'PrestaShop B', host: 'elektro-example.pl', items: 1692, sells: 'electrics' },
];
const isTwo = () => S.source === 'two';
const src = () => (isTwo() ? { name: 'your product masters', host: '', ordersOn: true, stockWhen: 'when the order is created in the product master that sells the product' } : SOURCES[S.source]);
const shops = () => (isTwo() ? TWO : [{ name: SOURCES[S.source].name, host: SOURCES[S.source].host, items: TOTAL_STOCK }]);
const shopOk = () => isTwo() || Boolean(SOURCES[S.source]);
const shopNames = () => shops().map((x) => x.name).join(' and ');

/* ---------------- shell ---------------- */
function stepper() {
  return `<ol class="stepper" aria-label="Setup steps" data-testid="wizard-stepper">${STEPS.map((s, i) => {
    const n = i + 1;
    const status = S.done[i] && n !== S.step ? 'done' : n === S.step ? 'current' : n <= S.maxReached ? 'open' : 'locked';
    return `<li class="stepper__item" data-status="${status}" data-testid="wizard-stepper-step-${n}">
      <button data-testid="wizard-stepper-button-${n}" type="button" ${status === 'locked' ? 'disabled' : ''} onclick="goStep(${n})" ${n === S.step ? 'aria-current="step"' : ''}>
        <span class="stepper__dot" aria-hidden="true">${status === 'done' ? '&#10003;' : n}</span>
        <span><span class="stepper__title">${s.title}</span>${s.meta ? `<br><span class="stepper__meta">${s.meta}</span>` : ''}</span>
      </button></li>`;
  }).join('')}</ol>`;
}

function panel({ why, body, next, back = true }) {
  return `<section class="panel" aria-labelledby="panelTitle" data-testid="wizard-step-panel" data-step="${S.step}">
    <div class="panel__head">
      <p class="panel__step">Step ${S.step} of ${N}</p>
      <h2 class="panel__title" id="panelTitle" tabindex="-1">${STEPS[S.step - 1].title}</h2>
      <p class="panel__why">${why}</p>
    </div>
    <div class="panel__body">${body}</div>
    <div class="panel__foot" data-testid="wizard-step-footer">
      <span>${back && S.step > 1 ? `<button data-testid="btn-back" class="button button--ghost" type="button" onclick="goStep(${S.step - 1})">&larr; Back</button>` : ''}</span>
      <span class="panel__foot-right">${next}</span>
    </div>
  </section>`;
}

/* ---------------- step 1: your product master ---------------- */
/* One step, one decision: "this is my product master". The location is created
   silently with the fixed name "Main warehouse" (shown later only on Fulfilment
   and Inventory > Locations); the wizard never mentions or asks for it.
   Two rows under the hood, both required by the router: the product master
   (who reports how many) and an inventory location (where they physically sit).
   The location is created by the operator's Confirm click (#2407: "an offer an
   operator takes, never a seed"), then the product master's stock is pointed at
   it with stockLocationOverride (#3206). No address is asked: labels take the
   sender address from the carrier connection (InPost/DPD senderAddress), and
   country/postcode only matter for routing rules between several warehouses. */
function step1() {
  const gate = api('GET /connections &rarr; one or two connections with status=active AND enabledCapabilities &ni; ProductMaster, InventoryMaster. OrderProcessorManager is NOT required: with the OMS on, OpenLinker lowers the product master\'s stock itself (target, see step 3).');
  if (S.source === 'none') {
    return panel({
      why: 'OpenLinker has no products or stock of its own. It reads them from your product master. Connect it first.',
      body: `<div class="alert alert--error"><span class="alert__title" data-testid="alert-no-product-master">No product master connected yet</span><span class="alert__text">Connect the product master that holds your products and stock, for example PrestaShop, WooCommerce or Subiekt GT. Then come back here.</span></div>${gate}`,
      next: `<a class="button" href="#" data-testid="link-connect-product-master">Connect your product master</a>`,
    });
  }
  const s = src();
  const list = shops();
  const names = shopNames();
  const twoWarn = isTwo()
    ? `<div class="alert alert--warning"><span class="alert__title" data-testid="alert-two-product-masters">Both product masters send stock to this one place</span><span class="alert__text">Keep each product in one product master only. If the same product is in both, OpenLinker sees two different products with two separate stock counts. A sale lowers the stock only in the product master it came from, so the other one can still sell the last units.</span></div>
      ${api('Two product masters, one warehouse (v1). Prerequisites before release: #3453 lowers stock per line in the master that owns it (sourceConnectionId) with a per-master idempotency key; a refused or fail-open order stays in OpenLinker instead of fanning out to both masters (new issue); returns (#3486) and cancel (#3479) give stock back to the owning master; the override is set on EVERY master. Each marketplace still reads ONE masterCatalogConnectionId for offers, barcode linking and content (offer-builder.service.ts ~121-131, offer-mapping-sync.service.ts ~286-316): not an OMS blocker, v2 (#3454). Same item in both masters is undetectable today (/variants/search is substring).')}`
    : '';
  const setupCalls = api(`On Confirm:<br>POST /connections {platformType:"openlinker", enabledCapabilities:["FulfillmentExecutor"]}  (packing connection, no credentials; without FulfillmentExecutor the dispatch job never resolves an executor and nothing reaches the bench)<br>POST /inventory/locations/bootstrap &rarr; MAIN "Main warehouse" (idempotent; name set silently, never shown in the wizard; renamed later in Inventory &rsaquo; Locations)<br>${list.map((x, i) => `PATCH /connections/{productMaster${i + 1}Id} {config: {...fullConfig, stockLocationOverride: "{MAIN id}"}}`).join('<br>')}<br>(config is replaced whole: send the existing config back with only this key changed)`);
  if (!S.done[0]) {
    return panel({
      why: 'OpenLinker has no products or stock of its own. It reads them from your product master.',
      body: `${masterCards()}${twoWarn}${gate}${setupCalls}`,
      next: `<button data-testid="btn-confirm-product-master" class="button" type="button" onclick="confirmProductMaster()">Confirm</button>`,
    });
  }
  const pct = Math.round((S.located / TOTAL_STOCK) * 100);
  const complete = S.located >= TOTAL_STOCK;
  return panel({
    why: 'OpenLinker has no products or stock of its own. It reads them from your product master.',
    body: `${masterCards()}
      <div class="progress" aria-live="polite" data-testid="stock-located-progress">

/* ---------------- actions ---------------- */
function markDone(n) { S.done[n - 1] = true; goStep(Math.min(N, n + 1)); }
function confirmProductMaster() { S.done[0] = true; S.located = 1240; S.syncing = true; render(true); tick(); }
function addPacker() {
  const name = $('#pName').value.trim(); const login = $('#pLogin').value.trim(); const err = $('#pErr');
  if (!name || !login) { err.textContent = 'Enter a name and a login.'; err.hidden = false; return; }
  if (S.packers.some((u) => u.login === login)) { err.textContent = `The login "${login}" is already taken. Pick another one.`; err.hidden = false; return; }
  const pass = 'Pack-' + Math.random().toString(36).slice(2, 6) + '-' + Math.random().toString(36).slice(2, 6);
  S.packers.push({ id: 'u' + Date.now(), name, login, mail: $('#pMail').value.trim() });
  S.lastCreated = { name, login, pass };
  render();
}
function copyPass() {
  const btn = $('#copyBtn');
  const ok = () => { btn.textContent = 'Copied'; setTimeout(() => { if ($('#copyBtn')) $('#copyBtn').textContent = 'Copy password'; }, 1500); };
  try { navigator.clipboard.writeText($('#tmpPass').value).then(ok, () => $('#tmpPass').select()); } catch (e) { $('#tmpPass').select(); }
}
function turnOn(again) { S.done[3] = true; S.live = true; S.view = again ? 'status' : 'waiting'; render(true); }
function stopNow() { closeDialog(); S.live = false; S.view = 'status'; render(true); }
function goStep(n) { S.maxReached = Math.max(S.maxReached, n); S.step = n; S.view = 'wizard'; render(true); }

let timer = null;
function tick() {
  clearInterval(timer);
  timer = setInterval(() => {
    if (!S.syncing) return clearInterval(timer);
    S.located = Math.min(TOTAL_STOCK, S.located + 600);
    if (S.located >= TOTAL_STOCK) { S.syncing = false; clearInterval(timer); }
    if (S.view === 'wizard' && (S.step === 1 || S.step === 4)) render();
  }, 1400);
}

/* ---------------- data-state vocabulary (E2E + implementation tickets cite these) ----------------
   step-1-product-master | step-1-no-product-master | step-1-two-product-masters (two masters, not confirmed yet)
   step-1-stock-syncing | step-1-stock-complete
   step-2-packers-empty | step-2-packer-added
   step-3-what-changes
   step-4-turn-on | waiting-first-order | first-order-arrived | status-on | status-off
   dialog-stop-confirm (on the dialog element)
   body[data-source] = prestashop | woocommerce | subiekt | none | two */
function stateName() {
  if (S.view === 'waiting') return 'waiting-first-order';
  if (S.view === 'first') return 'first-order-arrived';
  if (S.view === 'status') return S.live ? 'status-on' : 'status-off';
  switch (S.step) {
    case 1:
      if (S.source === 'none') return 'step-1-no-product-master';
      if (S.done[0]) return S.located >= TOTAL_STOCK ? 'step-1-stock-complete' : 'step-1-stock-syncing';
      return isTwo() ? 'step-1-two-product-masters' : 'step-1-product-master';
    case 2: return S.packers.length ? 'step-2-packer-added' : 'step-2-packers-empty';
    case 3: return 'step-3-what-changes';
    default: return 'step-4-turn-on';
  }
}

  $('#pageDesc').textContent = inWizard
    ? 'Pick and pack orders on one screen, with a barcode scanner. Setup takes about 5 minutes. Nothing changes in how your orders are handled until the last step.'
    : 'Orders are packed at the pack bench. You can stop this at any time.';
  let html;
  if (inWizard) html = `<div class="wizard">${stepper()}<div>${[step1, step2, step3, step4][S.step - 1]()}</div></div>`;
  else if (S.view === 'waiting') html = firstOrderView(false);
  else if (S.view === 'first') html = firstOrderView(true);
  else html = statusView();
  $('#root').innerHTML = html;
  document.body.dataset.state = stateName();
  document.body.dataset.source = S.source;
  if (moveFocus && inWizard) { const t = $('#panelTitle'); if (t) t.focus({ preventScroll: true }); }
}

/* ---------------- harness ---------------- */
const ANNA = { id: 'u1', name: 'Anna Nowak', login: 'anna', mail: 'anna@sklep-example.pl' };
let currentPreset = 's1';
function setPreset(p) {
  currentPreset = p;
  Object.assign(S, { step: 1, maxReached: 1, done: Array(N).fill(false), view: 'wizard', live: false, located: 0, syncing: false, lastCreated: null, packers: [], ack: false });
  clearInterval(timer);
  if (!shopOk() && p !== 's1') { S.source = 'prestashop'; syncSourceChips(); }
  const upTo = (n) => { for (let i = 0; i < n; i++) S.done[i] = true; S.maxReached = Math.min(N, n + 1); };
  const full = () => { S.located = TOTAL_STOCK; };
  switch (p) {
    case 's1-sync': S.done[0] = true; S.maxReached = 2; S.located = 1240; S.syncing = true; tick(); break;
    case 's1-complete': S.done[0] = true; S.maxReached = 2; full(); break;
    case 's2': upTo(1); S.step = 2; full(); break;
    case 's2-added': upTo(1); S.step = 2; full(); S.packers = [{ ...ANNA }]; S.lastCreated = { name: ANNA.name, login: ANNA.login, pass: 'Pack-7k2q-m9xd' }; break;
    case 's3': upTo(2); S.step = 3; full(); break;
    case 's4': upTo(3); S.step = 4; full(); S.ack = true; S.packers = [{ ...ANNA }]; break;
    case 'waiting': upTo(4); full(); S.live = true; S.view = 'waiting'; break;
    case 'first': upTo(4); full(); S.live = true; S.view = 'first'; break;
    case 'live': upTo(4); full(); S.live = true; S.view = 'status'; S.packers = [{ ...ANNA }]; break;
    case 'off': upTo(4); full(); S.live = false; S.view = 'status'; S.packers = [{ ...ANNA }]; break;
  }
  document.querySelectorAll('[data-preset]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.preset === p)));
  render(true);
}
function syncSourceChips() { document.querySelectorAll('[data-source]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.source === S.source))); }
document.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => setPreset(b.dataset.preset)));
document.querySelectorAll('[data-source]').forEach((b) => b.addEventListener('click', () => {
  S.source = b.dataset.source; syncSourceChips();
  setPreset(shopOk() ? currentPreset : 's1');
}));
$('#apiToggle').addEventListener('click', (e) => { const on = document.body.classList.toggle('show-api'); e.currentTarget.setAttribute('aria-pressed', String(on)); });

syncSourceChips();
setPreset('s1');
