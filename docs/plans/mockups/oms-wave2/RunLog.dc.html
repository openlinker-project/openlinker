<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Run log" description="Global automation run log: filters from URL params, newest first, one line per step." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0;background:var(--bg-canvas)}a{color:var(--accent-primary);text-decoration:none}a:hover{color:var(--accent-primary-hover);text-decoration:underline}</style></helmet>
<x-import component-from-global-scope="OpenLinkerUI.MemoryRouter" hint-size="100%,100%">
<x-import component-from-global-scope="OpenLinkerUI.PageLayout" hint-size="100%,720px" eyebrow="Operations" title="Run log" back-to="{{ backTo }}">
<div style="display:grid;gap:var(--space-4);padding-top:var(--space-2);max-width:1240px">
<div style="display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap">
<span class="chip chip--active">Outcome: Failed<button type="button" aria-label="Clear outcome filter" style="all:unset;cursor:pointer;padding-left:6px;font-family:var(--font-mono);line-height:1">×</button></span>
<span class="chip chip--active">Automation: Pack and ship<button type="button" aria-label="Clear automation filter" style="all:unset;cursor:pointer;padding-left:6px;font-family:var(--font-mono);line-height:1">×</button></span>
<span class="chip">Any trigger</span>
<span class="chip">Any date</span>
<span class="chip">Any order</span>
<x-import component-from-global-scope="OpenLinkerUI.Button" hint-size="80px,26px" tone="ghost" class-name="button--xs">Clear all</x-import>
<span style="margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);font-variant-numeric:tabular-nums">6 runs</span>
</div>
<x-import component-from-global-scope="OpenLinkerUI.DataTable" hint-size="100%,480px" columns="{{ columns }}" rows="{{ rows }}" row-key="{{ rowKey }}" sort="{{ sort }}" caption="Automation runs, newest first"></x-import>
<p style="margin:0;font-size:12px;line-height:1.55;color:var(--text-muted)">Runs older than 90 days are removed.</p>
</div>
</x-import>
</x-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:720}}">
const T = (n) => Date.parse('2026-08-22T12:00:00Z') - n * 60000;

const RUNS = [
  { id: 'r1', when: '12 minutes ago', ts: T(12), rule: 'Pack and ship', ruleHref: '/automations/pack-and-ship', trigger: 'An order is marked packed', order: 'OL-4471', steps: [{ k: 'ok', t: 'Bought the shipping label' }, { k: 'ok', t: 'Told Allegro the order shipped' }], outcome: 'Done', tone: 'success' },
  { id: 'r2', when: '41 minutes ago', ts: T(41), rule: 'Pack and ship', ruleHref: '/automations/pack-and-ship', trigger: 'An order is marked packed', order: 'OL-4468', steps: [{ k: 'fail', t: "Couldn't buy the shipping label" }, { k: 'skip', t: 'Tell the marketplace' }], outcome: 'Failed', tone: 'error' },
  { id: 'r3', when: '2 hours ago', ts: T(120), rule: 'Deadline nudge', ruleHref: '/automations/deadline-nudge', trigger: 'A marketplace dispatch deadline is close', order: 'OL-4462', steps: [{ k: 'ok', t: 'Sent an email' }], outcome: 'Done', tone: 'success' },
  { id: 'r4', when: '3 hours ago', ts: T(180), rule: 'Pack and ship', ruleHref: '/automations/pack-and-ship', trigger: 'An order is marked packed', order: 'OL-4455', steps: [{ k: 'note', t: 'Label already bought' }], outcome: 'Nothing to do', tone: 'neutral' },
  { id: 'r5', when: '5 hours ago', ts: T(300), rule: 'Invoice on pack', ruleHref: '/automations/invoice-on-pack', trigger: 'An order is marked packed', order: 'OL-4450', steps: [{ k: 'note', t: 'Nothing ran — two rules both wanted to issue a document' }], outcome: 'Blocked', tone: 'warning' },
  { id: 'r6', when: 'Yesterday 16:20', ts: T(1180), rule: 'Pack and ship', ruleHref: '/automations/pack-and-ship', trigger: 'An order is marked packed', order: 'OL-4431', steps: [{ k: 'ok', t: 'Bought the shipping label' }, { k: 'ok', t: 'Told Allegro the order shipped' }], outcome: 'Done', tone: 'success' },
];

const STEP = {
  ok: { glyph: '✓', color: 'var(--status-success-strong)', text: 'var(--text-primary)', opacity: 1 },
  fail: { glyph: '✕', color: 'var(--status-error-fg)', text: 'var(--status-error-fg)', opacity: 1 },
  skip: { glyph: '·', color: 'var(--text-muted)', text: 'var(--text-muted)', opacity: 0.7 },
  note: { glyph: '', color: 'var(--text-muted)', text: 'var(--text-secondary)', opacity: 1 },
};

class Component extends DCLogic {
  state = { ds: false };

  componentDidMount() {
    const tick = () => {
      if (window.OpenLinkerUI && window.OpenLinkerUI.StatusBadge) { this.setState({ ds: true }); return; }
      this._t = setTimeout(tick, 60);
    };
    tick();
  }

  componentWillUnmount() { clearTimeout(this._t); }

  step(s, i) {
    const cfg = STEP[s.k];
    return React.createElement('div', {
      key: i,
      style: { display: 'grid', gridTemplateColumns: '14px minmax(0,1fr)', gap: 8, alignItems: 'baseline', opacity: cfg.opacity },
    },
      React.createElement('span', { style: { fontFamily: 'var(--font-mono)', fontSize: 12, color: cfg.color, lineHeight: 1.5 } }, cfg.glyph),
      React.createElement('span', { style: { fontSize: 12.5, lineHeight: 1.5, color: cfg.text, textWrap: 'pretty' } },
        s.t,
        s.k === 'skip' ? React.createElement('span', { style: { marginLeft: 8, padding: '1px 5px', borderRadius: 'var(--radius-xs)', background: 'var(--bg-surface-muted)', border: '1px solid var(--border-subtle)', fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.04em', textTransform: 'uppercase', color: 'var(--text-muted)' } }, 'skipped') : null,
      ),
    );
  }

  badge(row) {
    const UI = this.state.ds ? window.OpenLinkerUI : null;
    if (!UI) return React.createElement('span', { style: { fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--text-secondary)' } }, row.outcome);
    return React.createElement(UI.StatusBadge, { tone: row.tone, withDot: true }, row.outcome);
  }

  renderVals() {
    const columns = [
      {
        id: 'when', header: 'When', sortable: true, accessor: (r) => r.ts,
        cell: (r) => React.createElement('div', {
          style: {
            minWidth: 132, paddingLeft: 10,
            borderLeft: r.tone === 'error' ? '2px solid var(--status-error)' : '2px solid transparent',
            fontFamily: 'var(--font-mono)', fontSize: 12.5, fontVariantNumeric: 'tabular-nums',
            letterSpacing: '-0.01em', color: 'var(--text-primary)', fontWeight: r.tone === 'error' ? 600 : 400,
          },
        }, r.when),
      },
      {
        id: 'rule', header: 'Automation', accessor: (r) => r.rule,
        cell: (r) => React.createElement('a', { href: r.ruleHref, style: { display: 'inline-block', minWidth: 118, fontSize: 13, fontWeight: 500, whiteSpace: 'nowrap' } }, r.rule),
      },
      {
        id: 'trigger', header: 'Trigger',
        cell: (r) => React.createElement('div', { style: { minWidth: 200, maxWidth: 250, fontSize: 12.5, lineHeight: 1.45, color: 'var(--text-secondary)', textWrap: 'pretty' } }, r.trigger),
      },
      {
        id: 'order', header: 'Order',
        cell: (r) => React.createElement('a', { href: '/orders/' + r.order, style: { display: 'inline-block', minWidth: 78, fontFamily: 'var(--font-mono)', fontSize: 12.5, letterSpacing: '-0.01em', whiteSpace: 'nowrap' } }, r.order),
      },
      {
        id: 'did', header: 'What it did',
        cell: (r) => React.createElement('div', { style: { display: 'grid', gap: 4, minWidth: 280, maxWidth: 400 } }, r.steps.map((s, i) => this.step(s, i))),
      },
      { id: 'outcome', header: 'Outcome', cell: (r) => React.createElement('div', { style: { minWidth: 132 } }, this.badge(r)) },
    ];
    return {
      columns, rows: RUNS, rowKey: (r) => r.id,
      sort: [{ id: 'when', desc: true }],
      backTo: { to: '/automations', label: 'Automations' },
    };
  }
}

</script>
</body>
</html>
