<title>Zapisane widoki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: the real OpenLinker shell, with the orders screen reduced to ONE strip (views), ONE search, TWO buttons (Filters, Display). Accent colour is reserved for the active tab and for "Save changes". */
:root{
  --font-sans:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --bg-canvas:oklch(99% .003 80); --bg-shell:oklch(97.5% .004 80); --bg-surface:#fff; --bg-surface-elevated:oklch(99% .003 80);
  --bg-surface-muted:oklch(96% .005 80); --bg-surface-hover:oklch(93% .006 80);
  --border-subtle:oklch(93.5% .006 80); --border-default:oklch(88% .008 80); --border-strong:oklch(78% .010 80);
  --text-primary:oklch(20% .012 80); --text-secondary:oklch(38% .010 80); --text-muted:oklch(52% .008 80); --text-disabled:oklch(70% .005 80);
  --text-on-primary:oklch(18% .012 50); --text-inverse:oklch(96% .005 80);
  --accent-primary:oklch(68% .18 50); --accent-primary-hover:oklch(62% .19 50); --accent-primary-soft:oklch(96% .04 60);
  --accent-primary-soft-strong:oklch(40% .16 50); --accent-primary-border:oklch(85% .10 55); --accent-ring:oklch(68% .18 50 / .30);
  --status-success:oklch(54% .14 150); --status-success-soft:oklch(96% .04 150); --status-success-border:oklch(85% .08 150); --status-success-fg:oklch(36% .12 150);
  --status-warning:oklch(72% .16 85); --status-warning-soft:oklch(96% .05 85); --status-warning-border:oklch(85% .10 85); --status-warning-fg:oklch(42% .12 80);
  --status-error:oklch(58% .20 25); --status-error-soft:oklch(96% .04 25); --status-error-border:oklch(85% .10 25); --status-error-fg:oklch(42% .16 25);
  --status-info:oklch(56% .14 245); --status-info-soft:oklch(96% .03 245); --status-info-border:oklch(85% .08 245); --status-info-fg:oklch(40% .12 245);
  --status-review:oklch(58% .16 290);
  --status-disabled-soft:oklch(95% .005 80); --status-disabled-border:oklch(85% .008 80); --status-disabled-fg:oklch(38% .010 80);
  --channel-allegro:oklch(70% .18 35); --channel-prestashop:oklch(60% .18 250); --channel-woocommerce:oklch(64% .16 150); --channel-shopify:oklch(64% .16 150);
  --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem; --space-5:1.5rem; --space-6:2rem; --space-7:3rem;
  --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:10px; --radius-xl:14px; --radius-pill:9999px;
  --shadow-xs:0 1px 2px rgb(15 18 26/.04);
  --shadow-md:0 2px 4px rgb(15 18 26/.04),0 6px 16px rgb(15 18 26/.08);
  --shadow-overlay:0 24px 48px rgb(15 18 26/.16),0 8px 16px rgb(15 18 26/.08);
  --shadow-focus:0 0 0 3px var(--accent-ring); --shadow-inset-top:inset 0 1px 0 rgb(255 255 255/.6);
  --overlay-scrim:rgb(15 18 26/.55); --button-hover:oklch(62% .19 50);
  --tracking-caps:.08em; --tracking-wide:.02em; --tracking-tight:-.012em; --shell-topbar-height:52px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-canvas:oklch(14% .005 270); --bg-shell:oklch(16% .006 270); --bg-surface:oklch(19% .007 270); --bg-surface-elevated:oklch(22% .008 270);
  --bg-surface-muted:oklch(24% .009 270); --bg-surface-hover:oklch(28% .010 270);
  --border-subtle:oklch(24% .010 270); --border-default:oklch(30% .012 270); --border-strong:oklch(42% .014 270);
  --text-primary:oklch(96% .006 270); --text-secondary:oklch(78% .010 270); --text-muted:oklch(60% .012 270); --text-disabled:oklch(42% .012 270);
  --text-on-primary:oklch(16% .012 50); --text-inverse:oklch(20% .012 80);
  --accent-primary:oklch(72% .18 50); --accent-primary-hover:oklch(78% .18 50); --accent-primary-soft:oklch(28% .08 50);
  --accent-primary-soft-strong:oklch(86% .14 60); --accent-primary-border:oklch(40% .14 55); --accent-ring:oklch(72% .18 50 / .40);
  --status-success:oklch(68% .16 150); --status-success-soft:oklch(26% .06 150); --status-success-border:oklch(36% .10 150); --status-success-fg:oklch(86% .14 150);
  --status-warning:oklch(78% .16 85); --status-warning-soft:oklch(28% .07 85); --status-warning-border:oklch(38% .10 85); --status-warning-fg:oklch(88% .14 85);
  --status-error:oklch(70% .18 25); --status-error-soft:oklch(28% .10 25); --status-error-border:oklch(40% .14 25); --status-error-fg:oklch(86% .14 25);
  --status-info:oklch(72% .14 245); --status-info-soft:oklch(26% .06 245); --status-info-border:oklch(36% .10 245); --status-info-fg:oklch(86% .12 245);
  --status-review:oklch(74% .14 290);
  --status-disabled-soft:oklch(24% .010 270); --status-disabled-border:oklch(34% .012 270); --status-disabled-fg:oklch(82% .010 270);
  --shadow-md:0 2px 4px rgb(0 0 0/.40),0 6px 16px rgb(0 0 0/.36); --shadow-overlay:0 24px 48px rgb(0 0 0/.60),0 8px 16px rgb(0 0 0/.40);
  --shadow-inset-top:inset 0 1px 0 rgb(255 255 255/.04); --overlay-scrim:rgb(0 0 0/.72); --button-hover:oklch(78% .18 50); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg-canvas:oklch(14% .005 270); --bg-shell:oklch(16% .006 270); --bg-surface:oklch(19% .007 270); --bg-surface-elevated:oklch(22% .008 270);
  --bg-surface-muted:oklch(24% .009 270); --bg-surface-hover:oklch(28% .010 270);
  --border-subtle:oklch(24% .010 270); --border-default:oklch(30% .012 270); --border-strong:oklch(42% .014 270);
  --text-primary:oklch(96% .006 270); --text-secondary:oklch(78% .010 270); --text-muted:oklch(60% .012 270); --text-disabled:oklch(42% .012 270);
  --text-on-primary:oklch(16% .012 50); --text-inverse:oklch(20% .012 80);
  --accent-primary:oklch(72% .18 50); --accent-primary-hover:oklch(78% .18 50); --accent-primary-soft:oklch(28% .08 50);
  --accent-primary-soft-strong:oklch(86% .14 60); --accent-primary-border:oklch(40% .14 55); --accent-ring:oklch(72% .18 50 / .40);
  --status-success:oklch(68% .16 150); --status-success-soft:oklch(26% .06 150); --status-success-border:oklch(36% .10 150); --status-success-fg:oklch(86% .14 150);
  --status-warning:oklch(78% .16 85); --status-warning-soft:oklch(28% .07 85); --status-warning-border:oklch(38% .10 85); --status-warning-fg:oklch(88% .14 85);
  --status-error:oklch(70% .18 25); --status-error-soft:oklch(28% .10 25); --status-error-border:oklch(40% .14 25); --status-error-fg:oklch(86% .14 25);
  --status-info:oklch(72% .14 245); --status-info-soft:oklch(26% .06 245); --status-info-border:oklch(36% .10 245); --status-info-fg:oklch(86% .12 245);
  --status-review:oklch(74% .14 290);
  --status-disabled-soft:oklch(24% .010 270); --status-disabled-border:oklch(34% .012 270); --status-disabled-fg:oklch(82% .010 270);
  --shadow-md:0 2px 4px rgb(0 0 0/.40),0 6px 16px rgb(0 0 0/.36); --shadow-overlay:0 24px 48px rgb(0 0 0/.60),0 8px 16px rgb(0 0 0/.40);
  --shadow-inset-top:inset 0 1px 0 rgb(255 255 255/.04); --overlay-scrim:rgb(0 0 0/.72); --button-hover:oklch(78% .18 50); color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-canvas);color:var(--text-primary);font-family:var(--font-sans);font-size:16px;line-height:1.5;font-feature-settings:'cv11','ss01';-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
.mono{font-family:var(--font-mono);letter-spacing:-.01em}.tabular{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* deck chrome */
.deck{max-width:1480px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.deckbar{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:.8125rem;color:var(--text-secondary)}
.deckbar b{color:var(--text-primary);font-weight:600}
.deck-controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.ctl-label{font:500 .625rem var(--font-mono);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-muted);margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--border-default);border-radius:var(--radius-md);overflow:hidden;background:var(--bg-surface)}
.seg button{background:transparent;color:var(--text-secondary);border:0;border-right:1px solid var(--border-subtle);height:1.625rem;padding:0 .625rem;font-size:.75rem;font-weight:500;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-checked=true]{background:var(--bg-surface-muted);color:var(--text-primary);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent-primary)}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--border-subtle);margin-bottom:14px}
.dtab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:var(--space-2) var(--space-3);font-size:.8125rem;font-weight:500;color:var(--text-secondary);cursor:pointer}
.dtab[aria-pressed=true]{color:var(--text-primary);font-weight:600;border-bottom-color:var(--accent-primary)}

/* shell (real) */
.frame{position:relative;border:1px solid var(--border-default);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);background:var(--bg-canvas)}
.shell{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:'main';min-height:760px}
.shell-sidebar{display:none}
@media (min-width:1024px){
  .shell{grid-template-columns:240px minmax(0,1fr);grid-template-areas:'sidebar main'}
  .shell-sidebar{grid-area:sidebar;display:flex;flex-direction:column;background:var(--bg-shell);border-right:1px solid var(--border-subtle);padding:12px 0;border-radius:var(--radius-xl) 0 0 var(--radius-xl)}
}
.shell-brand{display:flex;align-items:center;gap:8px;padding:4px 16px 16px}
.shell-brand__name{font-weight:600;font-size:14px;letter-spacing:-.02em}
.context-chip{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;padding:5px 14px;border:1px solid var(--status-info-border);border-radius:14px;background:var(--status-info-soft);color:var(--status-info-fg);margin-left:auto}
.context-chip b{font-size:13px;font-weight:600}.context-chip span{font:500 10px var(--font-mono)}
.shell-nav{flex:1;padding:0 12px}
.shell-nav__group{margin-bottom:16px}
.shell-nav__label{margin:0 0 4px;padding:0 8px;font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--text-muted)}
.shell-nav__list{list-style:none;padding:0;margin:0;display:grid;gap:1px}
.shell-nav__link{display:flex;align-items:center;padding:6px 8px;border-radius:6px;color:var(--text-secondary);font-size:13px;font-weight:500;text-decoration:none}
.shell-nav__link--active{background:var(--bg-surface-muted);color:var(--text-primary);font-weight:600;box-shadow:inset 2px 0 0 var(--accent-primary)}
.shell-nav__link-label{flex:1;min-width:0}
.shell-nav__link-count{font:500 11px var(--font-mono);color:var(--text-muted);padding-left:.5rem}
.shell-workspace{padding:12px 16px 0;border-top:1px solid var(--border-subtle);margin-top:8px;display:grid;gap:10px}
.shell-workspace__name{font-size:12.5px;font-weight:600}
.shell-workspace__user{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-muted)}
.shell-main{grid-area:main;min-width:0;display:flex;flex-direction:column}
.shell-topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;height:var(--shell-topbar-height);padding:0 16px;background:var(--bg-shell);border-bottom:1px solid var(--border-subtle);border-radius:0 var(--radius-xl) 0 0}
.shell-hamburger{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border-default);border-radius:6px;background:var(--bg-surface);color:var(--text-primary);flex:none}
@media (min-width:1024px){.shell-hamburger{display:none}}
.shell-crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);white-space:nowrap}
.shell-crumbs .cur{color:var(--text-primary);font-weight:500}.shell-crumbs .sep{color:var(--border-strong)}
.shell-search{display:none;align-items:center;gap:8px;height:32px;min-width:240px;max-width:420px;flex:1;padding:0 10px 0 32px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--bg-surface);color:var(--text-muted);font-size:13px;position:relative}
@media (min-width:1024px){.shell-search{display:inline-flex}}
.shell-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%)}
.shell-search span.ph{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font:500 10.5px var(--font-mono);padding:1px 6px;border:1px solid var(--border-default);border-bottom-width:2px;border-radius:var(--radius-xs);color:var(--text-muted);background:var(--bg-surface-muted);line-height:1.2}
.spacer{flex:1}
.shell-alerts{padding:6px 10px;font-size:12.5px;font-weight:500;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--bg-surface);color:var(--text-secondary)}
.shell-user{display:inline-flex;align-items:center;gap:8px;height:32px;padding:3px 10px 3px 3px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:500}
.shell-user i{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent-primary),var(--status-review));color:var(--text-inverse);display:inline-flex;align-items:center;justify-content:center;font:600 10.5px var(--font-sans);font-style:normal}
@media (max-width:767px){.shell-user b{display:none}}
.shell-content{flex:1;padding:20px 16px 32px}
@media (min-width:768px){.shell-content{padding:20px 24px 40px}}
@media (min-width:1024px){.shell-content{padding:20px 32px 48px}}

/* page */
.page-section{display:grid;gap:.75rem;grid-template-columns:minmax(0,1fr)}
.page-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.page-title{margin:0;font-size:1.5rem;font-weight:700;line-height:1.25;letter-spacing:var(--tracking-tight)}
.page-actions{display:flex;gap:6px;align-items:center}
.fresh{font-size:.75rem;color:var(--text-muted);margin-right:4px}
.button{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);border:1px solid var(--accent-primary-border);border-radius:var(--radius-md);padding:0 var(--space-4);height:2rem;background:var(--accent-primary);color:var(--text-on-primary);font-size:.8125rem;font-weight:500;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-xs),var(--shadow-inset-top)}
.button:hover{background:var(--button-hover)}
.button--secondary{border-color:var(--border-default);background:var(--bg-surface);color:var(--text-primary);box-shadow:var(--shadow-xs)}
.button--secondary:hover,.button--secondary[aria-expanded=true]{background:var(--bg-surface-muted);border-color:var(--border-strong)}
.button--ghost{border-color:transparent;background:transparent;color:var(--text-secondary);box-shadow:none}
.button--ghost:hover,.button--ghost[aria-expanded=true]{background:var(--bg-surface-muted);color:var(--text-primary)}
.button--danger{border-color:color-mix(in oklab,var(--status-error) 80%,black);background:var(--status-error);color:#fff}
.button--danger:hover{background:var(--status-error)}
.button--sm{height:1.75rem;padding:0 var(--space-3);font-size:.75rem}
.button--icon{width:1.75rem;padding:0}
.button:disabled{opacity:.55;cursor:not-allowed}
.button__shortcut{display:inline-flex;align-items:center;justify-content:center;min-width:1.125rem;padding:1px 5px;font:500 .625rem var(--font-mono);border-radius:var(--radius-xs);background:var(--bg-surface-muted);color:var(--text-muted)}

/* views strip (the ONE navigation device) */
.vstrip{display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--border-subtle)}
.vtabs{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.vtabs::-webkit-scrollbar{display:none}
@media (max-width:767px){.vtabs{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}}
.vtab{display:inline-flex;align-items:center;gap:7px;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:11px 10px;font-size:.8125rem;font-weight:500;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.vtab:hover{border-bottom-color:var(--border-default)}
.vtab[aria-current=true]{color:var(--text-primary);font-weight:600;border-bottom-color:var(--accent-primary)}
.vtab .n{font:500 .6875rem var(--font-mono);color:var(--text-muted)}
.vtab .n.err{color:var(--status-error-fg)}
.vtab .pill{font:500 .6875rem var(--font-mono);padding:0 7px;border-radius:var(--radius-pill);border:1px solid}
.pill--error{background:var(--status-error-soft);color:var(--status-error-fg);border-color:var(--status-error-border)}
.pill--warning{background:var(--status-warning-soft);color:var(--status-warning-fg);border-color:var(--status-warning-border)}
.vtab .who{color:var(--text-muted);display:inline-flex}
.vsep{width:1px;align-self:center;height:16px;background:var(--border-default);margin:0 6px;flex:none}
.edited-dot{width:6px;height:6px;border-radius:50%;background:var(--status-warning);flex:none}
@media (pointer:coarse){.vtab{min-height:44px}}

/* toolbar: search + Filters + Display, nothing else */
.tb{display:flex;gap:8px;align-items:center;margin-top:8px}
.sbox{position:relative;flex:1 1 auto;max-width:440px;min-width:0}
.sbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
.sbox kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.control{width:100%;height:2rem;border:1px solid var(--border-default);border-radius:var(--radius-md);padding:0 var(--space-3);background:var(--bg-surface);color:var(--text-primary);font-size:.8125rem;box-shadow:var(--shadow-xs);min-width:0}
.control.with-icon{padding-left:32px;padding-right:32px}
.control:focus{outline:none;box-shadow:var(--shadow-focus);border-color:var(--accent-primary)}
.control[aria-invalid=true]{border-color:var(--status-error)}
select.control{appearance:none;padding-right:2rem;background-image:linear-gradient(45deg,transparent 50%,var(--text-secondary) 50%),linear-gradient(135deg,var(--text-secondary) 50%,transparent 50%);background-position:calc(100% - 14px) calc(50% - 2px),calc(100% - 8px) calc(50% - 2px);background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.badge-n{font:600 .6875rem var(--font-mono);min-width:1.125rem;height:1.125rem;padding:0 5px;border-radius:var(--radius-pill);background:var(--accent-primary-soft);color:var(--accent-primary-soft-strong);display:inline-flex;align-items:center;justify-content:center}
.applied{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;min-height:30px;margin-top:2px}
.fchip{display:inline-flex;align-items:center;gap:4px;height:1.5rem;padding:0 4px 0 9px;border:1px solid var(--border-default);border-radius:var(--radius-pill);background:var(--bg-surface);color:var(--text-primary);font-size:.75rem;font-weight:500}
.fchip .k{color:var(--text-muted);font-weight:400}
.fchip button{border:0;background:none;color:var(--text-muted);width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.fchip button:hover{background:var(--bg-surface-hover);color:var(--text-primary)}
.edited{display:inline-flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin-left:auto;font-size:.8125rem;color:var(--text-secondary)}
.edited .tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--text-primary)}
.linkbtn{background:none;border:0;padding:0;font-size:.75rem;color:var(--text-secondary);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--text-primary)}
.repair{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--status-error-border);background:var(--status-error-soft);color:var(--status-error-fg);border-radius:var(--radius-md);font-size:.8125rem}
.repair ul{margin:4px 0 0;padding-left:18px}.repair .body{flex:1 1 220px;min-width:0}.repair .act{display:flex;gap:6px;flex-wrap:wrap}

/* menus */
.rel{position:relative;display:inline-flex}
.menu{position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:220px;max-width:min(380px,calc(100vw - 32px));max-height:min(480px,72vh);overflow:auto;padding:var(--space-1);background:var(--bg-surface-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);text-align:left}
.menu--right{left:auto;right:0}
.menu__label{padding:6px var(--space-3);font:500 .6875rem var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
.menu__sep{height:1px;background:var(--border-subtle);margin:var(--space-1) calc(var(--space-1)*-1)}
.menu__item{display:flex;align-items:center;gap:8px;width:100%;padding:6px var(--space-3);border:0;background:none;border-radius:var(--radius-sm);font-size:.8125rem;color:var(--text-primary);cursor:pointer;text-align:left;min-height:32px}
.menu__item:hover,.menu__item:focus-visible{background:var(--bg-surface-muted)}
.menu__item[aria-current=true]{background:var(--bg-surface-muted);font-weight:600;box-shadow:inset 2px 0 0 var(--accent-primary)}
.menu__item.danger{color:var(--status-error-fg)}
.menu__item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu__note{padding:6px var(--space-3) 4px;font-size:.75rem;color:var(--text-muted)}
.vrow{display:flex;align-items:stretch;position:relative}
.vrow>.menu__item{flex:1;min-width:0}
.vrow .more{border:0;background:none;color:var(--text-muted);width:32px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.vrow .more:hover,.vrow .more[aria-expanded=true]{background:var(--bg-surface-hover);color:var(--text-primary)}
.vrow .sub{position:absolute;right:4px;top:calc(100% - 4px);z-index:5;min-width:190px;padding:var(--space-1);background:var(--bg-surface-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)}
.hint{font:500 .6875rem var(--font-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-pill);padding:0 6px}
.icon-btn{border:0;background:none;color:var(--text-muted);width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn:hover:not(:disabled){background:var(--bg-surface-hover);color:var(--text-primary)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
@media (pointer:coarse){.menu__item,.vrow .more{min-height:44px}.icon-btn{width:44px;height:44px}.button--sm{min-height:44px}.fchip button{width:32px;height:32px}}

/* Display popover */
.dpop{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:300px;max-width:calc(100vw - 32px);max-height:min(560px,76vh);overflow:auto;background:var(--bg-surface-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);text-align:left;padding:var(--space-1)}
.dsec{padding:6px 8px 8px}
.dsec h4{margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;font:500 .6875rem var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
.colrow{display:flex;align-items:center;gap:4px;padding:1px 2px 1px 4px;border-radius:var(--radius-sm);min-height:30px}
.colrow:hover{background:var(--bg-surface-muted)}
.colrow label{flex:1;min-width:0;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.8125rem}
.colrow input{accent-color:var(--accent-primary);width:.875rem;height:.875rem;flex:none}
.fld{display:flex;flex-direction:column;min-width:0;line-height:1.3}.fld b{font-weight:500}.fld span{font-size:.75rem;color:var(--text-muted)}
.colrow--locked{color:var(--text-secondary)}
.segsm{display:inline-flex;border:1px solid var(--border-default);border-radius:var(--radius-md);overflow:hidden}
.segsm button{background:var(--bg-surface);border:0;border-right:1px solid var(--border-default);padding:5px 12px;font-size:.8125rem;cursor:pointer;color:var(--text-secondary)}
.segsm button:last-child{border-right:0}.segsm button[aria-checked=true]{background:var(--bg-surface-muted);color:var(--text-primary);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent-primary)}
.segsm button:disabled{opacity:.5;cursor:not-allowed}

/* table: exceptions get colour, normal states are quiet text */
.data-table__container{overflow-x:auto;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-surface);box-shadow:var(--shadow-xs);margin-top:4px}
.data-table{width:auto;min-width:100%;border-collapse:collapse;font-size:.8125rem}
.data-table th,.data-table td{padding:var(--space-3) var(--space-4);border-top:1px solid var(--border-subtle);text-align:left;vertical-align:top;line-height:1.4}
.compact .data-table th,.compact .data-table td{padding:var(--space-2) var(--space-3)}
.data-table thead th{border-top:0;border-bottom:1px solid var(--border-subtle);color:var(--text-muted);font:500 .6875rem var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;background:var(--bg-shell);vertical-align:middle}
.data-table th button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.data-table th button:hover{color:var(--text-secondary)}
.data-table th[aria-sort] button{color:var(--text-primary)}
.data-table tbody tr:hover td{background:color-mix(in oklab,var(--bg-shell) 60%,transparent)}
.data-table td.end,.data-table th.end{text-align:right}
.data-table td.end{white-space:nowrap}
.data-table td .l1,.data-table td .l2{white-space:nowrap}
.data-table td .itemline{display:inline-flex;gap:6px;align-items:center;max-width:210px;white-space:nowrap}
.data-table td .itemline .nm{overflow:hidden;text-overflow:ellipsis}
.data-table td.nw{white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.data-table th button .gl{opacity:0}
.data-table th:hover button .gl,.data-table th[aria-sort] button .gl,.data-table th button:focus-visible .gl{opacity:.6}
input[type=checkbox]{width:.875rem;height:.875rem;margin:0;accent-color:var(--accent-primary);cursor:pointer;vertical-align:middle}
.l1{display:block;color:var(--text-primary)}.l2{display:block;font-size:.75rem;color:var(--text-muted)}
.l2.err{color:var(--status-error-fg);font-weight:500}.l2.warn{color:var(--status-warning-fg);font-weight:500}
.idrow{display:flex;align-items:center;gap:8px}.idrow b{font-weight:600}
.hov{opacity:0}
tr:hover .hov,tr:focus-within .hov,.hov:focus-visible{opacity:1}
@media (hover:none){.hov{opacity:1}}
.copy{font-size:.75rem;color:var(--text-muted);background:none;border:0;padding:0;cursor:pointer}
.retry{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border:1px solid var(--status-error-border);border-radius:var(--radius-sm);background:var(--status-error-soft);color:var(--status-error-fg);font:600 .6875rem var(--font-mono);letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
.status-badge{display:inline-flex;align-items:center;gap:var(--space-2);padding:2px var(--space-2);border:1px solid var(--status-disabled-border);border-radius:var(--radius-sm);background:var(--status-disabled-soft);color:var(--status-disabled-fg);font:500 .625rem/1.5 var(--font-mono);letter-spacing:var(--tracking-wide);text-transform:uppercase;white-space:nowrap}
.status-badge__dot{width:.375rem;height:.375rem;border-radius:999px;background:currentColor;opacity:.75}
.status-badge--warning{border-color:var(--status-warning-border);background:var(--status-warning-soft);color:var(--status-warning-fg)}
.status-badge--error{border-color:var(--status-error-border);background:var(--status-error-soft);color:var(--status-error-fg)}
.cdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--channel,var(--text-muted));margin-right:6px;vertical-align:middle}
.thumb{width:28px;height:28px;flex:none;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--bg-surface-muted);display:inline-flex;align-items:center;justify-content:center;font:500 .6875rem var(--font-mono);color:var(--text-muted)}
.rowgo{width:28px;height:28px;border:1px solid var(--border-subtle);border-radius:50%;background:var(--bg-surface);color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:.25rem;height:1.125rem;padding:0 .5rem;border:1px solid var(--border-subtle);border-radius:var(--radius-pill);background:var(--bg-surface-muted);color:var(--text-secondary);font-size:.6875rem;font-weight:500}
.sortstack{display:inline-flex;flex-direction:column;gap:4px;align-items:flex-start}.sortstack.end{align-items:flex-end}
.sortbtn2{display:inline-flex;align-items:center;gap:3px;border:0;background:none;padding:1px 5px;margin:0 -5px;cursor:pointer;font:600 .6875rem var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);border-radius:4px}
.sortbtn2:hover{color:var(--text-secondary)}.sortbtn2.static{cursor:default}.sortbtn2.static:hover{color:var(--text-muted)}
.sortbtn2.act{color:var(--accent-primary-soft-strong);background:var(--accent-primary-soft)}
.needs{display:flex;gap:8px;align-items:center;margin-left:auto;font-size:.8125rem;color:var(--text-muted);white-space:nowrap}
.nbtn{background:none;border:0;padding:0;font:inherit;cursor:pointer;color:inherit}.nbtn b{font-family:var(--font-mono);font-weight:600}.nbtn .n{border-bottom:1px dotted currentColor;font-weight:500}
.nbtn.e{color:var(--status-error-fg)}.nbtn.t{color:var(--text-primary)}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8125rem;color:var(--text-muted);margin-top:8px}
.qs code{font:400 .75rem var(--font-mono);background:var(--bg-surface-muted);border:1px solid var(--border-subtle);border-radius:6px;padding:2px 8px;overflow-wrap:anywhere;color:var(--text-secondary)}
.empty{padding:36px 16px;text-align:center;color:var(--text-secondary);display:flex;flex-direction:column;gap:10px;align-items:center}
.cards{display:grid;gap:10px;margin-top:4px}
.card{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-surface);padding:12px 14px;display:grid;gap:6px}
.card__top{display:flex;align-items:center;gap:10px}
.card__line{display:flex;justify-content:space-between;gap:10px;font-size:.8125rem}

/* filters panel */
.panel-scrim{position:fixed;inset:0;background:var(--overlay-scrim);z-index:40}
.panel{position:fixed;top:8px;right:8px;bottom:8px;width:min(420px,calc(100% - 16px));z-index:41;background:var(--bg-surface-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);box-shadow:var(--shadow-overlay);display:flex;flex-direction:column}
.panel__head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border-subtle);font-weight:600}
.panel__body{flex:1;overflow:auto}.panel__sec{border-bottom:1px solid var(--border-subtle);padding:12px 16px}
.panel__foot{display:flex;justify-content:space-between;gap:8px;padding:12px 16px;border-top:1px solid var(--border-subtle)}
.field{display:flex;flex-direction:column;gap:4px}
.field__label{font:600 .6875rem var(--font-sans);text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.field__error{color:var(--status-error-fg);font-size:.75rem}.field__hint{color:var(--text-muted);font-size:.75rem}
.checkrow{display:flex;gap:8px;align-items:center;font-size:.8125rem}

/* dialog + toast */
.scrim{position:fixed;inset:0;background:var(--overlay-scrim);backdrop-filter:blur(12px);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{width:min(100%,30rem);max-height:90vh;overflow:auto;display:grid;gap:1rem;border:1px solid var(--border-default);border-radius:.75rem;padding:1.25rem;background:var(--bg-surface);box-shadow:var(--shadow-overlay)}
.dialog h3{margin:0;font-size:1.0625rem;font-weight:600}.dialog p{margin:0;color:var(--text-secondary);font-size:.8125rem}
.dialog__actions{display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap}
.summary{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1px dashed var(--border-default);border-radius:var(--radius-md);background:var(--bg-shell)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;gap:12px;align-items:center;border:1px solid var(--border-subtle);border-left:3px solid var(--status-success);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);background:var(--bg-surface-elevated);box-shadow:var(--shadow-md);max-width:min(24rem,calc(100vw - 32px));font-size:.8125rem}

/* decisions */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.dcard{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-xs);min-width:0}
.dcard h3{margin:0 0 8px;font-size:1.0625rem;font-weight:600}
.dcard h4{margin:14px 0 6px;font:500 .6875rem var(--font-mono);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-muted)}
.dcard p{margin:0 0 8px;color:var(--text-secondary);font-size:.8125rem}
.dcard ul{margin:0;padding-left:18px;color:var(--text-secondary);font-size:.8125rem}.dcard li{margin:3px 0}
pre.code{margin:0;padding:12px;background:var(--bg-shell);border:1px solid var(--border-subtle);border-radius:var(--radius-md);font:400 .75rem/1.55 var(--font-mono);overflow-x:auto;color:var(--text-secondary)}
.tbl{overflow-x:auto}.tbl table{border-collapse:collapse;width:100%;font-size:.8125rem}
.tbl th,.tbl td{padding:8px 12px;border-top:1px solid var(--border-subtle);text-align:left;vertical-align:top}
.tbl thead th{border-top:0;background:var(--bg-shell);font:500 .6875rem var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.col{display:flex;flex-direction:column;gap:16px}
.yes{color:var(--status-success-fg);font-weight:600}.no{color:var(--text-disabled)}.num{font-family:var(--font-mono);text-align:right}
@media (max-width:640px){.shell{min-height:0}.sbox{max-width:none;flex:1 1 100%}.tb{flex-wrap:wrap}}
@media (max-width:767px){.edited--bar{position:fixed;left:0;right:0;bottom:0;z-index:35;margin:0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg-surface-elevated);border-top:1px solid var(--border-default);box-shadow:var(--shadow-md);justify-content:space-between}.edited--bar .tag{flex:1 1 100%}}
.toast .undo{background:none;border:0;padding:0;font:600 .8125rem var(--font-sans);color:var(--accent-primary-soft-strong);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.status-badge--success{border-color:var(--status-success-border);background:var(--status-success-soft);color:var(--status-success-fg)}
.status-badge--info{border-color:var(--status-info-border);background:var(--status-info-soft);color:var(--status-info-fg)}
.idrow2{display:inline-flex;gap:8px;align-items:center}
.idchip{font:400 .6875rem var(--font-mono);background:var(--bg-surface-muted);border:1px solid var(--border-subtle);border-radius:6px;padding:0 6px;color:var(--text-secondary);white-space:nowrap}
.pubchip{display:inline-flex;align-items:center;height:1.375rem;padding:0 8px;border:1px solid var(--accent-primary-border);border-radius:var(--radius-sm);background:var(--accent-primary-soft);color:var(--accent-primary-soft-strong);font:600 .6875rem var(--font-mono);text-transform:uppercase;letter-spacing:.03em;width:max-content}
.lnk{background:none;border:0;padding:0;color:var(--accent-primary-soft-strong);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font:inherit}
span.lnk{cursor:default;font-size:.8125rem}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid;border-radius:var(--radius-md);font-size:.8125rem}
.note .body{flex:1;min-width:0}
.note--error{border-color:var(--status-error-border);background:var(--status-error-soft);color:var(--status-error-fg)}
.note--info{border-color:var(--status-info-border);background:var(--status-info-soft);color:var(--status-info-fg)}
.note .lnk{color:inherit;font-weight:600}
.bulk{position:sticky;bottom:12px;z-index:20;display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:10px 14px;background:var(--bg-surface);border:1px solid var(--border-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);font-size:.8125rem}
.vtab .n.warn{color:var(--status-warning-fg)}
.shell-nav__link{cursor:pointer}.shell-nav__link.is-off{opacity:.55;cursor:default}
.page-desc{margin:2px 0 0;color:var(--text-secondary);font-size:.875rem;max-width:68ch}
.l1.err{color:var(--status-error-fg);font-weight:500}
.page-header{align-items:flex-start}
.ordercell{display:flex;gap:12px;align-items:flex-start;min-width:0}
.ordercell>span:last-child{min-width:0}
.eyebrow{margin:0;font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-primary-hover)}
/*EXTRA*/
.sbox{flex:0 1 440px}
.page-desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.5em;max-width:100%}
.page-header>div:first-child{min-width:0;flex:1 1 320px}
.colgrp{border-radius:var(--radius-sm)}
.icon-btn.on{background:var(--bg-surface-muted);color:var(--text-primary)}
.partlist{margin:2px 0 8px 22px;padding:4px 0 4px 10px;border-left:2px solid var(--border-default);display:flex;flex-direction:column;gap:1px}
.partlist__hint{font-size:.75rem;color:var(--text-muted);padding:2px 4px}
.colrow--sub{min-height:28px}
.colrow--sub .sortable{color:var(--text-muted);display:inline-flex;margin-left:auto;padding-right:4px}
.arch pre{margin:0;padding:10px 12px;background:var(--bg-surface-muted);border:1px solid var(--border-default);border-radius:var(--radius-md);font-family:var(--font-mono,monospace);font-size:.75rem;line-height:1.5;overflow:auto;white-space:pre}
.icon-btn--ph{visibility:hidden;pointer-events:none}

.grip{border:0;background:none;color:var(--text-muted);width:20px;height:24px;display:inline-flex;align-items:center;justify-content:center;cursor:grab;flex:none;border-radius:6px;padding:0}
.grip:hover{color:var(--text-primary);background:var(--bg-surface-hover)}
.grip:active{cursor:grabbing}
.grip--ph{visibility:hidden}
.disc{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--text-muted);font-size:.75rem;height:24px;padding:0 6px;border-radius:6px;cursor:pointer;flex:none;font-family:inherit}
.disc:hover{background:var(--bg-surface-hover);color:var(--text-primary)}
.disc svg{transition:transform .12s}.disc.open svg{transform:rotate(90deg)}.disc.open{color:var(--text-primary)}
.disc--ph{visibility:hidden;pointer-events:none;width:58px}
.colgrp.dragging,.colrow.dragging{opacity:.4}
.colgrp.drop-before,.colrow.drop-before{box-shadow:0 -2px 0 var(--accent-primary)}
.colgrp.drop-after,.colrow.drop-after{box-shadow:0 2px 0 var(--accent-primary)}
.colrow--off{opacity:.8}

/* ---- sortable headers: quiet by default, accent text + growing underline when active ---- */
.sortbtn2{position:relative;padding:2px 0;margin:0;border-radius:2px;background:none;transition:color .16s ease}
.sortbtn2.act{background:none;color:var(--accent-primary-soft-strong)}
.sortbtn2:hover:not(.static){color:var(--text-primary)}
.sortbtn2.act:hover{color:var(--accent-primary-soft-strong)}
.sortbtn2:focus-visible,.data-table th button:focus-visible{outline:2px solid var(--accent-ring);outline-offset:3px}
.sortbtn2:not(.static)::after,.data-table th button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:1px;background:var(--accent-primary);transform:scaleX(0);transform-origin:left;transition:transform .24s cubic-bezier(.16,1,.3,1)}
.sortbtn2.act::after,.data-table th[aria-sort] button::after{transform:scaleX(1)}
.sortstack.end .sortbtn2::after{transform-origin:right}
.data-table th button{position:relative}
.data-table th[aria-sort] button{color:var(--accent-primary-soft-strong)}
.sarr{display:inline-flex;width:10px;height:10px;opacity:0;transform:translateY(2px) rotate(0);transition:opacity .16s ease,transform .32s cubic-bezier(.34,1.56,.64,1)}
.sortbtn2:not(.static):hover .sarr,.data-table th button:hover .sarr,.data-table th button:focus-visible .sarr{opacity:.45;transform:none}
.sarr.on,.sortbtn2:not(.static):hover .sarr.on{opacity:1;transform:none}
.sarr.desc,.sortbtn2:not(.static):hover .sarr.desc{transform:rotate(180deg)}
.data-table th button .gl{display:none}

/* ---- needs a look: the whole phrase is the link ---- */
.nbtn .n{border-bottom:1px dotted currentColor;font-weight:500;transition:border-color .12s}
.nbtn:hover .n{border-bottom-style:solid}
.nbtn b{font-weight:600}

/* ---- move buttons: reachable by mouse (hover), keyboard (focus) and always on touch ---- */
.mv{opacity:0;transition:opacity .12s}
.colrow:hover .mv,.colrow:focus-within .mv{opacity:1}

/* ---- motion that answers an action ---- */
@keyframes panelIn{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes partsIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- dialogs ---------- */
function SaveDialog({ cfg, mode, view, cur, role, views, onClose, onSubmit }) {
  useRestoreFocus();
  const fref = useRef(null); useFocusTrap(fref);
  const [name, setName] = useState(mode === 'rename' ? view.name : '');
  const [scope, setScope] = useState('personal');
  const [asDefault, setAsDefault] = useState(false);
  const [touched, setTouched] = useState(false);
  const t = name.trim(); const sc = mode === 'rename' ? view.scope : scope;
  const clash = views.some((v) => v.id !== (view && view.id) && v.name.toLowerCase() === t.toLowerCase());
  const error = !t ? 'Enter a name for this view.' : clash ? 'A view with this name already exists.' : '';
  const chips = [];
  if (mode === 'create') {
    cfg.filters.forEach((fc) => { const v = cur.f[fc.key]; if (!v) return; if (fc.type === 'check') chips.push(fc.label); else if (fc.hidden) { const sv = cfg.systemViews.find((x) => x.def.f[fc.key] === v); chips.push(fc.label + ': ' + (sv ? sv.name : v)); } else chips.push(fc.label + ': ' + optLabel(fc, v)); });
    chips.push('Sort: ' + sortLabel(cfg, cur.sort)); chips.push((cur.columns.length + 1) + ' columns');
  }
  useEffect(() => { const k = (e) => { if (e.key === 'Escape') onClose(); }; document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); }, []);
  const submit = (e) => { e.preventDefault(); setTouched(true); if (!error) onSubmit({ name: t, scope: sc, asDefault }); };
  return (
    <div className="scrim" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <form className="dialog" ref={fref} onSubmit={submit} role="dialog" aria-modal="true" aria-labelledby="dlg-t">
        <h3 id="dlg-t">{mode === 'rename' ? 'Rename view' : 'Save as new view'}</h3>
        <div className="field"><label className="field__label" htmlFor="vn">Name</label>
          <input id="vn" className="control" autoFocus value={name} maxLength={60} aria-invalid={touched && !!error} onChange={(e) => setName(e.target.value)} placeholder="e.g. Allegro, ready to pack" />
          {touched && error && <span className="field__error">{error}</span>}</div>
        {mode === 'create' && <>
          <div className="field"><span className="field__label">Who can see it</span>
            <div className="segsm" role="radiogroup"><button type="button" role="radio" aria-checked={scope === 'personal'} onClick={() => setScope('personal')}>Only me</button>
              <button type="button" role="radio" aria-checked={scope === 'shared'} disabled={role !== 'admin'} title={role !== 'admin' ? 'Admins only' : ''} onClick={() => setScope('shared')}>Everyone</button></div>
            <span className="field__hint">{role !== 'admin' ? 'Shared views are created by admins. You can duplicate them to your own.' : scope === 'shared' ? 'Everyone sees it. Only admins can edit or delete it.' : 'Visible only on your account.'}</span></div>
          {scope === 'personal' && <label className="checkrow"><input type="checkbox" checked={asDefault} onChange={(e) => setAsDefault(e.target.checked)} />Open {cfg.title} in this view by default</label>}
          <div className="summary" aria-label="What is saved">{chips.map((c) => <Chip key={c}>{c}</Chip>)}</div></>}
        <div className="dialog__actions"><Btn tone="secondary" onClick={onClose}>Cancel</Btn><Btn type="submit">{mode === 'rename' ? 'Save name' : 'Save view'}</Btn></div>
      </form>
    </div>
  );
}
function ConfirmDialog({ title, body, actions, onClose }) {

/* ---------- the list screen (one engine, many configs) ---------- */

  ['Diagnostics', [['Jobs & Logs', '461', 'jobs'], ['Webhooks', '0', 'webhooks'], ['Sync progress'], ['Duplicate stock positions']]],
  ['Platform', [['Connections', '10'], ['Adapters'], ['Settings']]], ['AI', [['Prompt templates'], ['Provider settings']]]];

function ListScreen({ cfg, role, theme, setTheme, go }) {
  const narrow = useNarrow();
  const [views, setViews] = useState(cfg.startViews);
  const [pinned, setPinned] = useState(cfg.pinned);

  const [search, setSearch] = useState('');

  const [dismissed, setDismissed] = useState({});
  const [dialog, setDialog] = useState(null);
  const [panel, setPanel] = useState(false);
  const [moreOpen, setMoreOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [sel, setSel] = useState([]);
  const moreRef = useOutside(moreOpen, () => setMoreOpen(false));
  const tt = useRef(null);
  const LOCKED = cfg.locked_views;
  const active = views.find((v) => v.id === activeId) || views[0];
  const rec = useMemo(() => reconcile(cfg, active.def), [active]);
  const diff = changes(cur, rec.def);
  const dirty = sig(cur) !== sig(rec.def);
  const isCustom = active.scope !== 'system';
  const canEdit = active.scope === 'personal' || (active.scope === 'shared' && role === 'admin');
  const say = (m, undo) => { setToast({ m, undo }); clearTimeout(tt.current); tt.current = setTimeout(() => setToast(null), undo ? 8000 : 5000); };
  const patch = (p) => setCur((c) => ({ ...c, ...p }));

  const rows = useMemo(() => run(cfg, cur, search), [cur, search]);
  useEffect(() => { setSel([]); }, [activeId]);

  const apply = (id) => {
    const v = views.find((x) => x.id === id); const prevA = activeId, prevC = cur, lost = dirty && isCustom, name = active.name;
    setActiveId(id); setCur(reconcile(cfg, v.def).def);
    if (lost) say('Discarded your changes to “' + name + '”.', () => { setActiveId(prevA); setCur(prevC); setToast(null); });
  };
  const autoPin = (id) => {
    let list = pinned.slice(); let note = '';
    if (list.length >= 6) {
      const out = list.find((p) => !LOCKED.includes(p) && p !== activeId && views.some((x) => x.id === p && x.scope !== 'system'));
      if (out) { list = list.filter((p) => p !== out); note = ' It replaced “' + views.find((x) => x.id === out).name + '” in the strip.'; }
    }
    if (list.length < 6) list.push(id);
    return { list, note };
  };
  const saveChanges = () => { setViews(views.map((v) => v.id === active.id ? { ...v, def: cur } : v)); say('Saved changes to “' + active.name + '”.'); };
  const create = ({ name, scope, asDefault }) => { const id = 'v' + Date.now(); setViews(views.concat({ id, scope, owner: scope === 'shared' ? 'You' : undefined, name, def: cur })); const pin = autoPin(id); setPinned(pin.list); setActiveId(id); if (asDefault) setDefaultId(id); setDialog(null); say('Saved view “' + name + '”' + (scope === 'shared' ? ' for everyone.' : '.') + pin.note); };
  const duplicate = (id) => { const prevA = activeId, prevC = cur, lost = dirty && isCustom && id !== activeId; const s = views.find((v) => v.id === id); const c = { id: 'v' + Date.now(), scope: 'personal', name: uniqueName(s.name + ' (copy)', views), def: id === activeId ? cur : reconcile(cfg, s.def).def }; setViews(views.concat(c)); setActiveId(c.id); setCur(c.def); say(id === activeId && dirty ? 'Copied with your current changes.' : 'Copied to your views.', lost ? () => { setActiveId(prevA); setCur(prevC); setToast(null); } : undefined); };
  const rename = ({ name }) => { setViews(views.map((v) => v.id === dialog.view.id ? { ...v, name } : v)); setDialog(null); say('Renamed to “' + name + '”.'); };
  const remove = () => { const id = dialog.view.id; const rest = views.filter((v) => v.id !== id); setViews(rest); setPinned(pinned.filter((p) => p !== id)); setDialog(null); if (defaultId === id) setDefaultId(cfg.systemViews[0].id); if (activeId === id) { setActiveId(cfg.systemViews[0].id); setCur(rest[0].def); } say('Deleted “' + dialog.view.name + '”.' + (defaultId === id ? ' ' + cfg.title + ' now opens in ' + cfg.systemViews[0].name + '.' : '')); };
  const togglePin = (id) => { if (LOCKED.includes(id) && pinned.includes(id)) { say('This view always stays in the strip.'); return; } if (pinned.includes(id)) setPinned(pinned.filter((p) => p !== id)); else if (pinned.length >= 6) say('The strip holds 6 views. Unpin one first.'); else setPinned(pinned.concat(id)); };
  const setSort = (key) => patch({ sort: cur.sort.key === key ? { key, dir: cur.sort.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: (cfg.sorts.find((s) => s.key === key) || { dir: 'desc' }).dir } });
  const colById = (id) => cfg.columns.find((c) => c.id === id);
  const cols = cur.columns.map(colById).filter(Boolean);
  const nOf = (v) => cfg.liveCounts && v.scope === 'system' ? run(cfg, { ...v.def, sort: cfg.defaultSort }, '').length : v.n;

  const chips = [];
  cfg.filters.filter((fc) => !fc.hidden).forEach((fc) => { const v = cur.f[fc.key]; if (!v) return; chips.push(fc.type === 'check' ? ['', fc.label, () => setF(fc.key, false)] : [fc.label, optLabel(fc, v), () => setF(fc.key, '')]); });
  const nFilters = chips.length;
  if (isCustom) cfg.filters.filter((fc) => fc.hidden).forEach((fc) => { const v = cur.f[fc.key]; if (!v) return; const sv = cfg.systemViews.find((x) => x.def.f[fc.key] === v); chips.push([fc.label, sv ? sv.name : String(v), () => setF(fc.key, '')]); });
  const visibleIds = pinned.filter((id) => views.some((v) => v.id === id));
  if (!visibleIds.includes(activeId)) visibleIds.push(activeId);
  const tabs = visibleIds.map((id) => views.find((v) => v.id === id)).filter(Boolean);
  const firstCustom = tabs.findIndex((v) => v.scope !== 'system');
  const showStrip = true;
  const banner = cfg.banner ? cfg.banner(cfg.rows) : null;
  const L = cfg.locked;
  const lockedTh = typeof L.head === 'function' ? L.head(cur.sort, setSort) : L.head;
  const allSel = rows.length > 0 && sel.length === rows.length;

  return (
    <div className={'frame ' + density}>
      <div className="shell">
        <aside className="shell-sidebar">
          <div className="shell-brand"><Logo /><span className="shell-brand__name">OpenLinker</span><span className="context-chip"><b>Dev</b><span>v0.19.0</span></span></div>
          <nav className="shell-nav" aria-label="Primary">
            {NAV.map(([g, items]) => (
              <section className="shell-nav__group" key={g}><p className="shell-nav__label">{g}</p><ul className="shell-nav__list">
                {items.map(([l, c, pg]) => <li key={l}><a className={'shell-nav__link' + (pg === cfg.id ? ' shell-nav__link--active' : '') + (pg ? '' : ' is-off')} href={'#' + (pg || '')} aria-current={pg === cfg.id ? 'page' : undefined} aria-disabled={pg ? undefined : 'true'} title={pg ? undefined : 'Not part of this prototype'} onClick={(e) => { e.preventDefault(); if (pg && pg !== cfg.id) go(pg); }}><span className="shell-nav__link-label">{l}</span>{c && <span className="shell-nav__link-count">{c}</span>}</a></li>)}
              </ul></section>))}
          </nav>
          <div className="shell-workspace"><strong className="shell-workspace__name">Default organization</strong><div className="shell-workspace__user"><span>{role}</span><span>Sign out</span></div></div>
        </aside>
        <div className="shell-main">
          <header className="shell-topbar">
            <span className="shell-hamburger"><Ic n="menu" s={16} /></span>
            <nav className="shell-crumbs" aria-label="Breadcrumb"><span>{cfg.crumb}</span><span className="sep">/</span><span className="cur">{cfg.title}</span></nav>
            <span className="shell-search"><Ic n="search" /><span className="ph">Search orders, products, connections…</span><kbd>⌘K</kbd></span>
            <span className="spacer" />
            <span className="shell-alerts">Alerts <span className="mono">0</span></span>
            <UserMenu role={role} density={density} setDensity={setDensity} theme={theme} setTheme={setTheme} />

                <div><p className="eyebrow">Synced 12:23</p><h2 className="page-title">{cfg.title}</h2><p className="page-desc">{cfg.desc}</p></div>

/* ---------- config builder ---------- */
function build(c) {
  const cfg = { actions: [], menu: [], filters: [], ...c };
  cfg.columns.forEach((x) => { if (x.parts) { x.fields = x.parts.map((q) => q.label).join(', '); x.sorts = x.parts.filter((q) => q.sort).map((q) => q.sort); } });
  cfg.defCols = cfg.columns.filter((x) => x.def).map((x) => x.id);
  cfg.defaultSort = { key: cfg.sorts[0].key, dir: cfg.sorts[0].dir };
  const view = (id, name, f, o = {}) => ({ id, scope: 'system', name, n: o.n, tone: o.tone, def: { f: f || {}, sort: o.sort || cfg.defaultSort, columns: o.columns || cfg.defCols, parts: o.parts || {} } });
  cfg.systemViews = cfg.sys.map(([id, name, f, o]) => view(id, name, f, o));
  const cust = (cfg.custom || []).map(([id, scope, name, f, o, owner]) => ({ id, scope, name, owner, def: { f: f || {}, sort: (o && o.sort) || cfg.defaultSort, columns: (o && o.columns) || cfg.defCols, parts: (o && o.parts) || {} } }));
  cfg.startViews = cfg.systemViews.concat(cust);
  cfg.pinned = cfg.pin || cfg.systemViews.slice(0, 6).map((v) => v.id);
  cfg.locked_views = cfg.lockViews || cfg.systemViews.slice(0, 2).map((v) => v.id);
  cfg.userViews = cfg.userViews !== false;
  return cfg;
}

/* ---------- app ---------- */
function App() {
  const [tab, setTab] = useState('proto');
  const [page, setPage] = useState('orders');
  const [role, setRole] = useState('operator');
  const [theme, setTheme] = useState('system');
  useEffect(() => { const r = document.documentElement; if (theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', theme); }, [theme]);
  const Seg = ({ value, onChange, options }) => <div className="seg" role="radiogroup">{options.map((o) => <button key={o[0]} type="button" role="radio" aria-checked={value === o[0]} onClick={() => onChange(o[0])}>{o[1]}</button>)}</div>;
  return (
    <div className="deck">
      <div className="deckbar">
        <span><b>Zapisane widoki na wszystkich listach.</b> Przełączaj strony w menu bocznym. Motyw i gęstość: menu użytkownika.</span>
        <div className="deck-controls"><div><span className="ctl-label">Role</span><Seg value={role} onChange={setRole} options={[['admin', 'Admin'], ['operator', 'Operator'], ['viewer', 'Viewer']]} /></div></div>
      </div>
      <div className="dtabs" role="group" aria-label="Sekcje"><button type="button" className="dtab" aria-pressed={tab === 'proto'} onClick={() => setTab('proto')}>Prototyp</button><button type="button" className="dtab" aria-pressed={tab === 'decisions'} onClick={() => setTab('decisions')}>Wszystkie tabele i decyzje</button><button type="button" className="dtab" aria-pressed={tab === 'arch'} onClick={() => setTab('arch')}>Architektura kodu</button></div>
      {tab === 'proto' ? <ListScreen key={page + role} cfg={PAGES[page]} role={role} theme={theme} setTheme={setTheme} go={setPage} /> : tab === 'arch' ? <Architecture /> : <Decisions />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
