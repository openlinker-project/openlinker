<title>Products list filters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: comparison strip, then the OpenLinker products page rendered twice
   from ONE shared filter state: "Today" (main @ 6 Nov 2026) and "Proposed". */
:root {
  --font-sans: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --bg-canvas: oklch(99% 0.003 80); --bg-shell: oklch(97.5% 0.004 80); --bg-surface: #ffffff;
  --bg-surface-muted: oklch(96% 0.005 80); --bg-surface-hover: oklch(93% 0.006 80);
  --border-subtle: oklch(93.5% 0.006 80); --border-default: oklch(88% 0.008 80); --border-strong: oklch(78% 0.010 80);
  --text-primary: oklch(20% 0.012 80); --text-secondary: oklch(38% 0.010 80); --text-muted: oklch(52% 0.008 80);
  --text-on-primary: oklch(18% 0.012 50); --text-link: oklch(50% 0.14 250);
  --accent-primary: oklch(68% 0.18 50); --accent-primary-soft: oklch(96% 0.04 60);
  --accent-primary-soft-strong: oklch(40% 0.16 50); --accent-primary-border: oklch(85% 0.10 55); --accent-ring: oklch(68% 0.18 50 / 0.30);
  --status-success: oklch(54% 0.14 150); --status-success-soft: oklch(96% 0.04 150); --status-success-border: oklch(85% 0.08 150); --status-success-fg: oklch(36% 0.12 150);
  --status-warning: oklch(72% 0.16 85); --status-warning-soft: oklch(96% 0.05 85); --status-warning-border: oklch(85% 0.10 85); --status-warning-fg: oklch(42% 0.12 80);
  --status-error: oklch(58% 0.20 25); --status-error-soft: oklch(96% 0.04 25); --status-error-border: oklch(85% 0.10 25); --status-error-fg: oklch(42% 0.16 25);
  --status-info: oklch(56% 0.14 245); --status-info-soft: oklch(96% 0.03 245); --status-info-border: oklch(85% 0.08 245); --status-info-fg: oklch(40% 0.12 245);
  --status-review-soft: oklch(96% 0.04 290); --status-review-border: oklch(85% 0.08 290); --status-review-fg: oklch(42% 0.14 290);
  --status-disabled-soft: oklch(95% 0.005 80); --status-disabled-border: oklch(85% 0.008 80); --status-disabled-fg: oklch(38% 0.010 80);
  --channel-allegro: oklch(70% 0.18 35); --channel-prestashop: oklch(60% 0.18 250); --channel-erli: oklch(66% 0.17 320); --channel-woocommerce: oklch(64% 0.16 150);
  --shadow-xs: 0 1px 2px rgb(15 18 26 / 0.04);
  --shadow-overlay: 0 24px 48px rgb(15 18 26 / 0.16), 0 8px 16px rgb(15 18 26 / 0.08);
  --shadow-focus: 0 0 0 3px var(--accent-ring);
  --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem; --space-5: 1.5rem; --space-6: 2rem; --space-7: 3rem;
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 10px; --radius-pill: 9999px;
  --duration-fast: 120ms; --duration-normal: 180ms; --duration-slow: 280ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --tracking-caps: 0.08em;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg-canvas: oklch(14% 0.005 270); --bg-shell: oklch(16% 0.006 270); --bg-surface: oklch(19% 0.007 270);
  --bg-surface-muted: oklch(24% 0.009 270); --bg-surface-hover: oklch(28% 0.010 270);
  --border-subtle: oklch(24% 0.010 270); --border-default: oklch(30% 0.012 270); --border-strong: oklch(42% 0.014 270);
  --text-primary: oklch(96% 0.006 270); --text-secondary: oklch(78% 0.010 270); --text-muted: oklch(60% 0.012 270);
  --text-on-primary: oklch(16% 0.012 50); --text-link: oklch(76% 0.14 245);
  --accent-primary: oklch(72% 0.18 50); --accent-primary-soft: oklch(28% 0.08 50); --accent-primary-soft-strong: oklch(86% 0.14 60); --accent-primary-border: oklch(40% 0.14 55); --accent-ring: oklch(72% 0.18 50 / 0.40);
  --status-success: oklch(68% 0.16 150); --status-success-soft: oklch(26% 0.06 150); --status-success-border: oklch(36% 0.10 150); --status-success-fg: oklch(86% 0.14 150);
  --status-warning: oklch(78% 0.16 85); --status-warning-soft: oklch(28% 0.07 85); --status-warning-border: oklch(38% 0.10 85); --status-warning-fg: oklch(88% 0.14 85);
  --status-error: oklch(70% 0.18 25); --status-error-soft: oklch(28% 0.10 25); --status-error-border: oklch(40% 0.14 25); --status-error-fg: oklch(86% 0.14 25);
  --status-info: oklch(72% 0.14 245); --status-info-soft: oklch(26% 0.06 245); --status-info-border: oklch(36% 0.10 245); --status-info-fg: oklch(86% 0.12 245);
  --status-review-soft: oklch(28% 0.07 290); --status-review-border: oklch(38% 0.10 290); --status-review-fg: oklch(86% 0.12 290);
  --status-disabled-soft: oklch(24% 0.009 270); --status-disabled-border: oklch(34% 0.012 270); --status-disabled-fg: oklch(78% 0.010 270);
  --shadow-overlay: 0 24px 48px rgb(0 0 0 / 0.5), 0 8px 16px rgb(0 0 0 / 0.3);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-canvas: oklch(14% 0.005 270); --bg-shell: oklch(16% 0.006 270); --bg-surface: oklch(19% 0.007 270);
  --bg-surface-muted: oklch(24% 0.009 270); --bg-surface-hover: oklch(28% 0.010 270);
  --border-subtle: oklch(24% 0.010 270); --border-default: oklch(30% 0.012 270); --border-strong: oklch(42% 0.014 270);
  --text-primary: oklch(96% 0.006 270); --text-secondary: oklch(78% 0.010 270); --text-muted: oklch(60% 0.012 270);
  --text-on-primary: oklch(16% 0.012 50); --text-link: oklch(76% 0.14 245);
  --accent-primary: oklch(72% 0.18 50); --accent-primary-soft: oklch(28% 0.08 50); --accent-primary-soft-strong: oklch(86% 0.14 60); --accent-primary-border: oklch(40% 0.14 55); --accent-ring: oklch(72% 0.18 50 / 0.40);
  --status-success: oklch(68% 0.16 150); --status-success-soft: oklch(26% 0.06 150); --status-success-border: oklch(36% 0.10 150); --status-success-fg: oklch(86% 0.14 150);
  --status-warning: oklch(78% 0.16 85); --status-warning-soft: oklch(28% 0.07 85); --status-warning-border: oklch(38% 0.10 85); --status-warning-fg: oklch(88% 0.14 85);
  --status-error: oklch(70% 0.18 25); --status-error-soft: oklch(28% 0.10 25); --status-error-border: oklch(40% 0.14 25); --status-error-fg: oklch(86% 0.14 25);
  --status-info: oklch(72% 0.14 245); --status-info-soft: oklch(26% 0.06 245); --status-info-border: oklch(36% 0.10 245); --status-info-fg: oklch(86% 0.12 245);
  --status-review-soft: oklch(28% 0.07 290); --status-review-border: oklch(38% 0.10 290); --status-review-fg: oklch(86% 0.12 290);
  --status-disabled-soft: oklch(24% 0.009 270); --status-disabled-border: oklch(34% 0.012 270); --status-disabled-fg: oklch(78% 0.010 270);
  --shadow-overlay: 0 24px 48px rgb(0 0 0 / 0.5), 0 8px 16px rgb(0 0 0 / 0.3);
}

* { box-sizing: border-box; }
html, body { background: var(--bg-canvas); color: var(--text-primary); }
body { font-family: var(--font-sans); font-size: 13px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); }
.tabular { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
:focus-visible { outline: none; box-shadow: var(--shadow-focus); border-radius: var(--radius-sm); }
a { color: var(--text-link); }

/* ── Comparison chrome (not product UI) ── */
.chrome { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); align-items: center;
  padding-block: var(--space-2); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg-shell); border-bottom: 1px solid var(--border-subtle); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--bg-shell); }
.chrome__note { color: var(--text-muted); font-size: .75rem; }
.chrome__spacer { flex: 1; }

/* ── existing primitives (class names as in index.css) ── */
.segmented-control { display: inline-flex; border: 1px solid var(--border-default); border-radius: var(--radius-md); }
.segmented-control__option { padding: 4px var(--space-3); border: none; border-right: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-secondary); font-size: .8125rem; cursor: pointer; flex: 1; white-space: nowrap; }
.segmented-control__option:first-child { border-radius: var(--radius-md) 0 0 var(--radius-md); }
.segmented-control__option:last-child { border-right: none; border-radius: 0 var(--radius-md) var(--radius-md) 0; }
.segmented-control__option[aria-pressed="true"] { background: var(--accent-primary); color: var(--text-on-primary); font-weight: 500; }
.segmented-control--soft .segmented-control__option[aria-pressed="true"] { background: var(--accent-primary-soft); color: var(--accent-primary-soft-strong); }

.page { max-width: 1440px; margin: 0 auto; padding-block: var(--space-4) var(--space-7);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: var(--space-3); }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
.page-eyebrow { font-family: var(--font-mono); font-size: .6875rem; font-weight: 500; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--accent-primary); }
.page-title { margin: 2px 0 0; font-size: 1.375rem; font-weight: 600; letter-spacing: -0.012em; }
.button-group { display: inline-flex; gap: var(--space-2); align-items: center; }

.button { display: inline-flex; align-items: center; gap: var(--space-2); height: 2rem; padding: 0 var(--space-3); border: 1px solid var(--accent-primary-border); border-radius: var(--radius-md);
  background: var(--accent-primary); color: var(--text-on-primary); font-size: .8125rem; font-weight: 500; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow-xs);
  transition: background var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.button:active { transform: translateY(1px); }
.button--sm { height: 1.75rem; padding: 0 var(--space-2); font-size: .75rem; }
.button--secondary { background: var(--bg-surface-muted); border-color: var(--border-default); color: var(--text-primary); }
.button--ghost { background: transparent; border-color: transparent; color: var(--text-secondary); box-shadow: none; }
.button--ghost:hover, .button--secondary:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
.button--outline { background: var(--bg-surface); border-color: var(--border-default); color: var(--text-primary); }
.button--outline:hover { background: var(--bg-surface-hover); }
.button--outline[aria-expanded="true"] { border-color: var(--accent-primary-border); background: var(--accent-primary-soft); color: var(--accent-primary-soft-strong); }
.button--danger { background: var(--status-error-soft); border-color: var(--status-error-border); color: var(--status-error-fg); }
.button__shortcut { font-family: var(--font-mono); font-size: .625rem; color: var(--text-muted); border: 1px solid var(--border-default); border-radius: 4px; padding: 0 4px; line-height: 1.5; }
.button__count { min-width: 1.125rem; height: 1.125rem; padding: 0 4px; border-radius: var(--radius-pill); display: inline-grid; place-items: center; font-family: var(--font-mono); font-size: .625rem; background: var(--accent-primary); color: var(--text-on-primary); }

.status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 1px 6px; border: 1px solid var(--status-disabled-border); border-radius: var(--radius-sm);
  background: var(--status-disabled-soft); color: var(--status-disabled-fg); font-family: var(--font-mono); font-size: .625rem; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; line-height: 1.6; }
.status-badge__dot { width: .375rem; height: .375rem; border-radius: 999px; background: currentColor; }
.status-badge--success { background: var(--status-success-soft); border-color: var(--status-success-border); color: var(--status-success-fg); }
.status-badge--warning { background: var(--status-warning-soft); border-color: var(--status-warning-border); color: var(--status-warning-fg); }
.status-badge--error { background: var(--status-error-soft); border-color: var(--status-error-border); color: var(--status-error-fg); }
.status-badge--info { background: var(--status-info-soft); border-color: var(--status-info-border); color: var(--status-info-fg); }
.status-badge--review { background: var(--status-review-soft); border-color: var(--status-review-border); color: var(--status-review-fg); }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 1.375rem; padding: 0 .5rem; border: 1px solid var(--border-subtle); border-radius: var(--radius-pill);
  background: var(--bg-surface-muted); color: var(--text-secondary); font-size: .75rem; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.chip:hover { border-color: var(--border-default); color: var(--text-primary); }
.chip--warning { background: var(--status-warning-soft); border-color: var(--status-warning-border); color: var(--status-warning-fg); }
.chip--error { background: var(--status-error-soft); border-color: var(--status-error-border); color: var(--status-error-fg); }
.chip--info { background: var(--status-info-soft); border-color: var(--status-info-border); color: var(--status-info-fg); }
.chip--success { background: var(--status-success-soft); border-color: var(--status-success-border); color: var(--status-success-fg); }
.chip[aria-pressed="true"] { background: var(--accent-primary); border-color: var(--accent-primary); color: var(--text-on-primary); }
.chip__count { font-family: var(--font-mono); font-size: .6875rem; font-variant-numeric: tabular-nums; }
.chip__age { font-family: var(--font-mono); font-size: .625rem; opacity: .75; }

.control { height: 1.875rem; padding: 0 var(--space-2); border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); color: var(--text-primary); font-size: .8125rem; width: 100%; min-width: 0; }
.control:focus-visible { border-color: var(--accent-primary); }
.check { display: flex; align-items: center; gap: var(--space-2); padding: 3px 0; cursor: pointer; font-size: .8125rem; }
.check input { accent-color: var(--accent-primary); margin: 0; }
.check__count { margin-left: auto; font-family: var(--font-mono); font-size: .6875rem; font-variant-numeric: tabular-nums; color: var(--text-muted); }
.check__count--error { color: var(--status-error-fg); }
.check__count--warning { color: var(--status-warning-fg); }
.eyebrow { font-family: var(--font-mono); font-size: .625rem; font-weight: 500; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field__label { font-size: .75rem; color: var(--text-secondary); font-weight: 500; }
.range-row { display: grid; grid-template-columns: 2.5rem 1fr; gap: var(--space-2); align-items: center; }

/* ── TODAY: health tiles (orders-segments) ── */
.segments { display: grid; grid-template-columns: repeat(6, minmax(130px, 1fr)); gap: var(--space-3); overflow-x: auto; }
.segment { text-align: left; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--bg-surface); padding: var(--space-2) var(--space-3); cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 3.25rem; }
.segment--error { background: var(--status-error-soft); border-color: var(--status-error-border); }
.segment--warning { background: var(--status-warning-soft); border-color: var(--status-warning-border); }
.segment--info { background: var(--status-info-soft); border-color: var(--status-info-border); }
.segment--success { background: var(--status-success-soft); border-color: var(--status-success-border); }
.segment[aria-pressed="true"] { border-color: var(--accent-primary); box-shadow: 0 0 0 1px var(--accent-primary); }
.segment__label { font-family: var(--font-mono); font-size: .625rem; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
.segment--error .segment__label { color: var(--status-error-fg); } .segment--warning .segment__label { color: var(--status-warning-fg); }
.segment--info .segment__label { color: var(--status-info-fg); } .segment--success .segment__label { color: var(--status-success-fg); }
.segment__value { font-size: 1.125rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.segment--error .segment__value { color: var(--status-error-fg); } .segment--warning .segment__value { color: var(--status-warning-fg); }
.segment--info .segment__value { color: var(--status-info-fg); } .segment--success .segment__value { color: var(--status-success-fg); }

/* ── TODAY: filter bar + accordion panel ── */
.filterbar { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.search { position: relative; flex: 0 1 420px; min-width: 200px; }
.search input { width: 100%; height: 1.875rem; padding: 0 2rem 0 1.75rem; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); font-size: .8125rem; }
.search input:focus-visible { border-color: var(--accent-primary); }
.search__glyph { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: .875rem; }
.search__kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
.results { margin-left: auto; font-family: var(--font-mono); font-size: .75rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.panel { border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--bg-surface-muted); animation: drop var(--duration-normal) var(--ease-out); }
.panel__grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.panel__group { padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.panel__group + .panel__group { border-left: 1px solid var(--border-subtle); }
.panel__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-top: 1px solid var(--border-subtle); font-size: .75rem; color: var(--text-muted); }
@keyframes drop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.quick__sep { width: 1px; height: 1rem; background: var(--border-default); margin: 0 4px; }
.quick__end { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; }
.applied { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 1.5rem; padding: 0 2px 0 var(--space-2); border: 1px solid var(--border-default); border-radius: var(--radius-pill); background: var(--bg-surface); font-size: .75rem; animation: pop var(--duration-normal) var(--ease-out); }
.pill__key { color: var(--text-muted); }
.pill button { width: 1.25rem; height: 1.25rem; border: none; background: none; border-radius: 999px; cursor: pointer; color: var(--text-muted); display: inline-grid; place-items: center; }
.pill button:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
@keyframes pop { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: none; } }
.linkbtn { border: none; background: none; cursor: pointer; color: var(--text-muted); font-size: .75rem; text-decoration: underline; text-underline-offset: 2px; padding: 2px 4px; }
.linkbtn:hover { color: var(--text-primary); }

/* ── PROPOSED: status tabs ── */
.tabs-scroll { overflow-x: auto; scrollbar-width: none; }
.tabs-scroll::-webkit-scrollbar { display: none; }
.tabs { position: relative; display: flex; gap: 2px; border-bottom: 1px solid var(--border-subtle); min-width: max-content; }
.tab { display: inline-flex; align-items: center; gap: var(--space-2); padding: 6px var(--space-3) 9px; border: none; background: none; cursor: pointer; color: var(--text-secondary); font-size: .8125rem; white-space: nowrap; border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
.tab:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
.tab[aria-selected="true"] { color: var(--text-primary); font-weight: 600; }
.tab__dot { width: .4375rem; height: .4375rem; border-radius: 999px; }
.tab__count { font-family: var(--font-mono); font-size: .75rem; font-weight: 500; font-variant-numeric: tabular-nums; padding: 0 6px; border-radius: var(--radius-pill); background: var(--bg-surface-muted); color: var(--text-secondary); min-width: 1.5rem; text-align: center; }
.tab__count--error { background: var(--status-error-soft); color: var(--status-error-fg); }
.tab__count--warning { background: var(--status-warning-soft); color: var(--status-warning-fg); }
.tab__count--zero { color: var(--text-muted); background: transparent; }
.tabs__ind { position: absolute; bottom: -1px; left: 0; height: 2px; border-radius: 2px; background: var(--accent-primary); transition: transform var(--duration-slow) var(--ease-out), width var(--duration-slow) var(--ease-out); }

/* PROPOSED toolbar: search, 3 pinned filters, all filters, count, sort */
.toolbar { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.anchor { position: relative; }
.dd-btn { display: inline-flex; align-items: center; gap: 6px; height: 1.875rem; padding: 0 var(--space-2) 0 var(--space-3); border: 1px dashed var(--border-strong); border-radius: var(--radius-pill); background: transparent; cursor: pointer; font-size: .8125rem; color: var(--text-secondary); white-space: nowrap; }
.dd-btn:hover { background: var(--bg-surface-hover); color: var(--text-primary); }

.pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 25; min-width: 240px; max-width: calc(100vw - 32px); background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay); padding: 6px; transform-origin: top left; animation: popin var(--duration-normal) var(--ease-out); }

.opt { width: 100%; display: flex; align-items: center; gap: var(--space-2); padding: 6px var(--space-2); border: none; background: none; border-radius: var(--radius-sm); cursor: pointer; text-align: left; font-size: .8125rem; }
.opt:hover, .opt:focus-visible { background: var(--bg-surface-hover); }

.pop__title { padding: 4px var(--space-2) 6px; font-size: .6875rem; color: var(--text-muted); }

/* PROPOSED "needs a look" queue row */
.queue { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.queue__label { font-size: .75rem; color: var(--text-muted); margin-right: 2px; }
.qchip { display: inline-flex; align-items: center; gap: 6px; height: 1.625rem; padding: 0 var(--space-2); border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); cursor: pointer; font-size: .75rem; white-space: nowrap; color: var(--text-primary); }
.qchip:hover { background: var(--bg-surface-hover); }

/* PROPOSED side sheets (filters + peek): dimmed, blurred list behind; spring-ish slide */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgb(12 14 20 / .38); backdrop-filter: blur(3px) saturate(.85); -webkit-backdrop-filter: blur(3px) saturate(.85); animation: fade 220ms var(--ease-out); }
.scrim--out { animation: fadeout 190ms ease-in forwards; }
@media (prefers-reduced-transparency: reduce) { .scrim { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgb(12 14 20 / .55); } }
.sheet { position: fixed; top: 8px; right: 8px; bottom: 8px; z-index: 41; display: flex; flex-direction: column; background: var(--bg-surface);
  border: 1px solid var(--border-default); border-radius: 14px; box-shadow: var(--shadow-overlay); overflow: hidden;
  margin-top: env(safe-area-inset-top, 0px); margin-bottom: env(safe-area-inset-bottom, 0px); margin-right: env(safe-area-inset-right, 0px);
  animation: sheet-in 360ms cubic-bezier(.32,.72,0,1); }

@keyframes sheet-out { to { transform: translateX(calc(100% + 16px)); opacity: .6; } }
.drawer { width: min(420px, calc(100vw - 16px)); }
.peek { width: min(560px, calc(100vw - 16px)); }
.icon-btn { width: 2rem; height: 2rem; border: none; border-radius: var(--radius-md); background: none; color: var(--text-muted); cursor: pointer; display: inline-grid; place-items: center; font-size: .875rem; }
.icon-btn:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
.drawer__head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle); }

/* Peek */
.peek-head { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); padding: var(--space-4) var(--space-6) var(--space-4) var(--space-5); border-bottom: 1px solid var(--border-subtle); background: var(--bg-surface-muted); }

@keyframes peek-swap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.peek-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.state-card { border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); }

.note { border-left: 3px solid var(--accent-primary); background: var(--accent-primary-soft); border-radius: 0 var(--radius-md) var(--radius-md) 0; padding: var(--space-2) var(--space-3); }
.note p { margin: 2px 0 0; font-size: .8125rem; }

.peek-h { margin: 0 0 var(--space-2); font-size: .8125rem; font-weight: 600; display: flex; gap: 6px; }
.items { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-3); font-size: .8125rem; }
.item + .item { border-top: 1px solid var(--border-subtle); }
.item__name { display: flex; flex-direction: column; min-width: 0; }
.kv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-3) var(--space-4); }
.kv-grid p { margin: 2px 0 0; font-size: .8125rem; overflow-wrap: anywhere; }
.peek-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: var(--space-2) var(--space-5); border-top: 1px solid var(--border-subtle); font-size: .75rem; }

/* Attention groups (Needs a look) */
.attn-row { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.attn { display: inline-flex; align-items: center; gap: var(--space-2); height: 2rem; padding: 0 var(--space-2) 0 var(--space-3); border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); cursor: pointer; font-size: .8125rem; white-space: nowrap;
  transition: border-color var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out); }

.attn-item { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-3); align-items: start; padding: 8px 10px; border: none; background: none; border-radius: var(--radius-md); cursor: pointer; text-align: left; }
.attn-item:hover, .attn-item:focus-visible { background: var(--bg-surface-hover); }

.attn-item[aria-checked="true"] .attn-item__box { background: var(--accent-primary); border-color: var(--accent-primary); }
.attn-item__text { display: flex; flex-direction: column; gap: 1px; }
.attn-item__title { font-size: .8125rem; font-weight: 500; }
.attn-item__desc { font-size: .75rem; color: var(--text-muted); }
.attn-item__meta { display: flex; flex-direction: column; align-items: flex-end; }
.attn-item__n { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-muted); }
.attn-item__n--error { color: var(--status-error-fg); } .attn-item__n--warning { color: var(--status-warning-fg); }
.attn-item__age { font-family: var(--font-mono); font-size: .625rem; color: var(--text-muted); white-space: nowrap; }

/* Proposed table: stacked headers kept, sort marks clearer */
.th-stack { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.th-stack--right { align-items: flex-end; }
.ptable .sortbtn { display: inline-flex; gap: 4px; align-items: center; padding: 1px 4px; margin: 0 -4px; border-radius: 4px; }
.ptable .sortbtn:hover { background: var(--bg-surface-hover); color: var(--text-primary); }

.ptable th:hover .sortbtn__ind { opacity: .7; }
.ptable .sortbtn--on { color: var(--text-primary); background: var(--accent-primary-soft); }

.ptable tbody tr.row { cursor: pointer; }
.ptable tbody tr.row--peek > td { background: var(--accent-primary-soft); box-shadow: inset 0 1px 0 var(--accent-primary-border), inset 0 -1px 0 var(--accent-primary-border); }
.ptable tbody tr.row--peek > td:first-child { box-shadow: inset 3px 0 0 var(--accent-primary), inset 0 1px 0 var(--accent-primary-border), inset 0 -1px 0 var(--accent-primary-border); }

.drawer__body { flex: 1; overflow-y: auto; }
.drawer__foot { display: flex; gap: var(--space-2); justify-content: space-between; padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border-subtle); }
.section { border-bottom: 1px solid var(--border-subtle); }
.section__head { width: 100%; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); border: none; background: none; cursor: pointer; text-align: left; }
.section__title { font-weight: 600; font-size: .8125rem; }
.section__sum { margin-left: auto; font-size: .75rem; color: var(--text-muted); max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.section__sum--on { color: var(--accent-primary-soft-strong); }
.section__body { padding: 0 var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.section__chev { transition: transform var(--duration-normal) var(--ease-out); color: var(--text-muted); }
.section__head[aria-expanded="true"] .section__chev { transform: rotate(90deg); }

/* ── TABLE (shared) ── */
.table-wrap { overflow-x: auto; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--bg-surface); }
table { width: 100%; border-collapse: collapse; min-width: 1080px; }

td { padding: var(--space-3); border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
tbody tr.row:hover > td { background: var(--bg-surface-hover); }
tbody tr.row--sel > td { background: var(--accent-primary-soft); }
.sortbtn { display: block; border: none; background: none; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; cursor: pointer; white-space: nowrap; }
.sortbtn--on { color: var(--text-primary); }
.sortbtn__ind { color: var(--accent-primary); }
.th-right { text-align: right; } .th-right .sortbtn { margin-left: auto; }
.col-check { width: 2.25rem; } .col-exp { width: 1.75rem; }
.stack { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.stack--right { align-items: flex-end; text-align: right; }
.wrap { display: flex; flex-wrap: wrap; gap: 4px; }
.idcell { display: flex; gap: var(--space-2); align-items: flex-start; }
.thumb { width: 1.75rem; height: 1.75rem; border-radius: var(--radius-sm); background: var(--bg-surface-muted); border: 1px solid var(--border-subtle); display: grid; place-items: center; font-family: var(--font-mono); font-size: .625rem; color: var(--text-muted); flex-shrink: 0; }
.ref { font-family: var(--font-mono); font-weight: 500; font-size: .8125rem; }
.copy { border: none; background: none; color: var(--text-muted); font-size: .6875rem; cursor: pointer; padding: 0 2px; }
.sub { font-size: .75rem; color: var(--text-muted); }
.more { font-family: var(--font-mono); font-size: .625rem; padding: 0 4px; border-radius: 4px; background: var(--bg-surface-muted); color: var(--text-muted); }
.conn { display: inline-flex; align-items: center; gap: 6px; padding: 1px 6px; border-radius: var(--radius-sm); background: var(--bg-surface-muted); font-family: var(--font-mono); font-size: .6875rem; white-space: nowrap; }
.conn__dot { width: .375rem; height: .375rem; border-radius: 999px; }
.money { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.packed { font-size: .75rem; color: var(--text-muted); white-space: nowrap; }
.packed b { color: var(--text-primary); font-weight: 500; }
.exp { width: 1.25rem; height: 1.25rem; border: none; background: none; cursor: pointer; color: var(--text-muted); border-radius: 4px; display: inline-grid; place-items: center; transition: transform var(--duration-normal) var(--ease-out); }
.exp[aria-expanded="true"] { transform: rotate(90deg); }
.exp:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
.cb { accent-color: var(--accent-primary); margin: 2px 0 0; }
.cta-link { font-size: .75rem; }
.detail { background: var(--bg-surface-muted); padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.detail__actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-3); }
.kv dt { font-family: var(--font-mono); font-size: .625rem; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
.kv dd { margin: 2px 0 0; font-size: .75rem; overflow-wrap: anywhere; }
.lineitem { display: flex; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--bg-surface); font-size: .75rem; }
.empty { padding: var(--space-7) var(--space-4); text-align: center; }
.empty h3 { margin: 0 0 4px; font-size: .9375rem; }
.empty p { margin: 0 auto var(--space-3); color: var(--text-muted); max-width: 52ch; }
.pager { display: flex; justify-content: space-between; align-items: center; font-size: .75rem; color: var(--text-muted); padding: var(--space-2) 0; }

/* PROPOSED table refinements: grouped header line + 2-line badge cap + peek */
th .th-group { display: flex; gap: var(--space-3); align-items: baseline; }
th .th-group--right { justify-content: flex-end; }
.th-sep { color: var(--border-strong); }
.overflow { font-family: var(--font-mono); font-size: .625rem; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); padding: 0 5px; background: none; color: var(--text-secondary); cursor: pointer; line-height: 1.6; }
.peek-btn { align-self: flex-start; border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-secondary); font-size: .6875rem; border-radius: var(--radius-sm); padding: 0 6px; height: 1.375rem; cursor: pointer; }
.peek-btn:hover { color: var(--text-primary); background: var(--bg-surface-hover); }

/* Bulk bar (existing BulkActionBar) */
.bulk { position: sticky; bottom: calc(var(--space-3) + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); box-shadow: var(--shadow-overlay); animation: drop var(--duration-normal) var(--ease-out); }
.bulk__count { font-weight: 600; }
.bulk__hint { color: var(--text-muted); font-size: .75rem; flex: 1; min-width: 160px; }

/* Changes ledger */
.ledger { border-top: 1px solid var(--border-subtle); padding-top: var(--space-4); display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-4) var(--space-6); }
.ledger h3 { margin: 0 0 var(--space-2); font-size: .875rem; }
.ledger table { min-width: 0; font-size: .75rem; }
.ledger td { padding: 6px var(--space-2); vertical-align: top; }
.ledger td:first-child { color: var(--text-secondary); width: 42%; }
.ledger p { margin: 0 0 var(--space-2); color: var(--text-secondary); font-size: .8125rem; max-width: 62ch; }

@media (max-width: 900px) {
  .panel__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .panel__group:nth-child(3) { border-left: none; }
  .panel__group:nth-child(n+3) { border-top: 1px solid var(--border-subtle); }

}
@media (max-width: 560px) {
  .panel__grid { grid-template-columns: 1fr; }

  .search { flex-basis: 100%; }
  .results { margin-left: 0; }
}

/* v4: calmer toolbar - status row carries "Needs a look", filters are one joined group */
.statusbar { display: flex; align-items: flex-end; gap: var(--space-2) var(--space-4); flex-wrap: wrap; border-bottom: 1px solid var(--border-subtle); }
.statusbar .tabs { border-bottom: 0; }
.statusbar .tabs-scroll { flex: 1 1 auto; min-width: 0; }
.attn-sum { display: flex; align-items: center; gap: 2px; padding-bottom: 6px; font-size: .8125rem; color: var(--text-muted); white-space: nowrap; }
.attn-sum__label { margin-right: 6px; }
.attn-sum__sep { color: var(--border-strong); }
.attn-link { position: relative; display: inline-flex; align-items: baseline; gap: 5px; padding: 3px 6px; border: none; border-radius: var(--radius-sm); background: none; cursor: pointer; color: var(--text-secondary); font-size: .8125rem;
  transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out); }
.attn-link:hover, .attn-link[aria-expanded="true"] { background: var(--bg-surface-hover); color: var(--text-primary); }
.attn-link__n { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-primary); }
.attn-link--error .attn-link__n { color: var(--status-error-fg); }
.attn-link__label { text-decoration: underline dotted var(--border-strong); text-underline-offset: 3px; }
.attn-link--on { background: var(--accent-primary-soft); color: var(--accent-primary-soft-strong); }
.attn-link__on { width: 6px; height: 6px; border-radius: 999px; background: var(--accent-primary); align-self: center; }
.attn-pop__head { padding: 6px 10px 4px; font-size: .75rem; font-weight: 600; color: var(--text-secondary); }
.fgroup { display: inline-flex; align-items: stretch; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); }
.fgroup > .anchor { display: flex; }
.fg-btn { display: inline-flex; align-items: center; gap: 6px; height: 1.875rem; padding: 0 var(--space-3); border: none; border-right: 1px solid var(--border-subtle); background: none; cursor: pointer; font-size: .8125rem; color: var(--text-secondary); white-space: nowrap;
  transition: background var(--duration-fast) var(--ease-out); }

/* Exit animation for side sheets: play the out keyframes, then unmount. */
function useClosable(onClose) {
  const [closing, setClosing] = useState(false);
  const close = () => {

/* NEW · shared/ui/sheet.tsx
   Desktop: side sheet. Phone (≤ 640px): bottom sheet in the vaul style -
   handle, drag down to dismiss (distance or flick velocity), rubber-band
   when dragged up, and the page behind scales back. Drag writes styles
   straight to the DOM (no React state per frame). */
const SHEET_EASE = 'cubic-bezier(.32,.72,0,1)';
const isPhone = () => window.matchMedia('(max-width: 640px)').matches;
function Sheet({ className, label, onClose, children }) {
  const { closing, close } = useClosable(onClose);
  const sheetRef = useRef(null);
  const scrimRef = useRef(null);
  const drag = useRef(null);
  useEffect(() => { document.body.classList.add('sheet-open'); return () => document.body.classList.remove('sheet-open'); }, []);
  useEffect(() => { if (closing) document.body.classList.remove('sheet-open'); }, [closing]);
  useEffect(() => { const k = (e) => { if (e.key === 'Escape') close(); }; document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); });
  const handlers = {
    onPointerDown: (e) => {
      if (!isPhone() || e.button !== 0 || e.target.closest('button, a, input, select, label')) return;
      drag.current = { y: e.clientY, t: performance.now(), dy: 0, h: sheetRef.current.offsetHeight };
      sheetRef.current.style.transition = 'none';
      e.currentTarget.setPointerCapture(e.pointerId);
    },
    onPointerMove: (e) => {
      const d = drag.current; if (!d) return;
      d.dy = e.clientY - d.y;
      const y = d.dy > 0 ? d.dy : d.dy * 0.12;
      sheetRef.current.style.transform = `translateY(${y}px)`;
      if (scrimRef.current) scrimRef.current.style.opacity = String(1 - Math.min(1, Math.max(0, y) / d.h) * 0.9);
    },
    onPointerUp: () => {
      const d = drag.current; if (!d) return; drag.current = null;
      const v = d.dy / Math.max(1, performance.now() - d.t);
      const el = sheetRef.current;
      if (d.dy > d.h * 0.3 || (d.dy > 24 && v > 0.45)) {
        el.style.transition = `transform 240ms ${SHEET_EASE}`; el.style.transform = 'translateY(100%)';
        if (scrimRef.current) { scrimRef.current.style.transition = 'opacity 240ms ease-out'; scrimRef.current.style.opacity = '0'; }
        document.body.classList.remove('sheet-open');
        setTimeout(onClose, 240);
      } else {
        el.style.transition = `transform 420ms ${SHEET_EASE}`; el.style.transform = '';
        if (scrimRef.current) { scrimRef.current.style.transition = 'opacity 300ms ease-out'; scrimRef.current.style.opacity = ''; }
      }
    },
  };
  handlers.onPointerCancel = handlers.onPointerUp;
  return ReactDOM.createPortal(
    <>
      <div ref={scrimRef} className={cls('scrim', closing && 'scrim--out')} onClick={close} aria-hidden="true" />
      <aside ref={sheetRef} className={cls('sheet', className, closing && 'sheet--out')} role="dialog" aria-modal="true" aria-label={label}>
        <div className="sheet__handle" {...handlers} aria-hidden="true"><span /></div>
        {children(close, handlers)}
      </aside>
    </>,
    document.body,
  );
}

  const items = [{ key: null, label: 'All products', n: counts.all }, ...STOCK_FILTERS.map((f) => ({ key: f.value, label: f.label, tone: f.tone, n: counts[f.value] }))];
  useLayoutEffect(() => { const el = ref.current?.querySelector('[aria-selected="true"]'); if (el) setInd({ x: el.offsetLeft, w: el.offsetWidth }); }, [value, counts]);
  const onKey = (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = items.findIndex((t) => t.key === value);
    onChange(items[(i + (e.key === 'ArrowRight' ? 1 : -1) + items.length) % items.length].key);
    requestAnimationFrame(() => ref.current?.querySelector('[aria-selected="true"]')?.focus());
  };
  return (
    <div className="tabs-scroll">
      <div className="tabs" role="tablist" aria-label="Products by stock" ref={ref} onKeyDown={onKey}>
        {items.map((t) => (
          <button key={t.label} type="button" role="tab" aria-selected={value === t.key} tabIndex={value === t.key ? 0 : -1} className="tab" onClick={() => onChange(t.key)}>
            {t.tone ? <span className="tab__dot" style={{ background: `var(--status-${t.tone})` }} aria-hidden="true" /> : null}
            {t.label}<span className={cls('tab__count', t.n === 0 ? 'tab__count--zero' : t.tone && `tab__count--${t.tone}`)}>{t.n}</span>
          </button>
        ))}
        <span className="tabs__ind" style={{ width: ind.w, transform: `translateX(${ind.x}px)` }} aria-hidden="true" />
      </div>
    </div>
  );
}
function FilterDropdown({ label, value, options, onChange, anyLabel }) {

function SortMenu({ sort, setSort }) {

function PSort({ k, label, sort, setSort }) {

    {label}<span className="sortbtn__ind" aria-hidden="true">{on ? (sort.dir === 'asc' ? '↑' : '↓') : '↕'}</span></button>;
}
function Peek({ id, rows, onNav, onClose }) {

    const k = (e) => {
      if ((e.key === 'ArrowDown' || e.key === 'j') && idx < rows.length - 1) { e.preventDefault(); onNav(rows[idx + 1].id); }
      if ((e.key === 'ArrowUp' || e.key === 'k') && idx > 0) { e.preventDefault(); onNav(rows[idx - 1].id); }
    };
    document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k);
  });
  const n = atp(p); const st = stockStatus(n); const stl = staleness(p);
  return (
    <Sheet className="peek" label={p.name} onClose={onClose}>{(close, drag) => (<>
      <header className="peek-head" {...drag}>
        <div className="peek-head__id ppeek-id">
          <Thumb p={p} />
          <div style={{ minWidth: 0 }}>
            <div className="peek-title"><a href="#" className="peek-link" onClick={(e) => { e.preventDefault(); toast(`Opens /products/${p.id}`); }}>{p.name}<span className="peek-link__arrow" aria-hidden="true">↗</span></a></div>
            <div className="peek-meta"><span>SKU <span className="mono">{p.sku}</span></span><ConnChip id={p.src} /><span>{variantCount(p)} {variantCount(p) === 1 ? 'variant' : 'variants'}</span></div>
          </div>
        </div>

        <button type="button" className="icon-btn peek-close" onClick={close} aria-label="Close details">✕</button>
      </header>
      <div className="peek-body" key={p.id}>
        <div className="peek-actions">
          <Btn sm onClick={() => toast(`Opens /products/${p.id}`)}>Open product</Btn>
          <Btn tone="outline" sm onClick={() => toast('Opens the content editor')}>Edit content</Btn>
          {hasGap(p) ? <Btn tone="outline" sm onClick={() => toast(`Opens the publish picker for ${p.name}`)}>+ Publish</Btn> : null}
        </div>
        <section className="state-card" aria-label="Product state">
          <div className="state-row"><span className="eyebrow">Stock</span><div className="wrap"><span className="pstock tabular">{n}</span><span className="sub">to sell</span><Badge tone={STOCK_TONE[st]}>{STOCK_LABEL[st]}</Badge><span className="sub tabular">master {master(p)}</span></div></div>
          <div className="state-row"><span className="eyebrow">Listings</span><div className="wrap"><CoveragePills p={p} /></div></div>
          <div className="state-row"><span className="eyebrow">Tax rate</span><div className="wrap">{p.tax === 'set' ? <Badge tone="success">Set</Badge> : p.tax === 'missing' ? <Badge tone="error">Missing</Badge> : <Badge>Never checked</Badge>}{stl ? <Badge tone="error">{stl.label}</Badge> : null}</div></div>
        </section>
        <section><h3 className="peek-h">Variants &amp; stock <span className="muted tabular">{variantCount(p)}</span></h3><VariantRows p={p} onCreate={() => toast('Opens the publish picker')} /></section>
        <section><h3 className="peek-h">Live marketplace status</h3><LiveStatus p={p} /></section>
        <section className="kv-grid">
          <div><span className="eyebrow">Internal ID</span><p className="mono">{p.id}</p></div>
          <div><span className="eyebrow">Source external ID</span><p className="mono">{p.ext}</p></div>
          <div><span className="eyebrow">Currency</span><p>PLN</p></div>
          <div><span className="eyebrow">Stock synced</span><p>{plDateTime(p.synced)}</p></div>
          <div><span className="eyebrow">Updated</span><p>{plDay(p.updated)}</p></div>
          <div><span className="eyebrow">Created</span><p>{plDay(p.created)}</p></div>

function ProposedPage({ s, set, rows, counts, sort, setSort, selected, setSelected }) {
  const [more, setMore] = useState(false);

    <main className="page">

          <FilterDropdown label="Listings" anyLabel="Any listing state" value={s.unlistedOn} onChange={(v) => set({ unlistedOn: v })} options={[{ value: ALL_GAPS, label: 'Unlisted anywhere', count: counts.gaps.all }, ...OFFER_CONNS.map((c) => ({ value: c.id, label: `Unlisted on ${c.platform}`, dot: c.color, count: counts.gaps[c.id] }))]} />
          <FilterDropdown label="Tax rate" anyLabel="Any" value={s.tax} onChange={(v) => set({ tax: v })} options={[{ value: 'missing', label: 'Missing', count: counts.taxMissing }, { value: 'not-checked', label: 'Never checked', count: counts.taxUnchecked }]} />
          <button type="button" className={cls('fg-btn', moreCount && 'fg-btn--on')} aria-expanded={more} title="All filters (F)" onClick={() => setMore(true)}>

          <button type="button" className="linkbtn" onClick={() => set({ ...EMPTY, stock: s.stock })}>Clear all</button>
        </div>
      ) : null}
      {rows.length ? (
        <div className="table-wrap">
          <table className="ptable">
            <thead><tr>
              <th className="col-check"><input className="cb" type="checkbox" aria-label="Select all visible products" checked={allSel} onChange={() => setSelected(allSel ? [] : rows.map((p) => p.id))} /></th>

              <th className="hide-1024 w-source">Source</th>
              <th className="w-stock"><span className="th-stack"><PSort k="stock" label="Stock" sort={sort} setSort={setSort} /></span></th>
              <th className="w-listings">Listings</th>
              <th className="th-right w-money"><span className="th-stack th-stack--right"><PSort k="price" label="Price" sort={sort} setSort={setSort} /><PSort k="updatedAt" label="Updated" sort={sort} setSort={setSort} /><PSort k="createdAt" label="Created" sort={sort} setSort={setSort} /></span></th>
            </tr></thead>
            <tbody>
              {rows.map((p) => {
                const sel = selected.includes(p.id);
                return (
                  <tr key={p.id} className={cls('row', sel && 'row--sel', peek === p.id && 'row--peek')} onClick={(e) => { if (!e.target.closest('button, a, input, label')) setPeek(p.id); }}>
                    <td><input className="cb" type="checkbox" aria-label={`Select ${p.name}`} checked={sel} onChange={() => setSelected(sel ? selected.filter((x) => x !== p.id) : [...selected, p.id])} /></td>
                    <td><div className="stack"><NameCell p={p} onOpen={() => setPeek(p.id)} /><button type="button" className="peek-btn" onClick={() => setPeek(p.id)}>Details <span aria-hidden="true">›</span></button></div></td>
                    <td className="hide-1024"><ConnChip id={p.src} /></td>
                    <td><StockCell p={p} /></td>
                    <td><span className="stack"><CoveragePills p={p} />{hasGap(p) ? <Btn tone="ghost" sm className="row-cta-btn" onClick={() => toast(`Opens the publish picker for ${p.name}`)}>+ Publish</Btn> : null}</span></td>
                    <td><span className="stack stack--right"><span className="pstock tabular">{plMoney(p.price)}</span><span className="sub tabular">upd. {plDay(p.updated)}</span><span className="sub tabular">{plDay(p.created)}</span></span></td>

              })}
            </tbody>
          </table>

      <BulkBar n={selected.length} clear={() => setSelected([])} />
      {more ? <MoreSheet s={s} set={set} counts={counts} onClose={() => setMore(false)} n={rows.length} /> : null}
      {peek ? <Peek id={peek} rows={rows} onNav={setPeek} onClose={() => setPeek(null)} /> : null}
    </main>
  );
}

  ['Expandable row: links, fields, variants & stock, live marketplace status', 'Row click or Details opens a side peek (bottom sheet on phones); same content; ↑ ↓ walks products'],
  ['+ Publish per row, + Create offer per variant', 'Unchanged, also in the peek'],
  ['Bulk bar: Clear, Publish products (N), max 100', 'Unchanged'],
  ['Cost prices button', 'Unchanged'],
  ['Default sort: Created, newest first', 'Unchanged ("Newest first")'],
  ['Availability-unknown alert (rare, config-wide)', 'Unchanged when it applies; not shown in the sample data'],
];

function App() {
  const [mode, setMode] = useState('proposed');
  const [s, setS] = useState(EMPTY);
  const [selected, setSelected] = useState([]);
  const [sortToday, setSortToday] = useState({ key: 'createdAt', dir: 'desc' });
  const [sortProp, setSortProp] = useState({ key: 'createdAt', dir: 'desc' });
  const set = (patch) => setS((cur) => ({ ...cur, ...patch }));
  const counts = useCounts(s);
  const sort = mode === 'today' ? sortToday : sortProp;
  const setSort = mode === 'today' ? setSortToday : setSortProp;
  const rows = useMemo(() => sortRows(PRODUCTS.filter((p) => matches(p, s)), sort), [s, sort]);
  const props = { s, set, rows, counts, sort, setSort, selected, setSelected };
  return (
    <>
      <div className="app-wrap">
        <div className="chrome">
          <div className="segmented-control segmented-control--soft" role="group" aria-label="Version">
            <button type="button" className="segmented-control__option" aria-pressed={mode === 'today'} onClick={() => setMode('today')}>Today (main, 6 Nov)</button>
            <button type="button" className="segmented-control__option" aria-pressed={mode === 'proposed'} onClick={() => setMode('proposed')}>Proposed</button>
          </div>
          <span className="chrome__note">Filters are shared, so switching keeps them. Sample data, 12 products.</span>
          <span className="chrome__spacer" />
          <span className="chrome__note">On a phone the panels open from the bottom; drag down to close. Keys: / search · F filters · ↑ ↓ in details · Esc close</span>
        </div>
        {mode === 'today' ? <TodayPage {...props} /> : <ProposedPage {...props} />}
        <div className="page" style={{ paddingTop: 0 }}>
          <section className="ledger">
            <div>
              <h3>Every control on main, and where it went</h3>
              <div className="table-wrap" style={{ border: 'none' }}><table><tbody>{MOVES.map(([a, b]) => <tr key={a}><td>{a}</td><td>{b}</td></tr>)}</tbody></table></div>
            </div>
            <div>
              <h3>Same rules as the orders list</h3>
              <ul>
                <li>One status axis: stock state is the only tab row. Out of stock, Low stock and Oversold were split between tiles and chips.</li>
                <li>Things that need work sit in one quiet line: listing gaps, missing tax rates, missing cost prices. Two banners and two tiles fold into it.</li>
                <li>Three pinned filters in one joined group, the rest in the More sheet.</li>
                <li>Applied filters always show as removable pills.</li>
                <li>Details open beside the list, not inside it, so the table stays readable.</li>
                <li>Narrow screens get the same layout instead of a different filter panel.</li>
              </ul>
            </div>
          </section>
        </div>
      </div>
      <Toaster />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
