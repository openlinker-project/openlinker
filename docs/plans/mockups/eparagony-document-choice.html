    box-shadow var(--duration-fast) var(--ease-out);
}
.button:hover {
  background: var(--button-primary-bg-hover);
  border-color: var(--button-primary-bg-hover);
  color: var(--text-on-primary);
}

  background: var(--accent-primary-active);

}

.button--secondary {

  color: var(--text-primary);
  box-shadow: var(--shadow-xs), var(--shadow-inset-top);
}

  background: var(--bg-surface-muted);

  background: var(--bg-surface-muted);

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useId, Children, cloneElement, isValidElement } = React;

/* ════════════════════════════════════════════════════════════════════
 * shared/ui - ported 1:1 from apps/web/src/shared/ui (types dropped)
 * ════════════════════════════════════════════════════════════════════ */

function Alert({ action, children, className = '', density = 'default', title, tone = 'info' }) {
  const classes = ['alert', `alert--${tone}`, density === 'compact' ? 'alert--compact' : '', className]
    .filter(Boolean).join(' ');
  return (
    <div className={classes} role={tone === 'error' ? 'alert' : 'status'}>
      <div className="alert__content">
        {title ? <strong className="alert__title">{title}</strong> : null}
        <div className="alert__description">{children}</div>
      </div>
      {action ? <div className="alert__actions">{action}</div> : null}
    </div>
  );
}

function FieldError({ id, message }) {
  if (!message) return null;
  return <p id={id} className="form-field__error" role="alert">{message}</p>;
}

function FormField({ children, description, error, label, name }) {
  const child = Children.only(children);
  const generatedId = useId();
  const inputId = child.props.id ?? `${name}-${generatedId}`;
  const descriptionId = description ? `${inputId}-description` : undefined;
  const errorId = error ? `${inputId}-error` : undefined;
  const describedBy = [child.props['aria-describedby'], descriptionId, errorId].filter(Boolean).join(' ') || undefined;
  return (
    <div className="form-field">
      <label htmlFor={inputId} className="form-field__label">{label}</label>
      {cloneElement(child, { id: inputId, 'aria-describedby': describedBy, 'aria-invalid': Boolean(error) || Boolean(child.props['aria-invalid']) })}
      {description ? <p id={descriptionId} className="form-field__description">{description}</p> : null}
      <FieldError id={errorId ?? `${inputId}-error`} message={error} />
    </div>
  );
}

function Input({ className = '', invalid = false, ...props }) {
  return <input className={['control', invalid ? 'control--invalid' : '', className].filter(Boolean).join(' ')} {...props} />;
}

function Select({ children, className = '', invalid = false, ...props }) {
  return (
    <select className={['control', 'control--select', invalid ? 'control--invalid' : '', className].filter(Boolean).join(' ')} {...props}>
      {children}
    </select>
  );
}

function Button({ className = '', tone = 'primary', type = 'button', ...props }) {
  return <button type={type} className={['button', `button--${tone}`, className].filter(Boolean).join(' ')} {...props} />;
}

function StatusBadge({ children, compact = false, tone = 'neutral' }) {
  return (
    <span className={['status-badge', `status-badge--${tone}`, compact ? 'status-badge--compact' : ''].filter(Boolean).join(' ')}>
      <span>{children}</span>
    </span>
  );
}

function BackLink({ label, className = '' }) {
  return (
    <a href="#" onClick={(e) => e.preventDefault()} className={['back-link', className].filter(Boolean).join(' ')}>
      <span className="back-link__glyph" aria-hidden="true">←</span>
      <span className="back-link__label">{label}</span>
    </a>
  );
}

function FormErrorSummary({ errors, title = 'Please correct the highlighted fields.' }) {
  if (errors.length === 0) return null;
  return (
    <Alert tone="error" title={title}>
      <ul className="form-error-summary__list">{errors.map((e) => <li key={e}>{e}</li>)}</ul>
    </Alert>
  );
}

function PageLayout({ children, description, eyebrow, summary, title }) {
  return (
    <section className="page-section">
      <div className="page-header">
        <div className="page-header__content">
          {eyebrow ? <p className="eyebrow">{eyebrow}</p> : null}
          <h2 className="page-title">{title}</h2>
          {description ? <p className="page-description">{description}</p> : null}
        </div>
      </div>
      {summary ? <div className="toolbar page-summary">{summary}</div> : null}
      {children}
    </section>
  );
}

/* ════════════════════════════════════════════════════════════════════
 * PROPOSAL - eparagony-setup.schema.ts (what changes)
 *
 * In the app this is the zod schema; here it is the same rules as a
 * plain function so the page runs without a build. Each rule names the
 * backend check it mirrors, so the form is never stricter than the gate.
 * ════════════════════════════════════════════════════════════════════ */

const DOCUMENT_CHOICES = [
  {
    capability: 'Fiscalization',
    label: 'Fiscal e-receipts',
    help: 'Registers a sale on your own fiscal printer through eparagony.pl.',
  },
  {
    capability: 'Invoicing',
    label: 'Invoices',
    help: 'Issues VAT invoices through eparagony.pl. eparagony.pl can also send them on to KSeF.',
  },
];

const ADDRESS_PARTS = ['merchantStreet', 'merchantNumber', 'merchantPostalCode', 'merchantCity', 'merchantCountry'];

const DEFAULT_VALUES = {
  enabledCapabilities: ['Fiscalization'],
  name: '', environment: 'sandbox', clientId: '', clientSecret: '', posId: '', integrationId: '',
  merchantTIN: '', merchantName: '',
  merchantStreet: '', merchantNumber: '', merchantApartment: '', merchantPostalCode: '', merchantCity: '', merchantCountry: 'PL',
  eInvoicingHubEnabled: false,
};

function validate(v) {
  const e = {};
  // superRefine #1: at least one document kind. Today the wizard hardcodes
  // enabledCapabilities: ['Fiscalization'] and never asks.
  if (v.enabledCapabilities.length === 0) e.enabledCapabilities = 'Pick at least one: e-receipts, invoices, or both.';
  if (!v.name.trim()) e.name = 'Connection name is required';
  if (!v.clientId.trim()) e.clientId = 'Client ID is required';
  if (!v.clientSecret.trim()) e.clientSecret = 'Client secret is required';
  if (!v.posId.trim()) e.posId = 'POS ID is required';
  if (v.integrationId.trim() && !v.integrationId.includes(':')) e.integrationId = 'Must be of the form integration:secret, e.g. openlinker:abc123';
  if (v.enabledCapabilities.includes('Invoicing')) {
    // superRefine #2: the invoice mapper refuses every invoice without merchantTIN.
    if (!v.merchantTIN.trim()) e.merchantTIN = 'Tax number (NIP) is required to issue invoices';
    // superRefine #3: the validator refuses a half-filled merchantAddress.
    // Apartment is the only optional part; Country is prefilled, so it alone
    // does not count as "started".
    const started = ['merchantStreet', 'merchantNumber', 'merchantApartment', 'merchantPostalCode', 'merchantCity']
      .some((k) => v[k].trim() !== '');
    if (started) for (const k of ADDRESS_PARTS) if (!v[k].trim()) e[k] = 'Required.';
    if (v.merchantCountry.trim() && !/^[A-Za-z]{2}$/.test(v.merchantCountry.trim())) e.merchantCountry = 'Use the two-letter code, e.g. PL.';
  }
  return e;
}

/* toCreateConnectionInput - what the POST /connections body becomes. */
function toCreateConnectionInput(v) {
  const invoicing = v.enabledCapabilities.includes('Invoicing');
  const address = ['merchantStreet', 'merchantNumber', 'merchantApartment', 'merchantPostalCode', 'merchantCity']
    .some((k) => v[k].trim() !== '')
    ? {
        street: v.merchantStreet.trim(), number: v.merchantNumber.trim(),
        ...(v.merchantApartment.trim() ? { apartment: v.merchantApartment.trim() } : {}),
        postalCode: v.merchantPostalCode.trim(), city: v.merchantCity.trim(), country: v.merchantCountry.trim().toUpperCase(),
      }
    : undefined;
  return {
    name: v.name.trim(),
    platformType: 'eparagony',
    adapterKey: 'eparagony.documents.v3',
    credentials: { clientId: v.clientId.trim(), clientSecret: '••••', ...(v.integrationId.trim() ? { integrationId: '••••' } : {}) },
    config: {
      environment: v.environment,
      posId: v.posId.trim(),
      ...(invoicing ? {
        merchantTIN: v.merchantTIN.trim(),
        ...(v.merchantName.trim() ? { merchantName: v.merchantName.trim() } : {}),
        ...(address ? { merchantAddress: address } : {}),
        eInvoicingHubEnabled: v.eInvoicingHubEnabled,
      } : {}),
    },
    enabledCapabilities: v.enabledCapabilities,
  };
}

/* ════════════════════════════════════════════════════════════════════
 * PROPOSAL - eparagony-setup-form.tsx
 * ════════════════════════════════════════════════════════════════════ */

const PRINTER_CHECKLIST = (
  <Alert tone="info" title="Before you connect your printer">
    <p>
      eparagony.pl registers a sale with your own fiscal printer. Three things need to be set up
      first, usually by your printer servicer:
    </p>
    <ul className="check-list">
      <li><span><strong>An online fiscal printer</strong> - Posnet, Novitus or Elzab - connected to the internet.</span><StatusBadge tone="neutral" compact>Your equipment</StatusBadge></li>
      <li><span><strong>eparagony.pl&apos;s printer-control software</strong> running on the machine next to the printer.</span><StatusBadge tone="neutral" compact>Your equipment</StatusBadge></li>
      <li><span><strong>The device set up for e-receipts</strong> by your printer servicer.</span><StatusBadge tone="neutral" compact>Ask your servicer</StatusBadge></li>
    </ul>
  </Alert>
);

function EparagonySetupForm({ values, setValues, submitted, setSubmitted, created, setCreated }) {
  const errors = submitted ? validate(values) : {};
  const errorMessages = Object.values(errors).filter((m) => m !== 'Required.');
  const addressErrorCount = ADDRESS_PARTS.filter((k) => errors[k]).length;
  const receipts = values.enabledCapabilities.includes('Fiscalization');
  const invoices = values.enabledCapabilities.includes('Invoicing');

  const set = (key) => (event) => setValues({ ...values, [key]: event.target.value });
  const toggleCapability = (capability) => {
    const has = values.enabledCapabilities.includes(capability);
    const next = has ? values.enabledCapabilities.filter((c) => c !== capability) : [...values.enabledCapabilities, capability];
    // Keep the product order (receipts, invoices), not the click order.
    setValues({ ...values, enabledCapabilities: DOCUMENT_CHOICES.map((d) => d.capability).filter((c) => next.includes(c)) });
  };

  const onSubmit = (event) => {
    event.preventDefault();
    setSubmitted(true);
    if (Object.keys(validate(values)).length === 0) setCreated(toCreateConnectionInput(values));
  };

  if (created) return <CreatedState body={created} onBack={() => setCreated(null)} />;

  const text = (key, label, description, extra = {}) => (
    <FormField label={label} name={key} error={errors[key]} description={description}>
      <Input value={values[key]} onChange={set(key)} autoComplete="off" invalid={Boolean(errors[key])} {...extra} />
    </FormField>
  );

  return (
    <form className="wizard-card" onSubmit={onSubmit} noValidate>
      <BackLink label="Connections" className="wizard-card__back" />

      {submitted && errorMessages.length + (addressErrorCount > 0 ? 1 : 0) > 0 ? (
        <FormErrorSummary errors={[...errorMessages, ...(addressErrorCount > 0 ? ['Complete the seller address, or leave it empty.'] : [])]} />
      ) : null}

      <fieldset className={['capability-fieldset', errors.enabledCapabilities ? 'capability-fieldset--invalid' : ''].filter(Boolean).join(' ')} aria-describedby="doc-choice-help">
        <legend className="capability-fieldset__legend">What should this connection issue?</legend>
        <p className="muted-text capability-fieldset__help" id="doc-choice-help">
          Pick one or both. You can change this later on the connection&rsquo;s detail page.
        </p>
        <ul className="capability-list">
          {DOCUMENT_CHOICES.map((choice) => {
            const id = `new-cap-${choice.capability}`;
            return (
              <li key={choice.capability} className="capability-list__item">
                <label htmlFor={id} className="capability-list__label">
                  <input id={id} type="checkbox" checked={values.enabledCapabilities.includes(choice.capability)} onChange={() => toggleCapability(choice.capability)} />
                  <span className="capability-list__name">{choice.label}</span>
                  <span className="capability-list__code">{choice.capability}</span>
                </label>
                <p className="capability-list__help muted-text">{choice.help}</p>
              </li>
            );
          })}
        </ul>
        <FieldError id="doc-choice-error" message={errors.enabledCapabilities} />
      </fieldset>

      {receipts && invoices ? (
        <Alert tone="info" density="compact">
          An order gets one document, never both. After connecting, add a rule in Settings → Sales
          documents that says which orders get a receipt and which get an invoice. Until then, orders
          wait instead of getting a guessed document.
        </Alert>
      ) : null}

      <div className="setup-lane">
        <h3 className="setup-lane__title">eparagony.pl account</h3>
        {text('name', 'Connection name', 'A label to identify this eparagony.pl account in OpenLinker.', { placeholder: 'My eparagony.pl account' })}
        <FormField label="Environment" name="environment" description="Sandbox has no fiscal device attached, so nothing prints or registers for real.">
          <Select value={values.environment} onChange={set('environment')}>
            <option value="sandbox">Sandbox - https://sandbox.eparagony.pl</option>
            <option value="production">Production - https://api.eparagony.pl</option>
          </Select>
        </FormField>
        {text('clientId', 'Client ID', 'Issued by eparagony.pl when your integration was approved.')}
        {text('clientSecret', 'Client secret', 'Stored securely on the server and never shown again after saving.', { type: 'password', placeholder: '••••••••••••••••••••••••' })}
        {text('posId', 'POS ID', 'The register or till identifier eparagony.pl stamps on every document.')}
        {text('integrationId', 'Integration ID (optional)', 'Of the form integration:secret. Leave blank if you were not given one.', { placeholder: 'openlinker:abc123' })}
      </div>

      {receipts ? (
        <div className="setup-lane">
          <h3 className="setup-lane__title">Fiscal e-receipts</h3>
          {PRINTER_CHECKLIST}
        </div>
      ) : null}

      {invoices ? (
        <div className="setup-lane">
          <h3 className="setup-lane__title">Seller on invoices</h3>
          <p className="setup-lane__help">eparagony.pl prints these on every invoice this connection issues, as the seller.</p>
          {text('merchantTIN', 'Tax number (NIP)', 'Must be the same NIP as on your eparagony.pl account. eparagony.pl refuses every invoice under a different number.', { inputMode: 'numeric', placeholder: '1234567890' })}
          {text('merchantName', 'Seller name (optional)', 'The name as registered. Invoices work without it; a correction needs it.', { autoComplete: 'organization' })}
          <fieldset className="eparagony-seller__address" aria-labelledby="seller-address-legend">
            <legend className="form-field__label" id="seller-address-legend">Seller address (optional)</legend>
            <div className="eparagony-seller__address-row eparagony-seller__address-row--street">
              {text('merchantStreet', 'Street', undefined, { placeholder: 'Prosta' })}
              {text('merchantNumber', 'Building', undefined, { placeholder: '51' })}
              {text('merchantApartment', 'Apartment')}
            </div>
            <div className="eparagony-seller__address-row eparagony-seller__address-row--city">
              {text('merchantPostalCode', 'Postal code', undefined, { placeholder: '00-838' })}
              {text('merchantCity', 'City', undefined, { placeholder: 'Warszawa' })}
              {text('merchantCountry', 'Country', undefined, { placeholder: 'PL' })}
            </div>
            <p className="form-field__description">
              Invoices work without it; a correction needs it. Leave it empty, or fill in every part except the apartment.
            </p>
          </fieldset>
          <div className="setup-lane__toggle">
          <label className="setup-lane__toggle-label" htmlFor="eInvoicingHubEnabled">
            <input id="eInvoicingHubEnabled" type="checkbox" checked={values.eInvoicingHubEnabled}
              onChange={(e) => setValues({ ...values, eInvoicingHubEnabled: e.target.checked })} />
            <span>Send invoices on to KSeF</span>
          </label>
          <p className="form-field__description">
            {values.eInvoicingHubEnabled
              ? 'Before the first invoice: give eparagony.pl permission to issue invoices in the KSeF taxpayer app, and switch KSeF on in panel.eparagony.pl. Without both, eparagony.pl refuses the invoice.'
              : 'Off: invoices are issued outside KSeF, which is a complete result. Turn it on once eparagony.pl may send to KSeF for you.'}
          </p>
          </div>
        </div>
      ) : null}

      <div className="form-actions">
        <Button type="submit">Connect eparagony.pl</Button>
      </div>
    </form>
  );
}

function CreatedState({ body, onBack }) {
  const invoices = body.enabledCapabilities.includes('Invoicing');
  const both = body.enabledCapabilities.length === 2;
  return (
    <div className="wizard-card">
      <Alert tone="success" title="Connection created">
        eparagony.pl connection &ldquo;{body.name}&rdquo; was created
        {invoices ? ' with the seller details invoices need.' : '.'}
      </Alert>
      {invoices || both ? (
        <Alert tone="warning" title="Before the first invoice">
          <ul className="next-steps">
            {invoices ? (
              <li>
                <span>Set up an invoice numbering series. Without one, issuing an invoice stops and asks for it.</span>
                <a href="#" onClick={(e) => e.preventDefault()}>Set up numbering</a>
              </li>
            ) : null}
            {both ? (
              <li>
                <span>Add a sales-document rule: which orders get a receipt, which an invoice.</span>
                <a href="#" onClick={(e) => e.preventDefault()}>Open sales documents</a>
              </li>
            ) : null}
          </ul>
        </Alert>
      ) : null}
      <div className="form-actions">
        <Button type="button">Test connection</Button>
        <Button tone="secondary" type="button" onClick={onBack}>Done</Button>
      </div>
    </div>
  );
}

/* Stable state names. Issues, PRs and E2E specs cite these, never a
   free-text description of the screen (docs/frontend-architecture.md § UX Mockups). */
function stateOf(values, submitted, created) {
  if (created) {
    const caps = created.enabledCapabilities;
    return caps.length === 2 ? 'created-both' : caps[0] === 'Invoicing' ? 'created-invoices' : 'created-receipts';
  }
  const errors = submitted ? validate(values) : {};
  if (errors.enabledCapabilities) return 'none-selected';
  if (errors.merchantTIN) return 'invoices-missing-nip';
  const caps = values.enabledCapabilities;
  if (caps.length === 2) return 'both';
  return caps[0] === 'Invoicing' ? 'invoices-only' : 'receipts-only';
}

/* ════════════════════════════════════════════════════════════════════
 * Proposal frame
 * ════════════════════════════════════════════════════════════════════ */

const SCENARIOS = {
  'Receipts only': { ...DEFAULT_VALUES },
  'Invoices only': { ...DEFAULT_VALUES, enabledCapabilities: ['Invoicing'] },
  'Both': { ...DEFAULT_VALUES, enabledCapabilities: ['Fiscalization', 'Invoicing'] },
  'Filled, invoices': {
    ...DEFAULT_VALUES, enabledCapabilities: ['Invoicing'], name: 'eparagony.pl sandbox', clientId: 'demo-client-id',
    clientSecret: 'x', posId: 'openlinker', merchantTIN: '5252556107', merchantName: 'OpenLinker Test Sp. z o.o.',
  },
};

function App() {
  const [values, setValues] = useState(SCENARIOS['Receipts only']);
  const [submitted, setSubmitted] = useState(false);
  const [created, setCreated] = useState(null);
  const chips = [
    ...(values.enabledCapabilities.includes('Fiscalization') ? ['Fiscalization'] : []),
    ...(values.enabledCapabilities.includes('Invoicing') ? ['Invoicing'] : []),
    'Guided setup',
  ];
  const load = (name, submit = false) => { setValues(SCENARIOS[name]); setCreated(null); setSubmitted(submit); };

  return (
    <div className="proposal">
      <main className="proposal__app" data-state={stateOf(values, submitted, created)}>
        <PageLayout
          eyebrow="Integrations"
          title="Connect eparagony.pl"
          description="OpenLinker hands a sale to eparagony.pl, which issues a fiscal e-receipt on your own printer, an invoice, or both. Connecting does not issue anything by itself."
          summary={<div className="toolbar__group">{chips.map((c) => <span key={c} className="toolbar-chip">{c}</span>)}</div>}
        >
          <EparagonySetupForm values={values} setValues={setValues} submitted={submitted} setSubmitted={setSubmitted} created={created} setCreated={setCreated} />
        </PageLayout>
      </main>

      <aside className="proposal__notes" aria-label="Opis propozycji">
        <div className="proposal__note">
          <span className="proposal__badge">propozycja</span>
          <h3>Podgląd stanów</h3>
          <div className="proposal__scenarios">
            {Object.keys(SCENARIOS).map((name) => (
              <Button key={name} tone="secondary" onClick={() => load(name)}>{name}</Button>
            ))}
            <Button tone="secondary" onClick={() => { setValues({ ...DEFAULT_VALUES, enabledCapabilities: [] }); setCreated(null); setSubmitted(true); }}>Nic nie wybrane</Button>
            <Button tone="secondary" onClick={() => { setValues({ ...SCENARIOS['Filled, invoices'], merchantTIN: '' }); setCreated(null); setSubmitted(true); }}>Faktury bez NIP</Button>
            <Button tone="secondary" onClick={() => { const v = SCENARIOS['Filled, invoices']; setValues(v); setSubmitted(true); setCreated(toCreateConnectionInput(v)); }}>Po utworzeniu: faktury</Button>
            <Button tone="secondary" onClick={() => { const v = { ...SCENARIOS['Filled, invoices'], enabledCapabilities: ['Fiscalization', 'Invoicing'] }; setValues(v); setSubmitted(true); setCreated(toCreateConnectionInput(v)); }}>Po utworzeniu: oba</Button>
          </div>
          <p style={{ margin: 0 }}>Formularz jest klikalny. „Connect” waliduje, a body requestu pojawia się w tym panelu.</p>
          <p style={{ margin: 0 }}>Aktualny stan: <code>data-state="{stateOf(values, submitted, created)}"</code></p>
        </div>

        {created ? (
          <div className="proposal__note">
            <h3>Body wysłane do POST /connections</h3>
            <pre className="mono-text" style={{ margin: 0, overflowX: 'auto', fontSize: '0.6875rem' }}>{JSON.stringify(created, null, 2)}</pre>
          </div>
        ) : null}

        <div className="proposal__note">
          <h3>Co się zmienia w kodzie</h3>
          <ol>
            <li><code>eparagony-setup.schema.ts</code>: <code>enabledCapabilities</code> z checkboxów (min. 1) zamiast zaszytego <code>['Fiscalization']</code>.</li>
            <li>Gdy jest <code>Invoicing</code>: <code>merchantTIN</code> wymagany, adres wszystko albo nic, <code>eInvoicingHubEnabled</code> domyślnie off.</li>
            <li>Lista „Before you connect” dotyczy drukarki, więc tylko przy e-paragonach.</li>
            <li>Po utworzeniu: przy fakturach link do serii numeracji, przy obu typach link do reguł dokumentów. To dwa kolejne ciche faile.</li>
          </ol>
        </div>

        <div className="proposal__note">
          <h3>Bez zmian</h3>
          <ul>
            <li>Backend: walidator już przyjmuje te pola.</li>
            <li>Komponenty i CSS: istniejące, wzorzec <code>capability-fieldset</code> z kreatora WooCommerce.</li>
            <li>Edycja połączenia: akordeon „Seller on invoices” z poprzedniej zmiany.</li>
          </ul>
        </div>
      </aside>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
