<style>
/* Layout: app shell canvas, one page-section, grouped list by connection, right-side detail sheet.
   Tokens copied 1:1 from apps/web/src/index.css (light :root + html[data-theme=dark]). */
:root {
  --font-sans: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg-canvas: oklch(99% 0.003 80); --bg-shell: oklch(97.5% 0.004 80); --bg-surface: #ffffff;
  --bg-surface-muted: oklch(96% 0.005 80); --bg-surface-hover: oklch(93% 0.006 80);
  --border-subtle: oklch(93.5% 0.006 80); --border-default: oklch(88% 0.008 80); --border-strong: oklch(78% 0.010 80);
  --text-primary: oklch(20% 0.012 80); --text-secondary: oklch(38% 0.010 80); --text-muted: oklch(52% 0.008 80);
  --text-on-primary: oklch(18% 0.012 50); --text-link: oklch(50% 0.14 250);
  --accent-primary: oklch(68% 0.18 50); --accent-primary-hover: oklch(62% 0.19 50);
  --accent-primary-soft: oklch(96% 0.04 60); --accent-primary-border: oklch(85% 0.10 55);
  --accent-ring: oklch(68% 0.18 50 / 0.30);
  --status-success: oklch(54% 0.14 150); --status-success-soft: oklch(96% 0.04 150); --status-success-border: oklch(85% 0.08 150); --status-success-strong: oklch(36% 0.12 150);
  --status-warning: oklch(72% 0.16 85); --status-warning-soft: oklch(96% 0.05 85); --status-warning-border: oklch(85% 0.10 85); --status-warning-strong: oklch(42% 0.12 80);
  --status-info: oklch(56% 0.14 245); --status-info-soft: oklch(96% 0.03 245); --status-info-border: oklch(85% 0.08 245); --status-info-strong: oklch(40% 0.12 245);
  --status-disabled-soft: oklch(95% 0.005 80); --status-disabled-border: oklch(85% 0.008 80); --status-disabled-strong: oklch(38% 0.010 80);
  --channel-allegro: oklch(70% 0.18 35); --channel-prestashop: oklch(60% 0.18 250); --channel-erli: oklch(66% 0.17 320); --channel-inpost: oklch(75% 0.15 90); --channel-shopify: oklch(64% 0.16 150); --channel-woocommerce: oklch(58% 0.15 300);
  --shadow-overlay: 0 24px 48px rgb(15 18 26 / 0.16), 0 8px 16px rgb(15 18 26 / 0.08);
  --overlay-scrim: rgb(15 18 26 / 0.45);
  --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem; --space-5: 1.5rem; --space-6: 2rem;
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 10px;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg-canvas: oklch(14% 0.005 270); --bg-shell: oklch(16% 0.006 270); --bg-surface: oklch(19% 0.007 270);
  --bg-surface-muted: oklch(24% 0.009 270); --bg-surface-hover: oklch(28% 0.010 270);
  --border-subtle: oklch(24% 0.010 270); --border-default: oklch(30% 0.012 270); --border-strong: oklch(42% 0.014 270);
  --text-primary: oklch(96% 0.006 270); --text-secondary: oklch(78% 0.010 270); --text-muted: oklch(60% 0.012 270);
  --text-on-primary: oklch(16% 0.012 50); --text-link: oklch(76% 0.14 245);
  --accent-primary: oklch(72% 0.18 50); --accent-primary-hover: oklch(78% 0.18 50); --accent-primary-soft: oklch(28% 0.08 50); --accent-primary-border: oklch(40% 0.14 55); --accent-ring: oklch(72% 0.18 50 / 0.40);
  --status-success-soft: oklch(26% 0.06 150); --status-success-border: oklch(36% 0.10 150); --status-success-strong: oklch(86% 0.14 150);
  --status-warning-soft: oklch(28% 0.07 85); --status-warning-border: oklch(38% 0.10 85); --status-warning-strong: oklch(88% 0.14 85);
  --status-info-soft: oklch(26% 0.06 245); --status-info-border: oklch(36% 0.10 245); --status-info-strong: oklch(86% 0.12 245);
  --status-disabled-soft: oklch(24% 0.009 270); --status-disabled-border: oklch(34% 0.012 270); --status-disabled-strong: oklch(78% 0.010 270);
  --overlay-scrim: rgb(0 0 0 / 0.6); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg-canvas: oklch(14% 0.005 270); --bg-shell: oklch(16% 0.006 270); --bg-surface: oklch(19% 0.007 270);
  --bg-surface-muted: oklch(24% 0.009 270); --bg-surface-hover: oklch(28% 0.010 270);
  --border-subtle: oklch(24% 0.010 270); --border-default: oklch(30% 0.012 270); --border-strong: oklch(42% 0.014 270);
  --text-primary: oklch(96% 0.006 270); --text-secondary: oklch(78% 0.010 270); --text-muted: oklch(60% 0.012 270);
  --text-on-primary: oklch(16% 0.012 50); --text-link: oklch(76% 0.14 245);
  --accent-primary: oklch(72% 0.18 50); --accent-primary-hover: oklch(78% 0.18 50); --accent-primary-soft: oklch(28% 0.08 50); --accent-primary-border: oklch(40% 0.14 55); --accent-ring: oklch(72% 0.18 50 / 0.40);
  --status-success-soft: oklch(26% 0.06 150); --status-success-border: oklch(36% 0.10 150); --status-success-strong: oklch(86% 0.14 150);
  --status-warning-soft: oklch(28% 0.07 85); --status-warning-border: oklch(38% 0.10 85); --status-warning-strong: oklch(88% 0.14 85);
  --status-info-soft: oklch(26% 0.06 245); --status-info-border: oklch(36% 0.10 245); --status-info-strong: oklch(86% 0.12 245);
  --status-disabled-soft: oklch(24% 0.009 270); --status-disabled-border: oklch(34% 0.012 270); --status-disabled-strong: oklch(78% 0.010 270);
  --overlay-scrim: rgb(0 0 0 / 0.6); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; }
.shell { max-width: 1180px; margin: 0 auto; padding-block: var(--space-6) var(--space-8, 4rem);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono-text { font-family: var(--font-mono); font-size: .78rem; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); border-radius: var(--radius-sm); }

/* PageLayout */
.page-section { display: grid; gap: var(--space-5); }
.page-header { display: flex; flex-wrap: wrap; gap: var(--space-4); justify-content: space-between; align-items: flex-start; }
.page-header__content { display: grid; gap: var(--space-2); max-width: 64ch; min-width: 0; }
.eyebrow { margin: 0; font-size: .76rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-primary-hover); }
.page-title { margin: 0; font-size: 1.6rem; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.page-description { margin: 0; color: var(--text-secondary); }
.page-header__actions { display: flex; gap: var(--space-2); }

/* Button / Input */
.button { display: inline-flex; align-items: center; gap: var(--space-2); height: 2rem; padding: 0 var(--space-4);
  border: 1px solid var(--accent-primary-border); border-radius: var(--radius-md); background: var(--accent-primary);
  color: var(--text-on-primary); font: 500 .8125rem var(--font-sans); cursor: pointer; transition: transform .12s var(--ease-out), background .15s; }
.button:hover { background: var(--accent-primary-hover); }
.button:active { transform: translateY(1px) scale(.98); }
.button--secondary { background: var(--bg-surface); color: var(--text-primary); border-color: var(--border-default); }
.button--secondary:hover { background: var(--bg-surface-hover); }
.button--ghost { background: transparent; border-color: transparent; color: var(--text-secondary); padding: 0 var(--space-2); }
.button--ghost:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
.input { height: 2rem; padding: 0 var(--space-3); border: 1px solid var(--border-default); border-radius: var(--radius-md);
  background: var(--bg-surface); color: var(--text-primary); font: .8125rem var(--font-sans); min-width: 0; }
.input::placeholder { color: var(--text-muted); }
.field { display: grid; gap: var(--space-1); }
.field__label { font-size: .75rem; font-weight: 500; color: var(--text-secondary); }

/* StatusBadge */
.status-badge { display: inline-flex; align-items: center; gap: var(--space-2); padding: 2px var(--space-2);
  border: 1px solid var(--status-disabled-border); border-radius: var(--radius-sm); background: var(--status-disabled-soft);
  color: var(--status-disabled-strong); font: 500 .6875rem/1.5 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.status-badge__dot { width: .375rem; height: .375rem; border-radius: 999px; background: currentColor; opacity: .75; }
.status-badge--success { background: var(--status-success-soft); border-color: var(--status-success-border); color: var(--status-success-strong); }
.status-badge--warning { background: var(--status-warning-soft); border-color: var(--status-warning-border); color: var(--status-warning-strong); }
.status-badge--info { background: var(--status-info-soft); border-color: var(--status-info-border); color: var(--status-info-strong); }

/* SegmentedControl */
.segmented { display: inline-flex; border: 1px solid var(--border-default); border-radius: var(--radius-md); }
.segmented__option { display: inline-flex; align-items: center; gap: var(--space-1); padding: var(--space-2) var(--space-3); border: 0; border-right: 1px solid var(--border-default);
  background: var(--bg-surface); color: var(--text-secondary); font: .8125rem var(--font-sans); cursor: pointer; }
.segmented__option:first-child { border-radius: var(--radius-md) 0 0 var(--radius-md); }
.segmented__option:last-child { border-right: 0; border-radius: 0 var(--radius-md) var(--radius-md) 0; }
.segmented__option[aria-pressed="true"] { background: var(--accent-primary); color: var(--text-on-primary); font-weight: 600; }
.segmented__option[aria-pressed="true"] .segmented__count { color: inherit; }
.segmented__count { font-family: var(--font-mono); font-size: .72rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }

/* Explainer (NEW: CursorExplainer) */
.explainer { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1px; background: var(--border-subtle);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }
.explainer__item { background: var(--bg-surface); padding: var(--space-4); display: grid; gap: var(--space-2); align-content: start; }
.explainer__item h3 { margin: 0; font-size: .875rem; font-weight: 600; display: flex; align-items: center; gap: var(--space-2); }
.explainer__item p { margin: 0; color: var(--text-secondary); font-size: .8125rem; }
.explainer__glyph { font-family: var(--font-mono); font-size: .72rem; color: var(--text-muted); }

.toolbar { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: end; }
.toolbar .grow { flex: 1 1 220px; min-width: 0; }

/* Grouped list (DataTable with groups) */
.group { border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--bg-surface); overflow: hidden; }
.group__head { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; justify-content: space-between;
  padding: var(--space-3) var(--space-4); background: var(--bg-shell); border-bottom: 1px solid var(--border-subtle); }
.entity { display: inline-flex; align-items: center; gap: var(--space-2); min-width: 0; font-weight: 600; }
.entity__dot { width: .5rem; height: .5rem; border-radius: 999px; flex: none; }
.conn-dot { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; flex: none; }
.conn-dot text { fill: #fff; font: 700 9px var(--font-mono); }
.entity__meta { font-weight: 400; color: var(--text-muted); font-size: .8125rem; }
.link { color: var(--text-link); text-decoration: none; font-size: .8125rem; background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; }
.link:hover { text-decoration: underline; }

.cols, .row { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.6fr) 8.5rem 7.5rem 1.25rem; gap: var(--space-4); align-items: center; }
.cols { padding: var(--space-2) var(--space-4); font-size: .72rem; color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--border-subtle); }
.row { width: 100%; text-align: left; padding: var(--space-3) var(--space-4); border: 0; border-top: 1px solid var(--border-subtle);
  background: transparent; color: inherit; font: inherit; cursor: pointer; transition: background .15s; }
.row:first-of-type { border-top: 0; }
.row:hover { background: var(--bg-surface-hover); }
.row:hover .row__chev { transform: translateX(2px); color: var(--text-primary); }
.row__what { display: grid; gap: 2px; min-width: 0; }
.row__label { font-weight: 500; }
.row__key { font-family: var(--font-mono); font-size: .72rem; color: var(--text-muted); overflow-wrap: anywhere; }
.row__pos { min-width: 0; display: grid; gap: 2px; }
.row__pos-main { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.row__pos-sub { font-size: .75rem; color: var(--text-muted); }
.row__time { font-size: .8125rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.row__chev { color: var(--text-muted); transition: transform .2s var(--ease-out), color .15s; font-size: 1rem; }
.empty-value { color: var(--text-muted); }

.bundle { border-top: 1px solid var(--border-subtle); }
.bundle__toggle { width: 100%; border: 0; background: var(--bg-surface-muted); padding: var(--space-3) var(--space-4); display: flex;
  gap: var(--space-3); align-items: center; cursor: pointer; color: var(--text-secondary); font: .8125rem var(--font-sans); text-align: left; }
.bundle__toggle:hover { color: var(--text-primary); }
.bundle__caret { transition: transform .25s var(--ease-out); display: inline-block; }
.bundle[data-open="true"] .bundle__caret { transform: rotate(90deg); }
.bundle__body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--ease-out); }
.bundle[data-open="true"] .bundle__body { grid-template-rows: 1fr; }
.bundle__inner { overflow: hidden; }

.list { display: grid; gap: var(--space-4); }
.sample-note { font-size: .75rem; color: var(--text-muted); }

/* Sheet (NEW: CursorDetailSheet, built on the app Dialog) */
.scrim { position: fixed; inset: 0; background: var(--overlay-scrim); opacity: 0; transition: opacity .25s; z-index: 40; }
.scrim[data-open="true"] { opacity: 1; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--bg-surface); z-index: 41;
  box-shadow: var(--shadow-overlay); border-left: 1px solid var(--border-default); transform: translateX(104%);
  transition: transform .38s var(--ease-out); display: grid; grid-template-rows: auto 1fr;
  padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet[data-open="true"] { transform: none; }
.sheet__head { padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border-subtle); display: grid; gap: var(--space-2); }
.sheet__top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
.sheet__title { margin: 0; font-size: 1.125rem; font-weight: 600; text-wrap: balance; }
.sheet__body { overflow-y: auto; padding: var(--space-5); display: grid; gap: var(--space-5); align-content: start; }
.sheet section { display: grid; gap: var(--space-2); }
.sheet h3 { margin: 0; font-size: .8125rem; font-weight: 600; color: var(--text-secondary); }
.sheet p { margin: 0; color: var(--text-secondary); font-size: .875rem; }
.kv { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: var(--space-2) var(--space-3); margin: 0; font-size: .8125rem; }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.copy { display: flex; gap: var(--space-2); align-items: flex-start; padding: var(--space-2) var(--space-3); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); background: var(--bg-surface-muted); }
.copy code { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: .78rem; overflow-wrap: anywhere; }
.copy button { flex: none; }
.callout { padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); border: 1px solid var(--status-info-border); background: var(--status-info-soft); color: var(--status-info-strong); font-size: .8125rem; }
.callout--warning { border-color: var(--status-warning-border); background: var(--status-warning-soft); color: var(--status-warning-strong); }
.steps { margin: 0; padding-left: 1.1rem; color: var(--text-secondary); font-size: .8125rem; display: grid; gap: var(--space-1); }
.sheet__actions { display: flex; flex-wrap: wrap; gap: var(--space-2); }

.toast { position: fixed; left: 50%; bottom: calc(var(--space-5) + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); opacity: 0;
  background: var(--text-primary); color: var(--bg-surface); padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); font-size: .8125rem;
  transition: opacity .2s, transform .25s var(--ease-out); z-index: 60; pointer-events: none; max-width: calc(100vw - 32px); }
.toast[data-show="true"] { opacity: 1; transform: translate(-50%, 0); }

/* v2 additions */
.status-badge--error { background: oklch(96% 0.04 25); border-color: oklch(85% 0.10 25); color: oklch(42% 0.16 25); }
:root[data-theme="dark"] .status-badge--error { background: oklch(28% 0.10 25); border-color: oklch(40% 0.14 25); color: oklch(86% 0.14 25); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .status-badge--error { background: oklch(28% 0.10 25); border-color: oklch(40% 0.14 25); color: oklch(86% 0.14 25); } }
.attention { border: 1px solid var(--status-warning-border); background: var(--status-warning-soft); border-radius: var(--radius-lg); padding: var(--space-4); display: grid; gap: var(--space-3); }
.attention__title { margin: 0; font-size: .9375rem; font-weight: 600; color: var(--status-warning-strong); }
.attention__list { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--space-2); }
.attention__item { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: baseline; font-size: .8125rem; color: var(--text-primary); }
.attention__item strong { font-weight: 600; }
.allgood { border: 1px solid var(--status-success-border); background: var(--status-success-soft); color: var(--status-success-strong); border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); font-size: .875rem; }
.verdict { display: inline-flex; gap: var(--space-2); align-items: center; font-size: .8125rem; color: var(--text-secondary); flex-wrap: wrap; }
.group__actions { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
.switch { display: inline-flex; align-items: center; gap: var(--space-2); font-size: .8125rem; color: var(--text-secondary); cursor: pointer; height: 2rem; }
.switch input { width: 1rem; height: 1rem; accent-color: var(--accent-primary); }
.row__job { font-size: .75rem; color: var(--text-muted); }
.row__job--fail { color: oklch(52% 0.18 25); }
.note-row { padding: var(--space-4); color: var(--text-secondary); font-size: .8125rem; display: grid; gap: var(--space-1); }
.field-error { font-size: .75rem; color: oklch(50% 0.18 25); }
.choice { display: grid; gap: var(--space-2); }
.choice label { display: flex; gap: var(--space-2); align-items: flex-start; padding: var(--space-3); border: 1px solid var(--border-default); border-radius: var(--radius-md); cursor: pointer; font-size: .8125rem; }
.choice label:has(input:checked) { border-color: var(--accent-primary-border); background: var(--accent-primary-soft); }
.choice small { display: block; color: var(--text-muted); }
.choice-card { display: grid; gap: 2px; padding: var(--space-3); border: 1px solid var(--accent-primary-border); border-radius: var(--radius-md); background: var(--accent-primary-soft); font-size: .8125rem; }
.choice-card span { font-weight: 500; }
.choice-card small { color: var(--text-muted); font-size: .75rem; }
.consequence { padding: var(--space-3); border-radius: var(--radius-md); background: var(--bg-surface-muted); font-size: .8125rem; color: var(--text-secondary); border: 1px dashed var(--border-strong); }
.rewind { display: grid; gap: var(--space-3); animation: rise .28s var(--ease-out); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.tech { display: grid; gap: var(--space-2); }
.tech summary { cursor: pointer; font-size: .8125rem; font-weight: 600; color: var(--text-secondary); }
/* SidePanel (shared/ui/side-panel.tsx): floating right drawer on desktop, vaul-style bottom sheet <= 640px */
.sheet, .guide { background: var(--bg-surface-elevated, var(--bg-surface)); }
@media (min-width: 641px) {
  .sheet, .guide { top: 8px; right: 8px; bottom: 8px; border: 1px solid var(--border-default); border-radius: 14px; overflow: hidden; transform: translateX(calc(100% + 16px)); }
  .scrim, .guide-scrim { backdrop-filter: blur(3px) saturate(.85); -webkit-backdrop-filter: blur(3px) saturate(.85); }
}
.sheet__head, .guide__head { padding: var(--space-4) var(--space-5); }
.sheet__kicker { font-size: .8125rem; color: var(--text-secondary); }
.guide__top h2 { font-size: 1.125rem; }
.panel__handle { display: none; }

/* NEW: features/cursors/lib/read-cursor-health.ts
   Health is judged on TIME against the expected cadence, never on the value. */
const NOW = new Date('2026-11-06T10:00:00Z');
const minutesSince = (iso) => (NOW - new Date(iso)) / 60000;

function readHealth(cursor, conn) {
  const d = describeCursor(cursor.cursorKey);
  if (d.platform && d.platform !== conn.platform) return { id: 'misplaced', label: 'Wrong connection', tone: 'error', why: `This bookmark belongs to ${d.platform} but sits on a ${conn.platform} connection. A sync wrote it under the wrong connection.` };
  if (cursor.lastJob?.status === 'failed') return { id: 'failing', label: 'Failing', tone: 'error', why: `Last run failed: ${cursor.lastJob.error}` };
  if (!d.cadence) return { id: 'ok', label: 'OK', tone: 'neutral' };
  const m = minutesSince(cursor.updatedAt);
  if (cursor.value === '' && d.kind === 'sweep-cycle') return { id: 'ok', label: 'On time', tone: 'success' };
  if (m > d.cadence * 6) return { id: 'stuck', label: 'Not moving', tone: 'warning', why: `Has not run for ${ago(cursor.updatedAt).replace(/ ago$/, '')}. It normally runs every ${d.cadence} min.` };
  if (m > d.cadence * 2) return { id: 'late', label: 'Late', tone: 'warning', why: `Last ran ${ago(cursor.updatedAt)}, expected every ${d.cadence} min.` };
  return { id: 'ok', label: 'On time', tone: 'success' };
}

/* Progress sentence, operator words first; the raw value lives in the sheet. */
function readProgress(cursor, stamps) {
  const d = describeCursor(cursor.cursorKey);
  const v = cursor.value;
  if (d.kind === 'sweep-cycle') {
    if (v === '') {
      const done = stamps[d.stamp];
      return { main: 'Finished, waiting for next pass', sub: done ? `Last pass done ${ago(done)}` : 'Next pass starts on schedule', empty: true };
    }
    const [cycleId, offset] = v.split(':');
    return { main: `In progress: ${Number(offset).toLocaleString('en')} items done`, sub: 'Continues on the next run', parsed: { cycleId, offset } };
  }
  if (v === '') return { main: 'Not started yet', sub: d.kind ? 'Waiting for the first run' : null, empty: true };
  if (d.kind === 'rolling-offset') return { main: `Checked up to item ${Number(v).toLocaleString('en')}`, sub: 'Starts over at the end' };
  if (d.kind === 'date-watermark') return { main: `Read up to ${fmt(cursor.updatedAt)}`, sub: null };
  if (d.kind === 'write-order') return { main: `Newest stock sent ${ago(v)}`, sub: null };
  return { main: `Read up to ${fmt(cursor.updatedAt)}`, sub: null };
}

function fmt(iso) { return new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Warsaw' }); }
function ago(iso) {
  const m = Math.round(minutesSince(iso));
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

/* Per-listing marks: aggregated; rows only when the operator searches. */
function WriteOrderBundle({ cursors, conn, stamps, showKeys, onOpen, searching }) {
  const [open, setOpen] = useState(false);

  return (
    <div className="bundle" data-open={isOpen}>

/* NEW: features/cursors/components/RewindPanel.tsx
   Named targets only. No free-text value editing. Refused while a pass runs. */
function RewindPanel({ cursor, notify }) {
  const d = describeCursor(cursor.cursorKey);
  const [confirming, setConfirming] = useState(false);
  if (d.rewind === 'restart' && cursor.value === '') return <p>The last pass already finished. Use Run now to start the next one early.</p>;
  const isPass = d.rewind === 'restart';
  return (
    <div className="rewind">
      <div className="choice-card">
        <span>{isPass ? 'Start the pass over' : 'Start the check over'}</span>
        <small>{isPass ? 'Drops the current pass. The next run reads the whole catalogue from item 1.' : 'The next run starts again from the first item.'}</small>
      </div>
      {confirming ? (
        <ConfirmDialog title="Confirm" confirmLabel="Start over"
          body={isPass ? 'The current pass is dropped and the next run starts from item 1. Every product is read again, which adds load on the shop for several runs.' : 'The next run re-checks from the first item. Nothing is written to the platform.'}
          onCancel={() => setConfirming(false)} onConfirm={() => { notify('Done. The next run starts over.'); setConfirming(false); }} />
      ) : (
        <div className="sheet__actions"><Button variant="secondary" onClick={() => setConfirming(true)}>Review</Button></div>
      )}
    </div>
  );
}

/* vaul-style drag-to-dismiss (mockup stand-in for SidePanel's motion drag): past 30% of the height, or a flick, closes. */
function useSheetDrag(onClose) {
  const ref = useRef(null);
  const start = useRef(null);
  const onPointerDown = (e) => {
    if (!matchMedia('(max-width: 640px)').matches || e.target.closest('button, a, input')) return;
    start.current = { y: e.clientY, t: performance.now() };
    ref.current.dataset.dragging = 'true';
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e) => { if (!start.current) return; const dy = e.clientY - start.current.y; ref.current.style.setProperty('--drag', `${dy > 0 ? dy : dy * 0.06}px`); };
  const onPointerUp = (e) => {
    if (!start.current) return;
    const dy = e.clientY - start.current.y; const v = dy / Math.max(1, performance.now() - start.current.t) * 1000;
    start.current = null; ref.current.dataset.dragging = 'false'; ref.current.style.setProperty('--drag', '0px');
    if (dy > ref.current.offsetHeight * 0.3 || v > 450) onClose();
  };
  return { ref, handlers: { onPointerDown, onPointerMove, onPointerUp, onPointerCancel: onPointerUp } };
}

                  <span className="gsec__chev" aria-hidden="true">›</span>
                  <span className="gsec__title">{s.title}</span>
                  <span className="gsec__sum">{query ? `${s.shown.length} found` : s.sum}</span>
                </button>
                <div className="gsec__body" id={`gs-${s.id}`}><div className="gsec__inner"><div className="gsec__list">
                  {s.shown.map((i) => <GuideItem key={i.id} item={i} q={query} focused={open && focusId === i.id} />)}
                </div></div></div>
              </section>
            );
          })}
        </div>
        <div className="guide__foot">Press ? anywhere on this page to open the guide, Esc to close it.</div>
      </aside>
    </>
  );
}

const HEALTH_GUIDE_ID = { ok: 'h-ok', late: 'h-late', stuck: 'h-stuck', failing: 'h-failing', misplaced: 'h-misplaced' };
const SYNC_GUIDE_ID = {
  'Automation deadlines': 's-system',
  'New orders': 's-orders', 'Offer changes': 's-offer-changes', 'New returns': 's-returns', 'Changed orders (backup check)': 's-changed-orders',
  'Listing status check': 's-listing-status', 'Parcel tracking check': 's-parcel', 'Shop order status check': 's-shop-status',
  'Product catalogue': 's-catalogue', 'Stock levels': 's-stock', 'Deleted products check': 's-deleted', 'Stock write order': 'p-stock',
};

/* =====================================================================
 * pages/cursors/cursors-list-page.tsx (v2)
 * ===================================================================== */
const HEALTH_FILTERS = [
  { value: 'all', label: 'All' },
  { value: 'problem', label: 'Needs a look' },
  { value: 'ok', label: 'On time' },
];
const isProblem = (h) => ['misplaced', 'failing', 'stuck', 'late'].includes(h.id);

function CursorsListPage() {
  const [connFilter, setConnFilter] = useState('all');
  const [health, setHealth] = useState('all');
  const [search, setSearch] = useState('');
  const [showKeys, setShowKeys] = useState(false);
  const [selected, setSelected] = useState(null);
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState('');
  const [guide, setGuide] = useState({ open: false, focus: null });
  const explain = (id) => setGuide({ open: true, focus: id });
  const timer = useRef(0);
  useEffect(() => { const t = setTimeout(() => setLoading(false), 650); return () => clearTimeout(t); }, []);
  useEffect(() => {
    const onKey = (e) => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName ?? '');
      if (e.key === '?' && !typing) { e.preventDefault(); setGuide({ open: true, focus: null }); }
      if (e.key === 'Escape') setGuide((g) => (g.open ? { open: false, focus: null } : g));
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  function notify(msg) { setToast(msg); clearTimeout(timer.current); timer.current = setTimeout(() => setToast(''), 2400); }

  const stamps = useMemo(() => {
    const s = {};
    CURSORS.forEach((c) => { const m = c.cursorKey.match(/^(.+\.completedAt):/); if (m) { (s[c.conn] ??= {})[m[1]] = c.value; } });
    return s;
  }, []);

  const rows = useMemo(() => CURSORS
    .filter((c) => !describeCursor(c.cursorKey).hidden)
    .map((c) => ({ ...c, health: readHealth(c, CONNECTIONS[c.conn]) })), []);

  const problems = rows.filter((r) => isProblem(r.health) && describeCursor(r.cursorKey).kind !== 'write-order');

  const q = search.trim().toLowerCase();
  const visible = rows.filter((r) => {
    if (connFilter !== 'all' && r.conn !== connFilter) return false;
    if (health === 'problem' && !isProblem(r.health)) return false;
    if (health === 'ok' && isProblem(r.health)) return false;
    if (!q) return true;
    return r.cursorKey.toLowerCase().includes(q) || describeCursor(r.cursorKey).label.toLowerCase().includes(q);
  });

  const connIds = GROUP_ORDER.filter((id) => connFilter === 'all' || id === connFilter);
  const groups = connIds
    .map((id) => ({ id, rows: visible.filter((r) => r.conn === id), all: rows.filter((r) => r.conn === id) }))
    .filter((g) => g.rows.length || (!q && health === 'all' && g.all.length === 0))
    .sort((a, b) => b.rows.filter((r) => isProblem(r.health)).length - a.rows.filter((r) => isProblem(r.health)).length);

  const countable = rows.filter((r) => describeCursor(r.cursorKey).kind !== 'write-order');
  const counts = { all: countable.length, problem: countable.filter((r) => isProblem(r.health)).length, ok: countable.filter((r) => !isProblem(r.health)).length };

  return (
    <div className="shell">
      <PageLayout
        eyebrow="Diagnostics"
        title="Sync progress"
        description="Every sync remembers how far it got, so the next run continues from there. Check here that orders, stock and listings are still being fetched on time."
        actions={<><label className="switch"><input type="checkbox" id="keys" checked={showKeys} onChange={(e) => setShowKeys(e.target.checked)} />Show technical keys</label><Button variant="secondary" onClick={() => setGuide({ open: true, focus: null })} aria-keyshortcuts="?"><span className="qmark" aria-hidden="true">?</span>How to read this<span className="kbd" aria-hidden="true">?</span></Button></>}
      >
        {loading ? null : problems.length ? (
          <div className="attention" data-state="needs-a-look" role="region" aria-label="Needs a look">
            <div className="gitem__top" style={{ justifyContent: 'space-between' }}><p className="attention__title">{problems.length} {problems.length === 1 ? 'sync needs' : 'syncs need'} a look</p><button type="button" className="help-link" onClick={() => explain('h-late')}>What do these badges mean?</button></div>
            <ul className="attention__list">
              {problems.map((r) => (
                <li key={r.conn + r.cursorKey} className="attention__item">
                  <StatusBadge tone={r.health.tone} withDot>{r.health.label}</StatusBadge>
                  <strong>{CONNECTIONS[r.conn].name}: {describeCursor(r.cursorKey).label}.</strong>
                  <span>{r.health.why}</span>
                  <button type="button" className="link" onClick={() => setSelected(r)}>Details</button>
                </li>
              ))}
            </ul>
          </div>
        ) : <div className="allgood" data-state="all-on-time">All syncs are on time.</div>}

        <div className="toolbar">
          <label className="field">
            <span className="field__label">Connection</span>
            <select className="input" id="conn" value={connFilter} onChange={(e) => setConnFilter(e.target.value)}>
              <option value="all">All connections</option>
              {Object.entries(CONNECTIONS).map(([id, c]) => <option key={id} value={id}>{c.name}</option>)}
            </select>
          </label>
          <label className="field grow">
            <span className="field__label">Search</span>
            <input className="input" id="q" type="search" placeholder="Orders, stock, an offer id…" value={search} onChange={(e) => setSearch(e.target.value)} />
          </label>
          <div className="field">
            <span className="field__label">Health</span>
            <SegmentedControl label="Filter by health" options={HEALTH_FILTERS.map((f) => ({ ...f, count: counts[f.value] }))} value={health} onChange={setHealth} />
          </div>
        </div>

        {loading ? (
          <div className="group" data-state="loading" aria-busy="true" aria-label="Loading sync progress">
            <div className="group__head"><span className="entity__meta">Loading…</span></div>
            {[0, 1, 2, 3].map((i) => <div key={i} className="skeleton" />)}
          </div>
        ) : groups.length === 0 ? (
          <div className="group note-row" data-state="no-match" style={{ textAlign: 'center' }}>
            No syncs match these filters. <span><button type="button" className="link" onClick={() => { setHealth('all'); setSearch(''); setConnFilter('all'); }}>Clear filters</button></span>
          </div>
        ) : (
          <div className="list">
            {groups.map(({ id, rows: gRows, all }) => {
              const conn = CONNECTIONS[id];
              const marks = gRows.filter((r) => describeCursor(r.cursorKey).kind === 'write-order');
              const main = gRows.filter((r) => describeCursor(r.cursorKey).kind !== 'write-order');
              const bad = all.filter((r) => isProblem(r.health)).length;
              return (
                <section key={id} className="group" aria-label={conn.name}>
                  <header className="group__head">
                    <EntityLabel name={conn.name} platform={conn.platform} meta={conn.role} />
                    <div className="group__actions">
                      <span className="verdict">
                        {all.length === 0 ? <StatusBadge tone="neutral">Pushes changes</StatusBadge>
                          : bad ? <StatusBadge tone="warning" withDot>{bad} need a look</StatusBadge>
                          : <StatusBadge tone="success">On time</StatusBadge>}
                      </span>
                      {conn.system ? null : <button type="button" className="link" onClick={() => notify(`Opens /connections/${conn.id.slice(0, 8)}…`)}>Open connection</button>}
                    </div>
                  </header>
                  {all.length === 0 ? (
                    <div className="note-row">
                      <span>{conn.name} sends changes to OpenLinker as they happen, so it keeps no bookmarks. That is normal. <button type="button" className="help-link" onClick={() => explain('h-pushes')}>Why?</button></span>
                    </div>
                  ) : null}
                  {main.length ? (
                    <>
                      <div className="cols"><button type="button" className="cols__btn" onClick={() => explain('s-orders')}>Sync <span className="qmark" aria-hidden="true">?</span></button><button type="button" className="cols__btn" onClick={() => explain('p-readupto')}>Progress <span className="qmark" aria-hidden="true">?</span></button><button type="button" className="cols__btn" onClick={() => explain('h-ok')}>Health <span className="qmark" aria-hidden="true">?</span></button><span>Last moved</span><span /></div>
                      {main.map((c) => <CursorRow key={c.cursorKey} cursor={c} conn={conn} stamps={stamps[id] ?? {}} showKeys={showKeys} onOpen={setSelected} />)}
                    </>
                  ) : null}
                  {marks.length ? <WriteOrderBundle cursors={marks} conn={conn} stamps={stamps[id] ?? {}} showKeys={showKeys} onOpen={setSelected} searching={Boolean(q)} /> : null}
                </section>
              );
            })}
          </div>
        )}
        <p className="sample-note">Example data. Times are relative to 6 Nov 2026, 11:00.</p>
      </PageLayout>

      <CursorDetailSheet cursor={selected} onClose={() => setSelected(null)} notify={notify} stamps={stamps} onExplain={explain} />
      <SyncGuideDrawer open={guide.open} focusId={guide.focus} onClose={() => setGuide({ open: false, focus: null })} />
      <div className="toast" role="status" aria-live="polite" data-show={Boolean(toast)}>{toast}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CursorsListPage />);
</script>
