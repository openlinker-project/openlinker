<title>Order detail v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concept: the order as a story. A masthead carries identity, the amount, and a progress line from
   "placed" to "delivered" with the failure marked where it happened; the systems it was sent to sit
   directly under it. Below that, one loud "needs you" card, then quiet open sections (no card per
   module). Boldness lives in the progress line only. Token names follow apps/web/src/index.css (status-* family, radius-*, accent-primary-*). A few are local to this preview: --bar, --fx, --fy, --tb, --tf, --tg, --tile-l, --tile-fg. */
:root {
  --font-sans: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg-canvas: oklch(99% 0.003 80); --bg-shell: oklch(97.5% 0.004 80); --bg-surface: #ffffff;
  --bg-muted: oklch(96% 0.005 80); --bg-surface-hover: oklch(93% 0.006 80);
  --border-subtle: oklch(93.5% 0.006 80); --border-default: oklch(88% 0.008 80); --border-strong: oklch(76% 0.010 80);
  --text-primary: oklch(20% 0.012 80); --text-secondary: oklch(38% 0.010 80); --text-muted: oklch(50% 0.008 80);
  --text-disabled: oklch(66% 0.005 80); --text-on-primary: oklch(18% 0.012 50); --text-link: oklch(50% 0.14 250);
  --accent-primary: oklch(68% 0.18 50); --accent-primary-hover: oklch(62% 0.19 50); --accent-primary-soft: oklch(96% 0.04 60);
  --accent-primary-soft-strong: oklch(40% 0.16 50); --accent-primary-border: oklch(85% 0.10 55); --accent-ring: oklch(68% 0.18 50 / 0.30);
  --status-success: oklch(54% 0.14 150); --status-success-soft: oklch(96% 0.04 150); --status-success-border: oklch(85% 0.08 150); --status-success-fg: oklch(36% 0.12 150);
  --status-warning: oklch(72% 0.16 85); --status-warning-soft: oklch(96% 0.05 85); --status-warning-border: oklch(85% 0.10 85); --status-warning-fg: oklch(42% 0.12 80);
  --status-error: oklch(58% 0.20 25); --status-error-soft: oklch(96% 0.04 25); --status-error-border: oklch(85% 0.10 25); --status-error-fg: oklch(42% 0.16 25);
  --status-info: oklch(56% 0.14 245); --status-info-soft: oklch(96% 0.03 245); --status-info-border: oklch(85% 0.08 245); --status-info-fg: oklch(40% 0.12 245);
  --status-disabled: oklch(55% 0.008 80); --status-disabled-soft: oklch(95% 0.005 80); --status-disabled-border: oklch(85% 0.008 80); --status-disabled-fg: oklch(38% 0.010 80);
  --tile-l: 92%; --tile-fg: 42%;
  --shadow-sm: 0 1px 2px rgb(15 18 26 / 0.04), 0 1px 3px rgb(15 18 26 / 0.06);
  --shadow-md: 0 2px 4px rgb(15 18 26 / 0.04), 0 8px 24px rgb(15 18 26 / 0.07);
  --shadow-overlay: 0 24px 48px rgb(15 18 26 / 0.16), 0 8px 16px rgb(15 18 26 / 0.08);
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg-canvas: oklch(14% 0.005 270); --bg-shell: oklch(16% 0.006 270); --bg-surface: oklch(19% 0.007 270);
  --bg-muted: oklch(24% 0.009 270); --bg-surface-hover: oklch(28% 0.010 270);
  --border-subtle: oklch(24% 0.010 270); --border-default: oklch(30% 0.012 270); --border-strong: oklch(42% 0.014 270);
  --text-primary: oklch(96% 0.006 270); --text-secondary: oklch(78% 0.010 270); --text-muted: oklch(66% 0.012 270);
  --text-disabled: oklch(46% 0.012 270); --text-on-primary: oklch(16% 0.012 50); --text-link: oklch(76% 0.14 245);
  --accent-primary: oklch(72% 0.18 50); --accent-primary-hover: oklch(78% 0.18 50); --accent-primary-soft: oklch(28% 0.08 50);
  --accent-primary-soft-strong: oklch(86% 0.14 60); --accent-primary-border: oklch(40% 0.14 55); --accent-ring: oklch(72% 0.18 50 / 0.40);
  --status-success: oklch(68% 0.16 150); --status-success-soft: oklch(26% 0.06 150); --status-success-border: oklch(36% 0.10 150); --status-success-fg: oklch(86% 0.14 150);
  --status-warning: oklch(78% 0.16 85); --status-warning-soft: oklch(28% 0.07 85); --status-warning-border: oklch(38% 0.10 85); --status-warning-fg: oklch(88% 0.14 85);
  --status-error: oklch(70% 0.18 25); --status-error-soft: oklch(28% 0.10 25); --status-error-border: oklch(40% 0.14 25); --status-error-fg: oklch(86% 0.14 25);
  --status-info: oklch(72% 0.14 245); --status-info-soft: oklch(26% 0.06 245); --status-info-border: oklch(36% 0.10 245); --status-info-fg: oklch(86% 0.12 245);
  --status-disabled: oklch(65% 0.010 270); --status-disabled-soft: oklch(24% 0.010 270); --status-disabled-border: oklch(34% 0.012 270); --status-disabled-fg: oklch(82% 0.010 270);
  --tile-l: 30%; --tile-fg: 84%;
  --shadow-md: 0 2px 4px rgb(0 0 0 / 0.40), 0 8px 24px rgb(0 0 0 / 0.36);
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.40), 0 1px 3px rgb(0 0 0 / 0.32);
  --shadow-overlay: 0 24px 48px rgb(0 0 0 / 0.60), 0 8px 16px rgb(0 0 0 / 0.40);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-canvas: oklch(14% 0.005 270); --bg-shell: oklch(16% 0.006 270); --bg-surface: oklch(19% 0.007 270);
  --bg-muted: oklch(24% 0.009 270); --bg-surface-hover: oklch(28% 0.010 270);
  --border-subtle: oklch(24% 0.010 270); --border-default: oklch(30% 0.012 270); --border-strong: oklch(42% 0.014 270);
  --text-primary: oklch(96% 0.006 270); --text-secondary: oklch(78% 0.010 270); --text-muted: oklch(66% 0.012 270);
  --text-disabled: oklch(46% 0.012 270); --text-on-primary: oklch(16% 0.012 50); --text-link: oklch(76% 0.14 245);
  --accent-primary: oklch(72% 0.18 50); --accent-primary-hover: oklch(78% 0.18 50); --accent-primary-soft: oklch(28% 0.08 50);
  --accent-primary-soft-strong: oklch(86% 0.14 60); --accent-primary-border: oklch(40% 0.14 55); --accent-ring: oklch(72% 0.18 50 / 0.40);
  --status-success: oklch(68% 0.16 150); --status-success-soft: oklch(26% 0.06 150); --status-success-border: oklch(36% 0.10 150); --status-success-fg: oklch(86% 0.14 150);
  --status-warning: oklch(78% 0.16 85); --status-warning-soft: oklch(28% 0.07 85); --status-warning-border: oklch(38% 0.10 85); --status-warning-fg: oklch(88% 0.14 85);
  --status-error: oklch(70% 0.18 25); --status-error-soft: oklch(28% 0.10 25); --status-error-border: oklch(40% 0.14 25); --status-error-fg: oklch(86% 0.14 25);
  --status-info: oklch(72% 0.14 245); --status-info-soft: oklch(26% 0.06 245); --status-info-border: oklch(36% 0.10 245); --status-info-fg: oklch(86% 0.12 245);
  --status-disabled: oklch(65% 0.010 270); --status-disabled-soft: oklch(24% 0.010 270); --status-disabled-border: oklch(34% 0.012 270); --status-disabled-fg: oklch(82% 0.010 270);
  --tile-l: 30%; --tile-fg: 84%;
  --shadow-md: 0 2px 4px rgb(0 0 0 / 0.40), 0 8px 24px rgb(0 0 0 / 0.36);
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.40), 0 1px 3px rgb(0 0 0 / 0.32);
  --shadow-overlay: 0 24px 48px rgb(0 0 0 / 0.60), 0 8px 16px rgb(0 0 0 / 0.40);
}
* { box-sizing: border-box; }
body { background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 14.5px; line-height: 1.5;
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.muted { color: var(--text-muted); }

/* ---------- artifact chrome (not part of the product) ---------- */
.wrap { max-width: 1360px; margin: 0 auto; display: grid; gap: 14px; }
.intro { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.intro h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.intro p { margin: 4px 0 0; color: var(--text-secondary); max-width: 62ch; }
.picker { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--bg-muted); border: 1px solid var(--border-default); border-radius: var(--radius-md); }
.picker button { border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; color: var(--text-secondary); font-weight: 500; }
.picker button[aria-selected="true"] { background: var(--bg-surface); color: var(--text-primary); box-shadow: var(--shadow-sm); }
.parity { border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); }
.parity summary { cursor: pointer; padding: 12px 16px; font-weight: 600; }
.parity-body { padding: 0 16px 16px; overflow-x: auto; }
.parity table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13px; }
.parity th, .parity td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
.parity th { color: var(--text-muted); font-weight: 500; }

/* ---------- app frame ---------- */
.frame { position: relative; display: grid; grid-template-columns: 60px minmax(0, 1fr); height: min(920px, calc(100dvh - 150px)); min-height: 640px;
  border: 1px solid var(--border-default); border-radius: var(--radius-xl); overflow: hidden; background: var(--bg-canvas); }
.rail { background: var(--bg-shell); border-right: 1px solid var(--border-default); padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: oklch(20% 0.012 80); display: grid; place-items: center; margin-bottom: 10px; }
.ri { position: relative; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--text-muted); border: 0; background: none; }
.ri:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
.ri.on { background: var(--bg-surface); color: var(--text-primary); box-shadow: var(--shadow-sm); }
.ri.on::before { content: ""; position: absolute; left: -11px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent-primary); }
.rail .sp { flex: 1; }
.mainwrap { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr); min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 12px; padding: 0 22px; border-bottom: 1px solid var(--border-default); background: var(--bg-canvas); }
.search { flex: 1; max-width: 420px; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--border-default); border-radius: var(--radius-md); color: var(--text-muted); background: var(--bg-surface); white-space: nowrap; overflow: hidden; }
.search kbd { margin-left: auto; font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--border-default); border-radius: 4px; padding: 0 5px; }
.top .sp { flex: 1; }
.pill-top { display: inline-flex; gap: 6px; align-items: center; padding: 5px 10px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); white-space: nowrap; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-primary), oklch(60% 0.16 20)); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }
.scroller { position: relative; overflow-y: auto; min-height: 0; }

/* ---------- order page ---------- */
.page { container-type: inline-size; }
.page-in { max-width: 1180px; margin: 0 auto; padding: 18px 28px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.page-in > * { min-width: 0; }
.mast-top > div { min-width: 0; }
@container (max-width: 700px) { .page-in { padding: 14px 14px 44px; gap: 18px; } }
.minibar { position: sticky; top: 0; z-index: 6; height: 0; overflow: visible; }
.minibar-in { position: absolute; inset: 0 0 auto 0; display: flex; align-items: center; gap: 12px; padding: 8px 28px; min-height: 54px;
  background: color-mix(in oklab, var(--bg-canvas) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-default); box-shadow: var(--shadow-sm);
  transform: translateY(-110%); transition: transform .34s cubic-bezier(.16,1,.3,1); }
.minibar.show .minibar-in { transform: none; }
.minibar-in strong { font-weight: 600; }
.minibar-in .sp { flex: 1; }
.crumb { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); border: 0; background: none; padding: 0; width: fit-content; }
.crumb:hover { color: var(--text-primary); }

/* masthead */
.mast { position: relative; border: 1px solid var(--border-default); border-radius: var(--radius-xl); background: var(--bg-surface); box-shadow: var(--shadow-md); overflow: hidden; }
.mast::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--bar, var(--status-success)); }
.mast.err { --bar: var(--status-error); } .mast.warn { --bar: var(--status-warning); }
.mast-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 32px; padding: 28px 30px 4px; }
@container (max-width: 800px) { .mast-top { grid-template-columns: minmax(0, 1fr); padding: 24px 18px 2px; } }
.h1 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.h1 h1 { margin: 0; font-size: 34px; line-height: 1.08; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
@container (max-width: 520px) { .h1 h1 { font-size: 27px; } }
.idchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-default); background: var(--bg-canvas); border-radius: var(--radius-sm); padding: 1px 4px 1px 8px; color: var(--text-secondary); font-family: var(--font-mono); font-size: 12.5px; }
.idchip button { border: 0; background: transparent; padding: 3px; border-radius: 4px; color: var(--text-muted); display: grid; }
.idchip button:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
.lead { margin: 10px 0 0; font-size: 16px; line-height: 1.45; max-width: 62ch; color: var(--text-primary); text-wrap: pretty; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 14px; color: var(--text-secondary); font-size: 13.5px; }
.facts span { display: inline-flex; align-items: center; gap: 7px; }
.facts .warn { color: var(--status-warning-fg); font-weight: 500; } .facts .err { color: var(--status-error-fg); font-weight: 500; }
.side-r { display: grid; gap: 14px; justify-items: end; align-content: start; }
@container (max-width: 800px) { .side-r { justify-items: start; } }
.total-block { text-align: right; }
@container (max-width: 800px) { .total-block { text-align: left; } }
.total { font-family: var(--font-mono); font-weight: 500; font-size: 32px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.total small { font-size: 15px; color: var(--text-muted); font-weight: 400; margin-right: 4px; letter-spacing: 0; }
.pay { margin-top: 8px; display: flex; justify-content: flex-end; }
@container (max-width: 800px) { .pay { justify-content: flex-start; } }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: relative; }

/* the progress line */
.jwrap { padding: 22px 30px 26px; }
@container (max-width: 800px) { .jwrap { padding: 18px 18px 14px; } }
.journey { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.jn { position: relative; display: grid; justify-items: center; text-align: center; gap: 10px; padding: 0 4px; }
.node { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--border-strong); background: var(--bg-surface); position: relative; z-index: 1; color: var(--text-disabled); }
.txt { display: grid; gap: 1px; justify-items: center; min-width: 0; }
.txt b { font-weight: 600; font-size: 14px; }
.txt time { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
.txt small { font-size: 12.5px; font-weight: 600; }
.jseg { position: absolute; top: 15px; left: calc(50% + 22px); width: calc(100% - 44px); height: 3px; border-radius: 2px; background: var(--border-default);
  transform-origin: 0 0; animation: grow .6s cubic-bezier(.16,1,.3,1) both; animation-delay: var(--d, 0ms); --fx: 0; --fy: 1; }
@keyframes grow { from { transform: scale(var(--fx), var(--fy)); } }
.jseg.ok { background: var(--status-success); } .jseg.err { background: var(--status-error); } .jseg.warn { background: var(--status-warning); }
.s-done .node { background: var(--status-success); border-color: var(--status-success); color: #fff; }
.s-current .node { background: var(--accent-primary); border-color: var(--accent-primary); color: var(--text-on-primary); }
.s-current .node::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--accent-primary); opacity: 0; animation: ping 2.8s ease-out 1.2s infinite; }
@keyframes ping { 0% { transform: scale(.82); opacity: .75; } 100% { transform: scale(1.55); opacity: 0; } }
.s-failed .node { background: var(--status-error); border-color: var(--status-error); color: #fff; }
.s-warn .node { background: var(--status-warning); border-color: var(--status-warning); color: oklch(25% 0.06 80); }
.s-stop .node { background: var(--text-primary); border-color: var(--text-primary); color: var(--bg-canvas); }
.s-pending .txt b { color: var(--text-muted); font-weight: 500; }
.s-failed .txt small { color: var(--status-error-fg); } .s-warn .txt small { color: var(--status-warning-fg); } .s-current .txt small { color: var(--accent-primary-soft-strong); } .s-stop .txt small { color: var(--text-secondary); }
@container (max-width: 700px) {
  .journey { grid-template-columns: minmax(0, 1fr); }
  .jn { grid-template-columns: 32px minmax(0, 1fr); justify-items: start; text-align: left; column-gap: 14px; padding: 0 0 18px; align-items: start; }
  .txt { justify-items: start; padding-top: 3px; }
  .jseg { top: 38px; bottom: 4px; left: 14px; width: 3px; height: auto; --fx: 1; --fy: 0; }
}

/* destinations */
.mast-dest { border-top: 1px solid var(--border-subtle); background: var(--bg-shell); padding: 16px 30px 20px; display: grid; gap: 10px; }
@container (max-width: 800px) { .mast-dest { padding: 14px 18px 18px; } }
.md-h { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
.md-h span { font-weight: 400; color: var(--text-muted); font-size: 13.5px; }
.flow { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.fl { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); transition: transform .18s cubic-bezier(.16,1,.3,1), box-shadow .18s; }
.fl:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.fl.error { border-color: var(--status-error-border); background: color-mix(in oklab, var(--status-error-soft) 62%, var(--bg-surface)); }
.ctile { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #fff; }
.fl b { display: block; font-weight: 600; font-size: 13.5px; line-height: 1.25; overflow-wrap: anywhere; }
.fl small { display: block; font-size: 12.5px; color: var(--text-muted); }
.fl.error small { color: var(--status-error-fg); font-weight: 500; } .fl.ok small { color: var(--status-success-fg); }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-primary);
  border-radius: var(--radius-md); padding: 7px 14px; font-weight: 500; line-height: 1.4; transition: background .15s, border-color .15s, transform .12s; white-space: nowrap; }
.btn:hover { background: var(--bg-surface-hover); }
.btn:active { transform: translateY(1px) scale(.985); }
.btn.primary { background: var(--accent-primary); border-color: var(--accent-primary); color: var(--text-on-primary); font-weight: 600; }
.btn.primary:hover { background: var(--accent-primary-hover); border-color: var(--accent-primary-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-secondary); }
.btn.ghost:hover { background: var(--bg-surface-hover); }
.btn.sm { padding: 4px 10px; font-size: 13.5px; }
.btn.danger { color: var(--status-error-fg); }
.btn[disabled] { color: var(--text-disabled); background: var(--bg-muted); border-color: var(--border-subtle); cursor: not-allowed; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--text-link); font-weight: 500; }
.linkbtn:hover { text-decoration: underline; }
.menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 8; min-width: 250px; padding: 5px; border: 1px solid var(--border-default); background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay); }
.menu button { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; }

function ActBtn({ a, ctx, sm }) {
  const ok = ctx.can(a.id, a.who);
  const reason = !ok ? whyNot(a.id) : a.disabled ? (a.hint || '') : '';
  return html`<${Btn} da=${a.id} sm=${sm} kind=${a.kind || ''} icon=${a.icon} disabled=${!ok || !!a.disabled} title=${reason} onClick=${() => ctx.run(a)}>${a.label}<//>`;
}
/* menu with the keyboard behaviour of a real menu */
function Menu2({ items, onClose, anchor }) {
  const ref = useRef(null);
  useEffect(() => {
    const first = ref.current && ref.current.querySelector('[role=menuitem]:not([disabled])'); if (first) first.focus();
    const h = (e) => { if (ref.current && !ref.current.contains(e.target) && !(anchor.current && anchor.current.contains(e.target))) onClose(); };
    document.addEventListener('mousedown', h); return () => document.removeEventListener('mousedown', h);
  }, []);
  const onKey = (e) => {
    const els = Array.from(ref.current.querySelectorAll('[role=menuitem]:not([disabled])')); const i = els.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); els[(i + 1) % els.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); els[(i - 1 + els.length) % els.length].focus(); }
    else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); onClose(); if (anchor.current) anchor.current.focus(); }
  };
  return html`<div className="menu" ref=${ref} role="menu" onKeyDown=${onKey}>${items.map((it, i) => it === '-' ? html`<hr key=${i} />` :
    html`<button key=${i} type="button" role="menuitem" tabIndex="-1" className=${it.danger ? 'dng' : ''} disabled=${it.disabled} onClick=${() => { onClose(); it.run && it.run(); }}><span>${it.label}${it.hint && html`<small>${it.hint}</small>`}</span></button>`)}</div>`;
}

/* ---------- dialogs (copy follows the app: cancel-order-dialog, cancel-shipment-dialog) ---------- */
function Modal({ m, o, ctx, close }) {
  const ref = useRef(null);
  const [v, setV] = useState({});
  useEffect(() => {
    const prev = document.activeElement;
    if (ref.current) { ref.current.focus(); if (!REDUCE) { try { ref.current.animate([{ opacity: 0, transform: 'translateY(10px) scale(.98)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'cubic-bezier(.16,1,.3,1)' }); } catch (e) {} } }
    const k = (e) => {
      if (e.key === 'Escape') { close(); return; }
      if (e.key !== 'Tab' || !ref.current) return;
      const f = Array.from(ref.current.querySelectorAll('button:not([disabled]),input,select,textarea,a[href]')); if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    };
    document.addEventListener('keydown', k);
    return () => { document.removeEventListener('keydown', k); if (prev && prev.focus) prev.focus(); };
  }, []);
  const ch = o.channel.split(' ')[0];
  const units = o.items.reduce((s, i) => s + i.q, 0);
  const done = (fn, msg) => () => { close(); if (fn) fn(); if (msg) ctx.say(msg); };
  const foot = (primary, label, danger, disabled, keep) => html`<div className="foot"><${Btn} onClick=${close}>${keep || 'Cancel'}<//><${Btn} kind=${danger ? 'danger' : 'primary'} disabled=${disabled} onClick=${primary}>${label}<//></div>`;
  const dispatched = o.shipx && o.shipx.kind === 'shipped' && o.shipx.step >= 1;
  let body;
  if (m.kind === 'cancel' && dispatched) body = html`<h2 id="dlg-title">This order can not be cancelled</h2>
    <div className="callout warn" style=${{ margin: 0 }}><${Icon} n="alert" s=${16} /><span><b>The parcel is on its way.</b></span></div>
    <p><b>What you can do instead</b></p>
    <ul><li>Ask the buyer to refuse the parcel, or to send it back after delivery. The return shows up on this order once the buyer opens it.</li><li>Once the goods are back, refund the buyer and confirm the refund here.</li><li>The invoice stays as issued. The return proposes the correction invoice.</li></ul>
    <div className="foot"><${Btn} kind="primary" onClick=${close}>Close<//></div>`;
  else if (m.kind === 'cancel') body = html`<h2 id="dlg-title">Cancel order #${o.num}?</h2>
    <p>OpenLinker asks ${ch} to cancel it. Once ${ch} confirms, the rest happens on its own, except the refund, which you make yourself.</p>
    <p><b>What happens</b> (${units} ${units === 1 ? 'unit' : 'units'})</p>
    <ul><li><b>${ch}</b>, sent: the order is marked as cancelled there.</li><li><b>Invoice</b>, you review: ${o.doc.st === 'none' ? 'nothing was issued, so there is nothing to correct.' : 'an issued invoice can not be withdrawn. OpenLinker opens a correction proposal for you to review and confirm.'}</li><li><b>Money</b>, your action: not refunded by OpenLinker. The payment keeps reading Paid until a refund is confirmed.</li><li><b>Stock</b>, automatic: reserved units are released, open fulfilment work is cancelled and a shipping label that was bought is voided where the carrier allows it.</li></ul>
    <div className="field"><label htmlFor="co-r">Reason</label><select id="co-r" defaultValue="" onChange=${(e) => setV({ r: e.target.value })}><option value="" disabled>Choose why</option><option value="buyer-request">Buyer asked to cancel</option><option value="duplicate">Duplicate order</option><option value="fraud">Suspected fraud or payment problem</option><option value="out-of-stock">Out of stock</option><option value="other">Other</option></select></div>
    ${foot(done(() => ctx.upd((x) => Object.assign({}, x, { cancelled: true, phase: { label: 'Cancelled', tone: 'off' }, times: Object.assign({}, x.times, { cancel: 'now' }) }))), 'Cancel order', true, !v.r, 'Keep order')}`;
  else if (m.kind === 'cancelShipment') body = html`<h2 id="dlg-title">Cancel this shipment?</h2><p>The label will be voided with ${o.shipx.carrier}. This cannot be undone - to ship this order again you'll need to generate a new label.</p>
    ${o.shipx.status === 'dispatched' || o.shipx.step >= 1 ? html`<div className="callout warn" style=${{ margin: 0 }}><${Icon} n="alert" s=${16} /><span>This shipment was already marked as dispatched, so the sales channel has been told the parcel is on its way. OpenLinker cannot take that back for you - tell the channel yourself after cancelling.</span></div>` : null}
    ${foot(done(() => ctx.upd((x) => Object.assign({}, x, { shipx: Object.assign({}, x.shipx, { kind: x.cancelled ? 'cancelledNone' : 'ready', tracking: null, step: 0 }) }))), 'Cancel shipment', true, false, 'Keep')}`;
  else if (m.kind === 'markDispatched') body = html`<h2 id="dlg-title">Mark this shipment as dispatched?</h2><p>Only needed when the automation stopped. ${ch} is told the parcel is on its way.</p>${foot(done(() => ctx.upd((x) => Object.assign({}, x, { shipx: Object.assign({}, x.shipx, { step: 1, status: 'dispatched' }) }))), 'Mark dispatched')}`;
  else if (m.kind === 'refund') body = html`<h2 id="dlg-title">Confirm the refund</h2><p>Confirm only once you have refunded <b>${o.cur} ${o.total}</b> to the buyer in ${ch}. OpenLinker does not move money.</p>${foot(done(() => ctx.upd((x) => Object.assign({}, x, { refunded: true }))), 'Confirm refund', false, false, 'Not yet')}`;
  else if (m.kind === 'email') {
    const blocked = ['inflight', 'inDoubt', 'authRejected'].includes(o.doc.st);
    body = html`<h2 id="dlg-title">Email the document to the buyer</h2>${blocked ? html`<div className="callout warn" style=${{ margin: 0 }}><${Icon} n="alert" s=${16} /><span>The document is not settled yet, so sending it is paused.</span></div>` : null}
      <div className="check"><input type="checkbox" id="em-ok" defaultChecked=${true} /><label htmlFor="em-ok">Send to the address on the order<div className="mono muted" style=${{ overflowWrap: 'anywhere' }}>${o.email || 'Not stored, so there is no address to send to'}</div></label></div>

  else if (m.kind === 'hold') body = html`<h2 id="dlg-title">Place a hold</h2><p>A held order is not sent to the warehouse until you release it.</p><div className="field"><label htmlFor="hold-r">Reason</label><select id="hold-r" onChange=${(e) => setV(Object.assign({}, v, { r: e.target.value }))} defaultValue="operator">${HOLD_REASONS.filter((h) => h[0] !== 'external').map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select></div><div className="field"><label htmlFor="hold-n">Note (optional)</label><input id="hold-n" className="ta" style=${{ minHeight: 0 }} onChange=${(e) => setV(Object.assign({}, v, { n: e.target.value }))} /></div>${foot(done(() => ctx.upd((x) => Object.assign({}, x, { hold: { reason: v.r || 'operator', by: 'You', at: 'now', service: false, note: v.n } }))), 'Place hold')}`;
  else if (m.kind === 'release') {
    const need = !o.hold.by;
    body = html`<h2 id="dlg-title">Release the hold?</h2><p>${holdLabel(o.hold.reason)}. ${need ? 'We do not know who placed this hold, so say why you release it.' : ''}</p>
      <div className="field"><label htmlFor="rel-n">Note${need ? ' (required)' : ' (optional)'}</label><input id="rel-n" className="ta" style=${{ minHeight: 0 }} onChange=${(e) => setV({ n: e.target.value })} /></div>
      ${foot(done(() => ctx.upd((x) => Object.assign({}, x, { hold: null, holdHistory: [{ r: x.hold.reason, by: x.hold.by, at: x.hold.at, released: 'now' }].concat(x.holdHistory), holdResult: 'queued' }))), 'Release hold', false, need && !(v.n || '').trim())}`;
  } else if (m.kind === 'deleteNote') body = html`<h2 id="dlg-title">Delete this note?</h2><p>The text is removed for everyone, including the pack bench. The activity timeline keeps a line saying a note by <b>${m.by}</b> was deleted, without its text.</p>${foot(done(() => ctx.upd((x) => Object.assign({}, x, { notes: x.notes.filter((n) => n.id !== m.id), activity: [{ t: 'now', tone: '', kind: 'note', by: 'You', text: 'Note deleted', sub: 'The text was removed.' }].concat(x.activity) }))), 'Delete note', true, false, 'Keep note')}`;
  else if (m.kind === 'return') body = html`<h2 id="dlg-title">Record a return</h2><p>Opens a return in OpenLinker for this order. It does not contact ${ch}. A line needs a SKU, or its stock cannot be restored.</p>
    <div className="field"><label htmlFor="ret-l">Line</label><select id="ret-l" onChange=${(e) => setV(Object.assign({}, v, { l: e.target.value }))}><option value="">Choose a line</option>${o.items.filter((i) => i.sku).map((i) => html`<option key=${i.sku} value=${i.sku}>${i.n} (${i.sku})</option>`)}</select></div>

    ${o.returns.rows.length ? html`<div className="callout warn" style=${{ margin: 0 }}><${Icon} n="alert" s=${16} /><span>This order already has a return. Record another only if this is a separate parcel.</span></div>` : null}

/* ---------- tags: closed vocabulary, the colour belongs to the tag ---------- */
function Tags({ o, ctx }) {
  const [open, setOpen] = useState(false);
  const ok = ctx.can('tag');
  if (!o.tags.length && !ok) return null;
  const avail = TAG_VOCAB.filter((t) => !o.tags.includes(t.n));
  return html`<div className="b-tags" aria-label="Order tags">${o.tags.map((n) => html`<span key=${n} className="tag"><i style=${{ background: TAG_DOT[(tag(n) || {}).c || 'grey'] }} />${n}${ok && html`<button type="button" className="tx tt44" aria-label=${'Remove tag ' + n} onClick=${() => ctx.upd((x) => Object.assign({}, x, { tags: x.tags.filter((y) => y !== n) }))}><${Icon} n="x" s=${12} w=${2.4} /></button>`}</span>`)}
    ${ok && html`<span style=${{ position: 'relative' }}><button type="button" className="tag-btn tt44" aria-haspopup="listbox" aria-expanded=${open} onClick=${() => setOpen(!open)}><${Icon} n="plus" s=${12} w=${2.4} />Add tag</button>
      ${open && html`<div className="menu" role="listbox" aria-label="Add tag" style=${{ right: 'auto', left: 0, minWidth: 200 }}>${avail.length ? avail.map((t) => html`<button key=${t.n} type="button" role="option" aria-selected="false" onClick=${() => { ctx.upd((x) => Object.assign({}, x, { tags: x.tags.concat([t.n]) })); setOpen(false); }}><i className="tagdot" style=${{ background: TAG_DOT[t.c] }} />${t.n}</button>`) : html`<span className="muted" style=${{ padding: '8px 10px', display: 'block' }}>No more tags.</span>`}<hr />${ctx.can('edit') ? html`<button type="button" onClick=${() => { setOpen(false); ctx.say('Opens Manage tags'); }}>Manage tags</button>` : null}</div>`}</span>`}</div>`;
}

/* ---------- header ---------- */
function payText(o) { return o.cancelled && o.paid && !o.refunded ? ['warn', 'Paid, refund needed'] : o.refunded ? ['off', 'Refunded'] : o.paid ? ['ok', 'Paid on ' + o.channel.split(' ')[0]] : ['off', 'Not paid yet']; }

  const items = [

    { label: 'Email buyer', disabled: !ctx.can('emailDoc') || !DOC_STATES_WITH_RECORD.includes(o.doc.st) || o.doc.st === 'failed', hint: !ctx.can('emailDoc') ? whyNot('emailDoc') : 'There is no issued document to email', run: () => ctx.ask({ kind: 'email' }) },

    { label: 'Cancel order', danger: true, disabled: !ctx.can('cancelOrder') || cancelled, hint: !ctx.can('cancelOrder') ? whyNot('cancelOrder') : cancelled ? 'Already cancelled' : dispatched ? 'Opens a dialog explaining what to do instead' : null, run: () => ctx.ask({ kind: 'cancel' }) }];
  const vis = [];
  if (!cancelled) vis.push({ id: 'edit', label: 'Edit order', icon: 'edit' });
  if (o.shipx && o.shipx.kind === 'shipped') vis.push({ id: 'view', label: 'Download label', icon: 'doc', say: 'Label downloaded' });

        <div className="sub"><span className="mono">${i.sku}</span>${i.was ? html`<span>${i.q} now, was ${i.was}</span>` : null}${i.vat ? html`<span>${i.vat} VAT</span>` : html`<${Pill} tone="warn">VAT rate missing<//>`}</div>
        ${i.gift ? html`<div style=${{ marginTop: 4 }}><${Disclosure} label="Why this gift is here"><p className="tech-b">${i.gift.by}. ${i.gift.doc}.</p><//></div>` : null}
        ${i.bundle ? html`<div style=${{ marginTop: 4 }}><${Disclosure} label=${'Bundle of ' + i.bundle.length}><p className="tech-b">${i.bundle.join(', ')}</p><//></div>` : null}</div>

/* ---------- shipping tab ---------- */
function LabelForm({ o, ctx }) {
  const s = o.shipx;
  const [f, setF] = useState({ w: '', l: '', wd: '', h: '', size: 'medium', cod: '', ins: '' });
  const set = (k) => (e) => setF(Object.assign({}, f, { [k]: e.target.value }));
  const int = (v) => /^[1-9][0-9]*$/.test(v);
  const bad = { w: f.w && !int(f.w), l: f.l && !int(f.l), wd: f.wd && !int(f.wd), h: f.h && !int(f.h) };
  const ready = int(f.w) && int(f.l) && int(f.wd) && int(f.h);
  const blocked = labelBlock(o);
  const carrier = s.carrier || s.method;
  const codCur = carrier === 'DPD' ? 'PLN' : o.cur;
  return html`<form className="lform" aria-label="Generate label" onSubmit=${(e) => { e.preventDefault(); if (ready && !blocked) ctx.run({ id: 'label', run: 'generate', f }); }}>
    <b>Generate label</b>
    ${blocked ? html`<div className="callout warn" style=${{ margin: 0 }}><${Icon} n="alert" s=${16} /><span>${blocked}${s.gate ? html` <${ActBtn} sm a=${{ id: 'addRoute', label: s.gate.act }} ctx=${ctx} />` : ''}</span></div>` : null}
    <div className="lgrid">
      <div className="field"><label htmlFor="lw">Weight (g)</label><input id="lw" inputMode="numeric" value=${f.w} onChange=${set('w')} aria-invalid=${!!bad.w} />${bad.w ? html`<small className="err-t">Weight must be a positive integer</small>` : null}</div>
      <div className="field"><label htmlFor="ll">Length (mm)</label><input id="ll" inputMode="numeric" value=${f.l} onChange=${set('l')} aria-invalid=${!!bad.l} />${bad.l ? html`<small className="err-t">Length must be a positive integer</small>` : null}</div>
      <div className="field"><label htmlFor="lwd">Width (mm)</label><input id="lwd" inputMode="numeric" value=${f.wd} onChange=${set('wd')} aria-invalid=${!!bad.wd} />${bad.wd ? html`<small className="err-t">Width must be a positive integer</small>` : null}</div>
      <div className="field"><label htmlFor="lh">Height (mm)</label><input id="lh" inputMode="numeric" value=${f.h} onChange=${set('h')} aria-invalid=${!!bad.h} />${bad.h ? html`<small className="err-t">Height must be a positive integer</small>` : null}</div>
      ${s.pickup ? html`<div className="field"><label htmlFor="ls">Locker size</label><select id="ls" value=${f.size} onChange=${set('size')}><option value="small">small</option><option value="medium">medium</option><option value="large">large</option></select><small className="muted">Locker size template - required for a locker shipment.</small></div>
      <div className="field"><label htmlFor="lp">${s.pickup.kind}</label><input id="lp" value=${s.pickup.code} readOnly /><small className="muted">Buyer-selected - read-only.</small></div>` : null}
      <div className="field"><label htmlFor="li">Insurance (${o.cur})</label><input id="li" inputMode="decimal" value=${f.ins} onChange=${set('ins')} /><small className="muted">Declared value to insure the parcel for. Leave blank for the carrier default.</small></div>
      ${o.paid ? null : html`<div className="field"><label htmlFor="lc">Cash on delivery (${codCur})</label><input id="lc" inputMode="decimal" value=${f.cod} onChange=${set('cod')} /><small className="muted">This carrier collects cash on delivery in ${codCur} only.</small></div>`}
    </div>
    <div style=${{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}><${ActBtn} a=${{ id: 'label', label: 'Generate label', kind: 'primary', icon: 'truck', disabled: !ready || !!blocked, hint: blocked || 'Fill in the weight and the three dimensions.', run: 'generate', f }} ctx=${ctx} /><span className="muted" style=${{ fontSize: 12.5 }}>Buying the label is simulated in this preview.</span></div>
  </form>`;
}
function ShipmentCard({ o, ctx }) {
  const s = o.shipx;
  const steps = ['Label ready', 'Dispatched', 'In transit', 'Delivered'];
  const has = s.kind === 'shipped';
  const cancellable = has && (s.status === 'generated' || s.status === 'dispatched');
  const url = s.tracking && CARRIER_URL[s.carrier] ? CARRIER_URL[s.carrier] + s.tracking : null;
  return html`<div className="parcel" id="shipment">
    <div className="p-h"><div className="who"><span className="dkind"><${Icon} n="truck" s=${20} /></span><div><b>${s.method}</b>${s.by ? html`<span className="s">${s.by}</span>` : null}</div></div>
      ${has ? html`<div style=${{ display: 'flex', gap: 8, flexWrap: 'wrap' }}><${ActBtn} sm a=${{ id: 'view', label: 'Download label', icon: 'doc', say: 'Label downloaded' }} ctx=${ctx} />${s.status === 'generated' && !o.cancelled ? html`<${ActBtn} sm a=${{ id: 'markDispatched', label: 'Mark dispatched' }} ctx=${ctx} />` : null}${cancellable ? html`<${ActBtn} sm a=${{ id: 'cancelShip', label: 'Cancel' }} ctx=${ctx} />` : null}</div>` : null}</div>
    ${s.kind === 'shipped' && o.cancelled ? html`<div className="callout warn"><${Icon} n="alert" s=${16} /><span>The order is cancelled, but this label still exists. Cancel the shipment so the carrier does not deliver it.</span></div>` : null}
    ${s.kind === 'cancelledNone' ? html`<p className="muted" style=${{ margin: 0 }}>The shipment was cancelled. The order is cancelled, so no new label is needed.</p>` : null}
    ${has && !s.tracking ? html`<p className="muted" style=${{ margin: 0 }}>Label generated. The tracking number will appear within about 5 minutes.</p>` : null}
    ${s.tracking ? html`<div className="track"><span className="muted">Tracking</span><span className="num">${s.tracking}</span><${CopyId} value=${s.tracking} shown="Copy" say=${ctx.say} />${url ? html`<a className="linkbtn" href=${url} target="_blank" rel="noreferrer">Track at ${s.carrier} <${Icon} n="ext" s=${12} /></a>` : null}</div>` : null}
    ${has ? html`<div className="steps" aria-label="Shipment progress">${steps.map((l, i) => html`<div key=${l} className=${'step ' + (i < s.step ? 'done' : i === s.step ? 'cur' : '')}><i />${l}</div>`)}</div>` : null}
    <div className="p-grid"><div><h3>Ship to</h3><div className="addr">${s.to.map((l, i) => html`<div key=${i} style=${i === 0 && s.to.length > 1 ? { fontWeight: 500 } : null}>${l}</div>`)}</div></div>
      ${s.pickup ? html`<div className="locker"><small>${s.pickup.kind}</small><b>${s.pickup.code}</b><small>${s.pickup.note}</small></div>` : null}</div>
    ${s.kind === 'labelFailed' ? html`<div className="callout warn" style=${{ margin: 0 }}><${Icon} n="alert" s=${16} /><span><b>Failed ${s.failedAt}.</b> ${s.carrierErr} Reference for carrier support: <span className="mono">${s.traceId}</span> <${CopyId} value=${s.traceId} shown="Copy" say=${ctx.say} /></span></div>` : null}
    ${(s.kind === 'ready' || s.kind === 'labelFailed') && !o.cancelled ? html`<${LabelForm} o=${o} ctx=${ctx} />` : null}
  </div>`;
}
function OutsideCard({ o, ctx }) {

}
function PackingLine({ o, ctx }) {
  if (o.pack.destFulfils) return html`<div className="line" id="packing"><b>Packing</b><span className="muted">Handled at the destination.</span></div>`;
  const p = o.pack.packed;
  return html`<div className="line" id="packing"><b>Packing</b><span>${p ? 'Packed ' + p.at + ' by ' + p.by : 'Not packed yet.'}</span><span className="sp" />
    ${p ? html`<${ActBtn} sm a=${{ id: 'unpack', label: 'Undo', icon: 'undo' }} ctx=${ctx} />` : html`<${ActBtn} sm a=${{ id: 'pack', label: 'Mark packed', disabled: o.cancelled, hint: 'The order is cancelled' }} ctx=${ctx} />`}</div>`;
}
function HoldPanel({ o, ctx }) {
  const h = o.hold;
  return html`<div id="hold" style=${{ display: 'grid', gap: 10 }}>
    ${h ? html`<div className="holdcard"><div className="p-h"><div><b>On hold: ${holdLabel(h.reason)}</b><span className="muted" style=${{ display: 'block', fontSize: 13 }}>${h.service ? 'Placed by the system' : 'Placed by ' + h.by}, ${h.at}.${h.note ? ' Note: ' + h.note : ''}</span></div><${ActBtn} sm a=${{ id: 'release', label: 'Release hold', kind: 'primary' }} ctx=${ctx} /></div></div>`
      : html`<div className="line"><b>Hold</b><span>None</span><span className="sp" />${o.cancelled ? null : html`<${ActBtn} sm a=${{ id: 'hold', label: 'Place hold' }} ctx=${ctx} />`}</div>`}
    ${o.holdResult ? html`<div className="callout"><${Icon} n="check" s=${16} /><span>Hold released. Provisioning was ${o.holdResult === 'queued' ? 'queued again, the order continues to your destinations.' : o.holdResult}</span></div>` : null}
    ${o.holdHistory.length ? html`<${Disclosure} label=${'Hold history (' + o.holdHistory.length + ')'}>${o.holdHistory.map((x) => html`<p className="tech-b" key=${x.at}>${holdLabel(x.r)}, placed ${x.by ? 'by ' + x.by : 'by the system'} ${x.at}, released ${x.released}</p>`)}<//>` : null}
  </div>`;
}
function TaskPanel({ o, ctx }) {
  if (!o.tasks.length) return null;
  return html`<${Sec} title="Fulfilment tasks" action=${html`<span className="muted">${o.tasks.length} ${o.tasks.length === 1 ? 'task' : 'tasks'}</span>`}>

      <div style=${{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 6 }}>${t.actions.length ? t.actions.map((a) => html`<${ActBtn} key=${a} sm a=${{ id: 'task', label: ACTION_LABEL[a], run: 'task' }} ctx=${ctx} />`) : html`<span className="muted">The server offers no actions for this task.</span>`}</div></div>`)}
  <//>`;
}
function RoutingPanel({ o }) {
  if (!o.routing.on) return null;
  return html`<${Sec} title="Routing decision"><div className=${'callout' + (o.routing.state === 'stuck' ? ' warn' : '')} style=${{ marginTop: 6 }}><${Icon} n=${o.routing.state === 'stuck' ? 'alert' : 'info'} s=${16} /><span>${o.routing.text}</span></div><//>`;
}
function ShippingTab({ o, ctx }) {
  const s = o.shipx;
  return html`<div style=${{ display: 'grid', gap: 18 }}>
    <div className="ocard"><${Sec} title="Shipment" id="fulfilment">${!s ? html`<p className="muted" style=${{ margin: '6px 0 0' }}>No shipment.</p>` : s.kind === 'outside' ? html`<${OutsideCard} o=${o} ctx=${ctx} />` : html`<${ShipmentCard} o=${o} ctx=${ctx} />`}<//></div>
  </div>`;
}
function PackingTab({ o, ctx }) {
  return html`<div style=${{ display: 'grid', gap: 18 }}>
    <div className="ocard" id="shipping-packing"><${Sec} title="Packing and hold"><div className="ship-stack"><${PackingLine} o=${o} ctx=${ctx} /><${HoldPanel} o=${o} ctx=${ctx} /></div><//></div>
    ${o.tasks.length ? html`<div className="ocard"><${TaskPanel} o=${o} ctx=${ctx} /></div>` : null}
    ${o.routing.on ? html`<div className="ocard"><${RoutingPanel} o=${o} /></div>` : null}
  </div>`;
}

/* ---------- documents tab ---------- */
function DocSec({ o, ctx }) {
  const d = o.doc;
  const kind = d.routed === 'receipt' ? 'receipt' : 'invoice';
  const issueLabel = kind === 'receipt' ? 'Register receipt' : 'Issue invoice';
  const authTone = { accepted: 'ok', pending: 'info', rejected: 'error' };
  const wzPill = d.wz === 'not-released' ? html`<${Pill} tone="warn">Goods not released<//>` : d.wz === 'released' ? html`<${Pill} tone="ok">Goods released, ${d.wzNo}<//>` : null;
  const settled = !['inflight', 'inDoubt', 'authRejected'].includes(d.st);
  const hasDoc = ['issued', 'final', 'authRejected'].includes(d.st);
  const title = d.title || (d.st === 'none' || d.st === 'blocked' ? 'No ' + kind + ' yet' : '');
  return html`<${Sec} id="invoicing" title="Sales document">
    <div className="doc-h"><span className="dkind"><${Icon} n="doc" s=${20} /></span><div><b>${title}</b>${d.sub ? html`<span className="muted">${d.sub}</span>` : null}</div></div>
    <div style=${{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 8 }}>${d.authority ? html`<${Pill} tone=${authTone[d.authority]}>${d.provider}: ${d.authority}<//>` : null}${wzPill}</div>
    ${d.st === 'none' ? html`<div style=${{ marginTop: 12 }}><${ActBtn} sm a=${{ id: 'issueDoc', label: issueLabel, icon: 'doc', say: kind === 'receipt' ? 'Receipt registration queued' : 'Invoice queued' }} ctx=${ctx} /><div className="muted" style=${{ fontSize: 12.5, marginTop: 6 }}>Routing chose ${kind === 'receipt' ? 'a receipt' : 'an invoice'} for this order, so that is the only document offered.</div></div>` : null}
    ${d.st === 'blocked' ? html`<div style=${{ marginTop: 12 }}><${ActBtn} sm a=${{ id: 'issueDoc', label: issueLabel, icon: 'doc', disabled: true, hint: 'Set the VAT rate on the product first' }} ctx=${ctx} /><div className="muted" style=${{ fontSize: 12.5, marginTop: 6 }}>Blocked until the VAT rate is set on the product. When it is, the block clears.</div></div>` : null}
    ${d.st === 'inflight' ? html`<div className="callout"><${Icon} n="clock" s=${16} /><span>Another attempt is running right now, for at least 38 s. There is nothing to click until it finishes.</span></div>` : null}
    ${d.st === 'inDoubt' ? html`<div className="callout warn"><${Icon} n="alert" s=${16} /><span>Registering again could produce a second fiscal document, so OpenLinker will not do that on its own.</span></div><div style=${{ marginTop: 12 }}><${ActBtn} sm a=${{ id: 'checkDoc', label: 'Check with provider', kind: 'primary', icon: 'retry' }} ctx=${ctx} /></div>` : null}
    ${d.st === 'unconfirmed' ? html`<div className="callout warn"><${Icon} n="alert" s=${16} /><span>Registering again could produce a second fiscal receipt, so check with the provider first.</span></div><div style=${{ marginTop: 12 }}><${ActBtn} sm a=${{ id: 'checkDoc', label: 'Check with provider', kind: 'primary', icon: 'retry', recpt: true }} ctx=${ctx} /></div>` : null}
    ${d.st === 'failed' ? html`<div style=${{ marginTop: 12 }}><${ActBtn} sm a=${{ id: 'issueDoc', label: 'Retry', kind: 'primary', icon: 'retry', say: 'Retry queued' }} ctx=${ctx} /></div>` : null}
    ${hasDoc ? html`<dl className="kv"><dt>Issued by</dt><dd>${d.provider} ${d.down ? html`<${Pill} tone="warn">Disconnected<//>` : ''}</dd></dl>
      ${d.down ? html`<div className="callout warn"><${Icon} n="alert" s=${16} /><span>This connection is disconnected, so corrections are paused. The document stays valid. <button type="button" className="linkbtn" onClick=${() => ctx.say('Opens the connection')}>Reconnect</button></span></div>` : null}
      ${d.st === 'authRejected' ? html`<div className="callout warn"><${Icon} n="alert" s=${16} /><span>KSeF rejected this document: ${d.authErr} Issue a correction. Emailing it is paused until it is resolved.</span></div>` : null}
      ${d.st === 'final' && !d.canCorrect ? html`<div className="callout warn"><${Icon} n="info" s=${16} /><span>This registration is final and cannot be corrected here.</span></div>` : null}
      <div style=${{ display: 'flex', gap: 8, marginTop: 12, flexWrap: 'wrap' }}>
        <${ActBtn} sm a=${{ id: 'emailDoc', label: 'Email to buyer', icon: 'mail', disabled: !settled, hint: 'Paused until the document is settled', run: 'email' }} ctx=${ctx} />
        ${d.canCorrect ? html`<${ActBtn} sm a=${{ id: 'correction', label: 'Issue correction', kind: d.st === 'authRejected' ? 'primary' : '', disabled: d.down, hint: 'Reconnect the provider first', say: 'Correction started' }} ctx=${ctx} />` : null}</div>` : null}
  <//>`;
}
function PaySec({ o, ctx }) {
  if (!o.payRecs) return null;
  const recs = o.payRecs;
  const counted = recs.filter((p) => p.st !== 'skipped' && p.st !== 'notTracked');
  const ok = counted.filter((p) => p.st === 'recorded').length;
  const hasFail = recs.some((p) => p.st === 'failed');
  const LBL = { recorded: ['ok', 'Paid in shop'], pending: ['info', 'Updating'], failed: ['error', 'Not sent'], skipped: ['off', 'Order cancelled'], handled: ['off', 'Handled'], notTracked: ['off', 'Not tracked here'] };
  return html`<${Sec} id="payshops" title="Payment in each shop" action=${html`<span className="muted">${ok} of ${counted.length} shops updated</span>`}>
    ${o.paidAfterCancel ? html`<div className="callout warn"><${Icon} n="alert" s=${16} /><span><b>The buyer paid a cancelled order.</b> The order stays cancelled and the shops were not changed. Check the refund in the marketplace.</span></div>` : null}
    <div style=${{ marginTop: 8 }}>${recs.map((p) => html`<div className="payrow" key=${p.shop}><span>${p.shop}</span><${Pill} tone=${LBL[p.st][0]}>${LBL[p.st][1]}<//>${p.note ? html`<span className="muted">${p.note}</span>` : html`<span />`}<span /></div>`)}</div>
    ${hasFail ? html`<div style=${{ display: 'flex', gap: 8, marginTop: 10, flexWrap: 'wrap' }}><${ActBtn} sm a=${{ id: 'payRetry', label: 'Retry now' }} ctx=${ctx} /><${ActBtn} sm a=${{ id: 'markHandled', label: 'Mark as handled' }} ctx=${ctx} /></div>` : null}
    <p className="muted" style=${{ fontSize: 12.5, margin: '8px 0 0' }}>Handled shops are not counted as updated. Retry and Mark as handled apply to the whole order.</p>
  <//>`;
}
function DocsTab({ o, ctx }) { return html`<div style=${{ display: 'grid', gap: 18 }}><div className="ocard"><${DocSec} o=${o} ctx=${ctx} /></div></div>`; }

/* ---------- returns, notes, history, technical ---------- */
function ReturnsTab({ o, ctx }) {

    const R = () => ords[key] || ORDERS[key];
    switch (a.id) {
      case 'view': if (a.run === 'reloadReturns') { upd((x) => Object.assign({}, x, { returns: { state: 'ok', rows: x.returns.rows } })); say('Returns reloaded'); } else if (a.go) setTab(a.go); else if (a.say) say(a.say); break;
      case 'retry': {
        upd((x) => Object.assign({}, x, { dests: x.dests.map((d) => (d.st === 'failed' && (!a.dest || d.name === a.dest) ? Object.assign({}, d, { st: 'pending', note: 'Sync queued' }) : d)) }));
        say('Retry queued. A retry never creates the order twice.');
        later(() => setOrds((p) => { const x = p[key] || ORDERS[key]; return Object.assign({}, p, { [key]: Object.assign({}, x, { dests: x.dests.map((d) => (d.note === 'Sync queued' ? (/mapping/i.test(d.err || '') ? Object.assign({}, d, { st: 'failed', note: 'No matching product' }) : Object.assign({}, d, { st: 'synced', note: 'Synced', err: null })) : d)) }) }); }), 1600); break; }
      case 'refund': setModal({ kind: 'refund' }); break;
      case 'cancelOrder': setModal({ kind: 'cancel' }); break;
      case 'edit': setModal({ kind: 'edit' }); break;
      case 'hold': setModal({ kind: 'hold' }); break;
      case 'release': setModal({ kind: 'release' }); break;
      case 'emailDoc': setModal({ kind: 'email' }); break;
      case 'record': setModal({ kind: 'return' }); break;
      case 'cancelShip': setModal({ kind: 'cancelShipment' }); break;
      case 'markDispatched': setModal({ kind: 'markDispatched' }); break;
      case 'pack': upd((x) => Object.assign({}, x, { pack: Object.assign({}, x.pack, { packed: { at: 'now', by: 'You' } }), activity: [{ t: 'now', tone: '', kind: 'pack', by: 'You', text: 'Marked as packed' }].concat(x.activity) })); say('Order marked packed.'); break;
      case 'unpack': upd((x) => Object.assign({}, x, { pack: Object.assign({}, x.pack, { packed: null }) })); say('Packed mark cleared.'); break;
      case 'label':
        if (a.f) { upd((x) => Object.assign({}, x, { shipx: Object.assign({}, x.shipx, { kind: 'shipped', status: 'generated', step: 0, tracking: null, by: 'OpenLinker bought the label from ' + (x.shipx.carrier || 'the carrier') + ' (simulated)' }) })); say('Label generated. Tracking number will appear within ~5 minutes.'); setTab('ship'); }
        else setTab('ship'); break;
      case 'checkDoc': say(a.recpt ? 'Asked the provider. This preview does not show its answer.' : 'Open the provider portal to check whether this document exists.'); break;
      case 'payRetry': upd((x) => Object.assign({}, x, { payRecs: x.payRecs.map((p) => (p.st === 'failed' ? { shop: p.shop, st: 'pending' } : p)) })); say('Queued 1 shop update. OpenLinker will mark the order paid in the shop in a moment.'); break;
      case 'markHandled': upd((x) => Object.assign({}, x, { payRecs: x.payRecs.map((p) => (p.st === 'failed' ? { shop: p.shop, st: 'handled' } : p)) })); say('Marked as handled'); break;
      case 'markRead': upd((x) => Object.assign({}, x, { buyerNote: Object.assign({}, x.buyerNote, { read: true }) })); say('Marked as read'); break;
      case 'task': say('Sent to the server. This preview does not change the task.'); break;
      default: say(a.say || (a.label + ': not modelled in this preview'));
    }
  };
  const ctx = { role, can: (id, who) => can(role, id, who), say, ask: setModal, upd, run, go, setTab };
  const denied = role === 'packer';
  const state = denied ? 'denied' : pstate;
  return html`<div className="wrap">
    <div className="intro"><div><h1>Order detail v3</h1><p>The research design after the audit: status and next step computed from every dimension, one role table, rules copied from the app, and unknown reads shown as unknown. Twelve order situations.</p></div></div>
    <div className="tools"><label className="tl-l">Order <select id="pick-order" value=${key} onChange=${(e) => pick(e.target.value)}>${ORDER_KEYS.map((k) => html`<option key=${k} value=${k}>${ORDERS[k].tab}</option>`)}</select></label>
      <label className="tl-l">Preview as <select id="pick-role" value=${role} onChange=${(e) => setRole(e.target.value)}><option value="admin">Admin</option><option value="operator">Operator</option><option value="viewer">Viewer</option><option value="packer">Packer</option></select></label>
      <label className="tl-l">Page <select id="pick-state" value=${pstate} onChange=${(e) => setPstate(e.target.value)}><option value="normal">Loaded</option><option value="loading">Loading</option><option value="error">Load error</option><option value="notfound">Not found</option></select></label></div>
    <div className="frame">
      <aside className="rail"><${Logo} />${RAIL.map(([ic, t, on]) => html`<button key=${t} type="button" className=${'ri' + (on ? ' on' : '')} title=${t} aria-label=${t}><${Icon} n=${ic} s=${19} /></button>`)}<span className="sp" /><button type="button" className="ri" title="Settings" aria-label="Settings"><${Icon} n="settings" s=${19} /></button></aside>
      <div className="mainwrap">
        <div className="top"><div className="search"><${Icon} n="search" s=${15} />Search orders, products, connections<kbd>Ctrl K</kbd></div><span className="sp" /><span className="pill-top"><${Icon} n="bell" s=${15} />Alerts 4</span><span className="avatar">AD</span></div>
        <main className="scroller" ref=${scroller}>${state === 'normal' ? html`<${PageB} key=${key} k=${key} o=${o} h=${h} tab=${tab} setTab=${setTab} ctx=${ctx} scroller=${scroller} />` : html`<${PageState} kind=${state} retry=${() => { if (denied) { setRole('admin'); say('Switched back to admin in this preview'); } else { setPstate('normal'); say('Reloaded'); } }} />`}</main>
      </div>
      ${modal && html`<${Modal} m=${modal} o=${o} ctx=${ctx} close=${() => setModal(null)} />`}
      ${toast && html`<div className="toast" role="status">${toast}</div>`}
    </div>
    <${Parity} />
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

</script>
