<title>Centrum zmian OpenLinker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  /* ── Typography ───────────────────────────────────────────────────── */
  --font-sans: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
    'Liberation Mono', monospace;

  /* ── Surfaces ──────────────────────────────────────────────────────
   * Warm-neutral OKLCH ramp (#775). Canvas is the page background;
   * surface is the elevated card; shell sits between for sidebars and
   * sticky bars. `bg-strong` is a deeper neutral for inset hovers and
   * pressed states. `bg-surface-muted` / `bg-surface-hover` are kept
   * as aliases for the FE-002 vocabulary that the rest of the CSS
   * already uses.
   */
  --bg-canvas: oklch(99% 0.003 80);
  --bg-shell: oklch(97.5% 0.004 80);
  --bg-surface: #ffffff;
  --bg-surface-elevated: oklch(99% 0.003 80);
  --bg-muted: oklch(96% 0.005 80);
  --bg-surface-muted: oklch(96% 0.005 80);
  --bg-surface-hover: oklch(93% 0.006 80);
  --bg-strong: oklch(93% 0.006 80);

  /* ── Borders ──────────────────────────────────────────────────────── */
  --border-subtle: oklch(93.5% 0.006 80);
  --border-default: oklch(88% 0.008 80);
  --border-strong: oklch(78% 0.010 80);
  --border-focus: oklch(68% 0.18 50);

  /* ── Text ─────────────────────────────────────────────────────────── */
  --text-primary: oklch(20% 0.012 80);
  --text-secondary: oklch(38% 0.010 80);
  --text-muted: oklch(52% 0.008 80);
  --text-disabled: oklch(70% 0.005 80);
  --text-on-primary: oklch(18% 0.012 50); /* text on accent button */
  --text-inverse: oklch(96% 0.005 80);
  --text-link: oklch(50% 0.14 250);

  /* ── Accent ───────────────────────────────────────────────────────
   * Signal-orange brand accent (#775). Reverses the monochrome stance
   * of #371 — the prior monochrome accent flattened the cockpit. The
   * accent is used sparingly: primary buttons, active-tab underline,
   * KPI top-rule, pulsing live dot, focus rings. Status hues remain
   * reserved for status meaning.
   *
   * `--accent-primary` is the brand colour; `--text-on-primary` above
   * is the legible text colour to pair with it on primary buttons.
   */
  --accent-primary: oklch(68% 0.18 50);
  --accent-primary-hover: oklch(62% 0.19 50);
  --accent-primary-active: oklch(56% 0.20 50);
  --accent-primary-soft: oklch(96% 0.04 60);
  --accent-primary-soft-strong: oklch(40% 0.16 50);
  --accent-primary-border: oklch(85% 0.10 55);
  --accent-focus: oklch(68% 0.18 50);
  --accent-ring: oklch(68% 0.18 50 / 0.30);

  /* ── Status: success ──────────────────────────────────────────────── */
  --status-success: oklch(54% 0.14 150);
  --status-success-soft: oklch(96% 0.04 150);
  --status-success-border: oklch(85% 0.08 150);
  --status-success-fg: oklch(36% 0.12 150);
  --status-success-strong: oklch(36% 0.12 150);

  /* ── Status: warning ──────────────────────────────────────────────── */
  --status-warning: oklch(72% 0.16 85);
  --status-warning-soft: oklch(96% 0.05 85);
  --status-warning-border: oklch(85% 0.10 85);
  --status-warning-fg: oklch(42% 0.12 80);
  --status-warning-strong: oklch(42% 0.12 80);

  /* ── Status: error ────────────────────────────────────────────────── */
  --status-error: oklch(58% 0.20 25);
  --status-error-soft: oklch(96% 0.04 25);
  --status-error-border: oklch(85% 0.10 25);
  --status-error-fg: oklch(42% 0.16 25);
  --status-error-strong: oklch(42% 0.16 25);

  /* ── Status: info ─────────────────────────────────────────────────── */
  --status-info: oklch(56% 0.14 245);
  --status-info-soft: oklch(96% 0.03 245);
  --status-info-border: oklch(85% 0.08 245);
  --status-info-fg: oklch(40% 0.12 245);
  --status-info-strong: oklch(40% 0.12 245);

  /* ── Viz: categorical series (#1739) ──────────────────────────────────
   * Small categorical palette for proportion visuals (routing-split bar).
   * NOT status hues — a series colour distinguishes entities (carriers,
   * connections), never encodes health. `--viz-cat-muted` is the neutral
   * "default / unassigned" bucket. */
  --viz-cat-1: oklch(75% 0.13 85);
  --viz-cat-2: oklch(60% 0.15 20);
  --viz-cat-3: oklch(58% 0.12 245);
  --viz-cat-4: oklch(60% 0.13 150);
  --viz-cat-muted: oklch(82% 0.008 80);

  /* ── Channel brand hues (#1752) ──────────────────────────────────────
   * Per-marketplace dot/pill identity colours, previously copy-pasted as raw
   * oklch literals across the orders, coverage, channel-pill, product-detail,
   * and variant-drawer rulesets. Brand identity, NOT status — a channel hue
   * distinguishes the platform, never encodes health. Single definition
   * (identical in light/dark), mirroring the viz categorical set. */
  --channel-allegro: oklch(70% 0.18 35);
  --channel-prestashop: oklch(60% 0.18 250);
  --channel-erli: oklch(66% 0.17 320);
  --channel-woocommerce: oklch(64% 0.16 150);
  --channel-amazon: oklch(72% 0.16 75);
  --channel-shopify: oklch(64% 0.16 150);

  --status-conflict-border: oklch(85% 0.10 45);

  --status-disabled-fg: oklch(38% 0.010 80);

  --shadow-overlay: 0 24px 48px rgb(15 18 26 / 0.16), 0 8px 16px rgb(15 18 26 / 0.08);
  --overlay-scrim: rgb(15 18 26 / 0.55);

  --shadow-xs: 0 1px 2px rgb(15 18 26 / 0.04);
  --shadow-sm: 0 1px 2px rgb(15 18 26 / 0.04), 0 1px 3px rgb(15 18 26 / 0.06);
  --shadow-md: 0 2px 4px rgb(15 18 26 / 0.04), 0 6px 16px rgb(15 18 26 / 0.08);
  --shadow-lg: 0 6px 12px rgb(15 18 26 / 0.06), 0 16px 32px rgb(15 18 26 / 0.10);
  --shadow-focus: 0 0 0 3px var(--accent-ring);
  --shadow-inset-top: inset 0 1px 0 rgb(255 255 255 / 0.6);

  /* Primary button hover — accent-driven (#775). Kept as a named token
     because existing CSS references it. The cascade through
     `--accent-primary-hover` would also work, but the explicit token
     makes the contract auditable in `tokens.ts`. */
  --button-primary-bg-hover: oklch(62% 0.19 50);

  /* ── Spacing scale (strict 4px grid) ─────────────────────────────── */
  /* ── Layout heights (#2227) ────────────────────────────────────────
   * The two pinned strips at the top of the shell, named once instead of
   * repeated as a literal `52px` in `.shell-topbar` and `.demo-banner`. Height,
   * not padding, so the value stays true: the banner carries a matching
   * `min-height`.
   */
  --shell-topbar-height: 52px;
  --demo-banner-height: 48px;

  --space-1: 0.25rem; /* 4px */
  --space-2: 0.5rem; /* 8px */
  --space-3: 0.75rem; /* 12px */
  --space-4: 1rem; /* 16px */
  --space-5: 1.5rem; /* 24px */
  --space-6: 2rem; /* 32px */
  --space-7: 3rem; /* 48px */
  --space-8: 4rem; /* 64px */

  /* ── Radius scale ─────────────────────────────────────────────────── */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;
  --radius-xl: 14px;
  --radius-pill: 9999px;

  /* ── Motion ───────────────────────────────────────────────────────── */
  --duration-fast: 120ms;
  --duration-normal: 180ms;
  --duration-slow: 280ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

  /* ── Tracking (letter-spacing) ────────────────────────────────────── */
  --tracking-tight: -0.012em;
  --tracking-normal: 0;
  --tracking-wide: 0.02em;
  --tracking-caps: 0.08em;

/* ── Artifact base (tokens are prepended at build time from apps/web/src/index.css) ── */
:root {
  --ease-spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
  --page-pad: max(16px, env(safe-area-inset-left, 0px));
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg-canvas);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'cv11', 'ss01';
}
button, input, select { font-family: inherit; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--accent-primary-hover); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); }
.tabular { font-variant-numeric: tabular-nums; }

/* ── Controls (ported from index.css) ── */
.button {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  border: 1px solid var(--accent-primary-border); border-radius: var(--radius-md);
  padding: 0 var(--space-4); height: 2rem; background: var(--accent-primary);
  color: var(--text-on-primary); font-size: 0.8125rem; font-weight: 500; cursor: pointer;
  text-decoration: none; user-select: none; white-space: nowrap;
  box-shadow: var(--shadow-xs), var(--shadow-inset-top);
  transition: background var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out),
    box-shadow var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out);
}
.button:hover { background: var(--button-primary-bg-hover); border-color: var(--button-primary-bg-hover); }
.button:active { background: var(--accent-primary-active); border-color: var(--accent-primary-active); transform: translateY(1px); }
.button:focus-visible, input:focus-visible, select:focus-visible, .radio-card:has(input:focus-visible), .chip:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
.button--secondary { border-color: var(--border-default); background: var(--bg-surface); color: var(--text-primary); }
.button--secondary:hover { background: var(--bg-surface-muted); border-color: var(--border-strong); }
.button--secondary:active { background: var(--bg-surface-hover); }
.button--ghost { border-color: transparent; background: transparent; color: var(--text-secondary); box-shadow: none; }
.button--ghost:hover { background: var(--bg-surface-muted); border-color: transparent; }
.button--danger { border-color: color-mix(in oklab, var(--status-error) 80%, black); background: var(--status-error); color: #fff; }
.button--danger:hover { background: color-mix(in oklab, var(--status-error) 90%, black); }
.button--sm { height: 1.75rem; padding: 0 var(--space-3); font-size: 0.75rem; }
.button--xs { height: 1.5rem; padding: 0 var(--space-2); font-size: 0.6875rem; border-radius: var(--radius-sm); gap: var(--space-1); }
.button--lg { height: 2.375rem; padding: 0 var(--space-5); font-size: 0.875rem; }
.button--icon { padding: 0; width: 2rem; }
.button--icon.button--sm { width: 1.75rem; }
.button:disabled { cursor: not-allowed; opacity: 0.55; box-shadow: none; transform: none; }
.button svg { flex-shrink: 0; }

select, input[type='text'] {
  width: 100%; height: 2rem; border: 1px solid var(--border-default); border-radius: var(--radius-md);
  padding: 0 var(--space-3); background: var(--bg-surface); color: var(--text-primary);
  font-size: 0.8125rem; box-shadow: var(--shadow-xs);
  transition: border-color var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
}
select:hover:not(:disabled), input[type='text']:hover:not(:disabled) { border-color: var(--border-strong); }
input:disabled, select:disabled { background: var(--bg-surface-muted); color: var(--text-muted); cursor: not-allowed; }
select {
  appearance: none; padding-right: var(--space-7);
  background-image: linear-gradient(45deg, transparent 50%, var(--text-secondary) 50%), linear-gradient(135deg, var(--text-secondary) 50%, transparent 50%);
  background-position: calc(100% - 14px) calc(50% - 2px), calc(100% - 8px) calc(50% - 2px);
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
input[type='checkbox'], input[type='radio'] { width: 0.875rem; height: 0.875rem; margin: 0; accent-color: var(--accent-primary); cursor: pointer; flex-shrink: 0; }

.alert {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
  border: 1px solid var(--border-default); border-radius: var(--radius-lg);
  padding: 0.875rem 1rem 0.875rem 1.125rem; background: var(--bg-surface); box-shadow: inset 3px 0 0 var(--border-default);
}
.alert--info { border-color: var(--status-info-border); background: var(--status-info-soft); box-shadow: inset 3px 0 0 var(--status-info); }
.alert--success { border-color: var(--status-success-border); background: var(--status-success-soft); box-shadow: inset 3px 0 0 var(--status-success); }
.alert--warning { border-color: var(--status-warning-border); background: var(--status-warning-soft); box-shadow: inset 3px 0 0 var(--status-warning); }
.alert__content { display: grid; gap: 0.25rem; font-size: 0.8125rem; }
.alert__title { font-weight: 600; }

.chip {
  display: inline-flex; align-items: center; gap: 0.25rem; height: 1.375rem; padding: 0 0.5rem;
  border: 1px solid var(--border-subtle); border-radius: var(--radius-pill); background: var(--bg-surface-muted);
  color: var(--text-secondary); font-size: 0.75rem; font-weight: 500; line-height: 1; white-space: nowrap;
}
.chip--success { background: var(--status-success-soft); border-color: var(--status-success-border); color: var(--status-success-strong); }
.chip--info { background: var(--status-info-soft); border-color: var(--status-info-border); color: var(--status-info-strong); }
.chip--warning { background: var(--status-warning-soft); border-color: var(--status-warning-border); color: var(--status-warning-strong); }
.chip--accent { background: var(--accent-primary-soft); border-color: var(--accent-primary-border); color: var(--accent-primary-soft-strong); }
.status-badge {
  display: inline-flex; align-items: center; gap: var(--space-2); padding: 1px var(--space-2);
  border: 1px solid var(--status-disabled-border); border-radius: var(--radius-sm); background: var(--status-disabled-soft);
  color: var(--status-disabled-fg); font-family: var(--font-mono); font-size: 0.625rem; font-weight: 500;
  line-height: 1.5; letter-spacing: var(--tracking-wide); text-transform: uppercase; white-space: nowrap;
}
.status-badge--success { border-color: var(--status-success-border); background: var(--status-success-soft); color: var(--status-success-fg); }
.status-badge--info { border-color: var(--status-info-border); background: var(--status-info-soft); color: var(--status-info-fg); }
.status-badge--warning { border-color: var(--status-warning-border); background: var(--status-warning-soft); color: var(--status-warning-fg); }
.status-badge__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.segmented-control { display: inline-flex; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); max-width: 100%; overflow-x: auto; }
.segmented-control__option {
  display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border: none;
  border-right: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-secondary);
  font-size: 0.8125rem; cursor: pointer; white-space: nowrap; transition: background var(--duration-fast) var(--ease-standard);
}
.segmented-control__option:first-child { border-top-left-radius: var(--radius-md); border-bottom-left-radius: var(--radius-md); }
.segmented-control__option:last-child { border-right: none; border-top-right-radius: var(--radius-md); border-bottom-right-radius: var(--radius-md); }
.segmented-control__option:hover { background: var(--bg-surface-hover); }
.segmented-control__option:focus-visible { outline: none; box-shadow: inset var(--shadow-focus); }
.segmented-control__option--active, .segmented-control__option--active:hover { background: var(--accent-primary); color: var(--text-on-primary); font-weight: 600; }
.segmented-control__count { font-family: var(--font-mono); font-size: 0.6875rem; opacity: 0.85; }

.eyebrow { font-size: 0.76rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-primary-hover); }
.form-field { display: grid; gap: var(--space-2); }
.form-field__label { font-size: 0.8125rem; font-weight: 600; }
.form-field__hint { font-size: 0.75rem; color: var(--text-muted); }
.card { border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); box-shadow: var(--shadow-soft); }

/* ── Setup stepper (ported) ── */
.setup-stepper { margin: 0 0 1.5rem; }
.setup-stepper__list { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; row-gap: 0.5rem; }
.setup-stepper__step { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--text-muted); }
.setup-stepper__indicator { display: inline-flex; align-items: center; justify-content: center; width: 1.5rem; height: 1.5rem; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--text-muted); font-size: 0.75rem; font-weight: 600; }
.setup-stepper__connector { width: 1.5rem; height: 1px; background: var(--border-default); margin: 0 0.25rem; }
.setup-stepper__step--current .setup-stepper__indicator { border-color: var(--accent-primary); color: var(--text-primary); box-shadow: var(--shadow-focus); }
.setup-stepper__step--current .setup-stepper__label { color: var(--text-primary); font-weight: 600; }
.setup-stepper__step--done .setup-stepper__indicator { border-color: transparent; background: var(--accent-primary); color: var(--text-on-primary); }
.setup-stepper__step--done .setup-stepper__connector { background: var(--accent-primary); }

/* ── Prototype chrome (outside the mock app) ── */
.proto { max-width: 1240px; margin: 0 auto; padding-block: 28px 64px; padding-left: var(--page-pad); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.proto__head { display: grid; gap: 6px; max-width: 70ch; }
.proto__title { font-size: 1.5rem; font-weight: 600; letter-spacing: var(--tracking-tight); text-wrap: balance; }
.proto__lead { color: var(--text-secondary); }
.proto__bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.proto__bar-label { font-size: 0.75rem; color: var(--text-muted); }
.proto__spacer { flex: 1 1 auto; }

/* ── Mock app shell (mirrors app-shell.tsx) ── */
.frame { position: relative; display: grid; grid-template-columns: 224px minmax(0, 1fr); grid-template-rows: var(--shell-topbar-height) minmax(0, 1fr); height: 780px; border: 1px solid var(--border-default); border-radius: var(--radius-xl); overflow: hidden; background: var(--bg-canvas); box-shadow: var(--shadow-lg); }
.sidebar { grid-row: 1 / 3; border-right: 1px solid var(--border-subtle); background: var(--bg-shell); padding: 14px 10px; overflow-y: auto; display: grid; align-content: start; gap: 2px; }
.sidebar__brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px 12px; font-weight: 600; }
.sidebar__logo { width: 26px; height: 26px; border-radius: 7px; background: var(--text-primary); display: grid; place-items: center; }
.sidebar__logo i { width: 10px; height: 10px; border-radius: 3px; background: var(--accent-primary); }
.sidebar__ver { margin-left: auto; font-family: var(--font-mono); font-size: 0.6875rem; color: var(--text-muted); border: 1px solid var(--border-default); border-radius: var(--radius-pill); padding: 1px 7px; }
.sidebar__group { font-family: var(--font-mono); font-size: 0.625rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); padding: 12px 8px 4px; }
.nav-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: transparent; text-align: left; font-size: 0.8125rem; font-weight: 500; color: var(--text-secondary); padding: 6px 8px; border-radius: var(--radius-md); cursor: pointer; }
.nav-item:hover { background: var(--bg-surface-hover); }
.nav-item--active { background: var(--bg-surface); color: var(--text-primary); box-shadow: inset 2px 0 0 var(--accent-primary), var(--shadow-xs); }
.nav-item__count { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--text-muted); }

.topbar { grid-column: 2; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--bg-shell); border-bottom: 1px solid var(--border-subtle); min-width: 0; }
.crumbs { display: flex; gap: 8px; font-size: 0.8125rem; color: var(--text-muted); white-space: nowrap; }
.crumbs b { color: var(--text-primary); font-weight: 600; }
.topbar__search { flex: 1 1 auto; max-width: 340px; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); color: var(--text-muted); font-size: 0.8125rem; min-width: 0; }
.topbar__kbd { font-family: var(--font-mono); font-size: 0.6875rem; border: 1px solid var(--border-default); border-radius: 4px; padding: 0 5px; }
.topbar__right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.avatar { display: inline-flex; align-items: center; gap: 8px; font-size: 0.8125rem; font-weight: 500; }
.avatar i { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, var(--viz-cat-2), var(--viz-cat-3)); display: grid; place-items: center; font-style: normal; font-size: 0.625rem; color: #fff; font-weight: 600; }

.bell { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); color: var(--text-secondary); font-size: 0.78rem; font-weight: 500; cursor: pointer; transition: background var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.bell:hover, .bell[aria-expanded='true'] { background: var(--bg-surface-muted); color: var(--text-primary); border-color: var(--border-strong); }
.bell:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
.bell__badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-pill); background: var(--accent-primary); color: var(--text-on-primary); font-family: var(--font-mono); font-size: 0.6875rem; font-weight: 600; display: inline-grid; place-items: center; animation: badge-pop 520ms var(--ease-spring) both; }
.bell__badge--zero { background: var(--bg-strong); color: var(--text-muted); animation: none; }
.bell--ring svg { animation: bell-ring 900ms var(--ease-out); transform-origin: 50% 0; }

.main { grid-column: 2; grid-row: 2; position: relative; min-height: 0; overflow: hidden; }
.content { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
[data-tour] { scroll-margin-top: 20px; }
.content__inner { position: relative; padding: 24px 28px 40px; min-height: 100%; animation: page-in 320ms var(--ease-out) both; }
.page-head { display: grid; gap: 4px; margin-bottom: 20px; }
.page-head h2 { font-size: 1.5rem; font-weight: 600; letter-spacing: var(--tracking-tight); }
.page-head p { color: var(--text-secondary); max-width: 62ch; }

/* ── Edit form ── */
.edit-layout { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 28px; align-items: start; }
.toc { position: sticky; top: 24px; align-self: start; display: grid; gap: 2px; font-size: 0.8125rem; }
.toc__title { font-family: var(--font-mono); font-size: 0.625rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); padding: 0 8px 6px; }
.toc button { text-align: left; border: 0; background: transparent; padding: 5px 8px; border-radius: var(--radius-sm); color: var(--text-secondary); cursor: pointer; font-size: inherit; box-shadow: inset 2px 0 0 transparent; transition: box-shadow var(--duration-normal) var(--ease-out), color var(--duration-fast); }
.toc button:hover { color: var(--text-primary); background: var(--bg-surface-muted); }
.toc button[aria-current='true'] { color: var(--text-primary); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent-primary); }
.form-card { max-width: 640px; display: grid; gap: 0; padding: 0; }
.form-section { display: grid; gap: 16px; padding: 22px 24px; border-bottom: 1px solid var(--border-subtle); scroll-margin-top: 12px; }
.form-section:last-of-type { border-bottom: 0; }
.form-section__head { display: grid; gap: 2px; }
.form-section__head h3 { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.form-section__head p { font-size: 0.8125rem; color: var(--text-muted); max-width: 56ch; }
.form-actions { display: flex; gap: 8px; padding: 14px 24px; border-top: 1px solid var(--border-subtle); background: var(--bg-surface-elevated); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.disclosure { border: 1px solid var(--border-default); border-radius: var(--radius-md); }
.disclosure > button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; border: 0; background: transparent; font-weight: 600; font-size: 0.8125rem; color: var(--text-primary); cursor: pointer; border-radius: var(--radius-md); text-align: left; }
.disclosure > button:hover { background: var(--bg-surface-muted); }
.disclosure__sum { font-weight: 400; color: var(--text-muted); font-size: 0.75rem; }
.disclosure__body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 280ms var(--ease-out); }
.disclosure__body[data-open='true'] { grid-template-rows: 1fr; }
.disclosure__body > div { overflow: hidden; }
.disclosure__pad { padding: 4px 12px 14px; display: grid; gap: 12px; font-size: 0.8125rem; color: var(--text-secondary); }
.check-row { display: flex; align-items: flex-start; gap: 10px; font-size: 0.8125rem; cursor: pointer; }
.check-row small { display: block; color: var(--text-muted); font-size: 0.75rem; margin-top: 2px; }
.chev { transition: transform 240ms var(--ease-out); }
[aria-expanded='true'] > .chev, .chev--open { transform: rotate(180deg); }

/* ── Shipping labels section (new, shared by wizard + edit) ── */
.label-master { display: grid; gap: 8px; }
.radio-card { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: start; padding: 10px 14px; border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); cursor: pointer; transition: border-color var(--duration-normal) var(--ease-out), background var(--duration-normal) var(--ease-out), box-shadow var(--duration-normal) var(--ease-out); }
.radio-card:hover { border-color: var(--border-strong); }
.radio-card[data-checked='true'] { border-color: var(--accent-primary); background: var(--accent-primary-soft); box-shadow: 0 0 0 1px var(--accent-primary); }
.radio-card input { margin-top: 3px; }
.radio-card__title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 600; font-size: 0.875rem; }
.radio-card__body { grid-column: 2; font-size: 0.8125rem; color: var(--text-secondary); max-width: 54ch; }
.radio-card__extra { grid-column: 2; display: grid; grid-template-rows: 0fr; transition: grid-template-rows 280ms var(--ease-out); }
.radio-card[data-checked='true'] .radio-card__extra { grid-template-rows: 1fr; }
.radio-card__extra > span { display: block; overflow: hidden; min-height: 0; }
.radio-card__extra-pad { padding-top: 8px; display: grid; gap: 6px; max-width: 320px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--text-link); font-size: 0.8125rem; text-decoration: underline; cursor: pointer; text-align: left; }
.effect { display: grid; gap: 6px; padding: 10px 14px; border: 1px dashed var(--border-strong); border-radius: var(--radius-lg); background: var(--bg-surface-elevated); }
.effect__title { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); }
.split { display: flex; height: 10px; border-radius: var(--radius-pill); overflow: hidden; background: var(--bg-strong); }
.split i { display: block; height: 100%; transition: flex-grow 520ms var(--ease-out); min-width: 0; }
.split-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.75rem; color: var(--text-secondary); }
.split-legend span { display: inline-flex; align-items: center; gap: 6px; }
.split-legend i { width: 8px; height: 8px; border-radius: 2px; }
.split-legend b { font-family: var(--font-mono); font-weight: 600; font-size: 0.6875rem; color: var(--text-primary); }
.confirm-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.saved { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--status-success-fg); animation: fade-up 320ms var(--ease-out) both; }

/* ── Carrier page ── */
.carrier-grid { display: grid; gap: 16px; max-width: 760px; }
.method-list { display: grid; }
.method-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); font-size: 0.8125rem; }
.method-row:last-child { border-bottom: 0; }
.method-row__name { font-weight: 500; }
.method-row__meta { color: var(--text-muted); font-size: 0.75rem; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px; border-bottom: 1px solid var(--border-subtle); }
.card-head h3 { font-size: 1rem; font-weight: 600; }
.card-head p { color: var(--text-muted); font-size: 0.8125rem; }

/* ── Wizard ── */
.wizard-card { display: grid; gap: 18px; padding: 20px; max-width: 620px; }
.cap-list { display: grid; gap: 10px; }

/* ── What's new page ── */
.changelog { display: grid; gap: 18px; max-width: 760px; }
.release { display: grid; gap: 14px; padding: 18px; }
.release__head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.release__head h3 { font-size: 1.125rem; font-weight: 600; }
.release__date { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); }
.change-group { display: grid; gap: 6px; }
.change-group h4 { font-size: 0.8125rem; font-weight: 600; color: var(--text-secondary); }
.change-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border-subtle); font-size: 0.8125rem; }
.change-item:first-of-type { border-top: 0; }

/* ── Dialog (ported .dialog + release-modal) ── */
.dialog-backdrop { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: var(--overlay-scrim); z-index: 40; animation: fade-in 220ms var(--ease-out) both; }
.dialog { min-width: 0; width: min(100%, 28rem); border: 1px solid var(--border-default); border-radius: 0.75rem; background: var(--bg-surface); box-shadow: var(--shadow-overlay); overflow: hidden; animation: dialog-in 420ms var(--ease-spring) both; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: 100%; }
.dialog__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border-subtle); }
.dialog__steps { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 0.6875rem; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
.dialog__dots { display: flex; gap: 5px; }
.dialog__dots i { width: 6px; height: 6px; border-radius: 99px; background: var(--border-strong); transition: width 280ms var(--ease-out), background 280ms var(--ease-out); }
.dialog__dots i[data-on='true'] { width: 18px; background: var(--accent-primary); }
.dialog__viewport { display: grid; overflow-x: hidden; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
.dialog__pane { min-width: 0; grid-area: 1 / 1; padding: 20px; display: grid; gap: 16px; align-content: start; animation: pane-in-fwd 380ms var(--ease-out) both; }
.dialog__pane[data-dir='back'] { animation-name: pane-in-back; }
.dialog__title { font-size: 1.25rem; font-weight: 600; letter-spacing: var(--tracking-tight); text-wrap: balance; }
.dialog__lead { color: var(--text-secondary); max-width: 52ch; }

.mini-task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); animation: fade-up 420ms var(--ease-out) both; }

/* ── Notification center ── */

.notif__menu-wrap { position: relative; margin-left: auto; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); min-width: 224px; padding: 4px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); box-shadow: var(--shadow-lg); z-index: 5; animation: menu-in 180ms var(--ease-out) both; transform-origin: 100% 0; }
.menu button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 7px 9px; font-size: 0.8125rem; color: var(--text-primary); border-radius: var(--radius-sm); cursor: pointer; text-align: left; }

.progress { display: grid; gap: 6px; }

/* Task stepper (new, vertical) */
.task-stepper { display: grid; }

.task__tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ── Guided tour ── */

/* ── Before / after ── */

.diff__before { color: var(--text-secondary); }
.diff__before::before, .diff__after::before { display: block; font-size: 0.6875rem; font-family: var(--font-mono); color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tracking-caps); margin-bottom: 2px; }

/* ── Motion ── */

@keyframes bell-ring { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(14deg); } 40% { transform: rotate(-11deg); } 60% { transform: rotate(7deg); } 80% { transform: rotate(-4deg); } }

@media (max-width: 900px) {

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

/* ── Per-method label assignment ── */

@media (max-width: 900px) { .assign__row { grid-template-columns: minmax(0, 1fr); } .assign__channel { flex-wrap: wrap; } }

/* ── Tour answers ── */
.tour-choices { display: grid; gap: 6px; }
.tour-choice { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); color: var(--text-primary); font-size: 0.8125rem; font-weight: 500; text-align: left; cursor: pointer; transition: border-color var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out); }

.tour-choice:active { transform: translateY(1px); }

.tour-choice__dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--border-strong); flex-shrink: 0; transition: border-color 200ms, box-shadow 200ms; }
.tour-choice[aria-pressed='true'] { border-color: var(--accent-primary); background: var(--accent-primary-soft); }
.tour-choice[aria-pressed='true'] .tour-choice__dot { border-color: var(--accent-primary); box-shadow: inset 0 0 0 3px var(--bg-surface), inset 0 0 0 9px var(--accent-primary); }
.tour-card__nav { display: flex; gap: 6px; }

.content__inner { transition: padding-bottom 320ms var(--ease-out); }
.content__inner[data-tour-open='true'] { padding-bottom: 380px; }

/* ── Channel summary + suggestions v2 ── */
.ch-list { display: grid; gap: 10px; }
.ch-row { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); }

.ch-row__meta { color: var(--text-muted); font-size: 0.75rem; }
.split--thin { height: 6px; }
.suggest__body { display: grid; gap: 8px; min-width: 0; }
.suggest__line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

@media (min-width: 1180px) {
  .tour-card { right: 16px; left: auto; margin-inline: 0; width: 340px; }
}

.mini-task:has(.mini-task__mark--opt) { border-style: dashed; background: transparent; }

.mini-task:not(:has(.mini-task__mark--opt)) { border-color: var(--accent-primary); box-shadow: inset 3px 0 0 var(--accent-primary); }
/* ── calmer shipping block ── */

.pairline__chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 3px; border: 1px solid var(--border-default); border-radius: var(--radius-pill); color: var(--text-primary); font-weight: 600; }
.pairline__chip i { font-style: normal; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--bg-strong); font-family: var(--font-mono); font-size: 0.5625rem; color: var(--text-secondary); }
.ship { display: grid; gap: 10px; padding: 14px 16px 6px; border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); }

.ship .split { height: 8px; }
.collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 320ms var(--ease-out), opacity 240ms var(--ease-out); opacity: 0; }
.collapse[data-open='true'] { grid-template-rows: 1fr; opacity: 1; }

.hint-lines { display: grid; gap: 6px; padding: 8px 12px; border-radius: var(--radius-md); background: var(--bg-surface-muted); font-size: 0.8125rem; color: var(--text-secondary); }

.ship__cols { display: grid; grid-template-columns: minmax(0, 1fr) 232px; gap: 12px; padding: 8px 16px 6px; font-size: 0.75rem; color: var(--text-muted); }
.ship .assign__row { padding: 8px 16px; border-top: 1px solid var(--border-subtle); box-shadow: none; position: relative; }
.ship .assign__row[data-changed='true'] { background: transparent; box-shadow: none; }
.ship .assign__row::before { content: ''; position: absolute; left: 6px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--accent-primary); transform: scale(0); transition: transform 320ms var(--ease-spring); }
.ship .assign__row[data-changed='true']::before { transform: scale(1); }
@media (max-width: 640px) { .ship__cols { display: none; } .ship .assign__row { grid-template-columns: 1fr; gap: 6px; } }
@media (prefers-reduced-motion: reduce) { .collapse, .ship .assign__row::before { transition: none; } }
.tour-ring { box-shadow: 0 0 0 1.5px var(--accent-primary), 0 0 0 9999px color-mix(in oklab, var(--overlay-scrim) 55%, transparent); }
.tour-ring::after { display: none; }

.pairline__note { color: var(--text-muted); font-size: 0.75rem; margin-left: 4px; }

.dialog-backdrop { position: fixed; }
.dialog { width: min(100%, 30rem); max-height: calc(100vh - 48px); }
.dialog__foot { flex-wrap: nowrap; }
.dialog__foot-right { flex-wrap: nowrap; margin-left: auto; }
@media (max-width: 520px) { .dialog__foot-right .btn, .dialog__foot-right button { padding-inline: 10px; } }

.ship__desc { color: var(--text-secondary); font-size: 0.8125rem; max-width: 62ch; }
.ship__cols { font-family: var(--font-mono); font-size: 0.6875rem; letter-spacing: var(--tracking-caps); text-transform: uppercase; }

.ship .assign__row::before { display: none; }
.tabs-mock { display: flex; gap: 18px; border-bottom: 1px solid var(--border-default); font-size: 0.8125rem; color: var(--text-secondary); overflow-x: auto; }
.tabs-mock span { padding: 8px 0; white-space: nowrap; }
.tabs-mock span[aria-current='true'] { color: var(--text-primary); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent-primary); }
.linkrow { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--border-default); border-radius: var(--radius-lg); }
.linkrow__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.notify-card { padding: 14px 16px; margin-bottom: 14px; }
.tip { position: relative; display: inline-flex; vertical-align: middle; margin-left: 6px; color: var(--text-muted); cursor: help; outline-offset: 2px; border-radius: 50%; }
.tip__body { position: absolute; left: 50%; top: calc(100% + 8px); transform: translate(-50%, 4px); width: min(20rem, 70vw); padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--bg-surface-elevated); box-shadow: var(--shadow-overlay); color: var(--text-secondary); font-size: 0.75rem; font-weight: 400; line-height: 1.45; opacity: 0; pointer-events: none; transition: opacity 160ms var(--ease-out), transform 200ms var(--ease-out); z-index: 30; }
.tip__body b { display: block; color: var(--text-primary); margin-bottom: 2px; }
.tip:hover .tip__body, .tip:focus-visible .tip__body { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .tip__body { transition: none; } }

.tip__icon { display: grid; place-items: center; width: 16px; height: 16px; border: 1px solid var(--border-strong); border-radius: 50%; font-size: 0.6875rem; font-weight: 600; line-height: 1; }
.tip:hover .tip__icon, .tip:focus-visible .tip__icon { color: var(--text-primary); border-color: var(--text-secondary); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.radio-stack { display: grid; gap: 8px; margin-top: 10px; }
.notify-card .form-section__head { display: grid; gap: 2px; }

.form-section--ruled { border-top: 1px solid var(--border-subtle); }

/* big title condenses into the sticky contents */
.page-head h2, .page-head .eyebrow { transition: opacity 260ms var(--ease-out); }
.page-head[data-condensed='true'] h2, .page-head[data-condensed='true'] .eyebrow { opacity: 0.35; }
.toc__page { display: grid; grid-template-rows: 0fr; opacity: 0; transform: translateY(10px) scale(0.96); transform-origin: left top; transition: grid-template-rows 420ms var(--ease-spring), opacity 260ms var(--ease-out), transform 420ms var(--ease-spring); }
.toc__page[data-on='true'] { grid-template-rows: 1fr; opacity: 1; transform: none; }
.toc__page > div { overflow: hidden; min-height: 0; }
.toc__page-btn { display: grid; gap: 1px; width: 100%; padding: 2px 8px 10px; margin-bottom: 6px; border: 0; border-bottom: 1px solid var(--border-subtle); background: none; text-align: left; cursor: pointer; border-radius: 0; box-shadow: none; }
.toc__page-btn strong { font-size: 1rem; font-weight: 600; letter-spacing: var(--tracking-tight); color: var(--text-primary); }
.toc__page-btn span { font-family: var(--font-mono); font-size: 0.625rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
.toc__page-btn:hover { background: none; }
.toc__page-btn:hover strong { color: var(--accent-primary); }
@media (prefers-reduced-motion: reduce) { .toc__page, .page-head h2, .page-head .eyebrow { transition: none; } }

/* architecture tab */
.arch { display: grid; gap: 32px; }
.arch-block { display: grid; gap: 14px; }
.arch-block__title { font-size: 1.125rem; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.arch-note { color: var(--text-secondary); font-size: 0.875rem; max-width: 72ch; }
.arch-tree { margin: 0; padding: 14px 16px; border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface-elevated); font-family: var(--font-mono); font-size: 0.75rem; line-height: 1.6; color: var(--text-secondary); overflow-x: auto; }
.arch-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.arch-card { padding: 16px 18px; display: grid; gap: 8px; align-content: start; font-size: 0.8125rem; color: var(--text-secondary); }
.arch-card h3 { font-size: 0.9375rem; font-weight: 600; color: var(--text-primary); }
.arch-card b { color: var(--text-primary); font-weight: 600; }
.arch-steps { margin: 0; padding-left: 1.2rem; display: grid; gap: 6px; font-size: 0.8125rem; color: var(--text-secondary); }
.arch-steps--wide { max-width: 80ch; font-size: 0.875rem; }
.arch-table { display: grid; }
.arch-row { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr) minmax(0, 1.4fr); gap: 16px; padding: 12px 18px; border-top: 1px solid var(--border-subtle); font-size: 0.8125rem; color: var(--text-secondary); }
.arch-row:first-child { border-top: 0; }
.arch-row strong { color: var(--text-primary); font-weight: 600; }
.arch-row--head { font-family: var(--font-mono); font-size: 0.6875rem; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); background: var(--bg-surface-elevated); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.arch-flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.arch-flow__col { display: grid; gap: 8px; align-content: start; padding: 14px; border: 1px dashed var(--border-strong); border-radius: var(--radius-lg); }
.arch-flow__label { font-size: 0.75rem; color: var(--text-muted); }
.arch-flow__arrow { text-align: center; color: var(--text-muted); font-size: 0.75rem; }
.arch-box { display: grid; gap: 2px; padding: 10px 12px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); font-size: 0.8125rem; font-weight: 600; }
.arch-box small { font-weight: 400; color: var(--text-muted); font-size: 0.75rem; }
.arch-box--accent { border-color: var(--accent-primary); box-shadow: inset 3px 0 0 var(--accent-primary); }
@media (max-width: 860px) { .arch-two, .arch-flow { grid-template-columns: minmax(0, 1fr); } .arch-row { grid-template-columns: minmax(0, 1fr); gap: 4px; } .arch-row--head { display: none; } }

.readonly-banner { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface-muted); color: var(--text-secondary); font-size: 0.8125rem; }
.task__admin { font-size: 0.75rem; color: var(--text-muted); }

.setup-line { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }

.steps-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--bg-surface-elevated); color: var(--text-primary); font-size: 0.8125rem; font-weight: 600; cursor: pointer; transition: background var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.steps-toggle:hover { background: var(--bg-surface-muted); border-color: var(--accent-primary); }
.steps-toggle:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
.steps-toggle__chev { transition: transform 280ms var(--ease-spring); color: var(--text-secondary); }
.steps-toggle[aria-expanded='true'] .steps-toggle__chev { transform: rotate(180deg); }
@media (prefers-reduced-motion: reduce) { .steps-toggle__chev { transition: none; } }

.bell { position: relative; }
.bell__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); margin-left: -2px; }

/* diagrams */
.dg-figure { margin: 0; display: grid; gap: 8px; }
.dg-figure figcaption { font-size: 0.8125rem; color: var(--text-muted); max-width: 80ch; }
.dg-scroll { overflow-x: auto; border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); padding: 12px; }
.dg-scroll svg { display: block; width: 100%; height: auto; font-family: var(--font-sans); }
.dg-box { fill: var(--bg-surface-elevated); stroke: var(--border-strong); stroke-width: 1; }
.dg-box[data-accent='true'] { stroke: var(--accent-primary); stroke-width: 1.5; }
.dg-box[data-dashed='true'] { stroke-dasharray: 4 3; fill: transparent; }
.dg-zone { fill: none; stroke: var(--border-default); stroke-dasharray: 5 4; }
.dg-zone-label { font-size: 11px; fill: var(--text-muted); font-family: var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; }
.dg-title { font-size: 13px; font-weight: 600; fill: var(--text-primary); }
.dg-title--left { text-anchor: start; }
.dg-sub { font-size: 11.5px; fill: var(--text-secondary); }
.dg-sub--left { text-anchor: start; }
.dg-label { font-size: 11.5px; fill: var(--text-secondary); }
.dg-label--left { text-anchor: start; }
.dg-arrow { fill: none; stroke: var(--text-muted); stroke-width: 1.4; }
.dg-arrow[data-accent='true'] { stroke: var(--accent-primary); stroke-width: 1.8; }
.dg-arrow[data-return='true'] { stroke-dasharray: 5 4; }
.dg-life { stroke: var(--border-default); stroke-width: 1; stroke-dasharray: 2 4; }

/* epic tab */
.epic-card { padding: 22px 24px; display: grid; gap: 16px; }
.epic-card__head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.epic-card__head h2 { font-size: 1.125rem; font-weight: 600; }
.epic-card__lead { color: var(--text-secondary); max-width: 74ch; }
.epic-col { display: grid; gap: 8px; align-content: start; }
.epic-col h3 { font-size: 0.9375rem; font-weight: 600; }
.epic-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.epic-stats div { display: grid; padding: 12px 14px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface-elevated); }
.epic-stats b { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.epic-stats span { font-size: 0.75rem; color: var(--text-muted); }
.epic-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.epic-task { display: grid; gap: 10px; align-content: start; padding: 16px 18px; border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); }
.epic-task__head { display: flex; align-items: flex-start; gap: 10px; }
.epic-task__id { font-family: var(--font-mono); font-size: 0.75rem; padding: 2px 7px; border-radius: var(--radius-sm); background: var(--bg-strong); color: var(--text-secondary); margin-top: 2px; }
.epic-task__title { flex: 1; font-size: 0.9375rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.epic-task__size { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-pill); color: var(--text-secondary); }
.epic-task__sum { font-size: 0.8125rem; color: var(--text-secondary); }
.epic-task__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.epic-task__deps { font-size: 0.75rem; color: var(--text-muted); margin-left: 4px; }
.epic-task__risk { font-size: 0.75rem; color: var(--status-warning-fg, var(--text-secondary)); padding: 6px 10px; border-radius: var(--radius-md); background: var(--status-warning-soft, var(--bg-surface-muted)); }
.epic-task__ac summary { cursor: pointer; font-size: 0.8125rem; font-weight: 600; color: var(--text-primary); }
.epic-task__ac ul { margin: 8px 0 0; padding-left: 1.1rem; display: grid; gap: 4px; font-size: 0.8125rem; color: var(--text-secondary); }
.epic-order { display: grid; gap: 10px; padding: 16px 18px; border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); }
.epic-order__spikes { display: flex; align-items: center; gap: 8px; font-size: 0.8125rem; color: var(--text-secondary); }
.epic-order__lane { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 4px 14px; align-items: center; padding-top: 10px; border-top: 1px solid var(--border-subtle); }
.epic-order__label { font-size: 0.8125rem; font-weight: 600; }
.epic-order__row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.epic-order__item { display: inline-flex; align-items: center; gap: 6px; }
.epic-order__item i { font-style: normal; color: var(--text-muted); }
.epic-order b { font-family: var(--font-mono); font-size: 0.75rem; padding: 3px 9px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--bg-surface-elevated); }
.epic-order b[data-size='L'] { border-color: var(--accent-primary); }
.epic-order__note { grid-column: 2; font-size: 0.75rem; color: var(--text-muted); }
@media (max-width: 860px) { .epic-grid, .arch-two { grid-template-columns: minmax(0, 1fr); } .epic-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .epic-order__lane { grid-template-columns: minmax(0, 1fr); } .epic-order__note { grid-column: 1; } }
