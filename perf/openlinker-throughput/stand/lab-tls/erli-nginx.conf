# TLS terminator for the `lab` stand's erli-stub container (#3043).
# See generate-certs.sh for why this exists - ErliHttpClient refuses a
# non-https base URL, and `isAllowedErliBaseUrl` additionally requires the
# hostname to resolve to erli.pl/erli.dev - see this service's compose
# entry for the network alias that satisfies that check inside the lab
# network only, and stubs/erli/README.md for the full rationale.
server {
    listen 443 ssl;
    server_name erli-stub.erli.dev;

    ssl_certificate     /etc/nginx/certs/erli-stub.crt;
    ssl_certificate_key /etc/nginx/certs/erli-stub.key;

    client_max_body_size 5m;

    location / {
        proxy_pass http://erli-stub:19085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
