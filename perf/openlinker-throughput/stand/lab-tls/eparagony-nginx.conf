# TLS terminator for the `lab` stand's eparagony-stub backend (#3043).
# See generate-certs.sh for why this exists - EparagonyHttpClient refuses a
# non-https base URL for both apiBaseUrl and authBaseUrl - and for why this
# container is reached at its OWN name (eparagony-stub-tls), never the bare
# "eparagony-stub" the plain-HTTP backend already owns.
server {
    listen 443 ssl;
    server_name eparagony-stub-tls;

    ssl_certificate     /etc/nginx/certs/eparagony-stub-tls.crt;
    ssl_certificate_key /etc/nginx/certs/eparagony-stub-tls.key;

    client_max_body_size 5m;

    location / {
        proxy_pass http://eparagony-stub:19084;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
