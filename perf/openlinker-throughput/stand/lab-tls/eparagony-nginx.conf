# TLS terminator for the `lab` stand's eparagony-stub container (#3043).
# See generate-certs.sh for why this exists - EparagonyHttpClient refuses a
# non-https base URL for both apiBaseUrl and authBaseUrl.
server {
    listen 443 ssl;
    server_name eparagony-stub;

    ssl_certificate     /etc/nginx/certs/eparagony-stub.crt;
    ssl_certificate_key /etc/nginx/certs/eparagony-stub.key;

    client_max_body_size 5m;

    location / {
        proxy_pass http://eparagony-stub:19084;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
