<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenLinker Web</title>
    <meta name="description" content="%VITE_OG_TITLE_PREFIX%E-commerce orchestration platform" />
    <!--
      Open Graph / Twitter Card (#2174). %VITE_OG_TITLE_PREFIX% is Vite's
      built-in build-time HTML env substitution (no plugin). %OG_IMAGE_PATH%
      is a custom token resolved by the `og-image-path` plugin in
      vite.config.ts from VITE_OG_BADGE_TEXT — see apps/web/.env.example for
      the two vars a demo deployment sets to badge every shared link without
      touching this markup.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenLinker" />
    <meta property="og:title" content="%VITE_OG_TITLE_PREFIX%OpenLinker Admin" />
    <meta property="og:description" content="%VITE_OG_TITLE_PREFIX%E-commerce orchestration platform" />
    <meta property="og:image" content="%OG_IMAGE_PATH%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%VITE_OG_TITLE_PREFIX%OpenLinker" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_OG_TITLE_PREFIX%OpenLinker Admin" />
    <meta name="twitter:description" content="%VITE_OG_TITLE_PREFIX%E-commerce orchestration platform" />
    <meta name="twitter:image" content="%OG_IMAGE_PATH%" />
    <meta name="twitter:image:alt" content="%VITE_OG_TITLE_PREFIX%OpenLinker" />
    <script>
      // Theme FOUC guard: resolve light/dark before React hydrates so tokens
      // cascade correctly on first paint. Kept in sync with ThemeProvider.
      (function () {
        try {
          var stored = window.localStorage.getItem('openlinker.theme');
          var effective =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', effective);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <!--
      Preload the hot-path IBM Plex weights so they arrive before the main JS
      bundle and avoid FOUT on first paint. `crossorigin` is mandatory —
      without it the preload is treated as a separate request and re-fetched.
      Full face set + unicode-range declarations live in `src/index.css`.
    -->
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
