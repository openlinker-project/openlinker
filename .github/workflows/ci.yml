name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` so the heavy jobs (gated on `draft == false`) fire the
    # moment a draft is marked ready — without it a dev would need an empty push
    # to trigger full CI on un-drafting. Re-stating the default trio is required:
    # naming `types` replaces the implicit [opened, synchronize, reopened].
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs on the same ref so a dead, replaced run doesn't keep
# holding scarce self-hosted slots and block the queue. Pushes to main rarely
# overlap; if a never-cancel-on-main policy is later wanted, gate with
# `cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap path gate. Runs on GitHub-hosted runners so it never consumes a
  # self-hosted slot.
  #
  # FIVE jobs gate on `code == 'true'` — lint / test / integration / build /
  # docker-build-smoke — but only the first FOUR are self-hosted
  # (`docker-build-smoke` is `ubuntu-latest`). `Type Check` is self-hosted and
  # intentionally NOT gated, so it always reports. That is where the slot
  # arithmetic comes from: five self-hosted jobs exist, four of them gate away,
  # so a docs-only or draft PR spends 1 self-hosted slot instead of 5.
  #
  # Which checks are *required* is branch-protection state and is not readable
  # from this file. This comment used to claim `Type Check` was the only one;
  # GOVERNANCE.md § Who can merge says otherwise, and neither can be verified
  # from the tree, so the claim is deliberately no longer made here.
  #
  # `code` matches any changed file EXCEPT pure docs / markdown / the dev-stack
  # compose file (none of which any CI job consumes — integration tests use
  # Testcontainers, not docker-compose.yml). Dockerfile is deliberately NOT
  # ignored: it feeds the future image build once CD is enabled.
  #
  # `predicate-quantifier: 'every'` is LOAD-BEARING, not decoration (#2296).
  # The pattern list below is an include-everything-then-negate list, and it
  # only subtracts anything under `every`, where a file must satisfy ALL four
  # predicates (matches `**` AND not-docs AND not-md AND not-compose). Under
  # the action's DEFAULT quantifier (`some`) a file matches if it satisfies
  # ANY pattern — every file matches `'**'`, so the negations subtract nothing
  # and `code` is `true` for literally any change. That was the state from
  # this job's introduction until #2296: the gate never once fired.
  #
  # Two ways to silently re-break this:
  #   1. It is an AND. Adding a pattern meaning "also match X" NARROWS the
  #      filter to near-nothing instead of widening it — and removing the
  #      quantifier restores the original inert-gate bug, with no symptom.
  #   2. `paths-filter` FAILS the step on an unrecognised quantifier value,
  #      and every gated job below is `needs: changes` with no `always()`, so
  #      a failed step SKIPS them all. On a code PR that reads as five skips
  #      plus two green checks — indistinguishable from a healthy docs PR.
  #      `Type Check` staying ungated is what bounds that.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!docker-compose.yml'

  lint:
    name: Lint
    timeout-minutes: 30
    # runs-on: ubuntu-latest
    runs-on: self-hosted
    needs: changes
    # Skip while draft, and skip when only docs/compose changed. Always run on
    # push (post-merge to main) where there's no PR draft context.
    if: ${{ github.event_name == 'push' || (github.event.pull_request.draft == false && needs.changes.outputs.code == 'true') }}
    steps:
      - uses: actions/checkout@v4
      # actions/checkout@v4 shallow-fetches only the triggering ref, so
      # `refs/remotes/origin/main` is absent on pull_request builds. The
      # migration-ordering invariant (#1013) in check-migration-timestamps.mjs
      # derives its baseline from `git ls-tree origin/main`; without this fetch
      # it can't run on the one path that catches a mis-ordered migration
      # pre-merge (#1020). Forced refspec tolerates a stale ref on reused
      # self-hosted workspaces; main is never force-pushed.
      #
      # Guarded on `git` being present: some self-hosted runners have no git
      # binary (actions/checkout then uses its tarball/API fallback), where a
      # bare `git fetch` would exit 127 and fail the job. When git is absent the
      # guard skips gracefully (it can't run without git anyway — see #662/#557).
      - name: Fetch origin/main (baseline for migration-ordering invariant)
        run: |
          if command -v git >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          else
            echo "git not available on this runner — migration-ordering guard will skip (#1020/#662)"
          fi
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build libs (workspace glob — auto-discovers new packages)
        run: pnpm -r --filter "./libs/**" build
      - name: Run lint
        run: pnpm lint

  type-check:
    name: Type Check
    timeout-minutes: 30
    # runs-on: ubuntu-latest
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  test:
    name: Test
    timeout-minutes: 30
    # runs-on: ubuntu-latest
    runs-on: self-hosted
    needs: changes
    if: ${{ github.event_name == 'push' || (github.event.pull_request.draft == false && needs.changes.outputs.code == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # No explicit libs build: `pnpm test:ci` already runs
      # `pnpm -r --filter "./libs/**" build` before the tests, so a separate
      # step here builds libs twice in this one job.
      - name: Run tests
        run: pnpm test:ci

  test-integration:
    name: Integration Tests
    # Budget covers two sequential suites (API + worker) plus install + libs
    # build. Must comfortably CONTAIN its steps or raising a step cap just
    # moves the failure here: 40 (api) + 15 (worker) + ~3 setup = 58.
    timeout-minutes: 65
    # runs-on: ubuntu-latest
    runs-on: self-hosted
    # `needs: changes` only for the cheap path-gate output — NOT an artifact
    # dependency on `test`. This job re-installs deps + rebuilds libs itself;
    # gating on `test` previously serialized the two longest jobs (unit ~6min,
    # then integration ~10min). Running them in parallel cuts the critical path
    # by ~6min. Trade-off: integration spends compute even when unit tests fail
    # on a PR — acceptable for the wall-clock win.
    needs: changes
    # Skip while draft / docs-only; always run on push (post-merge).
    if: ${{ github.event_name == 'push' || (github.event.pull_request.draft == false && needs.changes.outputs.code == 'true') }}
    # `actions: read` lets the orphan-sweep step below ask the Actions API
    # whether the run that created a given leftover container has actually
    # finished, instead of guessing from container age (#1285).
    permissions:
      contents: read
      actions: read
    env:
      OL_PII_HASH_SALT: ${{ vars.OL_PII_HASH_SALT }}
      # Ryuk (the Testcontainers reaper) requires a TCP callback from the
      # container back to the host. On self-hosted DinD runners this callback
      # fails because the Docker-in-Docker network is isolated, so Ryuk is
      # disabled here. NOTE (#1285): this runner is a persistent self-hosted
      # box (`runs-on: self-hosted`, not ephemeral `ubuntu-latest`) — its
      # Docker daemon does NOT stop/remove containers just because a job's
      # process exits, and a cancelled run (`cancel-in-progress`, see the
      # workflow-level `concurrency` block) is SIGKILLed before Jest's
      # globalTeardown can run either. With Ryuk off, nothing reaps those
      # containers on its own — the orphan-sweep step below is the
      # compensating control.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      # A cold ts-jest transform cache costs the FIRST suite of each
      # integration step ~32 s (measured: 6.4 s warm vs 76.3 s cold locally for
      # the same file) because every int-spec pulls the whole AppModule graph
      # through ts-jest. Both integration configs point `cacheDirectory` at
      # `.jest-cache/`, so persisting it removes that tax on a cache hit.
      # ts-jest keys entries by file content, so restoring an older cache is
      # safe: changed files simply miss and re-transform (#1920).
      #
      # The key is scoped to what invalidates the whole cache wholesale (deps,
      # base tsconfig, the jest configs) plus the run id, so a save still
      # happens while unchanged-deps runs share one entry. Keying on
      # `github.sha` instead minted a fresh multi-hundred-MB entry per commit,
      # which would evict the pnpm store cache this same job restores above -
      # the repo-wide budget is 10 GB with LRU eviction (PR #1923 review).
      - name: Cache jest transform output
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-integration-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.base.json', 'apps/*/test/jest-integration.cjs') }}-${{ github.run_id }}
          restore-keys: |
            jest-integration-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.base.json', 'apps/*/test/jest-integration.cjs') }}-
            jest-integration-${{ runner.os }}-
      - name: Sweep orphaned Testcontainers from finished CI runs (#1285)
        # Ryuk is disabled (see above) so containers from a cancelled or
        # crashed prior run are never reaped and pile up on this persistent
        # runner until the docker0 bridge's FDB table fills up (SSHS-7962).
        #
        # `libs/test-kit`'s `ciRunIdLabels()` stamps every Testcontainers
        # container this repo creates with its owning `GITHUB_RUN_ID`. For
        # each leftover container found here, this step asks the Actions API
        # for THAT run's actual current status rather than guessing from
        # container age — a run only ever reports `completed` once it is
        # truly over, so this can never remove a container belonging to
        # another `test-integration` job legitimately running concurrently
        # on this runner. (GitHub Actions API history confirmed 64 of 88
        # sampled `Integration Tests` job windows across different branches
        # overlap in time — this runner genuinely has more than one
        # concurrent job slot, ruling out an unconditional "remove
        # everything" sweep.) Containers without the label (predate this
        # fix, or a local/manual `docker compose` run) or whose owning run's
        # status can't be resolved (API hiccup, run outside retention) fall
        # back to a 90-minute age gate — double this job's timeout, so it
        # still can never match a live job's own containers.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          # If `gh` is missing, every container silently falls back to the
          # age gate below with no run-aware precision — log it loudly once
          # so a broken/absent `gh` on this runner doesn't go unnoticed.
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::gh CLI not found on this runner — orphan sweep will use the 90-minute age gate for every container instead of the precise run-status check"
          fi
          CUTOFF_EPOCH=$(( $(date -u +%s) - 5400 ))
          readarray -t CANDIDATES < <(docker ps -aq --filter "label=org.testcontainers=true")
          STALE=()
          for cid in "${CANDIDATES[@]}"; do
            [ -z "$cid" ] && continue
            OWNER_RUN_ID=$(docker inspect -f '{{ index .Config.Labels "ol.ci.run-id" }}' "$cid" 2>/dev/null || true)
            if [ -n "$OWNER_RUN_ID" ] && [ "$OWNER_RUN_ID" != "local" ] && [ "$OWNER_RUN_ID" != "$GITHUB_RUN_ID" ]; then
              RUN_STATUS=$(gh api "repos/$GH_REPOSITORY/actions/runs/$OWNER_RUN_ID" --jq '.status' 2>/dev/null || echo "")
              if [ "$RUN_STATUS" = "completed" ]; then
                STALE+=("$cid")
                continue
              elif [ -n "$RUN_STATUS" ]; then
                continue # queued/in_progress — still legitimately alive, leave it
              fi
              # RUN_STATUS empty: API lookup failed — fall through to the age check.
            fi
            if [ "$OWNER_RUN_ID" = "$GITHUB_RUN_ID" ]; then
              continue # this run's own container — never touch it here
            fi
            # A concurrently running job's own afterAll may remove this
            # container between the `docker ps -aq` listing above and this
            # inspect. Guarded to `0` (never stale) instead of letting the
            # failed substitution abort the whole step under `set -eo pipefail`.
            CREATED_EPOCH=$(date -u -d "$(docker inspect -f '{{.Created}}' "$cid" 2>/dev/null)" +%s 2>/dev/null || echo 0)
            if [ "$CREATED_EPOCH" -gt 0 ] && [ "$CREATED_EPOCH" -lt "$CUTOFF_EPOCH" ]; then
              STALE+=("$cid")
            fi
          done
          if [ "${#STALE[@]}" -gt 0 ]; then
            echo "Removing orphaned Testcontainers containers:"
            # `|| true`: a container in this batch may have been removed by a
            # concurrent job's own cleanup between the listing above and here;
            # docker rm -f returns non-zero if any single id fails, which would
            # otherwise abort the step under `set -eo pipefail`.
            docker rm -f "${STALE[@]}" || true
          else
            echo "No orphaned Testcontainers containers found."
          fi
          # Network prune is NOT safe unconditionally (#2825): Docker only
          # refuses to remove a network that ALREADY has a container
          # attached — it has no concept of "about to be attached". Unlike
          # the containers above, a `Network()` the PS/MySQL container
          # helper creates (`apps/api/test/integration/helpers/prestashop-container.helper.ts`,
          # and identically in `woocommerce-container.helper.ts`)
          # carries no `ol.ci.run-id` label (testcontainers-node's `Network`
          # builder has no `.withLabels()` in this version), so a network
          # that's been created but has no container attached YET — e.g.
          # while a sibling job's MySQL image is still cold-pulling —
          # is indistinguishable from a genuinely orphaned one and was
          # being pruned out from under the still-running job that created
          # it, surfacing as `failed to set up container networking: network
          # <id> not found` the moment that job's first container tried to
          # attach. The network only needs to survive until its FIRST
          # container attaches: the MySQL companion container, bounded by
          # its own startup timeout — 240s (4 min) explicitly for
          # PrestaShop's, ~120s (the @testcontainers/mysql default) for
          # WooCommerce's — not the full PS-install time. The `until=`
          # filter gives every in-flight network a 15-minute grace window
          # (comfortably above either bound) before it's eligible for
          # pruning, while still reclaiming
          # genuinely orphaned empty networks (left behind by a
          # SIGKILLed/cancelled run, since Ryuk is disabled here) promptly.
          docker network prune -f --filter "label=org.testcontainers=true" --filter "until=15m" || true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build libs (workspace glob — auto-discovers new packages)
        run: pnpm -r --filter "./libs/**" build
      - name: Verify core dist exists
        # Past-bug guard: a build-output regression in libs/core left
        # identifier-mapping unbuilt, breaking integration tests with cryptic
        # errors. Fail fast with a clear message instead.
        run: |
          test -f libs/core/dist/identifier-mapping/index.js \
            || (echo "ERROR: libs/core/dist/identifier-mapping/index.js missing after build" && exit 1)
      - name: Run integration tests
        run: pnpm --filter @openlinker/api test:integration
        # Was 25 (PS container boot + module install + cache:warmup adds ~20-30s
        # on Linux, #716). Raised for the OMS programme (waves 0-3a, PR #2675),
        # which took this tier from 108 to 166 API int-specs (+54%). Both
        # integration configs set `maxWorkers: 1`, so wall-clock is LINEAR in
        # suite count - a 54% bigger tier is a 54% longer step, and the old cap
        # killed a run that was still healthy (the last suites before the
        # cut-off passed in ~5.5s each, no stall, no leaked container).
        #
        # Measured: 18m29s wall / 1072s jest on a clean local box, 165/166
        # passing. This runner is slower - the same tier passed at 820s on main
        # (108 suites) and blew past 1512s here - so the realistic CI cost is
        # ~26-28min. 40 gives ~1.5x headroom over that floor while the job cap
        # below still bounds a genuine hang.
        #
        # NOTE for whoever looks next: it is NOT one expensive spec. The
        # slowest three are the pre-existing container suites
        # (allegro-prestashop-carrier-mapping 310s, prestashop-webhook-
        # provisioning 125s, woocommerce-inventory-propagation 101s), and
        # fulfillment-work-migration-parity - which stands up a SECOND database
        # with `migrationsRun: true` to run the full migration chain, because
        # the ordinary harness uses `synchronize` and so CI had never executed a
        # migration at all - costs only 14s. The growth is spread across ~50 new
        # specs, so the next wave will move this number again.
        timeout-minutes: 40
        # Note: Docker is pre-installed on GitHub Actions runners, required for Testcontainers
      - name: Run worker integration tests
        # Runs even if the API suite failed (!cancelled) so a worker-specific
        # AppModule DI regression is reported independently — the point of #786.
        if: ${{ !cancelled() }}
        run: pnpm --filter @openlinker/worker test:integration
        # Was 10 ("worker suite runs ~80s locally"), which is stale: the worker
        # tier grew 17 -> 26 int-specs on this branch and its LAST CI run took
        # 577s against the 600s cap - it passed with 23s to spare and is the
        # next step that would have gone red. 15 restores real headroom; the
        # cap still guards a hung container boot.
        timeout-minutes: 15
        # This job's own containers are cleaned up in-process: apps/worker has
        # its own globalSetup/globalTeardown pair (setup-global.ts / teardown.ts,
        # independent of apps/api's), plus each suite's own afterAll (e.g. the
        # PrestaShop/WooCommerce container helpers). No post-job sweep here:
        # this run's own status is still `in_progress` until the job finishes,
        # so the pre-flight sweep's run-status check wouldn't touch its
        # containers anyway — the next run's pre-flight sweep picks up anything
        # this run itself failed to clean up.

  test-php:
    name: PHP Unit Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            apps/prestashop-module/openlinker/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/prestashop-module/openlinker/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run PHP unit tests
        run: pnpm test:php

  build:
    name: Build
    timeout-minutes: 30
#    runs-on: ubuntu-latest
    runs-on: self-hosted
    needs: changes
    if: ${{ github.event_name == 'push' || (github.event.pull_request.draft == false && needs.changes.outputs.code == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker-build-smoke:
    name: Docker Build Smoke Test
    # Guards the `Dockerfile`'s hand-enumerated per-package COPY lists
    # (workspace manifests in `base`, `dist` output in `production`/`worker`).
    # A plugin added to apps/api or apps/worker's package.json without a
    # matching COPY entry breaks `pnpm install`'s "workspace:*" resolution
    # inside the image — this went unnoticed pre-#1365 because no CI job
    # built the image. Building `base` alone is enough to catch that class of
    # drift cheaply, without paying for the full multi-stage build + `pnpm build`.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'push' || (github.event.pull_request.draft == false && needs.changes.outputs.code == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build base stage (API/worker image)
        run: docker build --target base -f Dockerfile .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile .
