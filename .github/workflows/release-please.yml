name: release-please

# Product release line (Axis 1 of ADR-029). On every push to main, release-please
# reads Conventional Commits since the last release and keeps an open
# "chore: release X.Y.Z" PR updated with the version bump + CHANGELOG.md. Merging
# that PR is what tags vX.Y.Z + creates the GitHub Release — nothing releases here
# until a maintainer merges it. See RELEASING.md.
#
# The 0.1.0 baseline is hand-established (curated CHANGELOG + manifest); release-please
# manages 0.2.0 onward. It reads commits after `bootstrap-sha` (release-please-config.json).
on:
  push:
    branches: [main]

# release-please needs to open/update the Release PR and, on merge, push the tag +
# GitHub Release. It authenticates with a PAT (see the `token:` input below) rather
# than the default GITHUB_TOKEN, because a tag pushed by GITHUB_TOKEN cannot
# re-trigger a separate workflow - which is what kept `cd.yml` from firing on
# release (#1891, RELEASING.md § CD trigger).
#
# The permissions below are still load-bearing: when no release PAT is configured
# the `token:` input falls back to the default GITHUB_TOKEN, and that degraded path
# needs exactly these two scopes to open the Release PR and push the tag.
permissions:
  contents: write
  pull-requests: write

# Never let two release-please runs race the Release PR.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    # GitHub-hosted on purpose — this job only parses commits and edits
    # package.json / CHANGELOG.md / the manifest, so it never needs a self-hosted
    # slot or the repo's toolchain (no pnpm install, no build).
    runs-on: ubuntu-latest
    steps:
      # Self-diagnosing signal for the degraded path below. Without a release PAT
      # the run still succeeds, so the only symptom would be `cd.yml` silently not
      # firing on the next release - which is the exact bug #1891 fixed. Warn rather
      # than fail: losing the CD re-trigger is recoverable (cd.yml carries
      # workflow_dispatch), breaking the release line is not.
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning::No release PAT configured (RELEASE_PLEASE_TOKEN or GH_TOKEN) - falling back to GITHUB_TOKEN. The Release PR and tag are still created, but the tag push will NOT re-trigger cd.yml (#1891); start the deploy manually via cd.yml 'Run workflow'. See RELEASING.md (Release token)."
          fi

      # Pinned by commit SHA (not the mutable v4 tag) because this workflow holds
      # contents+pull-requests write — supply-chain hygiene for third-party actions.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # `RELEASE_PLEASE_TOKEN` is the preferred name (it states its blast radius);
          # `GH_TOKEN` is accepted for the already-provisioned secret. An unset secret
          # interpolates to the empty string, which would *override* the action's own
          # default rather than fall back to it - hence the explicit `github.token`
          # tail, so a missing PAT degrades instead of taking the release line down.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GH_TOKEN || github.token }}

      # openlinker.io/changelog renders this repo's GitHub Releases at build time.
      # A tag push never triggers workflows in *another* repository (regardless of
      # which token pushed it), so poke the website repo directly - but only when a
      # Release was actually cut (the Release PR merged), not on the every-push
      # Release-PR refresh.
      - name: Notify website of new release
        if: ${{ steps.release.outputs.release_created }}
        # Best-effort: the tag + GitHub Release are already created by the step
        # above, so a failed dispatch (expired PAT, website repo down) must not
        # red-X an otherwise-successful release. --fail-with-body still logs the
        # error for debugging, and the changelog refreshes on the next site deploy.
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::WEBSITE_DISPATCH_TOKEN not set — skipping website redeploy dispatch"
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/openlinker-project/openlinker-website/dispatches \
            -d "{\"event_type\":\"product-release\",\"client_payload\":{\"tag\":\"$TAG\"}}"
