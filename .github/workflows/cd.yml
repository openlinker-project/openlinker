name: CD

on:
  # Manual escape hatch: re-run a deploy for a tag whose automatic run was lost
  # (see #1891). Deliberately ref-restricted - this job rsyncs to the deploy host
  # and holds its SSH key, so it must never run from an unreviewed branch. The
  # `demo` environment's deployment-branch policy allows only `main` + `v*` tags,
  # and the `Guard deploy ref` step below re-checks that inside the workflow.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-deploy:
    name: Build and deploy
    runs-on: self-hosted
    environment: demo
    permissions: {}
    steps:
      # Defence in depth for the `workflow_dispatch` path. The `demo` environment's
      # deployment-branch policy is the primary gate, but it is a repo setting -
      # invisible here and silently removable. This step keeps the guarantee in the
      # workflow itself: a manual deploy runs only from `main` or a `v*` tag, never
      # from an arbitrary feature branch. Runs before checkout so nothing from an
      # unapproved ref is fetched.
      - name: Guard deploy ref
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/v*) ;;
            *)
              echo "::error::Manual deploys are allowed only from main or a v* tag (got $GITHUB_REF)."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v6

      # The VITE_OG_* trio badges the Open Graph share card (#2174) and must be
      # passed as build args: Vite bakes them into index.html at build time, and
      # root .dockerignore excludes `.env.*` so no env file can carry them in.
      # Unset repo vars expand to empty, which is the plain production card.
      - name: Build web
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }} \
            --build-arg VITE_OG_TITLE_PREFIX="${{ vars.VITE_OG_TITLE_PREFIX }}" \
            --build-arg VITE_OG_BADGE_TEXT="${{ vars.VITE_OG_BADGE_TEXT }}" \
            --build-arg VITE_OG_SITE_URL="${{ vars.VITE_OG_SITE_URL }}" \
            -f apps/web/Dockerfile . --tag openlinker-web

      - name: Export openlinker-web as tar
        run: docker save -o openlinker-web.tar openlinker-web

      - name: Build worker
        run: docker build -f Dockerfile --target worker . --tag openlinker-worker

      - name: Export openlinker-worker as tar
        run: docker save -o openlinker-worker.tar openlinker-worker

      - name: Build api
        run: docker build -f Dockerfile --target production . --tag openlinker-api

      - name: Export openlinker-api as tar
        run: docker save -o openlinker-api.tar openlinker-api

      - name: Build migrate
        run: docker build -f Dockerfile --target base . --tag openlinker-migrate

      - name: Export openlinker-migrate as tar
        run: docker save -o openlinker-migrate.tar openlinker-migrate

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: 'just-a-placeholder-so-we-dont-get-errors'

      - name: Adding Known Hosts
        run: ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOSTNAME }} >> ~/.ssh/known_hosts

      - name: Copy images to server
        run: rsync -avz -e "ssh -p ${{ secrets.SSH_PORT }}" ./openlinker-{migrate,api,web,worker}.tar ${{ secrets.SSH_HOST }}:${{ secrets.DESTINATION_PATH_IMAGES }}/

      - name: Sync prestashop module
        run: rsync -avz --delete -e "ssh -p ${{ secrets.SSH_PORT }}" ./apps/prestashop-module/ ${{ secrets.SSH_HOST }}:${{ secrets.DESTINATION_PATH_PRESTA_MODULE }}/

      - name: Sync prestashop init scripts
        run: rsync -avz --delete -e "ssh -p ${{ secrets.SSH_PORT }}" ./docker/prestashop/ ${{ secrets.SSH_HOST }}:${{ secrets.DESTINATION_PATH_PRESTA_INITSCRIPTS }}/

      - name: Sync woocommerce init scripts
        run: rsync -avz --delete -e "ssh -p ${{ secrets.SSH_PORT }}" ./docker/woocommerce/ ${{ secrets.SSH_HOST }}:${{ secrets.DESTINATION_PATH_WC_INITSCRIPTS }}/

      - name: Deploy
        run: ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} "bash ~/deploy.sh"
