name: release-center-catalog

# The step catalog's hand-written `introducedIn` is the NEXT minor, so it is
# greater than package.json until release-please bumps it. The check therefore
# runs on the release PR (where the version has just been bumped) and fails the
# release if release-please picked a different number (#4145, ADR-086). Make this
# job a required status for that PR in the branch protection settings.
on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - CHANGELOG.md

jobs:
  catalog:
    name: release-center-catalog
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-release-center-catalog.mjs --self-check
      - run: node scripts/check-release-center-catalog.mjs
